# tv.maktaba.livetv-slots: a first-party plugin of Maktaba (Epic 54, README §15.2), wave 7
# (story 54.34): stages, swaps, rolls back and cleans up TV changes (Epic 33's slots).
schema     = 1
id         = "tv.maktaba.livetv-slots"
version    = "0.0.0-dev"
plugin_api = "1.0"
maktaba    = ">=0.0.0"
licence    = "AGPL-3.0-only"
runtime    = "native-python"

[strings]
name    = "fp.livetv-slots.name"
summary = "fp.livetv-slots.summary"

[trusted]
runner    = "light"
component = "livetv.slots"
db.read   = ["app_settings", "channel_art_overrides", "channel_plans", "collection_items", "filler_items", "filler_pools", "job_stages", "series", "series_episodes", "tv_slots", "videos"]
db.write  = ["channel_programs", "channel_schedule_state", "channels", "external_links", "tv_change_events", "tv_changes", "tv_release_channels", "tv_releases", "tv_routing", "tv_sched_gen_seq"]
settings  = ["tv", "tv_output", "tv_staging", "display_titles"]
files.read  = ["data.channels"]
files.write = []

[[stage]]
name         = "tv_stage"
subject      = "catalog"
export       = "tv-stage"
version      = 1
label        = "Stage TV change"
subject_kinds = ["catalog"]
pool         = "cpu"
lane         = "channels"
lane_order   = 3
placement    = "home"
max_attempts = 2
entry        = "maktaba_fp_livetv_slots.stages.tv_stage:IMPL"

[[stage]]
name         = "tv_swap"
subject      = "catalog"
export       = "tv-swap"
version      = 1
label        = "Swap TV change"
subject_kinds = ["catalog"]
pool         = "cpu"
lane         = "channels"
lane_order   = 4
placement    = "home"
max_attempts = 1
entry        = "maktaba_fp_livetv_slots.stages.tv_swap:IMPL"

[[stage]]
name         = "tv_gc"
subject      = "catalog"
export       = "tv-gc"
version      = 1
label        = "TV staging clean-up"
subject_kinds = ["catalog"]
pool         = "cpu"
lane         = "channels"
lane_order   = 5
placement    = "home"
entry        = "maktaba_fp_livetv_slots.stages.tv_gc:IMPL"

[[stage]]
name         = "tv_rollback"
subject      = "catalog"
export       = "tv-rollback"
version      = 1
label        = "Roll back TV change"
subject_kinds = ["catalog"]
pool         = "cpu"
lane         = "channels"
lane_order   = 6
placement    = "home"
max_attempts = 2
entry        = "maktaba_fp_livetv_slots.stages.tv_rollback:IMPL"
