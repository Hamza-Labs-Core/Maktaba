# tv.maktaba.transcription: a first-party plugin of Maktaba (Epic 54, README §15.2), wave 3
# (story 54.30): Whisper and the second listen, on the GPU, in the ml runner of each
# transcription worker. Wave 9 (story 54.36 §1): extract, the WAV a speech backend that reads
# a file needs (the audio cache, data.cache), once it ran on the engine (54.36 §2).
schema     = 1
id         = "tv.maktaba.transcription"
version    = "0.0.0-dev"
plugin_api = "1.0"
maktaba    = ">=0.0.0"
licence    = "AGPL-3.0-only"
runtime    = "native-python"

[strings]
name    = "fp.transcription.name"
summary = "fp.transcription.summary"

[trusted]
runner    = "ml"
component = "transcription"
db.read   = ["app_settings", "libraries", "library_roots", "media_info", "processing_jobs", "vocab_pairs", "vocabulary"]
db.write  = ["audio_cache", "audio_tracks", "relisten_attempts", "transcribe_checkpoints", "transcript_edits", "transcript_segments", "transcripts", "videos", "word_flags"]
settings  = ["transcription"]
files.read  = ["library", "models", "data.cache"]
files.write = ["models", "data.cache"]
exec      = ["ffmpeg"]
gpu       = "preferred"

[[stage]]
name         = "extract"
subject      = "video"
export       = "extract"
version      = 1
label        = "Extract audio"
subject_kinds = ["video"]
pool         = "nas_read"
lane         = "media"
lane_order   = 1
may_request  = ["transcribe"]
entry        = "maktaba_fp_transcription.stages.extract:IMPL"

[[stage]]
name         = "transcribe"
subject      = "video"
export       = "transcribe"
version      = 1
label        = "Transcribe"
subject_kinds = ["video"]
pool         = "gpu"
lane         = "speech"
lane_order   = 2
may_request  = ["extract"]
storage      = "read"
edges        = [{ to = "second_listen", map = "same" }]
entry        = "maktaba_fp_transcription.stages.transcribe:IMPL"
fingerprint  = { input = true, output = false }

[[stage]]
name         = "second_listen"
subject      = "video"
export       = "second-listen"
version      = 1
label        = "Second listen"
subject_kinds = ["video"]
pool         = "listen"
lane         = "speech"
lane_order   = 3
storage      = "read"
edges        = [{ to = "subtitle_gen", map = "same" }, { to = "index", map = "same" }, { to = "tag", map = "season_of" }, { to = "tag", map = "loose_library_of" }, { to = "word_check", map = "same" }, { to = "content_screen", map = "same" }]
entry        = "maktaba_fp_transcription.stages.second_listen:IMPL"
fingerprint  = { input = true, output = false }
