# The parity proof of tv.maktaba.convert (story 54.32): the library's files and its trash,
# compared byte for byte, and the rows the conversion writes (the file-action journal with
# the same run-time ids on both sides), only the columns that hold the time masked.
tables = ["file_actions", "videos", "video_copies", "audio_tracks"]
files  = ["library"]

[ignore]
file_actions = ["created_at", "updated_at", "purge_after"]
videos = ["created_at", "updated_at", "mtime", "last_seen_at"]
video_copies = ["seen_at", "mtime"]
# the converted MP4 is a new file, written when each side ran: the fingerprints that hash a
# video's mtime (thumb_hash and thumb_small; clip_groups and promo_links, of the library's
# videos) differ by that time only. probe's edges queue them since probe runs on the engine
# (story 54.36 §2).
processing_jobs = ["input_hash@thumb_hash", "input_hash@thumb_small", "input_hash@clip_groups", "input_hash@promo_links"]

[[cases]]
name = "two MKVs (H.264 and Opus: the audio converted, the video copied) and an MP4 already fine"
