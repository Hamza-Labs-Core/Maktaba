# tv.maktaba.plex: a first-party plugin of Maktaba (Epic 54, README §15.2), wave 8
# (story 54.35): Maktaba's channels in Plex Live TV, through the home's service door. The
# plugin holds neither the Plex token nor Plex's address; every call goes through the door,
# which adds the token and scrubs it.
schema     = 1
id         = "tv.maktaba.plex"
version    = "0.0.0-dev"
plugin_api = "1.0"
maktaba    = ">=0.0.0"
licence    = "AGPL-3.0-only"
runtime    = "native-python"

[strings]
name    = "fp.plex.name"
summary = "fp.plex.summary"

[trusted]
runner    = "service"
component = "ext.plex"
db.read   = ["app_settings", "channel_schedule_state", "channels", "hdhr_device"]
db.write  = ["plex_livetv_state"]
settings  = ["plexlive"]
service   = ["plex"]

[[stage]]
name         = "plex_livetv"
subject      = "catalog"
export       = "plex-livetv"
version      = 2
label        = "Plex Live TV"
subject_kinds = ["catalog"]
pool         = "network_plex"
lane         = "channels"
lane_order   = 3
external_write = true
entry_for    = ["catalog"]
debounce_sec = 30
debounce_max_sec = 300
placement    = "home"
after_topup  = true
every_minutes_rule = ["plexlive", "drift_check_minutes"]
entry        = "maktaba_fp_plex.stages.plex_livetv:IMPL"
