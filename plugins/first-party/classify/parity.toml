# The parity proof of tv.maktaba.classify (story 54.26): the tables its stages write, keyed,
# with only the columns that hold the time of the write masked. Wave 4 (story 54.31) adds the
# series detect places, the tags, the model's and the book's answers, and the review pages.
tables = ["promo_links", "clip_groups", "clip_group_items", "topic_collections", "topic_items", "season_style",
          "series", "series_seasons", "series_episodes", "season_tags", "episode_tags", "video_topic_tags",
          "tag_checks", "clip_checks", "books", "series_books"]

[ignore]
promo_links = ["updated_at"]
clip_groups = ["updated_at"]
topic_collections = ["updated_at"]
season_style = ["updated_at"]
series = ["created_at", "updated_at"]
series_seasons = ["created_at", "updated_at", "retired_at"]
series_episodes = ["created_at"]
tag_checks = ["checked_at"]
clip_checks = ["checked_at"]
books = ["checked_at"]

[[cases]]
name = "a channel library: two shows, a playlist across both, clips, questions, a promo, talks"

[[cases]]
name = "a book's series and three clips with the model on: the model's and the book's corrections"

[[failure_cases]]
name = "a library with no series"
