# tv.maktaba.classify: Maktaba's classifiers as a first-party plugin (Epic 54, README §15.2).
# Wave 1 (story 54.28) moved the stages that read the database and write it, with no file,
# no model and no network; wave 4 (story 54.31) brings the rest of classify: the model's
# questions go through the plugin API's compute.generate (model_rules), the encyclopedia
# lookup runs in the net group.
schema     = 1
id         = "tv.maktaba.classify"
version    = "0.0.0-dev"
plugin_api = "1.0"
maktaba    = ">=0.0.0"
licence    = "AGPL-3.0-only"
runtime    = "native-python"

[strings]
name    = "fp.classify.name"
summary = "fp.classify.summary"

[capabilities]
# the model's questions (check_tags, check_clips) go through compute.generate (54.31 §2)
required = ["compute.llm"]

[trusted]
runner    = "light"
component = "classify"
db.read   = ["app_settings", "libraries", "media_metadata_enrichment", "processing_jobs", "video_signals", "videos", "youtube_channels", "youtube_playlist_items", "youtube_playlists", "youtube_videos"]
db.write  = ["clip_checks", "clip_group_items", "clip_groups", "promo_links", "season_style", "season_tags", "series", "series_episodes", "series_seasons", "tag_checks", "topic_collections", "topic_items", "video_topic_tags"]
settings  = ["groups", "detect", "tagcheck"]
compute   = ["llm"]
# review_pages: reads the small thumbnails, writes the library's page in the reports folder
files.read  = ["data.thumbnails"]
files.write = ["data.review"]

[[stage]]
name         = "promo_links"
subject      = "library"
export       = "promo-links"
version      = 1
label        = "Promo links"
subject_kinds = ["library"]
pool         = "cpu"
lane         = "seasons"
lane_order   = 2
entry_for    = ["library"]
debounce_sec = 30
debounce_max_sec = 300
edges        = [{ to = "clip_groups", map = "same" }, { to = "plan_channels", map = "catalog" }]
entry        = "maktaba_fp_classify.stages.promo_links:IMPL"
fingerprint  = { input = true, output = false }

[[stage]]
name         = "clip_groups"
subject      = "library"
export       = "clip-groups"
version      = 1
label        = "Clip groups"
subject_kinds = ["library"]
pool         = "cpu"
lane         = "seasons"
lane_order   = 3
entry_for    = ["library"]
debounce_sec = 30
debounce_max_sec = 300
edges        = [{ to = "plan_channels", map = "catalog" }]
entry        = "maktaba_fp_classify.stages.clip_groups:IMPL"
fingerprint  = { input = true, output = false }

[[stage]]
name         = "topic_collections"
subject      = "library"
export       = "topic-collections"
version      = 1
label        = "Topic collections"
subject_kinds = ["library"]
pool         = "cpu"
lane         = "seasons"
lane_order   = 2
entry_for    = ["library"]
debounce_sec = 30
debounce_max_sec = 300
edges        = [{ to = "clip_groups", map = "same" }, { to = "plan_channels", map = "catalog" }, { to = "youtube_collections", map = "same" }]
entry        = "maktaba_fp_classify.stages.topic_collections:IMPL"
fingerprint  = { input = true, output = false }

[[stage]]
name         = "rate_style"
subject      = "season"
export       = "rate-style"
version      = 1
label        = "Rate style"
subject_kinds = ["season"]
pool         = "cpu"
lane         = "seasons"
lane_order   = 3
may_request  = ["style_sample"]
entry_for    = ["season"]
debounce_sec = 10
debounce_max_sec = 120
edges        = [{ to = "plan_channels", map = "catalog" }]
entry        = "maktaba_fp_classify.stages.rate_style:IMPL"
fingerprint  = { input = true, output = false }

[[stage]]
name         = "check_tags"
subject      = "season"
export       = "check-tags"
version      = 1
label        = "Check series tags"
subject_kinds = ["season"]
pool         = "lookup"
lane         = "seasons"
lane_order   = 3
entry_for    = ["season"]
edges        = [{ to = "books", map = "same" }, { to = "plan_channels", map = "catalog" }]
# the model server defaults to localhost: the home's own (a node would ask another model,
# or none) unless the settings name a shared one
placement    = "home"
model_rules  = "tagcheck"
entry        = "maktaba_fp_classify.stages.check_tags:IMPL"
fingerprint  = { input = true, output = false }

[[stage]]
name         = "check_clips"
subject      = "library"
export       = "check-clips"
version      = 2
label        = "Check clip tags"
subject_kinds = ["library"]
pool         = "lookup"
lane         = "seasons"
lane_order   = 3
entry_for    = ["library"]
debounce_sec = 30
debounce_max_sec = 300
edges        = [{ to = "clip_groups", map = "same" }, { to = "plan_channels", map = "catalog" }]
# the model server defaults to localhost: the home's own (a node would ask another model,
# or none) unless the settings name a shared one
placement    = "home"
model_rules  = "tagcheck"
entry        = "maktaba_fp_classify.stages.check_clips:IMPL"
fingerprint  = { input = true, output = false }

[[stage]]
name         = "review_pages"
subject      = "library"
export       = "review-pages"
version      = 1
label        = "Review pages"
subject_kinds = ["library"]
pool         = "reports"
lane         = "seasons"
lane_order   = 6
entry_for    = ["library"]
debounce_sec = 120
debounce_max_sec = 900
# the reports folder is the home's (the API serves it)
placement    = "home"
entry        = "maktaba_fp_classify.stages.review_pages:IMPL"
fingerprint  = { input = true, output = false }

[[stage]]
name         = "detect"
subject      = "library"
export       = "detect"
version      = 3
label        = "Place episodes"
subject_kinds = ["library"]
pool         = "cpu"
lane         = "seasons"
lane_order   = 1
may_request  = ["fingerprint", "fp_gate"]
entry_for    = ["library"]
debounce_sec = 30
debounce_max_sec = 300
edges        = [{ to = "tag", map = "seasons_changed" }, { to = "rate_style", map = "seasons_changed" }, { to = "tag", map = "same" }, { to = "plan_channels", map = "catalog" }, { to = "review_pages", map = "same" }, { to = "topic_collections", map = "same" }, { to = "promo_links", map = "same" }, { to = "display_title", map = "same" }]
entry        = "maktaba_fp_classify.stages.detect:IMPL"
fingerprint  = { input = true, output = false }
