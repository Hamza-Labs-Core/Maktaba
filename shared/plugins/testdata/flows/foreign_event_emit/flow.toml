schema = 1
id = "dev.example.flow"
version = "1.0.0"

[strings]
name = "flow.name"

[[plugin]]
id = "dev.example.alpha"
version = ">=1.0.0, <2.0.0"

  [[plugin.stage]]
  name = "one"
  subject = "video"
  triggers = ["audio.ready"]
  emits = ["b.done"]

[[plugin]]
id = "dev.example.beta"
version = ">=1.0.0, <2.0.0"

  [[plugin.stage]]
  name = "two"
  subject = "video"
  triggers = ["audio.ready"]
  emits = ["b.done"]

  [[plugin.event]]
  name = "b.done"
  subject = "video"
  payload = "events/b.done.schema.json"
