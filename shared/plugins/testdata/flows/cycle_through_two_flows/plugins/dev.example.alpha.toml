  event = "audio.ready"
  [[stage.trigger]]
  event = "plugin:dev.example.xray/x.done"

[[event]]
name = "a.done"
subject = "video"
payload = "events/a.done.schema.json"

[[depends]]
plugin = "dev.example.xray"
version = ">=1.0.0, <2.0.0"
