schema = 1
id = "dev.example.alpha"
version = "1.0.0"
plugin_api = "1.0"
maktaba = ">=0.6.0"
licence = "MIT"

[strings]
name = "plugin.name"
summary = "plugin.summary"

[[stage]]
name = "one"
subject = "video"
export = "run-0"
version = 1
emits = ["a.done"]
