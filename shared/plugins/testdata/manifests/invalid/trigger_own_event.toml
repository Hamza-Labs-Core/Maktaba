# expect: manifest_bad_trigger
schema = 1
id = "dev.example.silence-chapters"
version = "1.4.0"
plugin_api = "1.0"
maktaba = ">=0.6.0, <0.9.0"
licence = "MIT"

[strings]
name = "plugin.name"
summary = "plugin.summary"

[[stage]]
name    = "find_silences"
subject = "video"
export  = "run-find-silences"
version = 3
emits = ["silences.found"]

[[stage]]
name    = "after"
subject = "video"
export  = "run-after"
version = 1
  [[stage.trigger]]
  event = "plugin:dev.example.silence-chapters/silences.found"

[[event]]
name    = "silences.found"
subject = "video"
payload = "events/silences.found.schema.json"
