# Every capability a plugin may ask for (Epic 54, story 54.01 §3; README §4.5).
#
# Read by the four manifest validators (Go shared/go/pluginmanifest, Rust
# plugind/crates/pluginmanifest, Python maktaba_pipeline.plugins.manifest, TypeScript
# tools/plugin-sdk/js/manifest.ts), by the host's import audit (54.02 §6) and by the
# plugin API (54.04). The words an admin reads are Maktaba's own, keyed by title_key and
# detail_key in web/src/i18n/{en,ar}.json, never the plugin's.
#
# Fields:
#   name        the capability; a name with `param` takes ":<value>" (plugin-data.read:<id>)
#   risk        low | medium | high (the rating, story 54.08 §2)
#   interface   the maktaba:plugin interface it unlocks (shared/plugins/wit)
#   functions   the functions of that interface it unlocks ("*" every one)
#   param       "plugin_id" when the name takes a plugin id
#   since       the plugin API minor (1.x) that added it
#
# compute.embed and compute.llm (story 54.21) came with plugin API 1.1: a required one is
# a `requires` of the plugin's component (search.semantic, llm), an optional one a `wants`.

schema = 1

[[capability]]
name      = "library.read"
risk      = "low"
interface = "library"
functions = ["*"]
title_key = "plugins.capability.library_read.title"
detail_key = "plugins.capability.library_read.detail"
since     = "1.0"

