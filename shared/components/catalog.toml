# The component catalog (Epic 51, story 51.01): every part of Maktaba, once.
#
# Every pipeline stage, supervisor process and background loop belongs to exactly one
# component here; the `catalog` CI job fails when code and this file drift apart. The
# words for each title_key / desc_key, phase and reason live in web/src/i18n/en.json and
# ar.json, never here.
#
# Embedded in the Go binaries (shared/components, go:embed) and in the pipeline
# (maktaba_pipeline/components/catalog.toml, a byte-for-byte copy written by
# `make catalog-sync`). Both loaders refuse an unknown field.
#
# Fields (story 51.01 §1):
#   id          ^[a-z][a-z0-9_]*(\.[a-z0-9_*-]+)*$, unique; core.* ids are not switchable
#   kind        process | stages | loop | extension | asset, or a + join of the first
#               three in the order stages+process+loop; it matches the lists it has
#   switchable  default true; false for core.* and only for them
#   group       the UI section
#   stages      StageDef names (engine/graph.py and the built-in extensions)
#   processes   "<role>/<instance>"; "*" alone matches any instance, "x-*" a prefix;
#               "pipeline/" is the main pipeline worker
#   loops       "<host>:<name>", host supervisor | api | streaming | pipeline
#   requires    ids, or "any:a|b|c" (one of them is enough); started first, stopped last
#   wants       ids used when present (missing: degraded, not blocked)
#   conflicts   ids that cannot run at the same time; listed on both sides
#   settings    "rules.<section>" and "toml:<section>.<key>" it owns
#   platforms   darwin-arm64 | windows-amd64 | linux-amd64 | linux-arm64
#   placement   any | home
#   bundles     full | core | worker: enabled by default in these bundles
#   drain       { grace_s = 30, checkpoint = false } (stages)
#   stop_grace_s  loops only; default 5
#   licence     an existing flag of api/internal/flags/declarations.go, or empty
#   features    the user-facing words it serves (top-level `features`)
#   resources   { ram_mb, disk_mb, gpu = none | preferred | required }
#   since       first release with this id
#   assets: source (default), sources (per platform), files ({path, sha256, size},
#   filled by 51.15), in_payload

schema = 1

phases = ["not_installed", "installing", "removing", "off", "stopped", "waiting",
          "starting", "running", "degraded", "draining", "failed"]

reasons = ["dependency_off", "licence_missing", "platform_unsupported", "not_enough_memory",
           "verify_failed", "crash_loop", "held", "stop_timeout", "settings_invalid",
           "env_override", "boot_flag", "reconcile_off", "not_in_payload", "component_off",
           "component_held", "required_by", "toml_superseded"]

# GET /api/capabilities answers these words (README §4.12). chapters and
# recommendations have no component behind them yet and always answer "on".
features = ["live_tv", "transcripts", "subtitles", "semantic_search", "chapters", "youtube",
            "plex", "remote_access", "recommendations"]

