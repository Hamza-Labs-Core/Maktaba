                      decided_by:
                        type: string
                        format: uuid
                      decided_at:
                        type: string
                        format: date-time
                      created_at:
                        type: string
                        format: date-time
                      expires_at:
                        type: string
                        format: date-time
                        description: 'When a request still waiting stops waiting: seven days after it was made, or, for a request for time, the end of the home day it was made on (04:00 home time).'
                  rule:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                      effect:
                        type: string
                        enum:
                        - allow
                        - block
                      subject_kind:
                        type: string
                        enum:
                        - library
