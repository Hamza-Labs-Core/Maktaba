  /search:
    get:
      tags:
      - Search
      summary: Hybrid search across the library
      description: 'Combines BM25 full-text and vector similarity using reciprocal rank fusion.

        Results carry per-stage timing under `took_ms`. When semantic backend is

        offline, the response sets `degraded=true` and falls back to FTS only. For a restricted account (one under parental controls) the results, their totals and their snippets are of the videos it may see only.

        '
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 1024
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - hybrid
          - fts
          - semantic
          default: hybrid
      - in: query
        name: language
        schema:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 5
        style: form
        explode: true
      - in: query
        name: library
        schema:
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - in: query
        name: tag
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - in: query
        name: speaker
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Search hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid query.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Semantic backend unavailable and `mode=semantic` was requested.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: searchByQuery
    post:
      tags:
      - Search
      summary: Hybrid search with a structured request body
      description: Same semantics as `GET /search`; the body form is preferred when filters get long. For a restricted account (one under parental controls) the results, their totals and their snippets are of the videos it may see only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search hits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid query.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: search
  /search/suggest:
    get:
      tags:
      - Search
      summary: Autocomplete suggestions
      parameters:
      - in: query
        name: q
        required: true
        schema:
