    get:
      tags:
      - System
      summary: A NAS home's own shares (admin)
      description: Admin only. On a NAS home (Epic 59, story 59.13), the storage server record the home keeps for the NAS itself, each of its own folders with the SMB share it is (an empty share is not shared on the network), the library folders that still need a share name, whether some share is mounted at another path from the NAS's own, and whether a shared folder is writable for Maktaba (else the notice no_writable_share, and nodes download speech models themselves).
      x-maktaba-role: admin
      responses:
        '200':
          description: The NAS's shares; nas is false on a home that is not a NAS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeShares'
        '401':
          description: Not signed in.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Admin only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: getHomeShares
    put:
      tags:
      - System
      summary: Name a NAS home's shares (admin)
      description: Admin only. Replaces the NAS record's addresses and each folder's share name. The home's pipeline converts the folders' stored paths to the shares at its next storage check.
      x-maktaba-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeSharesRequest'
      responses:
        '200':
          description: The NAS's shares as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeShares'
        '400':
          description: A folder that is not a whole path, or a share name with a slash.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Not signed in.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Admin only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: This home keeps no record of its own shares and the request names no server (not_a_nas_home).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      operationId: putHomeShares
  /server/settings:
    get:
      tags:
      - Server
      summary: Read server.toml's settings
      description: 'The supervisor''s settings document (`saved`: the media roots and path map; `server`: `mdns`, the listen addresses, the public URLs and `trusted_proxies`, the reverse proxies whose forwarded client address is believed), and where each library folder is on this machine under the saved map. Without a supervisor: `{available: false, reason}`.'
      x-maktaba-role: admin
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: getServerSettings
    put:
      tags:
      - Server
      summary: Change server.toml's settings
      description: A partial change the supervisor checks and writes, for the next start. `server.trusted_proxies` lists addresses or CIDRs (a `/0` is refused); the forwarded client address is believed only from loopback and from them. Audited.
      x-maktaba-role: admin
      requestBody:
        required: true
        description: The fields to change.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The settings after the change.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: This server runs under no supervisor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: A value was refused; the answer names each.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: putServerSettings
  /server/machine:
    get:
      tags:
      - Server
      summary: This machine's hardware and tier
      description: What the server found on this machine (the memory, a container's limit and the ZFS cache counted; the CPU and its features; the GPUs; the data disk; the platform), the tier and why, what it sets, the quiet hours, the video encoder's verdict and the plugin isolation level. On a full node this is the home's.
      x-maktaba-role: admin
      responses:
        '200':
          description: The machine.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  available:
                    type: boolean
                    description: False when this API runs under no supervisor, or the supervisor did not answer (`reason` says why).
                  tier:
                    type: string
                    enum:
                    - light
                    - standard
                    - strong
                    description: The tier running now.
                  detected:
                    type: string
                    enum:
                    - light
                    - standard
                    - strong
                    description: The tier this machine's memory gives.
                  saved:
                    type: string
                    enum:
                    - light
                    - standard
                    - strong
                    - auto
                    description: 'The tier saved for the next start (`auto`: none picked).'
                  restart_needed:
                    type: boolean
                  quiet_hours:
                    type: string
                    description: 'The quiet hours as saved (`01:00-06:00`; empty: none): heavy work waits for them.'
                  quiet_set:
                    type: boolean
                    description: Whether the quiet hours are set (else the tier's default applies).
                  quiet_default:
                    type: string
                    description: The tier's default quiet hours.
                  video:
                    type: object
                    additionalProperties: true
                    description: 'The streaming role''s video verdict: the encoder (`vaapi`, `qsv`, `nvenc`, `videotoolbox` or `software`) and why; absent until the streaming role has tested the encoders.'
                  plugin_isolation:
                    type: object
                    additionalProperties: true
                    description: This machine's plugin isolation level.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: getMachine
    put:
      tags:
      - Server
      summary: Change the tier, the quiet hours or the data disk
      description: 'Every field is optional and only those sent change, for the next start: `tier` (`auto`: detected from the memory again), `quiet_hours` (`01:00-06:00`, or empty for none) or `quiet_default: true` (the tier''s), `data_disk` (`ssd`, `rotational` or `auto`). A tier pick and the other changes are audited.'
      x-maktaba-role: admin
      requestBody:
        required: true
        description: The change.
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  enum:
                  - light
                  - standard
                  - strong
                  - auto
                quiet_hours:
                  type:
                  - string
                  - 'null'
                quiet_default:
                  type: boolean
                data_disk:
                  type: string
                  enum:
                  - ssd
                  - rotational
                  - auto
      responses:
        '200':
          description: The machine after the change.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  available:
                    type: boolean
                    description: False when this API runs under no supervisor, or the supervisor did not answer (`reason` says why).
                  tier:
                    type: string
                    enum:
                    - light
                    - standard
                    - strong
                    description: The tier running now.
                  detected:
                    type: string
                    enum:
                    - light
                    - standard
                    - strong
                    description: The tier this machine's memory gives.
                  saved:
                    type: string
                    enum:
                    - light
                    - standard
                    - strong
                    - auto
