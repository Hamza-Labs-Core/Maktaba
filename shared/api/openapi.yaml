                  ok:
                    type: boolean
                  detail:
                    type: string
                  latency_ms:
                    type: number
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Restricted'
      operationId: testSttBackend
  /devices/register:
