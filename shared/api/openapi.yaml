        build_time:
          type: string
          format: date-time
        go_version:
          type: string
        schema_revision:
          type: integer
    WsMessage:
      type: object
      description: 'Envelope for every server-to-client WebSocket message.

        `type` follows the form `<channel>.<event>` (e.g. `jobs.progress`,

        `playback.completed`, `library.updated`).

        '
      required:
      - type
      - data
      - at
      properties:
        type:
          type: string
          enum:
          - subscribe
          - unsubscribe
          - jobs.new
          - jobs.flag_set
          - jobs.progress
          - jobs.state_changed
          - jobs.done
          - playback.progress
          - playback.completed
          - library.updated
          - videos.state_changed
          - videos.new
          - profiles_changed
          - health_changed
          - error
        data:
          description: Event-specific payload. See per-event schemas below.
          oneOf:
          - $ref: '#/components/schemas/WsSubscribe'
          - $ref: '#/components/schemas/WsJobEvent'
          - $ref: '#/components/schemas/WsPlaybackEvent'
          - $ref: '#/components/schemas/WsLibraryEvent'
          - $ref: '#/components/schemas/WsVideoEvent'
          - $ref: '#/components/schemas/WsErrorEvent'
        at:
          type: string
          format: date-time
    WsSubscribe:
      type: object
      properties:
        channels:
          type: array
          items:
            type: string
            enum:
            - jobs
            - playback
            - library
            - system
    WsJobEvent:
      type: object
      required:
      - job_id
      properties:
        job_id:
          type: integer
          format: int64
        video_id:
          type: string
          format: uuid
        stage:
          $ref: '#/components/schemas/JobStage'
        state:
          $ref: '#/components/schemas/JobState'
        progress:
          $ref: '#/components/schemas/JobProgress'
        error:
          type: string
    WsPlaybackEvent:
      type: object
      required:
      - video_id
      - position_sec
      properties:
        user_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        position_sec:
          type: number
        completed:
          type: boolean
    WsLibraryEvent:
      type: object
      required:
      - library_id
      properties:
        library_id:
          type: string
          format: uuid
        change:
          type: string
          enum:
          - created
          - updated
          - deleted
          - scan_started
          - scan_finished
        stats:
          $ref: '#/components/schemas/LibraryStats'
    WsVideoEvent:
      type: object
      required:
      - video_id
      - state
      properties:
        video_id:
          type: string
          format: uuid
        library_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/VideoState'
    WsErrorEvent:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    QueueJobRef:
      type: object
      description: A job as shown in queue views (REST and SSE).
      required:
      - id
      - stage
      - state
      - subject_kind
      - subject_id
      - subject_label
      - library_id
      - priority
      - attempts
      - max_attempts
      - outcome
      - error_cause
      - created_at
      - started_at
      - finished_at
      - progress
      properties:
        id:
          type: integer
        stage:
          type: string
        state:
          type: string
        subject_kind:
          type: string
        subject_id:
          type: string
        subject_label:
          type: string
        library_id:
          type:
          - string
          - 'null'
        priority:
          type: integer
        attempts:
          type: integer
        max_attempts:
          type: integer
        outcome:
          type:
          - string
          - 'null'
        error_cause:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        started_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        finished_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        progress:
          type:
          - object
          - 'null'
          additionalProperties: true
    QueueEdge:
      type: object
      description: One edge of the stage graph.
      required:
      - to
      - map
      - when
      - legacy
      properties:
        to:
          type: string
        map:
          type: string
        when:
          type: string
        legacy:
          type: boolean
    QueueStageInfo:
      type: object
      description: A row of job_stages plus computed fed_by.
      required:
      - stage
      - label
      - lane
      - lane_order
      - subject_kinds
      - pool
      - version
      - legacy
      - hidden
      - external_write
      - write_mode
      - enabled
      - disabled_reason
      - paused
      - paused_at
      - paused_by
      - debounce_sec
      - edges
      - may_request
      - entry_for
      - fed_by
      - extension
      - graph_synced_at
      properties:
        stage:
          type: string
        label:
          type: string
        lane:
          type: string
        lane_order:
          type: integer
        subject_kinds:
          type: array
          items:
            type: string
        pool:
          type: string
        version:
          type: integer
        legacy:
          type: boolean
        hidden:
          type: boolean
        external_write:
          type: boolean
        write_mode:
          type: string
        enabled:
          type: boolean
        disabled_reason:
          type:
          - string
          - 'null'
        paused:
          type: boolean
        paused_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        paused_by:
          type:
          - string
          - 'null'
        debounce_sec:
          type: integer
        edges:
          type: array
          items:
            $ref: '#/components/schemas/QueueEdge'
        may_request:
          type: array
          items:
            type: string
        entry_for:
          type: array
          items:
            type: string
        fed_by:
          type: array
          items:
            type: string
        extension:
          type:
          - string
          - 'null'
        graph_synced_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    WorkerPool:
      type: object
      description: A worker pool with live usage.
      required:
      - pool
      - label
      - scope
      - size
      - effective_size
      - busy
      - stages
      - updated_at
      - updated_by
      properties:
        pool:
          type: string
        label:
          type: string
        scope:
          type: string
        size:
          type:
          - integer
          - 'null'
        effective_size:
          type: integer
        busy:
          type: integer
        stages:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type:
          - string
          - 'null'
    QueueCounts:
      type: object
      description: Per-stage counters.
      required:
      - pending
      - ready
      - running
      - paused
      - failed_open
      - done_24h
      - skipped_24h
      - awaiting_review
      properties:
        pending:
          type: integer
        ready:
          type: integer
        running:
          type: integer
        paused:
          type: integer
        failed_open:
          type: integer
        done_24h:
          type: integer
        skipped_24h:
          type: integer
        awaiting_review:
          type: integer
    QueueSummary:
      type: object
      description: Per-stage card data (gauge, rate, ETA, waiting reason, worker coverage).
      required:
      - stage
      - counts
      - wave
      - rate_per_min
      - eta_sec
      - oldest_waiting_sec
      - waiting_reason
      - running_jobs
      - served_by
      - served_workers
      - no_worker
      - extension
      properties:
        stage:
          type: string
        counts:
          $ref: '#/components/schemas/QueueCounts'
        wave:
          type: object
          additionalProperties: true
        rate_per_min:
          type: number
        eta_sec:
          type:
          - number
          - 'null'
        oldest_waiting_sec:
          type:
          - number
          - 'null'
        waiting_reason:
          type:
          - string
          - 'null'
        running_jobs:
          type: array
          items:
            $ref: '#/components/schemas/QueueJobRef'
        served_by:
          type: array
          items:
            type: string
        served_workers:
          type: integer
        no_worker:
          type: boolean
        extension:
          type:
          - string
          - 'null'
    QueueFlow:
      type: object
      description: Trigger traffic between two stages.
      required:
      - from
      - to
      - per_min
      properties:
        from:
          type: string
        to:
          type: string
        per_min:
          type: number
    QueueHealth:
      type: object
      description: Health strip.
      required:
      - nas
      - cpu
      - network
      - backlog
      - spark
      properties:
        nas:
          type: object
          additionalProperties: true
        cpu:
          type: object
          additionalProperties: true
        network:
          type: object
          additionalProperties: true
        backlog:
          type: object
          additionalProperties: true
        spark:
          type: object
          additionalProperties: true
    QueuesSnapshot:
      type: object
      description: Everything the overview needs; also the queues.snapshot SSE payload.
      required:
      - at
      - paused_all
      - stages
      - queues
      - pools
      - flows
      - health
      - issues_count
      properties:
        at:
          type: string
          format: date-time
        paused_all:
          type: boolean
        stages:
          type: array
          items:
            $ref: '#/components/schemas/QueueStageInfo'
        queues:
          type: array
          items:
            $ref: '#/components/schemas/QueueSummary'
        pools:
          type: array
          items:
            $ref: '#/components/schemas/WorkerPool'
        flows:
          type: array
          items:
            $ref: '#/components/schemas/QueueFlow'
        health:
          $ref: '#/components/schemas/QueueHealth'
        issues_count:
          type: integer
    QueueRatePoint:
      type: object
      description: One 10-minute bucket.
      required:
      - t
      - done
      - failed
      - skipped
      - nas_timeouts
      properties:
        t:
          type: string
          format: date-time
        done:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        nas_timeouts:
          type: integer
    QueueDetail:
      type: object
      description: One queue page.
      required:
      - info
      - summary
      - kpis
      - running
      - next_up
      - failures
      - log
      properties:
        info:
          $ref: '#/components/schemas/QueueStageInfo'
        summary:
          $ref: '#/components/schemas/QueueSummary'
        kpis:
          type: object
          additionalProperties: true
        running:
          type: array
          items:
            $ref: '#/components/schemas/QueueJobRef'
        next_up:
          type: array
          items:
            $ref: '#/components/schemas/QueueJobRef'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/FailureGroup'
        log:
          type: array
          items:
            $ref: '#/components/schemas/QueueLogLine'
    FailureGroup:
      type: object
      description: Open failures of a stage grouped by normalised cause (plus awaiting_review / stale_graph).
      required:
      - stage
      - cause
      - label
      - count
      - first_at
      - last_at
      - sample_message
      - sample_subjects
      - action
      properties:
        stage:
          type: string
        cause:
          type: string
        label:
          type: string
        count:
          type: integer
        first_at:
          type: string
          format: date-time
        last_at:
          type: string
          format: date-time
        sample_message:
          type: string
        sample_subjects:
          type: array
          items:
            type: object
            additionalProperties: true
        action:
          type: string
    QueueLogLine:
      type: object
      description: One job_events row.
      required:
      - id
      - at
      - job_id
      - stage
      - subject_kind
      - subject_id
      - subject_label
      - level
      - kind
      - message
      - data
      properties:
        id:
          type: integer
        at:
          type: string
          format: date-time
        job_id:
          type: integer
        stage:
          type: string
        subject_kind:
          type: string
        subject_id:
          type: string
        subject_label:
          type: string
        level:
          type: string
        kind:
          type: string
        message:
          type: string
        data:
          type:
          - object
          - 'null'
          additionalProperties: true
    RetriggerRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 5000
          items:
            type: object
            required:
            - subject_kind
            - subject_id
            properties:
              subject_kind:
                type: string
                enum:
                - video
                - library
                - series
                - season
                - catalog
              subject_id:
                type: string
                format: uuid
              stage:
                type: string
        mode:
          type: string
          enum:
          - queue
          - force
          - force_cascade
          default: queue
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 50
    RetriggerResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              subject_kind:
                type: string
              subject_id:
                type: string
              stage:
                type: string
              job_id:
                type:
                - integer
                - 'null'
              outcome:
                type: string
                enum:
                - inserted
                - coalesced
                - rerun_requested
                - disabled
                - unknown_stage
                - invalid_subject
    QueueItemHistory:
      type: object
      description: History and re-queue options of one subject.
      required:
      - subject
      - kinds
      - queues
      - appears_in
      - timeline
      - next
      properties:
        subject:
          type: object
          additionalProperties: true
        kinds:
          type: array
          items:
            type: string
        queues:
          type: array
          items:
            type: object
            additionalProperties: true
        appears_in:
          type: array
          items:
            type: object
            additionalProperties: true
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
        next:
          type:
          - string
          - 'null'
    LibraryQueueRow:
      type: object
      description: One row of the libraries table.
      required:
      - library_id
      - name
      - videos
      - seasons
      - strip
      - last_activity_at
      properties:
        library_id:
          type: string
        name:
          type: string
        videos:
          type: integer
        seasons:
          type: integer
        strip:
          type: array
          items:
            type: object
            additionalProperties: true
        last_activity_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    HealthSeries:
      type: object
      description: One health metric over time (nas.open_ms_p95, cpu.pct, net.plex_ms, backlog.ready, ...).
      required:
      - metric
      - points
      properties:
        metric:
          type: string
        points:
          type: array
          items:
            type: object
            additionalProperties: true
    QueueWorker:
      type: object
      description: A registered worker.
      required:
      - worker_id
      - host
      - online
      - last_seen_at
      - serves
      - serves_label
      - pools
      - started_at
      - version
      properties:
        worker_id:
          type: string
        host:
          type: string
        online:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
        serves:
          type: array
          items:
            type: string
        serves_label:
          type: string
        pools:
          type:
          - object
          - 'null'
          additionalProperties: true
        started_at:
          type: string
          format: date-time
        version:
          type:
          - string
          - 'null'
    ExtensionInfo:
      type: object
      description: An optional extension (Plex, dizqueTV). Secret settings are never returned.
      required:
      - name
      - label
      - description
      - version
      - enabled
      - configured
      - settings_schema
      - settings
      - secrets_set
      properties:
        name:
          type: string
        label:
          type: string
        description:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        configured:
          type: boolean
        settings_schema:
          type: array
          items:
            type: object
            additionalProperties: true
        settings:
          type: object
          additionalProperties: true
        secrets_set:
          type: array
          items:
            type: string
  requestBodies:
    WsClientMessage:
      description: JSON envelope sent from client to server over the WebSocket. Use `subscribe` / `unsubscribe`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WsMessage'
