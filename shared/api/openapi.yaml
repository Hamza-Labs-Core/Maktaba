          - more_like_this
          - recently_added
          - trending
        description: When set, returns just one shelf.
      responses:
        '200':
          description: Recommendations grouped by shelf.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getRecommendations
  /ws:
    get:
      tags:
      - WebSocket
      summary: Upgrade to the realtime event stream
      description: "HTTP/1.1 upgrade to a WebSocket. Documented here for client-generation\ntools that want to know the protocol exists; the message envelope is in\nthe schemas section as `WsMessage`.\n\n### Channels\n- `jobs` — job state and progress.\n- `playback` — `playback.progress`, `playback.completed` events.\n- `library` — `library.updated`, `videos.state_changed` events.\n- `system` — `profiles_changed`, `health_changed`.\n\n### Subscribe\n```json\n{ \"type\": \"subscribe\", \"channels\": [\"jobs\", \"playback\"] }\n```\n\n### Sample event\n```json\n{\n  \"type\": \"jobs.progress\",\n  \"data\": { \"job_id\": 42, \"stage\": \"transcribe\", \"pct\": 0.18, \"eta_sec\": 612 },\n  \"at\": \"2026-05-05T13:21:04Z\"\n}\n```\n"
      responses:
        '101':
          description: Switching protocols (WebSocket).
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: connectWebSocket
      x-ws-message-schema:
        $ref: '#/components/schemas/WsMessage'
      requestBody:
        $ref: '#/components/requestBodies/WsClientMessage'
  /system/health:
    servers:
    - url: https://{host}
      variables:
        host:
          default: maktaba.local
    get:
      tags:
      - System
      summary: Liveness / readiness check
      description: 'Mounted at both `/health` (off the API root, for monitoring agents) and

        `/api/system/health`. 503 if any required component is `down`.

        '
      security: []
      responses:
        '200':
          description: All dependencies healthy or degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: At least one required component is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getHealth
  /system/version:
    get:
      tags:
      - System
      summary: Build identification
      description: Mounted at both `/version` and `/api/system/version`.
      security: []
      responses:
        '200':
          description: Version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getVersion
  /system/metrics:
