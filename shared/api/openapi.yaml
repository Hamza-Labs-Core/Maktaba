      responses:
        '200':
          description: The addresses after the change.
          content:
            application/json:
              schema:
                type: object
                required:
                - addresses
                additionalProperties: false
                properties:
                  addresses:
                    type: array
                    maxItems: 64
                    items:
                      type: string
                    description: IP addresses or CIDR ranges, for example `192.168.1.20` or `192.168.1.0/24`. The answer has them normalised, without repeats.
        '400':
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Admin only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
