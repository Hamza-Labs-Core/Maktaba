components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 access token (15 min). Mobile / desktop / TV clients pass it as

        `Authorization: Bearer <token>`. The Streaming Service validates the same

        JWT offline against the JWKS at `/.well-known/jwks.json`.

        '
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth
      description: '`httpOnly`, `secure`, `sameSite=lax` cookie set by `POST /auth/login`.

        State-changing requests must also send the `X-CSRF-Token` header.

        '
  parameters:
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size (1–200, default 50).
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque pagination cursor from the previous page's `next` field.
    LibraryId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Library id.
    VideoId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Video id.
    JobId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: Job id (64-bit integer).
  headers:
    X-Request-Id:
      schema:
        type: string
        format: uuid
      description: UUIDv7 correlation id. Echoed in every response.
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Requests allowed in the current window.
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: Requests remaining in the current window.
    X-RateLimit-Reset:
      schema:
        type: integer
      description: Unix-epoch seconds when the window resets.
    Retry-After:
      schema:
        type: integer
      description: Seconds to wait before retrying.
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Request body or parameters failed validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ProblemDetails'
            - type: object
              properties:
                errors:
                  type: array
                  items:
                    $ref: '#/components/schemas/FieldError'
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unavailable:
      description: A downstream dependency (Pipeline or Streaming) is unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Unhandled server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem document.
      required:
      - type
      - title
      - status
      - request_id
      properties:
        type:
          type: string
          format: uri
          description: Stable problem identifier (`https://maktaba.dev/problems/<slug>`).
          examples:
          - https://maktaba.dev/problems/validation
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI of the resource that produced the problem.
        request_id:
          type: string
          format: uuid
          description: UUIDv7 correlation id (matches `X-Request-Id`).
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Present on validation failures.
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: Dotted-path to the offending field, e.g. `roots[0]`.
        message:
          type: string
    Page:
      type: object
      required:
      - items
      properties:
        items:
          type: array
        next:
          type:
          - string
