  /ws:
    get:
      tags:
      - WebSocket
      summary: Upgrade to the realtime event stream
      description: "HTTP/1.1 upgrade to a WebSocket. Documented here for client-generation\ntools that want to know the protocol\
        \ exists; the message envelope is in\nthe schemas section as `WsMessage`.\n\n### Channels\n- `jobs` — job state and\
        \ progress.\n- `playback` — `playback.progress`, `playback.completed` events.\n- `library` — `library.updated`, `videos.state_changed`\
        \ events.\n- `system` — `profiles_changed`, `health_changed`.\n\n### Subscribe\n```json\n{ \"type\": \"subscribe\"\
        , \"channels\": [\"jobs\", \"playback\"] }\n```\n\n### Sample event\n```json\n{\n  \"type\": \"jobs.progress\",\n\
        \  \"data\": { \"job_id\": 42, \"stage\": \"transcribe\", \"pct\": 0.18, \"eta_sec\": 612 },\n  \"at\": \"2026-05-05T13:21:04Z\"\
        \n}\n```\n"
      responses:
        '101':
          description: Switching protocols (WebSocket).
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: connectWebSocket
      x-ws-message-schema:
        $ref: '#/components/schemas/WsMessage'
      requestBody:
        $ref: '#/components/requestBodies/WsClientMessage'
