            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Restricted'
      operationId: createTag
  /stream/sessions:
    post:
      tags:
      - Sessions
      summary: Mint a streaming session
      description: 'Returns a signed manifest URL (HLS / DASH) or direct URL. The client passes

        it to its player; bytes are served by the Streaming Service, not the API.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
      responses:
        '200':
          description: Session minted.
          headers:
            Maktaba-Warning:
              schema:
                type: string
              description: e.g. `start-sec-clamped`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '403':
          description: 'User cannot access this video. Or the account''s watching time is over (Parental controls): the problem type is `https://maktaba.tv/problems/parental-time`, `code` is `parental_time`, `reason` is `outside_slot` or `limit_reached`, and `next_allowed_at` is when the rules allow watching again (absent when no moment in the next eight days does). No session is opened.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: '`transcode_busy`: every transcode this home runs at once is taken; ask again after `Retry-After`. Also when a restricted account''s watching time cannot be read, or the streaming service cannot be told of it: the stream is refused, never let through uncounted; ask again after `Retry-After`.'
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '507':
          description: Too little free on the streaming service's disk to prepare (transcode) the video (code `insufficient_storage`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: createSession
  /stream/sessions/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Sessions
      summary: Fetch a session
      responses:
        '200':
          description: Session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getSession
    delete:
      tags:
      - Sessions
      summary: Close a streaming session
      description: Frees the transcoder slot and revokes the signed URL.
      responses:
        '204':
          description: Closed.
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: closeSession
  /stream/sessions/{id}/progress:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Sessions
      summary: Heartbeat session progress
      description: 'Server-side debounced (1 Hz). Mirrors the position into `playback_state`.

        Excluded from rate limits. For a restricted account this is the stream''s heartbeat: it counts the watching time and keeps the stream running, so send it at least every 60 seconds.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - position_sec
              properties:
                position_sec:
                  type: number
                  minimum: 0
                completed:
                  type: boolean
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
        '403':
          description: 'The account''s watching time is over (Parental controls): the problem type is `https://maktaba.tv/problems/parental-time`, `code` is `parental_time`, `reason` is `outside_slot`, `limit_reached`, or `no_heartbeat` when the session is not one the home is counting for this account, and `next_allowed_at` is when the rules allow watching again (absent when no moment in the next eight days does, and with `no_heartbeat`). The position is not saved and the stream ends within 60 seconds.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 'A restricted account''s watching time could not be counted: the progress is refused, never taken uncounted; ask again after `Retry-After`.'
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: sessionProgressHeartbeat
  /stream/sessions/{id}/errors:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The stream session's id.
    post:
      tags:
      - Sessions
      summary: Report a playback failure
      description: A player says what went wrong with its own stream session, for the home's log. Reports are rate limited per session and per account; one over the limit is accepted and dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                video_id:
                  type: string
                  format: uuid
                outcome:
                  type: string
                  description: 'What the player did: `fatal`, `reopen` or `stalled`.'
                code:
                  type: string
                  description: The player's own name for the error.
                message:
                  type: string
                position_sec:
                  type: number
      responses:
        '202':
          description: Accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: reportPlaybackError
  /stream/capabilities:
    get:
      tags:
      - Sessions
      summary: Streaming server capabilities
      description: Cached 60 s; invalidated by the streaming service when the encoder profile changes.
      responses:
        '200':
          description: Capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamCapabilities'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getStreamCapabilities
  /watch/start:
    post:
      tags:
      - Watch progress
      summary: Start a watch
      description: 'Opens a watch session for the caller''s history and statistics. When the caller has paused tracking nothing is opened and `tracking` is false. For any signed-in user. It counts no watching time and keeps no stream running: the stream session''s progress posts do that.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - video_id
              properties:
                video_id:
                  type: string
                  format: uuid
                device_type:
                  type: string
                  description: 'What kind of device plays, for the statistics; absent: what the app''s `X-Maktaba-Client` header says.'
                platform:
                  type: string
                quality:
                  type: string
      responses:
        '201':
          description: The watch session was opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  tracking:
                    type: boolean
        '200':
          description: 'Tracking is paused for the caller: nothing was opened and `tracking` is false.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  tracking:
                    type: boolean
        '400':
          description: '`video_id` is not an id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'The account''s watching time is over (Parental controls): the problem type is `https://maktaba.tv/problems/parental-time`, `code` is `parental_time`, `reason` is `outside_slot` or `limit_reached`, and `next_allowed_at` is when the rules allow watching again (absent when no moment in the next eight days does).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such video that the caller can reach. A video in a library the caller cannot open answers the same as one that does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'A restricted account''s watching time could not be read: the watch is refused, never let through on an error; ask again after `Retry-After`.'
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: startWatch
  /watch/heartbeat:
    post:
      tags:
      - Watch progress
      summary: Keep a watch going
      description: Adds the time since the last heartbeat to an active watch session of the caller and records how far the video has played. A session that was closed is not opened again. For any signed-in user. It counts no watching time against a restricted account's time rules and keeps no stream running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
                  format: uuid
                position_sec:
                  type: number
                  minimum: 0
      responses:
        '200':
          description: The watch session as it is now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                  video_id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum:
                    - active
                    - completed
                    - stopped
                    - interrupted
                  duration_sec:
                    type: integer
                  percent_complete:
                    type: number
        '400':
          description: '`session_id` is not an id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: 'The account''s watching time is over (Parental controls): the problem type is `https://maktaba.tv/problems/parental-time`, `code` is `parental_time`, `reason` is `outside_slot` or `limit_reached`, and `next_allowed_at` is when the rules allow watching again (absent when no moment in the next eight days does).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such watch session of the caller, or its video is now hidden from the account.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The watch session is closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: 'A restricted account''s watching time could not be read: the watch is refused, never let through on an error; ask again after `Retry-After`.'
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: heartbeatWatch
  /settings:
