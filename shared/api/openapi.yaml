      description: Each feature a client shows (`live_tv`, `transcripts`, `search`, ...) and whether it is on, off, or not available, so an app hides or explains what is off. Answers 304 to a matching `If-None-Match`; `/ws/home` sends `capabilities_changed` when it moves. The answer also carries the caller's own `parental` block, and the ETag covers it, so a changed limit is a changed answer.
      responses:
        '200':
          description: The features, and the caller's `parental` block.
          content:
