      operationId: setTunerAllowedAddresses
  /me/parental/requests:
    post:
      tags:
      - Parental controls
      summary: Ask a parent to open something
      description: For a restricted account only. Asks its guardians to allow one item it can reach but its limit hides, or, with `subject_kind` `time`, for more watching time today. Asking again for the same item while the first request waits answers that request; an account has one request for time waiting at most, and asking again, for any number of minutes, answers it. A request waits seven days, a request for time only until its home day ends (04:00 home time), and at most 20 wait at once. Each guardian gets one notice, which names neither the child nor the item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_kind:
                  type: string
                  enum:
                  - library
                  - collection
                  - series
                  - channel
                  - youtube_source
                  - plugin
                  - video
                  - time
                subject_id:
                  type: string
                  description: 'The item''s id. For `time`: the minutes asked for, a whole number from 1 to 480 written as text (`"30"`).'
              required:
              - subject_kind
              - subject_id
      responses:
        '200':
          description: A request for this item, or for time, was already waiting; it is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      child_id:
                        type: string
                        format: uuid
                      subject_kind:
                        type: string
                        enum:
                        - library
                        - collection
                        - series
                        - channel
                        - youtube_source
                        - plugin
                        - video
                        - time
                      subject_id:
                        type: string
                        description: The item's id; for a request for time, the minutes asked for, as text.
                      minutes:
                        type: integer
                        description: The minutes a request for time asks for; absent for any other kind.
                      status:
                        type: string
                        enum:
                        - pending
                        - approved
                        - denied
                        - expired
                      decided_by:
                        type: string
                        format: uuid
                      decided_at:
                        type: string
                        format: date-time
                      created_at:
                        type: string
                        format: date-time
                      expires_at:
                        type: string
                        format: date-time
                        description: 'When a request still waiting stops waiting: seven days after it was made, or, for a request for time, the end of the home day it was made on (04:00 home time).'
        '201':
          description: The request was made.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      child_id:
                        type: string
                        format: uuid
                      subject_kind:
                        type: string
                        enum:
                        - library
                        - collection
                        - series
                        - channel
                        - youtube_source
                        - plugin
                        - video
                        - time
                      subject_id:
                        type: string
                        description: The item's id; for a request for time, the minutes asked for, as text.
                      minutes:
                        type: integer
                        description: The minutes a request for time asks for; absent for any other kind.
                      status:
                        type: string
                        enum:
                        - pending
                        - approved
                        - denied
                        - expired
                      decided_by:
                        type: string
                        format: uuid
                      decided_at:
                        type: string
                        format: date-time
                      created_at:
                        type: string
                        format: date-time
                      expires_at:
                        type: string
                        format: date-time
                        description: 'When a request still waiting stops waiting: seven days after it was made, or, for a request for time, the end of the home day it was made on (04:00 home time).'
        '403':
          description: 'Not a restricted account: `code` is `not_restricted`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such item that the account can reach. An item in a library the account cannot open answers the same as one that does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 20 requests are already waiting (`code` is `too_many_requests`), or the caller is rate limited.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: askParent
  /me/parental/guardians:
    get:
      tags:
      - Parental controls
      summary: Who can unlock with a parent PIN
      description: 'For a restricted account only. The account''s guardians, and the admins, who have set a parent PIN: the people a device offers on its PIN screen.'
      responses:
        '200':
          description: The people with a PIN, by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  guardians:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        username:
                          type: string
        '403':
          description: 'Not a restricted account: `code` is `not_restricted`.'
