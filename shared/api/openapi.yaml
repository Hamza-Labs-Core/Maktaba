      operationId: getWatchProgress
    put:
      tags:
      - Watch progress
      summary: Upsert playback state for the current user and a video
      description: 'Server-side debounced (1 Hz per user/video). Fires `playback.completed`

        on `false → true` transition. Excluded from per-user rate limits.

