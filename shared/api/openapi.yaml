      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The channel's id.
    post:
      tags:
      - Parental controls
      summary: Get a signed address to watch a channel
      description: 'Answers the channel''s live stream address, signed for this caller. The home''s streaming service serves a channel only to a request that carries this signature, to the home''s web port for a signed-in account, or to an address allowed to use the tuner. For a signed address and for a signed-in account it asks, on every request and again when a programme starts, whether what plays now is within that viewer''s parental limit, and it refuses when it cannot get an answer. When the programme now on the channel is above the caller''s parental limit the answer is 403 with `code: restricted`, `reason: programme` and `retry_at`, and the player shows its "not available right now" screen until then. The stream itself stops for a restricted viewer when such a programme starts. A sign-in with no account, other than the admin token, gets 403 `no_account`. On another machine of the home a channel plays with a sign-in through that machine''s web port, not with this address.'
      responses:
        '200':
          description: The signed address.
          content:
            application/json:
              schema:
                type: object
                required:
                - channel_id
                - url
                - expires_at
                - until
                properties:
                  channel_id:
                    type: string
                    format: uuid
                    description: The channel.
                  url:
                    type: string
                    description: The channel's HLS playlist address with its signature. Ask for a new one before `expires_at`.
                  expires_at:
                    type: string
                    format: date-time
                    description: When the signature stops working.
                  until:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: 'When the answer may change: the start of the next programme that flips it, in UTC. Null when nothing in the next 12 hours changes it. Ask again at this time.'
        '403':
          description: 'The programme now on the channel is above the caller''s limit: `code` is `restricted`, `reason` is `programme` and `retry_at` is when to ask again (absent when nothing in the next 12 hours changes it).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such channel that the caller may see. A channel above a restricted account's limit, or blocked for it, answers the same as one that does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: playChannel
  /tv/parental/verdict:
    get:
      tags:
      - Parental controls
      summary: The parental answer for a viewer and a channel (this machine's services)
      description: For the streaming service on the home machine, which asks before it serves a live channel to a named viewer. It carries the machine's local token in `X-Maktaba-Local-Token`; no user sign-in opens it.
      security: []
      parameters:
      - name: channel
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The channel's id.
      - name: user
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: The viewer's account id.
      responses:
        '200':
          description: The answer for now.
          content:
            application/json:
              schema:
                type: object
                required:
                - restricted
                - channel_allowed
                - allowed
                - until
                properties:
                  restricted:
                    type: boolean
                    description: True when the viewer has a parental limit.
                  channel_allowed:
                    type: boolean
                    description: True when the viewer may see the channel at all.
                  allowed:
                    type: boolean
                    description: True when the viewer may watch the programme now on the channel.
                  until:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: 'When the answer may change: the start of the next programme that flips it, in UTC. Null when nothing in the next 12 hours changes it. Ask again at this time.'
        '400':
          description: Invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The local token is missing or wrong.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: getLiveParentalVerdict
  /tv/hdhr/allowed:
