  /me/parental/time:
    get:
      tags:
      - Parental controls
      summary: The caller's own watching time now
      description: 'For the player''s countdown: whether the caller may watch now, for how long, and when next. For any signed-in user; an account with no time rules is `allowed` and not `limited`. It only reads: asking it counts nothing and keeps no stream running. When the time is over, opening a stream session, posting its progress and starting a watch answer 403 with the problem type `https://maktaba.tv/problems/parental-time`, a `reason` (`outside_slot`, `limit_reached`, or `no_heartbeat` when the stream sent no progress for 60 seconds) and, when the rules allow watching again, `next_allowed_at`. The streaming service refuses the stream''s segments within 60 seconds with the same `reason`.'
      parameters:
      - in: query
        name: library_id
        required: false
        schema:
          type: string
          format: uuid
        description: 'Also count the rules of this library; absent: the account''s own rules.'
      responses:
        '200':
          description: The caller's time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                    description: Watching may start or go on now.
                  limited:
                    type: boolean
                    description: A time rule covers this moment, so `remaining_seconds` is a real countdown.
                  reason:
                    type: string
                    enum:
                    - outside_slot
                    - limit_reached
                    description: Why not, when not `allowed`.
                  remaining_seconds:
                    type:
                    - integer
                    - 'null'
                    description: How long watching may go on from now; null when no rule limits the account now.
                  slot_ends_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: When the open slot closes; null when no slot covers now.
                  next_allowed_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: When watching is next allowed; null when it is allowed now.
                  now:
                    type: string
                    format: date-time
                    description: The home's clock for this answer. Count down from it, not from the device's clock.
        '422':
          description: '`library_id` is not an id.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: getMyParentalTime
