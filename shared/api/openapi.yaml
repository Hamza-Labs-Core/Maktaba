      type: object
      description: A card of a library's Collections tab.
      properties:
        kind:
          type: string
          enum:
          - topic
          - clip
          - curated
          - smart
          - youtube
          - plex
        subkind:
          type: string
        id:
          type: string
        name:
          type: string
        videos:
          type:
          - integer
          - 'null'
        poster_video_ids:
          type: array
          items:
            type: string
        automatic:
          type: boolean
        source_kind:
          type: string
          enum:
          - youtube_playlist
          - youtube_channel
          - plex
        show_on_library:
          type: boolean
    ParentalSettings:
      type: object
      description: Whether parental controls are on in this home, and what an admin is told while they are off.
      required:
      - enabled
      - restricted_accounts
      - can_disable
      - child_devices
      - child_device_notice
      properties:
        enabled:
          type: boolean
          description: Parental controls are on. They start off in a home that has set nothing up, and turn on by themselves when an admin makes the first account restricted or gives the first library a default age tier. While they are off a device's age signal is recorded and limits nothing. A restricted account's own limit is applied whatever this says.
        restricted_accounts:
          type: integer
          description: How many accounts are restricted.
        can_disable:
          type: boolean
          description: 'False while any account is restricted: lift every restriction before turning parental controls off.'
        child_devices:
          type: integer
          description: How many sign-ins' devices said a child may be using them (a limit under 18) and are not applied because parental controls are off. Zero once they are on.
        child_device_notice:
          type: boolean
          description: 'Show the notice that a child may be using Maktaba: parental controls are off and such a device spoke since an admin last dismissed the notice.'
      example:
        enabled: false
        restricted_accounts: 0
        can_disable: true
        child_devices: 1
        child_device_notice: true
    ParentalCapabilities:
      type: object
      description: 'The caller''s own part of the home''s capabilities: what an app needs about parental controls before it draws anything.'
      required:
      - enabled
      - restricted
      - tier_limit
      - can_manage
      properties:
        enabled:
          type: boolean
          description: Parental controls are on in this home.
        restricted:
          type: boolean
          description: The account is restricted. A sign-in limited only by its device is not a restricted account.
        tier_limit:
          type:
          - integer
          - 'null'
          enum:
          - -1
          - 0
          - 9
          - 13
          - 16
          - 18
          - null
          description: 'The age-tier limit this sign-in is held to, by the account''s policy or by its device, whichever is stricter: `0` all ages, `9`, `13`, `16`, `18`; `-1` nothing that has a tier; `null` when nothing limits it.'
        can_manage:
          type: boolean
          description: 'The caller is an admin, or the guardian of at least one restricted account: show the Family screens.'
      example:
        enabled: true
        restricted: true
        tier_limit: 9
        can_manage: false
  requestBodies:
    WsClientMessage:
      description: JSON envelope sent from client to server over the WebSocket. Use `subscribe` / `unsubscribe`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WsMessage'
