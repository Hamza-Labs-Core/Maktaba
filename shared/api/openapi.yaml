openapi: 3.1.0
info:
  title: Maktaba API
  version: 0.1.0
  summary: Self-hosted video library with automatic transcription, semantic search, and adaptive streaming.
  description: "The Maktaba API is the control plane for a self-hosted video library. It exposes\nlibraries, videos, transcripts,\
    \ search, processing jobs, streaming sessions, and\nuser state over a uniform JSON surface.\n\n## Conventions\n\n- **Transport.**\
    \ HTTP/1.1 and HTTP/2 over TLS. JSON request and response bodies\n  use `Content-Type: application/json; charset=utf-8`.\
    \ Error responses use\n  [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457) `application/problem+json`.\n- **Identifiers.**\
    \ Resource ids are UUIDv4 unless documented otherwise.\n  `Job.id` and `AudioTrack.id` are 64-bit integers.\n- **Times.**\
    \ All timestamps are RFC 3339 / ISO 8601 in UTC (`Z` suffix).\n  Durations and offsets are seconds as floats.\n- **Pagination.**\
    \ Cursor-based. Pass `limit` (default 50, max 200) and the\n  opaque `cursor` returned from the previous page. The page\
    \ envelope is\n  `{ items: [...], next: \"<cursor>\" | null }`. Cursors encode\n  `(updated_at DESC, id DESC)` and rotate\
    \ when the schema version changes.\n- **Idempotency.** All `POST /api/jobs/{id}/{action}` endpoints are idempotent.\n\
    \  Clients may set `Idempotency-Key: <uuid>` on `POST` and `PATCH` requests; the\n  server replays the original response\
    \ for 24 hours.\n- **Request correlation.** Every response carries `X-Request-Id` (UUIDv7).\n  Clients may pass their\
    \ own `X-Request-Id` to thread it through.\n- **Rate limits.** Default: 600 requests / minute / authenticated user, 6\
    \ 000 /\n  minute / IP. Exhausted requests get `429 Too Many Requests` with `Retry-After`\n  and headers `X-RateLimit-Limit`,\
    \ `X-RateLimit-Remaining`, `X-RateLimit-Reset`.\n\n## Authentication\n\nTwo equivalent paths backed by the same identity:\n\
    \n- **Web** uses `httpOnly` cookies set by `POST /api/auth/login`. State-changing\n  requests must also include the `X-CSRF-Token`\
    \ header (value mirrored from the\n  `csrf_token` cookie).\n- **Mobile / desktop / TV** uses bearer JWT (RS256, 15 min)\
    \ with a long-lived\n  opaque refresh token. Public keys are exposed at `/api/.well-known/jwks.json`.\n\nSingle-user installs\
    \ may pass a static admin token via `Authorization: Bearer`.\n\n## Streaming\n\nThe `/api/sessions` endpoints mint short-lived\
    \ signed URLs that the client\nsends to the Streaming Service (separate origin) directly. Bytes never round\ntrip the\
    \ API.\n\n## WebSocket\n\n`GET /api/ws` upgrades to a multiplexed event stream. Messages are JSON\n`{ type, data, at }`\
    \ envelopes. Clients subscribe by sending\n`{ type: \"subscribe\", channels: [\"jobs\", \"playback\", \"library\"] }`\
    \ on connect.\n"
  contact:
    name: Maktaba
    url: https://github.com/maktaba/maktaba
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0
servers:
- url: https://{host}/api
  description: Production
  variables:
    host:
      default: maktaba.local
      description: The host where the API service is reachable.
- url: http://localhost:8080/api
  description: Local development
externalDocs:
  description: Architecture spec
  url: https://github.com/maktaba/maktaba/blob/main/specs/architecture.md
tags:
- name: Auth
  description: Login, token refresh, session lifecycle.
- name: Libraries
  description: Folder collections shared by configuration and language profile.
- name: Videos
  description: Video metadata, processing controls, transcript window.
- name: Search
  description: Hybrid (FTS + semantic) search with filters and saved queries.
- name: Jobs
  description: Pipeline job state and pause / resume / cancel / retry control.
- name: Queue
  description: Aggregate queue statistics.
- name: Collections
  description: User-curated and smart collections of videos.
- name: Tags
  description: Tag taxonomy.
- name: Speakers
  description: Speaker labels derived from diarization.
- name: Watch progress
  description: Per-user playback position and completion state.
- name: Sessions
  description: Streaming session lifecycle (mint signed URLs, close, capabilities).
- name: Settings
  description: App-wide and per-user settings.
- name: Devices
  description: Push-notification device registration.
- name: Recommendations
  description: Personalized video suggestions.
- name: System
  description: Health, version, metrics. Open to monitoring agents.
- name: WebSocket
  description: Real-time event channel (documented; protocol is WS).
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Authenticate with username and password
      description: 'On success, sets `auth` and `csrf_token` cookies (web) **and** returns a

        bearer access token + refresh token in the body (mobile/TV). Clients use

        whichever they need; the server issues both unconditionally.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: correct horse battery staple
      responses:
        '200':
          description: Authenticated.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Sets `auth` (httpOnly secure) and `csrf_token` (readable) cookies.
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: login
  /auth/register:
    post:
      tags:
      - Auth
      summary: Create a new user account
      description: 'Disabled in single-user mode. When enabled, requires either an admin token

        (multi-user with admin-only invites) or open registration if configured.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '403':
          description: Registration disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Username already taken.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: register
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Exchange a refresh token for a fresh access token
      description: 'Rotating refresh tokens; the previous refresh token is invalidated on use.

        Web clients send the refresh token via the `refresh_token` cookie; native

        clients send `{refresh_token}` in the body.

        '
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: Required for native clients.
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Refresh token invalid, revoked, or expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: refreshToken
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke current credentials
      description: Clears auth cookies and revokes the bearer refresh token.
      responses:
        '204':
          description: Logged out.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Clears `auth`, `csrf_token`, `refresh_token` cookies.
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: logout
  /auth/me:
    get:
      tags:
      - Auth
      summary: Return the authenticated user
      responses:
        '200':
          description: Authenticated user profile, and the home's name.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/User'
                - type: object
                  properties:
                    home_name:
                      type: string
                      description: The home's name for people (an admin renames
                        it with PATCH /settings home.name; unset, the computer's
                        name).
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: getCurrentUser
  /libraries:
    get:
      tags:
      - Libraries
      summary: List libraries
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of libraries.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Library'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
      operationId: listLibraries
    post:
      tags:
      - Libraries
      summary: Create a library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryCreate'
            example:
              name: Lectures
              roots:
              - /mnt/media/lectures
              settings:
                language: ar
                stt_profile: default
      responses:
        '201':
          description: Library created.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: Canonical URL of the new library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '409':
          description: Name already in use.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: createLibrary
  /libraries/{id}:
    parameters:
    - $ref: '#/components/parameters/LibraryId'
    get:
      tags:
      - Libraries
      summary: Fetch a library
      responses:
        '200':
          description: Library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getLibrary
    patch:
      tags:
      - Libraries
      summary: Update a library
      description: Settings are deep-merged; pass `null` to clear a key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryUpdate'
      responses:
        '200':
          description: Updated library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Library'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: updateLibrary
    delete:
      tags:
      - Libraries
      summary: Delete a library
      parameters:
      - in: query
        name: purge
        schema:
          type: boolean
          default: false
        description: When `true`, also unlinks media files from disk.
      - in: query
        name: confirm
        schema:
          type: string
        description: Required when `purge=true`. Must equal the library id.
      responses:
        '204':
          description: Deleted.
        '207':
          description: Multi-status — soft delete done, some files failed to unlink.
          content:
            application/json:
              schema:
                type: object
                properties:
                  failed_paths:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Confirmation token missing or wrong.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: deleteLibrary
  /libraries/{id}/scan:
    parameters:
    - $ref: '#/components/parameters/LibraryId'
    post:
      tags:
      - Libraries
      summary: Enqueue a scan job for a library
      description: Returns immediately with the scan job id; progress is published over WebSocket.
      responses:
        '202':
          description: Scan enqueued.
          content:
            application/json:
              schema:
                type: object
                required:
                - job_id
                properties:
                  job_id:
                    type: integer
                    format: int64
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: scanLibrary
  /libraries/{id}/stats:
    parameters:
    - $ref: '#/components/parameters/LibraryId'
    get:
      tags:
      - Libraries
      summary: Aggregate stats for a library
      responses:
        '200':
          description: Library stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryStats'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getLibraryStats
  /videos:
    get:
      tags:
      - Videos
      summary: List videos
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - in: query
        name: library
        schema:
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      - in: query
        name: language
        schema:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 5
        style: form
        explode: true
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        description: Filter by `content_type` (e.g. `lecture`, `film`).
      - in: query
        name: tag
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - in: query
        name: q
        schema:
          type: string
          maxLength: 256
        description: Lightweight FTS over title + description. Use `POST /search` for full search.
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - updated_at
          - created_at
          - title
          - duration_sec
          - relevance
          default: created_at
        description: Without one, the most recently added first (`created_at`); with `q`, `relevance`
          (titles that start with `q`, then titles that hold it, then descriptions only, each newest-added
          first). A sort the caller names always wins; `relevance` needs `q`.
      responses:
        '200':
          description: Page of videos.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/VideoSummary'
        '400':
          description: Invalid sort or filter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: listVideos
  /videos/{id}:
    parameters:
    - $ref: '#/components/parameters/VideoId'
    get:
      tags:
      - Videos
      summary: Fetch a video with full metadata
      responses:
        '200':
          description: Video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getVideo
    patch:
      tags:
      - Videos
      summary: Update mutable video fields
      description: Body is capped at 8 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoUpdate'
      responses:
        '200':
          description: Updated video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Body too large.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: updateVideo
    delete:
      tags:
      - Videos
      summary: Delete a video
      parameters:
      - in: query
        name: purge
        schema:
          type: boolean
          default: false
      - in: query
        name: confirm
        schema:
          type: string
          format: uuid
        description: Required when `purge=true`; must equal the video id.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: Confirmation required for purge.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: deleteVideo
  /videos/{id}/process:
    parameters:
    - $ref: '#/components/parameters/VideoId'
    post:
      tags:
      - Videos
      summary: Enqueue a single processing stage for a video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stage
              properties:
                stage:
                  $ref: '#/components/schemas/JobStage'
                priority:
                  type: integer
                  minimum: 1
                  maximum: 999
                  default: 100
      responses:
        '200':
          description: Job enqueued (or returned if it already existed).
          content:
            application/json:
              schema:
                type: object
                required:
                - job_id
                - stage
                - state
                properties:
                  job_id:
                    type: integer
                    format: int64
                  stage:
                    $ref: '#/components/schemas/JobStage'
                  state:
                    $ref: '#/components/schemas/JobState'
                  note:
                    type: string
        '400':
          description: '`stage` cannot be enqueued at video scope (e.g. `scan`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: processVideo
  /videos/{id}/reprocess:
    parameters:
    - $ref: '#/components/parameters/VideoId'
    post:
      tags:
      - Videos
      summary: Reset state and reprocess from a given stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - from_stage
              properties:
                from_stage:
                  $ref: '#/components/schemas/JobStage'
      responses:
        '202':
          description: Jobs enqueued.
          content:
            application/json:
              schema:
                type: object
                required:
                - job_ids
                - from_stage
                - predecessor_state
                properties:
                  job_ids:
                    type: array
                    items:
                      type: integer
                      format: int64
                  from_stage:
                    $ref: '#/components/schemas/JobStage'
                  predecessor_state:
                    $ref: '#/components/schemas/VideoState'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: reprocessVideo
  /videos/{id}/segments:
    parameters:
    - $ref: '#/components/parameters/VideoId'
    get:
      tags:
      - Videos
      summary: Read a transcript window for a video
      parameters:
      - in: query
        name: from
        schema:
          type: number
          format: float
          default: 0
        description: Inclusive start (seconds).
      - in: query
        name: to
        schema:
          type: number
          format: float
        description: Exclusive end (seconds). Defaults to end of transcript.
      - in: query
        name: words
        schema:
          type: boolean
          default: false
        description: When `true`, populates `Segment.words` with word-level timing.
      - in: query
        name: include_superseded
        schema:
          type: boolean
          default: false
        description: Include segments from superseded transcripts.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Segments in `[from, to)`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentWindow'
        '400':
          description: Invalid time window or query.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: listVideoSegments
  /videos/{id}/subtitles:
    parameters:
    - $ref: '#/components/parameters/VideoId'
    get:
      tags:
      - Videos
      summary: List subtitle tracks (signed URLs)
      parameters:
      - in: header
        name: Accept-Language
        schema:
          type: string
        description: Preferred language ranking; orders the result.
      responses:
        '200':
          description: Subtitle tracks. URLs are signed and short-lived.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subtitle'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: listVideoSubtitles
  /videos/{id}/chapters:
    parameters:
    - $ref: '#/components/parameters/VideoId'
    get:
      tags:
      - Videos
      summary: List chapters for a video (ordered by `seq`)
      responses:
        '200':
          description: Chapters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
