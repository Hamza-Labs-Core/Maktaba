      responses:
        '204':
          description: The PIN is set.
        '403':
          description: '`code` is `password_wrong` when the password is wrong; `restricted` for a restricted account. A play-only sign-in through Maktaba Cloud is refused too.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 'Ten wrong passwords in an hour: `code` is `too_many_tries`, with `retry_after` and the `Retry-After` header. Or the caller is rate limited.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: setParentalPin
  /parental/requests:
