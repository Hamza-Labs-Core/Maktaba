        '401':
          $ref: '#/components/responses/Unauthorized'
        '304':
          description: Unchanged since the ETag sent.
        '503':
          description: 'The account''s limits cannot be read now (`code: parental_unavailable`): try again after `Retry-After`. An app must not treat this as an account nothing limits.'
          content:
            application/problem+json:
              schema:
