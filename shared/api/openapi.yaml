            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: dismissParentalNotice
  /parental/library-suggestions:
    get:
      tags:
      - Parental controls
      summary: List the libraries with the tier Rate libraries starts with
      description: 'Every library with its default age tier and the one the form offers for a library that has none: All ages when at least nine in ten of its classified videos are lectures, otherwise none. Nothing is stored until an admin sets a tier with `PUT /libraries/{id}/age-tier`.'
      x-maktaba-role: admin
      responses:
        '200':
          description: The libraries, by name.
          content:
            application/json:
              schema:
                type: object
                required:
                - libraries
                properties:
                  libraries:
                    type: array
                    items:
                      type: object
                      required:
                      - library_id
                      - name
                      - tier
                      - suggested_tier
                      - classified
                      - lectures
                      properties:
                        library_id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        tier:
                          type:
                          - integer
                          - 'null'
                          enum:
                          - 0
                          - 9
                          - 13
                          - 16
                          - 18
                          - null
                          description: The default tier stored now, or null.
                        suggested_tier:
                          type:
                          - integer
                          - 'null'
                          enum:
                          - 0
                          - null
                          description: 'What the form starts with: `0` (All ages) or null (Not rated).'
                        classified:
                          type: integer
                          description: How many of its videos have a content type.
                        lectures:
                          type: integer
                          description: How many of those are lectures or sermons.
        '403':
          description: 'Admin only. A restricted account gets `code: restricted`, any other account `code: admin_only`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: listParentalLibrarySuggestions
  /channels:
    get:
      tags:
      - Parental controls
      summary: List the channels
      description: The live TV channels the caller may read, each with what it plays now. A restricted account is not sent a channel above its limit or under a block rule, and a programme above its limit is not named. An admin's answer also has each channel's `age_tier`.
      responses:
        '200':
          description: The channels.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                          format: uuid
                        number:
                          type: integer
                        name:
                          type: string
                        age_tier:
                          type:
                          - integer
                          - 'null'
                          enum:
                          - 0
                          - 9
                          - 13
                          - 16
                          - 18
                          - null
                          description: 'The channel''s age tier, set with `PUT /channels/{id}/age-tier`: a tier, or null when none is set. Only an administrator''s answer has this field; it is absent for everyone else.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: listChannels
  /libraries/manage:
    get:
      tags:
      - Libraries
      summary: List every library for the management page
      description: Each library with its folders, counts, last scan and what it follows on YouTube, and the folders two libraries share. Each library carries its default `age_tier`.
      x-maktaba-role: admin
      responses:
        '200':
          description: The libraries.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - conflict_groups
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        age_tier:
                          type:
                          - integer
                          - 'null'
                          enum:
                          - 0
                          - 9
                          - 13
                          - 16
                          - 18
                          - null
                          description: 'The library''s default age tier, set with `PUT /libraries/{id}/age-tier`: a tier, or null when none is set.'
                  conflict_groups:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '403':
          $ref: '#/components/responses/Restricted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: listManagedLibraries
  /pairing/approve:
    post:
      tags:
      - Devices
      summary: Approve the code a device shows
      description: The signed-in person types the code an app shows, and the app is signed in as them. With `as_user`, a guardian or an admin signs the device in as a restricted account they look after instead. A restricted account approves only for itself. A sign-in through Maktaba Cloud cannot approve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                as_user:
                  type: string
                  format: uuid
                  description: 'The restricted account to sign the device in as; absent: the caller.'
              required:
              - code
      responses:
        '200':
          description: Approved; the device collects its tokens.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - approved
        '403':
          description: 'A sign-in through Maktaba Cloud, or a restricted account naming another account (`code`: `restricted`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The code is unknown or expired, or `as_user` is not a restricted account the caller looks after.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: The code is already approved.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: approvePairingCode
  /users:
    post:
      tags:
      - Auth
      summary: Create an account
      description: Admins only. With `parental` the account is restricted from the start, with its limit and, optionally, its guardians; a refused request leaves no account behind.
      x-maktaba-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                is_admin:
                  type: boolean
                parental:
                  type: object
                  properties:
                    max_tier:
                      type: integer
                      enum:
                      - -1
                      - 0
                      - 9
                      - 13
                      - 16
                      - 18
                      description: 'The highest age tier the account may open: `0` all ages, `9`, `13`, `16`, `18`; `-1` nothing that has a tier.'
                    unrated:
                      type: string
                      enum:
                      - hide
                      description: 'What happens to a video with no age tier: `hide`.'
                    allow_only:
                      type: boolean
                      description: Only what a rule allows is open, whatever its tier.
                    guardians:
                      type: array
                      items:
                        type: string
                        format: uuid
                  required:
                  - max_tier
                  description: Makes the account restricted. Not with `is_admin`.
              required:
              - username
              - password
      responses:
        '201':
          description: The account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  is_admin:
                    type: boolean
                  must_change_password:
                    type: boolean
        '403':
          description: Only an admin creates accounts.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'The username is taken; or a restricted account cannot be an admin (`code`: `restricted_admin`) or look after another account (`restricted_guardian`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: createUser
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 access token (15 min). Mobile / desktop / TV clients pass it as

        `Authorization: Bearer <token>`. The Streaming Service validates the same

        JWT offline against the JWKS at `/.well-known/jwks.json`.

        '
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth
      description: '`httpOnly`, `secure`, `sameSite=lax` cookie set by `POST /auth/login`.

        State-changing requests must also send the `X-CSRF-Token` header.

        '
  parameters:
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size (1–200, default 50).
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque pagination cursor from the previous page's `next` field.
    LibraryId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Library id.
    VideoId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Video id.
    JobId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: Job id (64-bit integer).
  headers:
    X-Request-Id:
      schema:
        type: string
        format: uuid
      description: UUIDv7 correlation id. Echoed in every response.
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Requests allowed in the current window.
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: Requests remaining in the current window.
    X-RateLimit-Reset:
      schema:
        type: integer
      description: Unix-epoch seconds when the window resets.
    Retry-After:
      schema:
        type: integer
      description: Seconds to wait before retrying.
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Restricted:
      description: 'A restricted account (one under parental controls) may not do this: `code` is `restricted` and `type` is `https://maktaba.tv/problems/restricted`. Any other account gets the operation''s own answer.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ValidationError:
      description: Request body or parameters failed validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ProblemDetails'
            - type: object
              properties:
                errors:
                  type: array
                  items:
                    $ref: '#/components/schemas/FieldError'
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unavailable:
      description: A downstream dependency (Pipeline or Streaming) is unavailable.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Unhandled server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    HomeShare:
      type: object
      required:
      - path
      - share
      - local_only
      - host_path
      properties:
        path:
          type: string
          description: The NAS's own folder (/volume1/Movies).
        share:
          type: string
          description: The SMB share it is; empty when it is not shared.
        local_only:
          type: boolean
        host_path:
          type: boolean
          description: False for a mount at another path from the NAS's own.
        rule:
          type: string
          description: The share the platform's folder layout gives it.
    HomeShares:
      type: object
      required:
      - nas
      - platform
      - server
      - addresses
      - shares
      - unnamed
      - other_path
      - writable_share
      - notices
      properties:
        nas:
          type: boolean
        platform:
          type: string
        server:
          type: string
          description: The storage server record that is the NAS.
        addresses:
          type: array
          items:
            type: string
        shares:
          type: array
          items:
            $ref: '#/components/schemas/HomeShare'
        unnamed:
          type: array
          items:
            type: string
        other_path:
          type: boolean
        writable_share:
          type: boolean
        notices:
          type: array
          items:
            type: string
    HomeSharesRequest:
      type: object
      required:
      - addresses
      - shares
      properties:
        server:
          type: string
          description: Only for a home that has not reported its record yet.
        addresses:
          type: array
          maxItems: 32
          items:
            type: string
        shares:
          type: array
          maxItems: 256
          items:
            type: object
            required:
            - path
            - share
            properties:
              path:
                type: string
              share:
                type: string
    ProblemDetails:
      type: object
      description: RFC 9457 problem document.
      required:
      - type
      - title
      - status
      - request_id
      properties:
        type:
          type: string
          format: uri
          description: Stable problem identifier (`https://maktaba.tv/problems/<slug>`). Every slug is an entry of the problem-type registry, `shared/api/problems.json`, which says in English and Arabic what it means and what to do; https://maktaba.tv/problems/ publishes a page for each.
          examples:
          - https://maktaba.tv/problems/validation
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI of the resource that produced the problem.
        request_id:
          type: string
          format: uuid
          description: UUIDv7 correlation id (matches `X-Request-Id`).
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Present on validation failures.
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: Dotted-path to the offending field, e.g. `roots[0]`.
        message:
          type: string
    Page:
      type: object
      required:
      - items
      properties:
        items:
          type: array
        next:
          type:
          - string
          - 'null'
          description: Cursor for the next page; `null` on the last page.
    AffectedCount:
      type: object
      required:
      - affected
      properties:
        affected:
          type: integer
          minimum: 0
    User:
      type: object
      required:
      - id
      - username
      - is_admin
      - created_at
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 256
    RegisterRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 256
        invite_token:
          type: string
    AuthTokenResponse:
      type: object
      required:
      - user
      - access_token
      - token_type
      - expires_in
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
          description: Short-lived (15 min) JWT.
        refresh_token:
          type: string
          description: Long-lived opaque token. Omitted for web clients (set via cookie).
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Lifetime of `access_token` in seconds.
          examples:
          - 900
    Library:
      type: object
      required:
      - id
      - name
      - roots
      - settings
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        roots:
          type: array
          items:
            type: string
          description: Absolute filesystem paths.
        settings:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        collection_mode:
          type: string
          enum:
          - tab_only
          - hide_items
          - show_both
        access:
          type:
          - string
          - 'null'
          enum:
          - rw
          - ro
          - none
          - null
          description: 'The last media-permission check: `rw`, `ro` (read-only for Maktaba: the writes that would change its files answer 409 `library_read_only`) or `none`; null when never checked (treated as `rw`). The folders'' detail is the admin''s `GET /api/libraries/{id}/access`.'
        access_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        access_partial:
          type: boolean
          description: Some files could not be read, or a write failed since the check.
        age_tier:
          type:
          - integer
          - 'null'
          enum:
          - 0
          - 9
          - 13
          - 16
          - 18
          - null
          description: 'The library''s default age tier (Epic 57), set with `PUT /api/libraries/{id}/age-tier`: a tier, or null when none is set. Only an administrator''s answer has this field; it is absent for everyone else.'
    LibraryCreate:
      type: object
      required:
      - name
      - roots
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        roots:
          type: array
          minItems: 1
          items:
            type: string
        settings:
          type: object
          additionalProperties: true
    LibraryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        roots:
          type: array
          items:
            type: string
        settings:
          type: object
          additionalProperties: true
        collection_mode:
          type: string
          enum:
          - tab_only
          - hide_items
          - show_both
    LibraryStats:
      type: object
      required:
      - total_videos
      - total_duration_sec
      - by_state
      - processed_pct
      - by_language
      properties:
        total_videos:
          type: integer
        total_duration_sec:
          type: number
        processed_pct:
          type: number
          minimum: 0
          maximum: 1
        by_state:
          type: object
          additionalProperties:
            type: integer
        by_language:
          type: object
          additionalProperties:
            type: integer
    VideoState:
      type: string
      enum:
      - discovered
      - probed
      - audio_extracted
      - transcribed
      - indexed
      - ready
      - failed
    VideoSummary:
      type: object
      required:
      - id
      - library_id
      - title
      - state
      - playable
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        library_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        detected_language:
          type:
          - string
          - 'null'
          description: ISO 639-1 code.
        content_type:
          type:
          - string
          - 'null'
        state:
          $ref: '#/components/schemas/VideoState'
        path:
          type:
          - string
          - 'null'
        playable:
          type: boolean
        duration_sec:
          type:
          - number
          - 'null'
        poster_url:
          type:
          - string
          - 'null'
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VideoDetail:
      allOf:
      - $ref: '#/components/schemas/VideoSummary'
      - type: object
        properties:
          media_info:
            $ref: '#/components/schemas/MediaInfo'
          audio_tracks:
            type: array
            items:
              $ref: '#/components/schemas/AudioTrack'
          chapters:
            type: array
            items:
              $ref: '#/components/schemas/Chapter'
          tags:
            type: array
            items:
              $ref: '#/components/schemas/Tag'
          transcript_id:
            type:
            - string
            - 'null'
            format: uuid
          playback_state:
            $ref: '#/components/schemas/PlaybackState'
          age_tier_admin:
            type:
            - integer
            - 'null'
            enum:
            - 0
            - 9
            - 13
            - 16
            - 18
            - null
            description: 'The age tier an administrator set on this video itself (Epic 57), with `PUT /api/videos/{id}/age-tier`: a tier, or null when the administrator set none. It is not what the video resolves to from its other sources. Only an administrator''s answer has this field; it is absent for everyone else.'
    VideoUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 512
        description:
          type: string
          maxLength: 8192
        tags:
          type: array
          items:
            type: string
            maxLength: 64
        content_type:
          type: string
    MediaInfo:
      type: object
      properties:
        container:
          type: string
        video_codec:
          type: string
        width:
          type: integer
        height:
          type: integer
        fps:
          type: number
        bitrate_kbps:
          type: integer
        has_subtitles:
          type: boolean
        duration_sec:
          type: number
    AudioTrack:
      type: object
      required:
      - id
      - index
      properties:
        id:
          type: integer
          format: int64
        index:
          type: integer
        codec:
          type: string
        channels:
          type: integer
        sample_rate:
          type: integer
        language:
          type: string
        title:
          type: string
        is_default:
          type: boolean
    Segment:
      type: object
      required:
      - id
      - seq
      - start_sec
      - end_sec
      - text
      properties:
        id:
          type: integer
          format: int64
        seq:
          type: integer
        start_sec:
          type: number
        end_sec:
          type: number
        text:
