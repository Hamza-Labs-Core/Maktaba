  /components/{id}/restart:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The component's id in the catalog.
    post:
      tags:
      - Components
      summary: Restart a component
      description: 'Restarts a running component: its processes and the supervisor''s own loops through this machine''s supervisor, its loops in the API cancelled and started again, and its loops in streaming or the pipeline through a restart request their runner acts on within seconds. The desired state does not change; the restart is recorded as `component.restart`.'
      x-maktaba-role: admin
      responses:
        '200':
          description: 'The component after the restart, with `restarted`: how many of its processes and loops started again here, and `requested`: the hosts (`streaming`, `pipeline`, `api`) asked to restart their loops, whose runners act on the request within seconds (not counted in `restarted`: the API cannot confirm them).'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '202':
          description: 'Nothing restarted here (`restarted` is 0): none of its processes runs now and the supervisor starts them, or its loops run in another process, which was asked (`requested`).'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          description: Admin only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Refused (`code`): `not_restartable` (stages, an extension or an asset), `not_running` (off or stopped, or waiting for what it requires), `not_switchable` (part of the server). Nothing was restarted.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: This server runs under no supervisor, or the supervisor does not answer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: restartComponent
