            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: listParentalUnlockers
  /me/parental/unlock:
    post:
      tags:
      - Parental controls
      summary: Open something with a parent PIN
      description: 'For a restricted account only: a guardian types their PIN on the child''s device. A right PIN allows the item until 04:00 home time and answers a waiting request for it. A wrong PIN, a person who is not a guardian of the account and a person with no PIN all get the same answer, and every answer takes at least 250 ms. Five wrong PINs lock that guardian''s PIN for 15 minutes, then twice as long each time, up to 24 hours; ten wrong PINs in an hour from one account, or twenty from one address, close PIN entry for an hour. With `subject_kind` `time` a right PIN gives more time for today and no rule: `subject_id` is the minutes, and a waiting request for time is answered.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guardian_id:
                  type: string
                  format: uuid
                  description: 'Whose PIN this is: one of the people `GET /me/parental/guardians` lists.'
                pin:
                  type: string
                  pattern: ^[0-9]{6}$
                subject_kind:
                  type: string
                  enum:
                  - library
                  - collection
                  - series
                  - channel
                  - youtube_source
                  - plugin
                  - video
                  - time
                subject_id:
                  type: string
                  description: 'The item''s id. For kind `time`: the minutes to give, 1 to 480, as text.'
              required:
              - guardian_id
              - pin
              - subject_kind
              - subject_id
      responses:
        '200':
          description: 'Opened: the allow rule, with when it ends; for kind `time`, the time given.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  rule:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                      effect:
                        type: string
                        enum:
                        - allow
                        - block
                      subject_kind:
                        type: string
                        enum:
                        - library
                        - collection
                        - series
                        - channel
                        - youtube_source
                        - plugin
                        - video
                      subject_id:
                        type: string
                      expires_at:
                        type: string
                        format: date-time
                      created_by:
                        type: string
                        format: uuid
                      created_at:
                        type: string
                        format: date-time
                    description: The allow rule added; absent for kind `time`.
                  grant:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      user_id:
                        type: string
                        format: uuid
                      day:
                        type: string
                        format: date
                        description: The home day the minutes are for. A home day ends at 04:00 home time.
                      minutes:
                        type: integer
                      used_seconds:
                        type: integer
                        description: How much of the grant has been watched.
                      granted_by:
                        type: string
                        format: uuid
                      created_at:
                        type: string
                        format: date-time
                    description: The time given, for kind `time`; absent for any other kind.
        '403':
          description: '`code` is `pin_wrong` (nothing was opened), or `not_restricted` when the caller is not a restricted account.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such item that the account can reach; the PIN was not looked at.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 'PIN entry is locked: `code` is `pin_locked`, and `retry_after` and the `Retry-After` header give the seconds left. The right PIN is refused too while a lock is on.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/InternalError'
      operationId: unlockWithParentPin
  /me/parental-pin:
    get:
      tags:
      - Parental controls
      summary: Whether the caller has a parent PIN
      description: For admins and for guardians of a restricted account. The PIN itself is never returned.
      responses:
        '200':
          description: Whether a PIN is set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  set:
