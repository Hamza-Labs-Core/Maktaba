
"""
Maktaba GraphQL schema (Story 7.17). Mirrors the REST routes 1:1 — the
parity test compares the chi router table against this SDL and fails on
diff.
"""

scalar Time
scalar JSON

# ---------- domain types ----------

type Library {
  id: ID!
  name: String!
  roots: [String!]!
  settings: JSON
  createdAt: Time!
  updatedAt: Time!
}

type MediaInfo {
  container: String
  durationSec: Float
  width: Int
  height: Int
  fps: Float
  bitrateKbps: Int
}

type AudioTrack {
  id: Int!
  language: String
  codec: String!
  channels: Int
  default: Boolean!
}

type Subtitle {
  id: ID!
  language: String!
  format: String!
  source: String!
  isDefault: Boolean!
  url: String!
}

type Chapter {
  seq: Int!
  startSec: Float!
  endSec: Float
  title: String!
  source: String!
}

type Word {
  seq: Int!
  startSec: Float!
  endSec: Float!
  text: String!
  confidence: Float
}

type Segment {
  id: ID!
  seq: Int!
  startSec: Float!
  endSec: Float!
  text: String!
  speaker: String
  words: [Word!]
}

type Transcript {
  id: ID!
  language: String
  segments(from: Float, to: Float, first: Int): [Segment!]!
  createdAt: Time!
}

type Tag { id: ID!  name: String! }

type Speaker {
  id: ID!
  name: String!
  clusterLabel: String
}

type Collection {
  id: ID!
  libraryId: ID!
  name: String!
  description: String
  isSmart: Boolean!
  smartQuery: JSON
  items: [Video!]!
}

type PlaybackState {
  positionSec: Float!
  completed: Boolean!
  updatedAt: Time!
}

type Job {
  id: ID!
  videoId: ID
  stage: String!
  state: String!
  priority: Int!
  attempts: Int!
  pauseRequested: Boolean!
  cancelRequested: Boolean!
  createdAt: Time!
  notBefore: Time
}

type Worker {
  id: String!
  host: String!
  lastHeartbeat: Time
  currentJobId: ID
}

type StreamingSession {
  id: ID!
  videoId: ID!
  mode: String!
  manifestUrl: String
  directUrl: String
  expiresAt: Time!
  openedAt: Time!
  closedAt: Time
}

type User {
  id: ID!
  username: String!
  isAdmin: Boolean!
}

type Video {
  id: ID!
  libraryId: ID!
  path: String!
  filename: String!
  title: String
  description: String
  state: String!
  detectedLanguage: String
  durationSec: Float
  sizeBytes: Int!
  contentHash: String!
  metadata: JSON
  createdAt: Time!
  updatedAt: Time!
  mediaInfo: MediaInfo
  audioTracks: [AudioTrack!]!
  subtitles: [Subtitle!]!
  chapters: [Chapter!]!
  tags: [Tag!]!
  latestTranscript: Transcript
  playbackState: PlaybackState
}

type SearchMatch {
  segmentId: ID!
  videoId: ID!
  startSec: Float!
  endSec: Float!
  snippet: String!
  score: Float!
}

type SearchHit {
  videoId: ID!
  bestMatch: SearchMatch!
  matches: [SearchMatch!]!
}

type SearchResult {
  hits: [SearchHit!]!
  total: Int!
  tookMs: JSON!
}

type Recommendation {
  videoId: ID!
  score: Float
  positionSec: Float
  durationSec: Float
}

type Rail {
  id: String!
  title: String!
  reasonKind: String!
  items: [Recommendation!]!
}

"""
A single Continue Watching / library card as consumed by the 10-foot
TV clients (Story 14.5 / 14.6). durationSec + positionSec drive the
progress bar; reason is the localizable rail reason key.
"""
type RailCard {
  id: ID!
  title: String!
  durationSec: Float!
  positionSec: Float
  remainingSec: Float
  posterUrl: String
  snippet: String
  reason: String
}

type Device {
  id: ID!
  platform: String!
  bundleId: String!
  appVersion: String
  locale: String
  registeredAt: Time!
  lastSeenAt: Time!
}

# ---------- input types ----------

input LibraryCreateInput {
  name: String!
  roots: [String!]!
  settings: JSON
}

input LibraryPatchInput {
  name: String
  roots: [String!]
  settings: JSON
}

input SearchFiltersInput {
  language: [String!]
  libraryId: [ID!]
  speaker: [String!]
}

input SearchInput {
  q: String!
  mode: String
  limit: Int
  filters: SearchFiltersInput
}

input VideoPatchInput {
  title: String
  description: String
  tags: [String!]
}

input DeviceRegisterInput {
  platform: String!
  pushToken: String!
  bundleId: String!
  appVersion: String
  locale: String
}

# ---------- query / mutation / subscription ----------

type Query {
  libraries: [Library!]!
  library(id: ID!): Library

  videos(library: ID, language: String, q: String, limit: Int): [Video!]!
  video(id: ID!): Video

  search(input: SearchInput!): SearchResult!
  searchSuggest(q: String!): [String!]!

  job(id: ID!): Job
  jobs(stage: String, state: String, limit: Int): [Job!]!
  queueStats: JSON!

  collections: [Collection!]!
  collection(id: ID!): Collection
  tags: [Tag!]!
  speakers(videoId: ID): [Speaker!]!

  settings: JSON!

  recommendations(surface: String, limit: Int): [RailCard!]!
  continueWatching(limit: Int): [RailCard!]!

  streamCapabilities: JSON!
  streamSession(id: ID!): StreamingSession

  devices: [Device!]!
}

type Mutation {
  createLibrary(input: LibraryCreateInput!): Library!
  patchLibrary(id: ID!, input: LibraryPatchInput!): Library!
  deleteLibrary(id: ID!, purge: Boolean): Boolean!
  scanLibrary(id: ID!): String!

  patchVideo(id: ID!, input: VideoPatchInput!): Video!
  deleteVideo(id: ID!, purge: Boolean): Boolean!
  processVideo(id: ID!, stage: String, priority: Int): String!
  reprocessVideo(id: ID!, fromStage: String!): [String!]!

  saveSearch(name: String!, query: JSON!): ID!

  openStreamSession(videoId: ID!, profile: String): StreamingSession!
  closeStreamSession(id: ID!): Boolean!
  postProgress(sessionId: ID!, positionSec: Float!, completed: Boolean): Boolean!

  pauseJob(id: ID!, force: Boolean): Job!
  resumeJob(id: ID!): Job!
  cancelJob(id: ID!): Job!
  retryJob(id: ID!): Job!

  patchSettings(input: JSON!): JSON!

  registerDevice(input: DeviceRegisterInput!): ID!
  unregisterDevice(id: ID!): Boolean!

  mergeSpeakers(keep: ID!, drop: ID!): Int!
}

type Subscription {
  jobUpdates: Job!
  libraryEvents(libraryId: ID!): JSON!
  playbackUpdates(videoId: ID!): JSON!
}
