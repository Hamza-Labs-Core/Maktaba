# Mirrors api/.golangci.yml — Story 21.4 keeps the same forbidigo set
# everywhere so the shared/health/go module is held to the same bar as
# the services that import it. Migrated from the v1 schema for Go 1.25.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(ln|f)?$
          msg: use the shared/log/go logger instead of fmt.Print*; pipe operator output through fmt.Fprint* against an explicit writer.
        - pattern: ^print$
          msg: use the shared/log/go logger instead of the print builtin.
        - pattern: ^println$
          msg: use the shared/log/go logger instead of the println builtin.
      exclude-godoc-examples: true
      analyze-types: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
