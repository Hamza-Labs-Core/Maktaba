[package]
name = "maktaba-desktop"
version = "0.1.0"
description = "Maktaba desktop shell"
authors = ["Hamza Labs"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "maktaba_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maktaba-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# Story 13.x — `maktaba://` deep links (custom scheme registration +
# runtime on_open_url handler). On Linux/Windows the scheme is owned by
# the running instance, so single-instance focusing is wired in lib.rs.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Story 13.5 — passive mDNS browse for `_maktaba._tcp.local.`
mdns-sd = "0.11"

# Epic 36 story 36.5 — the server login item. SMAppService (macOS 13+)
# registers the LaunchAgent plist shipped inside the bundle; the objc2
# bindings are the same family tauri itself uses, so no Swift bridge.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
