[package]
name = "maktaba-desktop"
version = "0.1.0"
description = "Maktaba desktop shell"
authors = ["Hamza Labs"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "maktaba_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maktaba-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
# Epic 35 (ask first): the OS notification when the home's order is ready to
# install (the Mac's menu-bar item has no badge to show it).
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
# Story 13.x — `maktaba://` deep links (custom scheme registration +
# runtime on_open_url handler). On Linux/Windows the scheme is owned by
# the running instance, so single-instance focusing is wired in lib.rs.
# Its Linux-only rust-ini dependency is pinned below.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Story 13.5 — passive mDNS browse for `_maktaba._tcp.local.`
mdns-sd = "0.11"

# Epic 36 story 36.5 — the server login item. SMAppService (macOS 13+)
# registers the LaunchAgent plist shipped inside the bundle; the objc2
# bindings are the same family tauri itself uses, so no Swift bridge.
# NSLocale: the user's preferred languages, which the tray's words follow
# (Epic 38 story 38.4).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSArray", "NSLocale"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Epic 38 story 38.3 — the server at sign-in on Windows: the agent's mutex,
# the launcher's stop event, a kill-on-close job, ShellExecute, the user's
# SID (the task's name) and the sign-in's logon time (a pause holds for that
# sign-in). The display language, which the tray's words follow (story
# 38.4). The version tauri's own plugins already use (one copy in
# Cargo.lock).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# tauri-plugin-deep-link 2.6.2 builds `ini::ParseOption` on Linux without
# the fields rust-ini 0.21.3 added, which fails with E0063. The exact pin
# (inside deep-link's ^0.21) keeps a `cargo update` from moving Cargo.lock
# past 0.21.1; no PR CI builds the Linux desktop. Drop it once deep-link
# builds against current rust-ini.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
