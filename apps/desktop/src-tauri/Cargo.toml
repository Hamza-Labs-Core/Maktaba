[package]
name = "maktaba-desktop"
version = "0.1.0"
description = "Maktaba desktop shell"
authors = ["Hamza Labs"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "maktaba_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "maktaba-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Story 13.5 — passive mDNS browse for `_maktaba._tcp.local.`
mdns-sd = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]
