# The desktop player's own libraries (Epic 42.4); the shared ones (Kotlin, OkHttp,
# serialization, coroutines, ZXing) come from apps/android/gradle/libs.versions.toml.
[versions]
compose = "1.12.2"
# JavaFX 21 is the last that runs on Java 17 (the runtime the installers carry), and has
# every platform: win, linux, linux-aarch64 (mac-aarch64 for building on a Mac)
javafx = "21.0.13"
jmdns = "3.6.4"
jna = "5.19.1"

[libraries]
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version = "1.9.0" }
compose-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }

[plugins]
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
