# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX is required by Compose and all current AndroidX libs.
android.useAndroidX=true

# Kotlin code style for the official formatter.
kotlin.code.style=official

# Only build the resources for the densities/ABIs we ship; keeps the
# non-transitive R class smaller and builds faster.
android.nonTransitiveRClass=true
