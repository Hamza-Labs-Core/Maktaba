# The native Apple apps (Epic 42). Generate Maktaba.xcodeproj from this file:
#   cd apps/apple && xcodegen
# Signing is Xcode's: automatic, team G58UVTKQPB (Mahmoud Darwish). Xcode makes the App IDs,
# certificates and profiles; command-line builds pass -allowProvisioningUpdates.
name: Maktaba
options:
  bundleIdPrefix: com.hamzalabs.maktaba
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  MaktabaKit:
    path: MaktabaKit
settings:
  base:
    DEVELOPMENT_TEAM: G58UVTKQPB
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targetTemplates:
  # every app: plain http to a home on the local network is allowed (a self-hosted home is
  # often http://192.168.x.x:8088)
  App:
    type: application
    dependencies:
      - package: MaktabaKit
    settings:
      base:
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Maktaba connects to your home server on this network."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    info:
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        # browsed by HomeBrowser and by the permissions walkthrough's Local Network check
        NSBonjourServices: ["_maktaba._tcp"]
        # the build settings' versions (CI sets them per upload: the tag's version and a new
        # build number every time, which TestFlight requires)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  # a home's connect link and QR code (Epic 42 story 42.2): maktaba://connect?id=&n=&u=
  # (the Player and the Remote; not the TV app, whose Info.plist lives in apps/tv)
  OpensConnectLinks:
    info:
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.hamzalabs.maktaba.connect
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [maktaba]
  IOSApp:
    templates: [App, OpensConnectLinks]
    platform: iOS
    settings:
      base:
        # scanning a home's QR code, or a device's sign-in QR code to approve it
        INFOPLIST_KEY_NSCameraUsageDescription: "Maktaba scans your home's QR code to connect to it, and a device's sign-in QR code to approve it."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # only the system's HTTPS: no export-compliance question on every TestFlight build
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  # ---- Maktaba Player: iPhone (iPhone Duo too), iPad, Mac -------------------------------
  Maktaba Player:
    templates: [IOSApp]
    sources:
      - path: Player
      - path: Shared/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.player
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Maktaba
        INFOPLIST_KEY_UIBackgroundModes: audio
    info:
      path: Player/Info-iPhone.plist
  Maktaba Player iPad:
    templates: [IOSApp]
    sources:
      - path: Player
        excludes: ["*.plist"]
      - path: Shared/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.player.tablet
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_CFBundleDisplayName: Maktaba
        INFOPLIST_KEY_UIBackgroundModes: audio
    info:
      path: Player/Info-iPad.plist
  Maktaba Player Mac:
    templates: [App, OpensConnectLinks]
    platform: macOS
    sources:
      - path: Player
        excludes: ["*.plist"]
      - path: Shared/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.player.mac
        INFOPLIST_KEY_CFBundleDisplayName: Maktaba Player
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Player/Player-Mac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # StreamProxy listens on the loopback (127.0.0.1 only) for the system player
        com.apple.security.network.server: true
        # the tokens live in the data-protection keychain (no login-keychain prompts)
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hamzalabs.maktaba.player.mac
    info:
      path: Player/Info-Mac.plist

  # the Mac player shows inside the app (SwiftUI's VideoPlayer aborts there on macOS 27):
  #   xcodebuild test -scheme "Maktaba Player Mac" -destination platform=macOS
  Maktaba Player Mac Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PlayerMacTests
    dependencies:
      - target: Maktaba Player Mac
      - package: MaktabaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.player.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Maktaba Player Mac.app/Contents/MacOS/Maktaba Player Mac"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ARCHS: arm64

  # ---- Maktaba Remote: iPhone (iPhone Duo too), iPad -------------------------------------
  Maktaba Remote:
    templates: [IOSApp]
    sources:
      - path: Remote
      - path: Shared/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.remote
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Maktaba Remote
    info:
      path: Remote/Info-iPhone.plist
  Maktaba Remote iPad:
    templates: [IOSApp]
    sources:
      - path: Remote
        excludes: ["*.plist"]
      - path: Shared/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.remote.tablet
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_CFBundleDisplayName: Maktaba Remote
    info:
      path: Remote/Info-iPad.plist

  # ---- the permissions walkthrough's UI tests on iPhone (UITests/) ----------------------
  Maktaba Player UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: Maktaba Player }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.player.uitests
        TEST_TARGET_NAME: Maktaba Player
  Maktaba Remote UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: Maktaba Remote }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.remote.uitests
        TEST_TARGET_NAME: Maktaba Remote
  # the same tests on the iPad apps: the wide layouts (story 42.8) and signing in there
  Maktaba Player iPad UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: Maktaba Player iPad }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.player.tablet.uitests
        TEST_TARGET_NAME: Maktaba Player iPad
        TARGETED_DEVICE_FAMILY: "2"
  Maktaba Remote iPad UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: Maktaba Remote iPad }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.remote.tablet.uitests
        TEST_TARGET_NAME: Maktaba Remote iPad
        TARGETED_DEVICE_FAMILY: "2"

  # ---- Maktaba TV: Apple TV (Epic 14). Its sources stay with the other TV app in apps/tv. -
  Maktaba TV:
    templates: [App]
    platform: tvOS
    sources:
      - path: ../tv/tvos/MaktabaTV
        excludes: ["Info.plist", "Resources/Fonts/*.txt"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.tv
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_CFBundleDisplayName: Maktaba
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # its own catalog: the layered tvOS icon and Top Shelf images (AppIcon.brandassets)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    info:
      path: ../tv/tvos/MaktabaTV/Info.plist
      properties:
        UIAppFonts: [Amiri-Bold.ttf, IBMPlexSansArabic-Regular.ttf, IBMPlexSansArabic-Medium.ttf, IBMPlexSansArabic-SemiBold.ttf]
  Maktaba TV UITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: ../tv/tvos/MaktabaTVUITests
      # the mock home the iPhone's connect tests use (no real home, no real account)
      - path: UITests/MockHome.swift
    dependencies:
      - target: Maktaba TV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamzalabs.maktaba.tv.uitests
        TEST_TARGET_NAME: Maktaba TV

schemes:
  Maktaba Player:
    build:
      targets: { Maktaba Player: all }
    run: { config: Debug }
    test:
      targets: [Maktaba Player UITests]
    archive: { config: Release }
  Maktaba Player iPad:
    build:
      targets: { Maktaba Player iPad: all }
    run: { config: Debug }
    test:
      targets: [Maktaba Player iPad UITests]
    archive: { config: Release }
  Maktaba Player Mac:
    build:
      targets: { Maktaba Player Mac: all }
    run: { config: Debug }
    test:
      targets: [Maktaba Player Mac Tests]
    archive: { config: Release }
  Maktaba Remote:
    build:
      targets: { Maktaba Remote: all }
    run: { config: Debug }
    test:
      targets: [Maktaba Remote UITests]
    archive: { config: Release }
  Maktaba Remote iPad:
    build:
      targets: { Maktaba Remote iPad: all }
    run: { config: Debug }
    test:
      targets: [Maktaba Remote iPad UITests]
    archive: { config: Release }
  Maktaba TV:
    build:
      targets: { Maktaba TV: all }
    run: { config: Debug }
    test:
      targets: [Maktaba TV UITests]
    archive: { config: Release }
