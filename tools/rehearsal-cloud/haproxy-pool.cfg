# HAProxy standing in for Hetzner's LB11 in front of the api pool (Epic 50 story 50.17,
# compose-pool.yml): what the owner sets on LB11 (deploy/cloud-ha/README.md, "The api pool").
# HTTP to each node's api listener on the private network; health check GET /readyz every 5 s,
# a node out after 2 failures and back after 2 passes; least connections. No retries and no
# redispatch: a request sent to a closed port fails here as it would on LB11, so the rehearsal
# counts it.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    retries 0

frontend api
    bind :80
    default_backend apis

backend apis
    balance leastconn
    option httpchk GET /readyz
    default-server inter 5s fall 2 rise 2
    server api-1 10.52.0.21:8090 check
    server api-2 10.52.0.22:8090 check
    server api-3 10.52.0.23:8090 check

listen stats
    bind :8404
    stats enable
    stats uri /stats
