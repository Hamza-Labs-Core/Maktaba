# Who owns a row of each table a first-party plugin writes (Epic 54, README §15.12).
#
# tools/plugins/statements_build.py reads this file to work out, from each write
# statement's parse tree, which scope checks the plugin API must run before the write: a
# column listed under [tables.<table>] names the kind of id it holds, and every write must
# bind the rows it touches to such a column with a $N the API checks against the job's
# token (`<kind> $N` in the statement's `scope:` header). The API resolves each kind with
# its own lookup (api/internal/plugins/statements/resolve.go): `subject` is a video,
# `library` a library, and every other kind a row whose library (and video) the lookup
# answers.
#
# A table no library owns goes under [home.<table>] with the reason it needs no check.
# `catalog_only = true` means its rows belong to the home as a whole: only a plugin whose
# stages all take the catalog as their subject (a token that spans every library) may
# write it, and the check fails when any other plugin does.
#
# A table a plugin writes that is in neither list fails `statements_build.py check`.
# Changes here are reviewed with the plugin that needs them.

[tables.videos]
id = "subject"
library_id = "library"

[tables.audio_tracks]
id = "audio_track"
video_id = "subject"

[tables.audio_cache]
content_hash = "audio_cache"
video_id = "subject"
