# YouTube rows describe public videos, channels and playlists that several libraries may
# follow: the API counts one in a job's scope when the job's library follows its channel or
# downloads it, or when no library has claimed it (resolve.go).
[tables.youtube_channels]
channel_id = "youtube_channel"
library_id = "library"

[tables.youtube_channel_libraries]
channel_id = "youtube_channel"
library_id = "library"

[tables.youtube_downloads]
library_id = "library"
source_id = "youtube_source"
video_id = "subject"

[tables.youtube_playlists]
playlist_id = "youtube_playlist"
channel_id = "youtube_channel"

[tables.youtube_playlist_items]
playlist_id = "youtube_playlist"

[tables.youtube_sources]
id = "youtube_source"
library_id = "library"

# a library's decision record: clash_library_id names the other library it clashed with, as
# information, not an owner
[tables.youtube_source_decisions]
library_id = "library"

[tables.youtube_videos]
youtube_id = "youtube_video"
channel_id = "youtube_channel"

# --- id-named columns that hold no kind the API resolves -----------------------------------

[not_ids]
"media_metadata_enrichment.external_id" = "the provider's own id of a public item (a YouTube video id), not a Maktaba row's: a row is tied to its library through video_id"
"youtube_downloads.youtube_id" = "a public YouTube video id: several libraries may download the same video, so the id names no one library's row; a download is tied to its library through library_id"
"youtube_playlist_items.youtube_id" = "a public YouTube video id in a public playlist's listing: the listing is shared by every library that follows the playlist's channel, and its rows are tied to a scope through playlist_id"

