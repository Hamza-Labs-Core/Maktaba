# YouTube rows describe public videos, channels and playlists that several libraries may
# follow: the API counts one in a job's scope when the job's library follows its channel or
# downloads it, or when no library has claimed it (resolve.go).
[tables.youtube_channels]
channel_id = "youtube_channel"
library_id = "library"

[tables.youtube_downloads]
library_id = "library"
source_id = "youtube_source"
