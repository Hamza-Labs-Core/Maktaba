# golangci-lint v2 config for the Maktaba cloud control-plane.
# Story 22.1 sets a sensible default; Story 21.1 added the forbidigo
# rule that bans bare `fmt.Print(ln)?` and the Go `print(ln)?` builtins
# in production code so server output goes through the structured logger.
# Mirrors api/streaming so the cloud module is held to the same bar
# (Story 22.1 baseline). Previously absent, which left the control-plane
# (auth/billing/relay) un-linted in CI.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - forbidigo
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(ln|f)?$
          msg: use the shared/log/go logger instead of fmt.Print*; pipe operator output through fmt.Fprint* against an explicit writer.
        - pattern: ^print$
          msg: use the shared/log/go logger instead of the print builtin.
        - pattern: ^println$
          msg: use the shared/log/go logger instead of the println builtin.
      exclude-godoc-examples: true
      analyze-types: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
