# Maktaba Cloud configuration template.
#
# Secrets must come from environment variables — placeholders here are
# refused by the config validator at startup so the file can be checked
# into source control safely.

[server]
listen_addr   = "0.0.0.0:8080"
public_url    = "https://api.maktaba.tv"
# Origin of the cloud web app (mail links, OAuth landings). Defaults to public_url.
web_url       = "https://app.maktaba.tv"
# "production" on the cloud's nodes: the api's listeners must then be loopback (or
# private) and trusted_proxies set (Epic 50 story 50.31). Production uses
# listen_addr = "127.0.0.1:8090" and admin_listen_addr = "127.0.0.1:8091" (50.32).
# env = "production"
# The peers whose CF-Connecting-IP is believed (CIDRs): the local cloudflared in
# production, ["127.0.0.1/32", "::1/128"]. Empty: the client IP is the TCP peer.
# X-Forwarded-For is never read. (Replaces trust_proxy_headers, which is refused.)
trusted_proxies = []
# How Cloudflare reaches the api: "tunnel" (default), or "aop" (the fallback: Caddy
# checks Cloudflare's client certificate against aop_ca_file and Cloudflare's ranges).
origin_mode = "tunnel"
# The operator console's own listener (Epic 50 story 50.32): every /v1/admin/* route is
# served here and only here (404 on listen_addr), for exactly admin_host; any other Host is
# 404. A change (POST, PUT, PATCH, DELETE) must carry Origin: admin_origin and
# X-Maktaba-Staff: 1, else 403 bad_origin. Production: "127.0.0.1:8091", "admin.maktaba.tv"
# (admin_origin then defaults to https://admin.maktaba.tv). Unset: no console at all.
# For dev, `pnpm dev:admin` serves the console on :5175 and proxies /v1 here with
# Host: admin.localhost.
admin_listen_addr = "127.0.0.1:8091"
admin_host        = "admin.localhost"
admin_origin      = "http://localhost:5175"
# The names listen_addr answers (any other Host is 404; /healthz, /readyz and /metrics answer
# on any). Production: ["api.maktaba.tv", "app.maktaba.tv", "maktaba.tv"]. Empty: any name.
user_hosts = []
read_timeout  = "30s"
write_timeout = "60s"
shutdown_grace = "20s"
# In the api pool behind a load balancer (Epic 50 story 50.17): after SIGTERM /readyz answers
# 503 for this long while the api keeps serving, so the balancer (2 failed checks 5 s apart)
# takes the node out before its port closes. "12s" on the pool's nodes; 0 (the default) on one.
# Override via MAKTABA_CLOUD_DRAIN_DELAY.
# drain_delay = "12s"

[admin]
# The operator console's optional network allow-list (Epic 50 story 50.33 §7): when set, the
# admin listener answers only client IPs inside one of these prefixes (403 ip_not_allowed,
# audited, otherwise). Empty: off. The console's staff keys come from the environment only:
# MAKTABA_CLOUD_STAFF_TOKEN_SECRET (>= 32 bytes, not MAKTABA_CLOUD_TOKEN_SECRET) and
# MAKTABA_CLOUD_STAFF_SECRET_KEY (32 bytes, hex or base64); with admin_listen_addr set, the api
# refuses to start without them.
ip_allowlist = []

[database]
url = "postgres://maktaba_cloud@localhost:5432/maktaba_cloud?sslmode=require"
# Override via MAKTABA_CLOUD_DB_URL.
# A direct connection to the primary for what holds a session of its own: the relay's change
# listener (LISTEN) and the worker's leader lock (story 50.17). Needed once url goes through
# PgBouncer's transaction pool (50.18); empty means url. Override via MAKTABA_CLOUD_DB_DIRECT_URL.
# direct_url = "postgres://maktaba_cloud@10.0.0.2:5432/maktaba_cloud?sslmode=require"
max_open_conns    = 25
max_idle_conns    = 5
conn_max_lifetime = "30m"

[redis]
url = "redis://localhost:6379/0"

[oauth.google]
client_id     = ""
# Secret via MAKTABA_CLOUD_OAUTH_GOOGLE_SECRET.

[oauth.apple]
team_id   = ""
key_id    = ""
client_id = ""
key_path  = ""

[auth]
# Access-token HMAC secret. Env-only (never written to this file):
#   MAKTABA_CLOUD_TOKEN_SECRET  (>= 32 bytes; e.g. `openssl rand -base64 48`)
# Required by the `api` role; ignored by `relay` and `worker`.

[billing]
# The payment provider. It is not chosen yet: "none" (the default and the
# only value accepted) takes no payments. Paid plans show as coming soon,
# checkout answers 503 payments_not_set_up, /v1/billing/webhook/{provider}
# is a 404, and service admins set plans by hand
# (POST /v1/admin/accounts/{id}/plan). Env: MAKTABA_CLOUD_BILLING_PROVIDER.
provider = "none"

[apns]
team_id  = ""
key_id   = ""
key_path = ""
bundle_id = "com.maktaba.app"

[fcm]
project_id           = ""
service_account_path = ""

[mail]
# "log" writes account mails (verification, reset) to the api log instead of
# delivering them. It is the only driver today.
driver = "log"

[entitlement]
# Ed25519 key path; private key never touches client-readable mounts.
private_key_path = "/etc/maktaba/cloud/entitlement.ed25519"

[telemetry]
log_format            = "json"
log_level             = "info"
sample_2xx_after_days = 7
sample_2xx_rate       = 0.10

[relay]
# Public host used to construct per-server subdomains:
#   <server-slug>.relay.maktaba.tv
public_host = "relay.maktaba.tv"
# The tunnel directory (Epic 50 story 50.04): this process's name and the
# loopback or private address its peers forward requests to. Empty
# peer_addr: no forwarding. The blue/green units set both
# (MAKTABA_CLOUD_RELAY_ID, MAKTABA_CLOUD_RELAY_PEER_ADDR).
# id        = "a-blue"
# peer_addr = "127.0.0.1:8444"
# A request for a home seen in the last hold_recent waits up to hold_max
# for it to reconnect (then 503 home_reconnecting); "0s" turns it off.
hold_max    = "15s"
hold_recent = "2m"
# How long a stopping relay waits for its homes to move their tunnels
# (Epic 50 story 50.03); the container's stop grace must be longer.
shutdown_grace = "150s"

[relay.drain]
# On SIGTERM: refuse new tunnels, send each home DRAIN (rate a second), and
# wait. false: close every tunnel at once, as before 50.03.
enabled  = true
within   = "5s"
deadline = "120s"
rate     = 100

[relay.pool]
# Epic 50 story 50.16: a pool of relay machines (deploy/cloud-ha/relay-pool/). Off: one relay,
# as Phase 1. On (every relay and the api): each relay heartbeats its member row; each home
# gets a primary and a standby relay by weighted rendezvous hashing; the api gives apps a
# relay_hint. The member id and addresses are per machine (MAKTABA_CLOUD_RELAY_POOL_MEMBER,
# _PUBLIC_IP, _PRIVATE_IP; member defaults to relay.id, private_ip to peer_addr's host).
enabled         = false
# hosts         = "{id}.relay.maktaba.tv"   # a member's tunnel host; default "{id}.<public_host>"
capacity_mbps   = 1000                      # weights the hash (50.14's measurement)
rebalance_every = "30s"
rebalance_rate  = 20                        # homes moved a second, at most

[relay.ticket]
# Homes reconnect with a 10-minute resume ticket instead of their secret.
enabled = true

[relay.plans]
# Epic 50 story 50.19: a plan without the relay (Free) is always refused (402 relay_needs_plan).
# true: paid homes are capped (X-Maktaba-Relay-Cap-Kbps, paced at the cap + 20 %) and limited
# as their plan says; false: they are forwarded in full, and their bytes still counted.
enforce = false

[relay.stream_limit]
# A new relayed stream past the plan's limit is refused (429 stream_limit) while the plans
# are enforced; false: counted, never refused.
enabled = true

# Direct remote access (Epic 50 story 50.15): each home's own HTTPS names under one of several
# direct-name domains (never maktaba.tv), answered by the dns role on nodes A and B, certificates
# from Let's Encrypt within each domain's weekly budget, then ZeroSSL, then Google Trust
# Services. Adding a domain is configuration only: register it, delegate its NS to ns1/ns2
# (docs/cloud-dns.md), append it here. Off until the domains exist.
[direct]
enabled = false
domains = ["direct-a.example", "direct-b.example", "direct-c.example"]
ns1 = "203.0.113.11"          # node A's primary IP
ns2 = "203.0.113.12"          # node B's primary IP
dns_listen = ":53"
weekly_budget = 45
check_every = "15m"

[direct.acme.letsencrypt]
directory = "https://acme-v02.api.letsencrypt.org/directory"
account_key = "/etc/maktaba/acme-letsencrypt.key"
contact = "mailto:ops@maktaba.tv"

# ZeroSSL and Google need external account binding: the HMAC comes from the environment only
# (MAKTABA_CLOUD_DIRECT_ZEROSSL_EAB_HMAC, MAKTABA_CLOUD_DIRECT_GOOGLE_EAB_HMAC)
[direct.acme.zerossl]
directory = "https://acme.zerossl.com/v2/DV90"
account_key = "/etc/maktaba/acme-zerossl.key"
eab_kid = ""

[direct.acme.google]
directory = "https://dv.acme-v02.api.pki.goog/directory"
account_key = "/etc/maktaba/acme-google.key"
eab_kid = ""

[turnstile]
# The bot check on the web auth pages (Epic 50 story 50.30): Cloudflare Turnstile, verified by
# the api on register, login and forgot-password for requests from the web origins below.
# Native apps (no Origin) are never asked. Off by default; production turns it on. The secret
# is env-only: MAKTABA_CLOUD_TURNSTILE_SECRET (on without it, the api role refuses to start).
enabled     = false
site_key    = ""
# Defaults to server.web_url.
web_origins = ["https://app.maktaba.tv"]
