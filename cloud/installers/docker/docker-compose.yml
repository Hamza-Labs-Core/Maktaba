# The Docker install of Maktaba: one container that runs the server and everything it runs
# (the web app, the API, live TV, the pipeline, its own Postgres), and updates itself.
#
#   docker compose up -d                        # pulls the image, waits for the setup
#   docker compose run --rm maktaba setup       # the setup, in the terminal (once)
#
# After the setup the container starts Maktaba by itself; open http://<this machine>:8088.
#
# Updates are automatic, as on every other install (Admin -> Updates: the quiet window, Update
# now, pause): the server verifies each release (its Sigstore signature from the release
# workflow, the checksums) and installs it as a new runtime on the `maktaba` volume, switching to
# it under the launcher's guard and back if it cannot start. The image tag below is only where
# a new volume starts from; there is nothing to pull for updates.
#
# A newer image pulled later is switched to at the container's next start the same way, under
# the launcher's guard: kept once its server has run for a few minutes, and if it cannot start,
# the volume goes back to what ran before and that image's release is not tried again (the
# image you ran before still runs). An older image never replaces what the volume runs. If you
# manage the image yourself (Watchtower, a pinned tag you move), turn the server's own updates
# off so only one thing updates it: MAKTABA_UPDATE_DISABLE below (or Admin -> Updates -> Pause).

services:
  maktaba:
    image: ghcr.io/hamza-labs-core/maktaba-server:latest
    restart: unless-stopped
    # the user Maktaba runs as (any uid:gid; never root): 1000:1000 is the image's own. On a
    # NAS, set the user that owns the folders you mount (a DSM user such as 1026:100, TrueNAS's
    # apps user 568:568, Unraid's 99:100). The data folder below must be writable by it: if it
    # is not, the container stops at once and its log says which folder, which user and the fix.
    user: "1000:1000"
    # the launcher drains the server on a stop (the pipeline's jobs, then Postgres)
    stop_grace_period: 90s
    # environment:
    #   MAKTABA_UPDATE_DISABLE: "1"   # the image is updated by something else (see above)
    #   MAKTABA_HOST_IP: "192.168.1.20"   # the address your devices reach this machine at, when
    #                                     # it has several (a NAS's bonded links or VLANs)
    # the host's network (Linux): the machines and apps of your network find this home (mDNS)
    # and reach it at this machine's own address, as with any other install. Maktaba answers
    # mDNS itself under "<this machine>-maktaba", beside the NAS's own responder. Docker
    # Desktop (Mac, Windows) has no host network, and some households keep every container on
    # a bridge: there, use docker-compose.bridge.yml instead (apps then connect by address,
    # by the home's HTTPS name or with a code from Maktaba Cloud).
    network_mode: host
    # ports:
    #   - "8088:8088"   # the web app
    #   - "8080:8080"   # the API the cluster's machines and the apps use
    #   - "8081:8081"   # live TV
    #   - "54329:54329" # the bundled Postgres, for machines that join this home (TLS, their roles only)
    volumes:
      # everything Maktaba keeps: server.toml, the runtime it updates, the database, logs, models
      - maktaba:/var/lib/maktaba
      # your library, as the setup's library screens name it (read-write: the cluster's folder
      # lives beside the media on a share; the media itself is never written)
      - ${MAKTABA_MEDIA:-./media}:/media
      # Optional: publish the home through the NAS's own Avahi instead of Maktaba's responder.
      # The socket reaches every system service D-Bus lets this user talk to (":ro" does not
      # stop that), so it is off unless you want it:
      # - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
    # Hardware video on an Intel or AMD chip (a J4125 or N100 NAS, an AMD APU): pass the render
    # device and its group, so Maktaba's user may open it. The group's id differs from NAS to
    # NAS; find it on the host with: stat -c %g /dev/dri/renderD128
    # Settings -> This machine then shows "Video: hardware (iHD), H.264 and HEVC", or why not.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "937"   # the render device's group id, from the stat command above
    # NVIDIA GPUs (the second listen, faster transcription) need the NVIDIA container toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  maktaba:
