[package]
name = "mkp"
version = "1.0.0"
description = "The Maktaba plugin SDK's CLI: new, check, pack, sign and test a plugin (Epic 54, stories 54.12, 54.14)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "mkp"
path = "src/main.rs"

[dependencies]
maktaba-plugin-manifest = { path = "../pluginmanifest" }
maktaba-plugin-sig = { path = "../sig" }
base64 = { workspace = true }
getrandom = "0.2"
plugind-core = { path = "../core" }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tar = "0.4"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"
