[package]
name = "maktaba-plugin-sig"
version = "1.0.0"
description = "The Maktaba plugin chain of trust (Epic 54, story 54.14): canonical JSON, the root, store keys, package signatures and the signed lists; the Rust twin of shared/plugins/pluginsig"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
