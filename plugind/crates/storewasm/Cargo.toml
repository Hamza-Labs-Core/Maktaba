[package]
name = "maktaba-store-wasm"
version = "1.0.0"
description = "What the plugin store's Workers need from the home's rules, compiled to WebAssembly (Epic 54, stories 54.15, 54.16): read a .mkplugin in memory with the home's limits, validate its manifest, and re-pack it with the store's signature"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
maktaba-plugin-manifest = { path = "../pluginmanifest" }
maktaba-plugin-audit = { path = "../audit" }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ruzstd = { version = "=0.8.1", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
