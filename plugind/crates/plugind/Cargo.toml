[package]
name = "maktaba-plugind"
version = "1.0.0"
description = "The Maktaba plugin host (Epic 54, stories 54.02 and 54.03)"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "maktaba-plugind"
path = "src/main.rs"

[features]
# A test-only build that applies the sandbox and then, as native code, tries to get out
# (story 54.03 §5). Never shipped; it also adds --no-sandbox for the positive control.
escape-probes = []

[dependencies]
plugind-core = { path = "../core" }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Networking_WinSock", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"
