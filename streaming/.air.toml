# air config for the streaming service (Story 22.8 live-reload).
# See api/.air.toml for narrated notes — this mirrors that config.

root = "/src/streaming"
tmp_dir = "/src/streaming/tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  full_bin = "./tmp/main serve"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = ["tmp", "vendor", "bin"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true
