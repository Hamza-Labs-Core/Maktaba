<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Maktaba — Login (Epic 10)</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161922; --panel-2: #1d2130; --border: #262b3a;
    --text: #e6e8ef; --text-dim: #8b91a7; --text-muted: #5a6079;
    --accent: #3ddc97; --accent-2: #2ab87a; --warn: #f5a524; --error: #ef4444;
    --shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  [data-theme="light"] {
    --bg: #f5f6fa; --panel: #ffffff; --panel-2: #f0f2f7; --border: #e1e4ec;
    --text: #1a1d26; --text-dim: #5a6079; --text-muted: #8b91a7;
    --accent: #1aa56c; --accent-2: #138a58; --warn: #d97706; --error: #dc2626;
    --shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at top, rgba(61,220,151,0.08), transparent 50%);
  }
  .theme-switch {
    position: fixed; top: 16px; right: 16px; z-index: 1000;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  .label {
    position: fixed; top: 16px; left: 16px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted); padding: 6px 12px; border: 1px solid var(--border);
    border-radius: 4px; background: var(--panel-2);
  }
  .auth-card {
    width: 420px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 40px; box-shadow: var(--shadow);
    position: relative; z-index: 1;
  }
  .brand {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; margin-bottom: 32px;
  }
  .brand-logo {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 28px;
    box-shadow: 0 8px 24px rgba(61,220,151,0.3);
  }
  .brand h1 { font-size: 22px; font-weight: 600; }
  .brand p { font-size: 13px; color: var(--text-dim); }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 500;
    margin-bottom: 6px; color: var(--text-dim);
  }
  .input-wrap {
    position: relative; display: flex; align-items: center;
  }
  .input-wrap svg {
    position: absolute; left: 12px; color: var(--text-muted);
  }
  .field input {
    width: 100%; padding: 11px 14px 11px 40px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 14px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,220,151,0.15);
  }
  .show-password {
    position: absolute; right: 12px; background: transparent; border: 0;
    color: var(--text-muted); cursor: pointer; padding: 4px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); cursor: pointer; }
  .checkbox input { width: 14px; height: 14px; accent-color: var(--accent); }
  .link { color: var(--accent); font-size: 13px; text-decoration: none; }
  .link:hover { text-decoration: underline; }
  .btn-primary {
    width: 100%; padding: 12px; border-radius: 8px; border: 0;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-2); }
  .divider {
    margin: 24px 0; display: flex; align-items: center; gap: 12px;
    color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .social {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  }
  .btn-social {
    padding: 10px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px;
  }
  .btn-social:hover { border-color: var(--text-dim); }
  .footer-text {
    margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-dim);
  }
  .server-info {
    margin-top: 20px; padding: 10px 14px; background: var(--panel-2);
    border-radius: 8px; font-size: 11px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px; justify-content: center;
  }
  .server-info .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
<div class="label">EPIC 10 · STORY 10.01 · LOGIN</div>
<button class="theme-switch" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">Toggle theme</button>

<div class="auth-card">
  <div class="brand">
    <div class="brand-logo">م</div>
    <h1>Welcome back</h1>
    <p>Sign in to your Maktaba server</p>
  </div>

  <form>
    <div class="field">
      <label>Email</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" value="mahmoud@example.com" />
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" value="••••••••••••" />
        <button type="button" class="show-password">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="row">
      <label class="checkbox"><input type="checkbox" checked /> Remember me for 30 days</label>
      <a href="#" class="link">Forgot password?</a>
    </div>

    <button type="submit" class="btn-primary">Sign in</button>
  </form>

  <div class="divider">or continue with</div>

  <div class="social">
    <button class="btn-social">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285f4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34a853"/></svg>
      Google
    </button>
    <button class="btn-social">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.04C6.5 2.04 2 6.53 2 12.06c0 5 3.66 9.15 8.44 9.9v-7H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33v7a10 10 0 0 0 8.44-9.9c0-5.53-4.5-10.02-10-10.02z"/></svg>
      Facebook
    </button>
    <button class="btn-social">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
      LinkedIn
    </button>
  </div>

  <div class="footer-text">
    New to Maktaba? <a href="#" class="link">Create an account</a>
  </div>

  <div class="server-info">
    <span class="dot"></span>
    Connecting to: <strong style="color: var(--text-dim);">maktaba.local:8080</strong>
  </div>
</div>

</body>
</html>
