<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maktaba TV</title>
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header>
      <h1 id="title">Maktaba TV</h1>
    </header>
    <main>
      <section class="player" aria-live="polite">
        <video id="video" controls playsinline muted></video>
        <p id="status" class="status"></p>
      </section>
      <nav aria-labelledby="channels-title">
        <h2 id="channels-title">Channels</h2>
        <ul id="channels" class="channels"></ul>
      </nav>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
