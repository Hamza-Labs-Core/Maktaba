<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B111C" />
    <title>Maktaba</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Before any paint the UA canvas is dark unless the OS asks for light
         (first listed scheme wins when there is no preference). -->
    <meta name="color-scheme" content="dark light" />
    <!-- Story 11.8 AC-3: resolve theme BEFORE first paint (no FOUC). A
         blocking same-origin script (the CSP forbids inline script); it
         mirrors src/lib/theme.ts — keep the two in sync. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
