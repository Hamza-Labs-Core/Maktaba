<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="window" content="960x640">
<title>Server for Mac: the menu-bar panel</title>
<link rel="stylesheet" href="../../../../web/packages/website/design/site-tokens.css">
<link rel="stylesheet" href="../desktop.css">
<style>
  /* macOS's own menu bar, drawn only as the ground the panel opens from */
  .mbar { position: absolute; inset-inline: 0; inset-block-start: 0; block-size: 26px; display: flex; align-items: center; gap: 18px; padding-inline: 14px; background: rgba(20,24,34,.85); color: #fff; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; font-size: 13px; direction: ltr; }
  :root[dir="rtl"] .mbar { direction: rtl; }
  .mbar b { font-weight: 700; }
  .mbar .grow { flex: 1; }
  .mbar svg { inline-size: 15px; block-size: 15px; }
  .mbar .mk { position: relative; display: grid; place-items: center; inline-size: 28px; block-size: 22px; border-radius: 5px; background: rgba(255,255,255,.2); }
  .mbar .mk svg { inline-size: 16px; block-size: 16px; }
  .panel { position: absolute; inset-block-start: 32px; inset-inline-end: 148px; inline-size: 340px; border-radius: 12px; overflow: hidden; background: rgba(24,36,58,.96); border: 1px solid rgba(255,255,255,.12); box-shadow: var(--dk-shadow); }
  .panel .top { display: flex; align-items: center; gap: 12px; padding: 14px 14px 10px; }
  .panel .top img { inline-size: 34px; block-size: 34px; border-radius: 8px; }
  .panel .top .t { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .panel .top .s { color: var(--dk-muted); font-size: var(--dk-t-small); line-height: var(--dk-t-small-lh); }
  .panel .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 10px; }
  .panel .tiles > div { padding: 8px 10px; border-radius: 8px; background: rgba(11,17,28,.45); font-size: var(--dk-t-small); }
  .panel .tiles b { display: block; font-size: var(--dk-t-body); }
  .panel .tiles span { color: var(--dk-muted); }
  .panel .tiles .bar { margin-block-start: 6px; block-size: 4px; }
  .panel .menu { position: static; inline-size: auto; border: 0; border-radius: 0; box-shadow: none; background: transparent; border-block-start: 1px solid var(--dk-line); padding: 6px; }
  .panel .menu .mi { min-block-size: 30px; }
</style>
</head>
<body>
<div class="desk" style="background: #121a2a"></div>
<div class="mbar">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#fff" d="M11.2 8.5c0-1.6 1.3-2.4 1.4-2.5-.8-1.1-2-1.3-2.4-1.3-1-.1-2 .6-2.5.6s-1.3-.6-2.2-.6C4.4 4.7 3.3 5.4 2.7 6.5c-1.2 2.1-.3 5.2.9 6.9.6.8 1.2 1.7 2.1 1.7.8 0 1.2-.5 2.2-.5s1.3.5 2.2.5c.9 0 1.5-.8 2-1.7.6-.9.9-1.8.9-1.9 0 0-1.8-.7-1.8-3zM9.6 3.6c.5-.6.8-1.4.7-2.2-.7 0-1.5.5-2 1-.4.5-.8 1.3-.7 2.1.8.1 1.5-.4 2-.9z"/></svg>
  <b data-t="c.server"></b><span data-t="m1"></span><span data-t="m2"></span><span data-t="m3"></span><span data-t="m4"></span>
  <span class="grow"></span>
  <span class="mk"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" d="M5 21V11C5 7 8 5.5 10 4.5 11.2 3.9 11.8 3 12 2c.2 1 .8 1.9 2 2.5 2 1 5 2.5 5 6.5v10M8.5 18c1.3-.7 2.6-.7 3.5 0 .9-.7 2.2-.7 3.5 0"/></svg></span>
  <i data-i="wifi"></i><i data-i="battery"></i><span class="num" data-t="clock"></span>
</div>
<div class="panel">
  <div class="top"><img src="../../../../web/public/icons/icon-192.png" alt=""><div><div class="t"><span data-t="running"></span><span class="dot"></span></div><div class="s" data-th="sub"></div></div></div>
  <div class="tiles">
    <div><b class="num" data-t="a"></b><span data-t="aS"></span></div>
    <div><b class="num" data-t="b"></b><span data-t="bS"></span><div class="bar"><i style="inline-size: 64%"></i></div></div>
  </div>
  <div class="menu">
    <div class="mi hover"><i data-i="window"></i><span data-t="open"></span><span class="end">⌘O</span></div>
    <div class="mi"><i data-i="pausecircle"></i><span data-t="pause"></span></div>
    <div class="mi"><i data-i="logs"></i><span data-t="logs"></span></div>
    <div class="mi"><i data-i="flag"></i><span data-t="report"></span></div>
    <div class="sep"></div>
    <div class="mi"><i data-i="power"></i><span data-t="quit"></span><span class="end">⌘Q</span></div>
  </div>
</div>
<script src="kit.js"></script>
<script>
MK.applyKit({
  en: {
    title: "Server for Mac: menu-bar panel", m1: "File", m2: "View", m3: "Window", m4: "Help", clock: "Mon 21:40",
    running: "Maktaba is running", sub: "Haddad's Mac mini · version 0.3.112",
    a: "3 devices", aS: "1 watching now", b: "Language model", bS: "3.2 of 5 GB",
    open: "Open Maktaba", pause: "Pause server", logs: "Open logs", report: "Report a problem…", quit: "Quit (server keeps running)",
  },
  ar: {
    title: "الخادم للماك: لوحة شريط القوائم", m1: "ملف", m2: "عرض", m3: "نافذة", m4: "مساعدة", clock: "الاثنين ٢١:٤٠",
    running: "مكتبة تعمل", sub: "ماك ميني عائلة حداد · الإصدار <bdi>0.3.112</bdi>",
    a: "٣ أجهزة", aS: "مشاهدة واحدة الآن", b: "النموذج اللغوي", bS: "٣٫٢ من ٥ غيغابايت",
    open: "فتح مكتبة", pause: "إيقاف الخادم مؤقتًا", logs: "فتح السجلات", report: "الإبلاغ عن مشكلة…", quit: "خروج (يبقى الخادم عاملًا)",
  },
});
</script>
</body>
</html>
