<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="window" content="493x356">
<title>Installer: the Player's .msi, themed within what Windows Installer allows</title>
<link rel="stylesheet" href="../../../../web/packages/website/design/site-tokens.css">
<link rel="stylesheet" href="../desktop.css">
<style>
  /* Windows Installer draws its dialogs itself: a 493 × 312 dialog (here under a 44 px
     system title bar). What a package can change: the dialog bitmap (behind the text),
     the banner bitmap on inner pages, and each text style's face, size and colour. The
     buttons and the button strip stay the system's. */
  body { background: #f3f3f3; font-family: "Segoe UI", system-ui, sans-serif; }
  .sysbar { block-size: 44px; display: flex; align-items: center; gap: 8px; padding-inline: 12px; background: #f3f3f3; color: #1a1a1a; font-size: 12px; border-block-end: 1px solid #e5e5e5; }
  .sysbar img { inline-size: 16px; block-size: 16px; }
  .sysbar .grow { flex: 1; }
  .sysbar .caption-btns { align-self: stretch; color: #1a1a1a; }
  .sysbar .caption-btns span { color: #1a1a1a; }
  .bmp { position: relative; block-size: 270px; overflow: hidden;
         background: radial-gradient(160px 140px at 82px 250px, rgba(227,178,82,.18), transparent 70%), linear-gradient(90deg, #0F1725 164px, #0B111C 164px); font-family: var(--dk-text); color: var(--dk-fg); }
  .bmp .arch-art { position: absolute; inset-inline-start: 22px; inset-block-end: -4px; inline-size: 120px; }
  .bmp .mark { position: absolute; inset-inline-start: 22px; inset-block-start: 20px; display: flex; align-items: center; gap: 8px; }
  .bmp .mark img { inline-size: 26px; block-size: 26px; border-radius: 6px; }
  .bmp .mark span { font-family: var(--dk-display); font-weight: 700; font-size: 20px; }
  .bmp .txt { position: absolute; inset-inline-start: 182px; inset-inline-end: 20px; inset-block-start: 22px; }
  .bmp h1 { font-family: var(--dk-display); font-weight: 700; font-size: 22px; line-height: 30px; margin-block-end: 10px; }
  .bmp p { font-size: 12.5px; line-height: 19px; color: var(--dk-muted); margin-block-end: 8px; }
  .strip { block-size: 42px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding-inline: 12px; background: #f3f3f3; border-block-start: 1px solid #dcdcdc; }
  .strip span { inline-size: 75px; block-size: 23px; display: grid; place-items: center; border: 1px solid #cfcfcf; border-radius: 4px; background: #fdfdfd; font-size: 12px; color: #1a1a1a; }
  .strip span.def { border-color: #005fb8; box-shadow: inset 0 0 0 1px #005fb8; }
  .note { position: absolute; inset-block-end: 6px; inset-inline-start: 182px; font-size: 11px; color: var(--dk-muted); }
</style>
</head>
<body>
<div class="sysbar"><img src="../../../../web/public/icons/icon-192.png" alt=""><span data-t="sys"></span><span class="grow"></span><div data-caption="close"></div></div>
<div class="bmp">
  <div class="mark"><img src="../../../../web/public/icons/icon-192.png" alt=""><span data-t="c.server"></span></div>
  <div data-arch></div>
  <div class="txt"><h1 data-t="h1"></h1><p data-t="p1"></p><p data-t="p2"></p></div>
  <div class="note" data-th="note"></div>
</div>
<div class="strip"><span data-t="back"></span><span class="def" data-t="next"></span><span data-t="cancel"></span></div>
<script src="kit.js"></script>

  },
});
</script>
</body>
</html>
