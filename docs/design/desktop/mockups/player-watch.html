<!doctype html>

<head>

<title>Player: watching</title>

<style>
  .video { position: absolute; inset: 0; background: #000; }
  .video img { inline-size: 100%; block-size: 100%; object-fit: cover; filter: saturate(1.05); }
  .top { position: absolute; inset-inline: 0; inset-block-start: 0; display: flex; align-items: center; gap: 14px; block-size: 64px; padding-inline-start: 18px;
         background: linear-gradient(180deg, rgba(5,8,14,.85), rgba(5,8,14,0)); }
  .top .caption-btns { align-self: flex-start; block-size: 44px; }
  .top .t1 { font-weight: 600; font-size: var(--dk-t-lead); }
  .top .t2 { color: var(--dk-muted); font-size: var(--dk-t-small); }
  .top .grow { flex: 1; }
  .ctrl { position: absolute; inset-inline: 0; inset-block-end: 0; padding: 70px 28px 18px;
          background: linear-gradient(0deg, rgba(5,8,14,.92) 0%, rgba(5,8,14,.6) 55%, rgba(5,8,14,0) 100%); }
  /* media never mirrors: the timeline and the transport keep left-to-right in Arabic */
  .scrub, .transport { direction: ltr; }
  .transport { display: flex; align-items: center; gap: 6px; }
  .scrub { position: relative; block-size: 20px; display: flex; align-items: center; }
  .scrub .track { position: relative; flex: 1; block-size: 5px; border-radius: 5px; background: rgba(255,255,255,.22); }
  .scrub .buf { position: absolute; inset-block: 0; inset-inline-start: 0; inline-size: 61%; border-radius: inherit; background: rgba(255,255,255,.32); }
  .scrub .played { position: absolute; inset-block: 0; inset-inline-start: 0; inline-size: 43%; border-radius: inherit; background: var(--dk-brass); }
  .scrub .knob { position: absolute; inset-block-start: -5px; inset-inline-start: calc(43% - 7px); inline-size: 15px; block-size: 15px; border-radius: 50%; background: var(--dk-brass); box-shadow: 0 0 0 4px rgba(227,178,82,.25); }
  .scrub .tick { position: absolute; inset-block: -1px; inline-size: 3px; background: rgba(5,8,14,.85); }
  .peek { position: absolute; inset-block-end: 26px; inset-inline-start: calc(58% - 88px); inline-size: 176px; text-align: center; }
  .peek .pic { block-size: 99px; border-radius: 8px; overflow: hidden; border: 2px solid rgba(255,255,255,.85); }
  .peek .pic img { inline-size: 100%; block-size: 100%; object-fit: cover; object-position: 70% 50%; }
  .peek .pt { margin-block-start: 6px; font-weight: 600; font-size: var(--dk-t-small); text-shadow: 0 1px 3px #000; }
  .row { display: flex; align-items: center; gap: 6px; margin-block-start: 10px; }
  .row .iconbtn { inline-size: 42px; block-size: 42px; border-radius: 50%; }
  .row .iconbtn svg { inline-size: 24px; block-size: 24px; }
  .row .big { inline-size: 52px; block-size: 52px; background: var(--dk-fg); color: #05080e; }
  .row .time { margin-inline: 10px; font-weight: 600; }
  .row .time .muted { font-weight: 400; }
  .row .time span { unicode-bidi: isolate; }
  .row .grow { flex: 1; }
  .vol { display: flex; align-items: center; gap: 8px; }
  .vol .bar { inline-size: 84px; block-size: 4px; }
  .vol .bar i { background: var(--dk-fg); }
  .row .iconbtn.open { background: rgba(255,255,255,.14); color: var(--dk-brass); }
  .menu { inset-block-end: 78px; inset-inline-end: 150px; inline-size: 300px; background: rgba(24,36,58,.96); }
  .sub { position: absolute; inset-inline: 0; inset-block-end: 268px; text-align: center; }
  .sub span { display: inline-block; padding: 4px 14px; border-radius: 6px; background: rgba(5,8,14,.72); font-size: 26px; line-height: 38px; font-weight: 600; }
  :root[dir="rtl"] .sub span { font-size: 28px; line-height: 44px; }
  .menu .mi .check-i { inline-size: 20px; color: var(--dk-brass); }
</style>
</head>
<body>
<div class="win win11">

  <div class="top">

    <div class="grow"></div>
    <div data-caption></div>

  <div class="ctrl">
    <div class="scrub">

    <div class="mi on hover"><span class="check-i"><i data-i="check"></i></span><span data-t="ar"></span><span class="end" data-t="arNote"></span></div>
    <div class="mi"><span class="check-i"></span><span data-t="en"></span></div>
