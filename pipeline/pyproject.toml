[project]
name = "maktaba-pipeline"
version = "0.0.1"
description = "Maktaba transcription/indexing pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "blake3>=1.0.8",
    "cryptography>=43",
    "grpcio>=1.68",
    "huggingface-hub>=0.25",
    "psutil>=6",
    "structlog>=24.0",
    "watchdog>=4.0.0",
    "websockets>=13",
    "zeroconf>=0.136",
]

[project.scripts]
maktaba-pipeline = "maktaba_pipeline.__main__:main"

[project.optional-dependencies]
# Media-intelligence tools (scripts/mediaintel): YouTube metadata via yt-dlp.
mediaintel = [
    "yt-dlp>=2025.11.12",
]
# Speech to text (plan 03-10): Whisper on the GPU through MLX on Apple Silicon; on Windows
# and Linux x86_64 through CTranslate2 (story 38.8, stt/ct2.py), on an NVIDIA GPU when CUDA
# is usable, else on the CPU.
stt = [
    # pinned: stt/batched.py builds on its DecodingTask and timestamp filter internals
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # pinned: stt/ct2.py builds on its tokenizer, mel filters and word alignment
    "faster-whisper==1.2.1 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    # 4.6.3 runs Whisper's convolutions in its own CUDA code: no cuDNN. Its wheels load
    # cuBLAS 12 when the model goes on the GPU (built against 12.8)
    "ctranslate2>=4.6.3,<5 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    # that cuBLAS, from PyPI (stt/ct2.py loads it from site-packages/nvidia/cublas): no
    # CUDA toolkit to install; the NVIDIA driver is all the machine needs
    "nvidia-cublas-cu12>=12.8,<13 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "silero-vad>=6.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    # the second listen (stt/refine.py): Cohere Transcribe Arabic on MLX, and the
    # CAMeL Tools MSA dictionary that respells the words it hears
    "mlx-audio==0.5.9 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    # Cohere's tokenizer; mlx-audio does not declare it
    "sentencepiece>=0.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "camel-tools>=1.6,<2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    # ... and on Windows and Linux x86_64 (story 38.9, stt/cohere_cuda.py): the same model
    # through transformers (its cohere_asr model, native since 5.4) on torch's CUDA build,
    # on an NVIDIA GPU only: torch's CUDA 13 build (PyPI's on Linux; on Windows PyPI has only
    # a CPU torch, so [tool.uv.sources] takes it from PyTorch's index there)
    "torch>=2.9,<3 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "transformers>=5.4,<6 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    # transformers loads the weights straight onto the GPU (device_map) only with accelerate
    "accelerate>=1.1 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    # the cohere_asr feature extractor's mel filters come from librosa
    "librosa>=0.11 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "sentencepiece>=0.2 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    # the dictionary: on Windows camel-tools needs no kenlm (its own marker); Linux has a wheel
    "camel-tools>=1.6,<2 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]
dev = [
    "grpcio-tools>=1.68",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-psutil>=6",
    "types-pyyaml>=6.0",
]
# Semantic search (engine `index` stage + the gRPC SemanticSearch RPC):
# embedded persistent Chroma and a sentence-transformers embedder
# (default intfloat/multilingual-e5-small; torch picks up Apple MPS).
search = [
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.0,<7",
]

# torch's CUDA build on Windows x86_64 (story 38.9): PyPI has only a CPU torch for Windows, so
# it comes from PyTorch's own index there, CUDA 13.0 as PyPI's Linux torch (Turing and newer
# GPUs, an NVIDIA driver of R580 or later). Explicit: uv takes nothing else from it. The lock
# pins the wheel with its hash, and the release's constraints file names the index
# (build-release.sh: uv export --emit-index-url, uv 0.12 or later). Every pin in it is
# hash-checked, so a file from either index is installed only when it is the pinned one; the
# installers and the app install the pins with pip, which picks that file whichever index
# has it (uv takes one index's file and stops at a hash mismatch)
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maktaba_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast in-process tests (Epic 20.1)",
    "integration: tests that touch service containers (Epic 20.4)",
    "e2e: tests that drive the full compose stack (Epic 20.5)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Story 21.1: T201 (print) and T203 (pprint) ban bare prints in
# production code so output flows through the structured logger.
select = ["E", "F", "I", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# Ad-hoc scripts and notebooks are exempt from the print ban — they are
# not production code paths. None today; placeholder for when scripts/
# arrives.
# scripts/mediaintel are CLI tools: they print by design and embed SQL/CSS
# literals that read worse wrapped.
"scripts/**" = ["T20", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/maktaba_pipeline", "tests"]
# The shared test-tier plugin lives outside this package's source
# tree (Story 20.1 — common across future Python services). Point
# mypy at it so `import maktaba_testtier` resolves the same way it
# does at runtime via tests/conftest.py.
mypy_path = "../shared/testtier/py"
