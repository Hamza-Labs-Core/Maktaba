[project]
name = "maktaba-pipeline"
version = "0.0.1"
description = "Maktaba transcription/indexing pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maktaba_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast in-process tests (Epic 20.1)",
    "integration: tests that touch service containers (Epic 20.4)",
    "e2e: tests that drive the full compose stack (Epic 20.5)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/maktaba_pipeline", "tests"]
