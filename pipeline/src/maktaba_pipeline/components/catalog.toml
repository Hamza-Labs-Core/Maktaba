# ---- processing ----------------------------------------------------------------------

[[component]]
id        = "transcription"
kind      = "stages+process"
group     = "processing"
title_key = "components.transcription.title"
desc_key  = "components.transcription.desc"
# refine and word merge run inside transcribe; the second listen (Cohere, the wanted
# model) is a stage of its own since slot 0174
stages    = ["extract", "transcribe", "second_listen"]
processes = ["pipeline/stt-*"]
requires  = ["runtime.ml", "any:model.whisper-turbo|model.whisper-large-v3|model.whisper-medium"]
wants     = ["model.cohere-arabic"]
settings  = ["rules.transcription", "toml:transcription.workers"]
platforms = ["darwin-arm64", "windows-amd64", "linux-amd64", "linux-arm64"]
resources = { ram_mb = 6000, disk_mb = 0, gpu = "preferred" }
drain     = { grace_s = 120, checkpoint = true }
bundles   = ["full", "worker"]
features  = ["transcripts"]
since     = "0.3.66"

