# ---- plugins (Epic 54) ----------------------------------------------------------------
# Each installed plugin is a run-time entry plugin.<id> (kind plugin, story 54.37), never
# listed here. This is the host their code runs in, started only while one is on.

[[component]]
id        = "plugins.host"
kind      = "process"
group     = "plugins"
title_key = "components.plugins.host.title"
desc_key  = "components.plugins.host.desc"
processes = ["plugins/"]
placement = "home"
# not on Windows yet: the pipeline's dispatcher reaches the host on a unix socket, which
# asyncio cannot open there
platforms = ["darwin-arm64", "linux-amd64", "linux-arm64"]
bundles   = ["full", "core"]
on_demand = true
since     = "0.3.83"

