# The Hunspell dictionaries word review installs per language (Epic 52, stories 52.3 and
# 52.16): one Epic 51 asset each, lang.hunspell.<code>, never in a bundle (an admin
# installs it). `make catalog-sync` writes their catalog block and their en/ar words from
# this list, and copies it into the pipeline (language_packs/hunspell-languages.toml);
# `make catalog-check` fails when they differ. The list grows by PR, a release at a time;
# a dictionary whose licence does not allow redistribution is left out (the fallback
# pack covers its language).
#
# code     BCP 47 (the language Whisper names)
# folder   the LibreOffice dictionaries repository folder
# files    the .aff/.dic stem in that folder
# script   ISO 15924
# en, ar   the language's name for the Components page
# licence  the dictionary's, recorded in the pack's NOTICE

[[language]]
code = "fr"
folder = "fr_FR"
files = "fr"
script = "Latn"
en = "French"
ar = "الفرنسية"
licence = "MPL-2.0"

