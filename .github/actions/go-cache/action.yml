# Restores the Go module and build caches (GOMODCACHE, GOCACHE) that main saved; it never
# saves. setup-go's own cache has no read-only switch, and a pull request's run saved its own
# copy of every entry: the repository's Actions cache went over its 10 GB limit and main's
# entries were evicted within an hour or two (#615). So setup-go runs with `cache: false`,
# this action restores, and only a push to main writes.
#
# One entry per runner OS, architecture and Go version, keyed on every go.sum in the
# checkout: each job used to key on its own go.sum files and its runner image, and one
# push to main wrote some 20 entries of 0.2-0.8 GB each (7.9 GB of the 10), which pushed
# small pinned tools out within the hour. The runner image is not in the key: Go's build
# cache is addressed by its inputs, the C compiler's identity among them for cgo, so an
# entry from another Ubuntu image only misses where it differs.
#
# One job per entry writes it (tools/ci/tests/test_go_cache.py names them), as its last
# steps, with every module of the checkout in the module cache first, so the other jobs on
# that runner find theirs:
#
#   - name: Every module in the Go cache
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
#     run: tools/ci/go-cache-fill.sh
#   - name: Save the Go caches
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
#     uses: actions/cache/save@v4
#     with:
#       path: ${{ steps.go-cache.outputs.path }}
#       key: ${{ steps.go-cache.outputs.key }}
#
# With no entry for the exact key (a go.sum changed, or no job writes this Go version on
# this runner) the newest entry for the same runner and Go version is restored, then any for
# the same runner: the modules in it still count, and go-mod-download fetches the rest.

name: Go caches (restore only)
description: Restores main's Go module and build caches, one entry per runner OS, arch and Go version; never saves.

outputs:
  key:
    description: the cache key (for actions/cache/save)
    value: ${{ steps.key.outputs.key }}
  path:
    description: GOMODCACHE and GOCACHE, one per line (for actions/cache/save)
    value: ${{ steps.key.outputs.path }}
  cache-hit:
    description: "'true' when the exact key was restored"
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        HASH: ${{ hashFiles('**/go.sum', '!**/node_modules/**') }}
      run: |
        set -euo pipefail
        [ -n "${HASH}" ] || { echo "::error::go-cache: no go.sum file matched"; exit 1; }
        arch=$(printf '%s' "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
        version=$(go env GOVERSION)
        {
          echo "prefix=setup-go-${RUNNER_OS}-${arch}-"
          echo "version-prefix=setup-go-${RUNNER_OS}-${arch}-go-${version#go}-"
          echo "key=setup-go-${RUNNER_OS}-${arch}-go-${version#go}-${HASH}"
          echo "path<<GO_CACHE_PATHS"
          go env GOMODCACHE
          go env GOCACHE
          echo "GO_CACHE_PATHS"
        } >> "${GITHUB_OUTPUT}"

    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.version-prefix }}
          ${{ steps.key.outputs.prefix }}
