# The cloud web app's UI tests in a real browser (Epic 50 story 50.13, T11): Playwright with
# Chromium against `vite --config vite.cloud.config.ts`, every /v1 call answered by the test
# (web/cloud/e2e, web/playwright.cloud.config.ts). No cloud, no home.
name: Web UI

on:
  pull_request:
    paths:
      - 'web/cloud/**'
      - 'web/src/lib/**'
      - 'web/design-system/**'
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
      - 'web/vite.cloud.config.ts'
      - 'web/playwright.cloud.config.ts'
      - '.github/workflows/web-ui.yml'
  push:
    branches: [main]
    paths:
      - 'web/cloud/**'
      - 'web/playwright.cloud.config.ts'
      - '.github/workflows/web-ui.yml'

permissions:
  contents: read

concurrency:
  group: web-ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      # restore only: main's entries (.github/actions/node-cache); only a push to main saves
      - name: pnpm store
        uses: ./.github/actions/node-cache
        with:
          package-manager: pnpm
          lock-hash: ${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: The cloud web app with Maktaba Cloud down (T11)
        working-directory: web
        env:
          CI: 'true'
        run: pnpm e2e:cloud
      - name: The traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-ui-traces
          path: web/test-results
          retention-days: 7
