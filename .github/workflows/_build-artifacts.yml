# Reusable build-artifacts gate (Story 22.1, gate 6).
#
# Cross-compiles every binary, produces the web bundle, and uploads
# everything as named artifacts. AC3: linux/amd64, linux/arm64,
# darwin/arm64. TC2: a Go change that breaks linux/arm64 fails the
# matrix entry with the offending arch named.

name: Build artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, goos: linux,  goarch: amd64 }
          - { os: ubuntu-22.04, goos: linux,  goarch: arm64 }
          - { os: macos-14,     goos: darwin, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cloud/go.sum

      # Web bundle is platform-neutral; only build it once on linux/amd64
      # to keep the matrix focused on the Go cross-compile signal.
      - name: Set up pnpm
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Go binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make build-go

      # The cloud module is outside `make build-go`'s graph. Cross-compile
      # the maktaba-cloud (relay) binary here on every matrix arch so a
      # change that breaks the relay on linux/arm64 fails the gate with
      # the offending arch named (mirrors the AC3/TC2 contract).
      - name: Build cloud (relay) binary
        working-directory: cloud
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-buildid= -s -w" \
            -o bin/maktaba-cloud ./cmd/maktaba-cloud

      - name: Build web bundle
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: make build-web

      - name: Upload Go binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            api/bin/maktaba-api
            streaming/bin/maktaba-streaming
            cloud/bin/maktaba-cloud
          retention-days: 14

      - name: Upload web bundle
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: web-bundle
          path: web/dist
          retention-days: 14
