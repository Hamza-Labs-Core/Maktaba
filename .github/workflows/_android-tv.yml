# Reusable gate for the Android TV app (Epic 14, `apps/tv/android`): its unit tests (sign-in
# by code, the authorized API calls, resume), the sign-in code screen's screenshots checked
# against the references (Roborazzi, app/src/test/screenshots), Android lint, a debug build, and the release bundle,
# unsigned, so a change R8 breaks fails here and not on the release tag (play-bundles.yml). It builds on
# the phone apps' shared core (apps/android/core), so a change there runs this gate too.

name: Android TV app

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android-tv:
    name: Android TV app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/tv/android
    steps:
      - uses: actions/checkout@v6.0.2

      # The wrapper's jar runs the build: it must be Gradle's own for the version it names,
      # checked here so a wrong jar fails the PR and not the release (play-bundles.yml).
      - name: Gradle wrapper is Gradle's
        run: |
          set -euo pipefail
          version=$(sed -n 's#.*/gradle-\(.*\)-bin.zip#\1#p' gradle/wrapper/gradle-wrapper.properties)
          want=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${want}  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # compileSdk 37, as the core's; AGP fetches its build-tools.
        with:
          packages: platform-tools platforms;android-37.0

      # Gradle's own cache action (Enhanced Caching: free on a public repository): the Gradle
      # User Home's dependencies, plugins, wrapper and compiled scripts, restored before the build
      # so it resolves nothing it resolved before from the network. Each dependency is its own
      # entry, shared between runs. The entry's key is the wrapper, the version catalogs and the
      # build scripts (not the commit), so a run on the same inputs reuses it and writes nothing
      # new; after a version change it restores the newest entry for this job and fetches only
      # what changed. Pull requests write too: an entry already there is never written again.
      - name: Gradle caches
        uses: gradle/actions/setup-gradle@v6.4.0
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB_EXECUTION: ${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/tv/android/gradle/*.toml', 'apps/tv/android/gradle/wrapper/gradle-wrapper.properties', 'apps/tv/android/**/*.gradle.kts', 'apps/tv/android/gradle.properties', 'apps/android/client/build.gradle.kts', 'apps/android/core/build.gradle.kts') }}
        with:
          cache-read-only: false
          add-job-summary: on-failure
          # the step above checks the wrapper jar
          validate-wrappers: false

      - name: Unit tests, lint, build
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug :app:assembleDebug :app:bundleRelease

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-tv-reports
          path: |
            apps/tv/android/app/build/reports/
            apps/tv/android/app/build/test-results/
            apps/tv/android/app/build/outputs/roborazzi/
          retention-days: 7
