# The package repositories (apt, dnf) and the Homebrew tap, brought up to each stable
# release once it is published.
#
# A release is published by whichever tag workflow finishes last (release.yml or
# desktop-release.yml: tools/release/release-assets.sh), so this runs when either completes
# (workflow_run, from main's copy of this file), and acts only on a published release that is
# the newest stable one: a pre-release, a draft, an older or a maintenance release changes
# nothing. It publishes only the release's own files, each checked first: the server's
# packages and the formula against the release's Sigstore-signed checksums.txt (the identity
# machines verify: release.yml at the tag), the Linux app's packages and the Mac app's bundle
# against the apps' updater key, as the apps check them. A run again is harmless: a package
# already published is kept, the indexes are written again, the tap is left as it is.
#
# Each part is skipped, with a notice, until its configuration is there:
#   apt + dnf  vars.MAKTABA_PACKAGES_URL       the public address (docs: https://packages.maktaba.dev)
#              vars.MAKTABA_PACKAGES_BUCKET    the S3-compatible bucket it serves ("name" or "name/prefix")
#              vars.MAKTABA_PACKAGES_ENDPOINT  the S3 API (Cloudflare R2: https://<account>.r2.cloudflarestorage.com;
#                                              empty for AWS S3, with vars.MAKTABA_PACKAGES_REGION)
#              secrets.MAKTABA_PACKAGES_ACCESS_KEY_ID, secrets.MAKTABA_PACKAGES_SECRET_ACCESS_KEY
#              secrets.MAKTABA_REPO_SIGNING_KEY         the repository's armored private key (gpg --armor
#                                                       --export-secret-keys); its public half is published
#              secrets.MAKTABA_REPO_SIGNING_PASSPHRASE  when the key has one
#   Homebrew   vars.HOMEBREW_TAP_REPO (owner/homebrew-tap), secrets.HOMEBREW_TAP_TOKEN (contents:write on it)
# The Linux app's packages and the Mac app's cask also need vars.TAURI_UPDATER_PUBKEY (the
# apps' key; without it the apps cannot update either, and they are left out).

name: Packages

on:
  workflow_run:
    workflows: [Release, Desktop Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag (vX.Y.Z): published, and the newest stable release"
        required: true

permissions:
  contents: read

# One at a time, never cancelled: every run writes the same repositories and the same tap.
concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  gate:
    name: the newest stable release, published
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      publish: ${{ steps.which.outputs.publish }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/release/go.mod
          cache-dependency-path: tools/release/go.sum
      - name: Which release
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          tag="${RUN_TAG}"
          if [ "${EVENT}" = workflow_dispatch ]; then
            tag="${INPUT_TAG}"
          elif [ "${RUN_EVENT}" != push ]; then
            echo "::notice::the run was no tag push: nothing to publish"
            echo "publish=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          publish=false
          if ! [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${tag}: not a stable release tag: nothing to publish"
          elif [ "$(gh release view "${tag}" --json isDraft --jq .isDraft 2>/dev/null || echo none)" != false ]; then
            echo "::notice::${tag} is not published yet: the workflow that publishes it runs this again"
          else
            published="$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')"
            if [ "$(printf '%s\n' "${published}" | (cd tools/release && go run ./cmd/release-order latest --tag "${tag}"))" = true ]; then
              publish=true
              echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
            else
              echo "::notice::${tag} is not the newest stable release: the repositories and the tap keep theirs"
            fi
          fi
          echo "publish=${publish}" >>"${GITHUB_OUTPUT}"

  repos:
    name: apt + dnf repositories
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      REPO_URL: ${{ vars.MAKTABA_PACKAGES_URL }}
      BUCKET: ${{ vars.MAKTABA_PACKAGES_BUCKET }}
      ENDPOINT: ${{ vars.MAKTABA_PACKAGES_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MAKTABA_PACKAGES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MAKTABA_PACKAGES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.MAKTABA_PACKAGES_REGION || 'auto' }}
      # Cloudflare R2 refuses the checksums newer AWS CLIs send by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      SIGNING_KEY: ${{ secrets.MAKTABA_REPO_SIGNING_KEY }}
      SIGNING_PASSPHRASE: ${{ secrets.MAKTABA_REPO_SIGNING_PASSPHRASE }}
      UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Configured
        id: config
        run: |
          set -euo pipefail
          missing=""
          [ -n "${REPO_URL}" ] || missing="${missing} vars.MAKTABA_PACKAGES_URL"
          [ -n "${BUCKET}" ] || missing="${missing} vars.MAKTABA_PACKAGES_BUCKET"
          [ -n "${AWS_ACCESS_KEY_ID}" ] || missing="${missing} secrets.MAKTABA_PACKAGES_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY}" ] || missing="${missing} secrets.MAKTABA_PACKAGES_SECRET_ACCESS_KEY"
          [ -n "${SIGNING_KEY}" ] || missing="${missing} secrets.MAKTABA_REPO_SIGNING_KEY"
          if [ -n "${missing}" ]; then
            echo "::notice::the package repositories are not configured (missing:${missing}): ${TAG} is not published to them"
            echo "ready=false" >>"${GITHUB_OUTPUT}"
          else
            echo "ready=true" >>"${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v6.0.2
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-go@v6.4.0
        if: steps.config.outputs.ready == 'true'
        with:
          go-version-file: tools/release/go.mod
          cache-dependency-path: tools/release/go.sum
      - uses: sigstore/cosign-installer@v3.10.0
        if: steps.config.outputs.ready == 'true'
      - name: Install the repository tools
        if: steps.config.outputs.ready == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt-utils createrepo-c

      - name: Download the release's packages
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "${TAG}" --dir dl --pattern checksums.txt --pattern checksums.txt.sigstore.json \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.deb.sig' --pattern '*.rpm.sig'
          ls -l dl

      # The server's packages are the release's signed set: checksums.txt carries the identity
      # every machine verifies, and each package must be listed in it and match.
      - name: Check them
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cosign verify-blob --bundle dl/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dl/checksums.txt
          (cd dl && sha256sum --check --ignore-missing --strict checksums.txt)
          mkdir -p take app
          shopt -s nullglob
          for f in dl/maktaba-server_*.deb dl/maktaba-server-*.rpm; do
            base="${f##*/}"
            awk '{sub(/^\.\//, "", $2); print $2}' dl/checksums.txt | grep -qxF "${base}" ||
              { echo "::error::${base} is not in the release's signed checksums.txt"; exit 1; }
            cp "${f}" take/
          done
          # The Linux app's packages, as the apps check them: their updater signature, the
          # apps' key, this release's version.
          for f in dl/Maktaba_*.deb dl/Maktaba-*.rpm; do
            if [ -f "${f}.sig" ]; then cp "${f}" "${f}.sig" app/; fi
          done
          if [ -z "$(ls app)" ]; then
            echo "::notice::${TAG} has no signed Linux app packages: the repositories carry the server alone"
          elif [ -z "${UPDATER_PUBKEY}" ]; then
            echo "::notice::vars.TAURI_UPDATER_PUBKEY is not set: the Linux app's packages are left out"
          else
            (cd tools/release && go run ./cmd/updater-feed --verify --dir ../../app --pubkey "${UPDATER_PUBKEY}" --tag "${TAG}")
            for f in app/*.deb app/*.rpm; do cp "${f}" take/; done
          fi
          ls -l take
          [ -n "$(ls take)" ] || { echo "::error::${TAG} has no package to publish"; exit 1; }

      - name: Signing key
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 0700 "${GNUPGHOME}"
          printf '%s\n' "${SIGNING_KEY}" | gpg --batch --import 2>/dev/null
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')"
          [ -n "${fpr}" ] || { echo "::error::secrets.MAKTABA_REPO_SIGNING_KEY holds no secret key"; exit 1; }
          {
            echo "GNUPGHOME=${GNUPGHOME}"
            echo "GPG_KEY=${fpr}"
          } >>"${GITHUB_ENV}"
          if [ -n "${SIGNING_PASSPHRASE}" ]; then
            printf '%s' "${SIGNING_PASSPHRASE}" >"${RUNNER_TEMP}/repo-passphrase"
            echo "GPG_PASSPHRASE_FILE=${RUNNER_TEMP}/repo-passphrase" >>"${GITHUB_ENV}"
          fi
          echo "signing with ${fpr}"

      - name: Add the release to the repositories
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ep=()
          [ -z "${ENDPOINT}" ] || ep=(--endpoint-url "${ENDPOINT}")
          aws s3 sync "s3://${BUCKET}" repo "${ep[@]}" --only-show-errors
          bash tools/release/pkg-repo.sh add repo take/*
          bash tools/release/pkg-repo.sh prune repo
          bash tools/release/pkg-repo.sh index repo
          find repo -type f | sort

      # The packages first, then every index but the signed tops, then those (InRelease,
      # Release, Release.gpg, repomd.xml and its signature), then what was pruned goes: a
      # machine reading the repository meanwhile finds what its index names.
      - name: Publish
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ep=()
          [ -z "${ENDPOINT}" ] || ep=(--endpoint-url "${ENDPOINT}")
          dst="s3://${BUCKET}"
          aws s3 sync repo "${dst}" "${ep[@]}" --only-show-errors --exclude '*' --include '*.deb' --include '*.rpm' \
            --cache-control "public, max-age=31536000, immutable"
          tops=(--exclude 'apt/dists/stable/InRelease' --exclude 'apt/dists/stable/Release' --exclude 'apt/dists/stable/Release.gpg'
            --exclude 'rpm/repodata/repomd.xml' --exclude 'rpm/repodata/repomd.xml.asc')
          aws s3 sync repo "${dst}" "${ep[@]}" --only-show-errors --exclude '*.deb' --exclude '*.rpm' "${tops[@]}" \
            --cache-control "no-cache"
          aws s3 sync repo "${dst}" "${ep[@]}" --only-show-errors --exclude '*' --include 'apt/dists/stable/*' \
            --include 'rpm/repodata/repomd.xml' --include 'rpm/repodata/repomd.xml.asc' --cache-control "no-cache"
          aws s3 sync repo "${dst}" "${ep[@]}" --only-show-errors --delete --size-only
          echo "::notice::${TAG} is in the package repositories at ${REPO_URL}"

  homebrew:
    name: Homebrew tap
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ needs.gate.outputs.tag }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Configured
        id: config
        run: |
          set -euo pipefail
          if [ -z "${TAP_REPO}" ] || [ -z "${TAP_TOKEN}" ]; then
            echo "::notice::the Homebrew tap is not configured (vars.HOMEBREW_TAP_REPO, secrets.HOMEBREW_TAP_TOKEN): it keeps its formula"
            echo "ready=false" >>"${GITHUB_OUTPUT}"
          else
            echo "ready=true" >>"${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@v6.0.2
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-go@v6.4.0
        if: steps.config.outputs.ready == 'true'
        with:
          go-version-file: tools/release/go.mod
          cache-dependency-path: tools/release/go.sum
      - uses: sigstore/cosign-installer@v3.10.0
        if: steps.config.outputs.ready == 'true'

      # The formula is the release's own maktaba.rb (signed with the rest); the cask names
      # the Mac app's bundle once its updater signature checks.
      - name: The formula and the cask
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir -p dl app
          gh release download "${TAG}" --dir dl --pattern checksums.txt --pattern checksums.txt.sigstore.json \
            --pattern maktaba.rb
          cosign verify-blob --bundle dl/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dl/checksums.txt
          awk '{sub(/^\.\//, "", $2); print $2}' dl/checksums.txt | grep -qxF maktaba.rb ||
            { echo "::error::maktaba.rb is not in the release's signed checksums.txt"; exit 1; }
          (cd dl && sha256sum --check --ignore-missing --strict checksums.txt)
          bundle="Maktaba_${ver}_aarch64.app.tar.gz"
          if [ -z "${UPDATER_PUBKEY}" ]; then
            echo "::notice::vars.TAURI_UPDATER_PUBKEY is not set: the tap gets the formula alone"
          elif gh release download "${TAG}" --dir app --pattern "${bundle}" --pattern "${bundle}.sig" &&
              [ -f "app/${bundle}" ] && [ -f "app/${bundle}.sig" ]; then
            (cd tools/release && go run ./cmd/updater-feed --verify --dir ../../app --pubkey "${UPDATER_PUBKEY}" --tag "${TAG}")
            bash tools/release/homebrew-tap.sh cask "${ver}" "$(sha256sum "app/${bundle}" | awk '{print $1}')" >maktaba-app.rb
          else
            echo "::notice::${TAG} has no signed ${bundle}: the tap gets the formula alone"
          fi

      - name: Push to the tap
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git clone -q --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cask=()
          [ ! -f maktaba-app.rb ] || cask=(maktaba-app.rb)
          bash tools/release/homebrew-tap.sh push tap "${TAG}" dl/maktaba.rb "${cask[@]}"
