# Reusable PR-body validator (Story 22.1).
#
# The branch protection rule blocks merges that don't satisfy `ci-success`.
# The only sanctioned bypass is the `force-merge` label, which requires
# a `force-merge: <reason>` line in the PR body. This job enforces that
# pairing — TC3 in story-22-01.

name: PR body check

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("Not a pull_request event; nothing to check.");
              return;
            }
            const body = pr.body || "";
            const labels = (pr.labels || []).map(l => l.name);
            const forceMatch = body.match(/^\s*force-merge:\s*(.+)$/m);

            if (labels.includes("force-merge")) {
              if (!forceMatch) {
                core.setFailed(
                  "PR has the `force-merge` label but no `force-merge: <reason>` " +
                  "line in the body. Add a line explaining why the override is " +
                  "needed (audit trail), or remove the label."
                );
                return;
              }
              const reason = forceMatch[1].trim();
              if (reason.length < 10) {
                core.setFailed(
                  "force-merge reason is too short (need ≥10 chars). Explain " +
                  "what's broken and why bypassing CI is the right call."
                );
                return;
              }
              core.notice(`force-merge override accepted: ${reason}`);
              return;
            }

            // No force-merge label = no override; nothing to validate.
            core.info("No force-merge label; PR body check passes.");
