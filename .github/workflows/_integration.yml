# Reusable integration gate (Story 22.1, gate 3; Epic 20.4).
#
# Service container digests are pinned (Story 22.7-supply-chain-style)
# and bumped via Renovate. Don't bump tags by hand — open a Renovate PR.

name: Integration

on:
  workflow_call:
    # each part when its files changed (ci.yml, from .github/ci-paths.yml)
    inputs:
      integration: { type: boolean, default: true }
      compat_prev: { type: boolean, default: true }
      parental_bypass: { type: boolean, default: true }

permissions:
  contents: read

jobs:
  integration:
    if: inputs.integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      chroma:
        image: ghcr.io/chroma-core/chroma:0.5.5
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -fsS http://localhost:8000/api/v1/heartbeat || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
      CHROMA_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: all

      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          # keep the wheels: pruned (setup-uv's default) main's entry held 6 MB, and every
          # run downloaded the whole set from PyPI again
          prune-cache: false
          # restore main's uv cache; only a push to main saves it
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install pipeline deps
        working-directory: pipeline
        # every extra but torch's CUDA tree: no test runs torch (tools/ci/pipeline-deps.sh)
        run: ../tools/ci/pipeline-deps.sh

      - name: Wait for services
        # Service containers report healthy via Docker's healthcheck, but
        # Postgres' `pg_isready` returns success before the DB accepts
        # connections from non-loopback. Belt-and-braces: poll once.
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U maktaba >/dev/null 2>&1 \
               && curl -fsS http://localhost:8000/api/v1/heartbeat >/dev/null 2>&1; then
              echo "services ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Services not ready after 60s"
          exit 1

      # Slot 0184 (#642): a transaction that locks processing_done_subjects rows out of key
      # order across statements fails in the tests instead of only warning, so a new code
      # path that could deadlock with the retention is caught here
      - name: Strict lock order on the test databases
        run: psql "postgres://maktaba:maktaba@localhost:5432/maktaba" -c "ALTER ROLE maktaba SET maktaba.lock_order_strict = 'on'"

      - name: Run migrations (first run — applies pending)
        run: make migrate

      - name: Run migrations again (idempotency smoke-check, AC3/TC2)
        # A clean second `migrate up` proves the migrations are
        # idempotent — Story 22.4 AC3. Goose treats already-applied
        # versions as no-ops, so this exits 0 with no DDL emitted.
        run: make migrate

      # The Go tests gated on MAKTABA_TEST_PG_URL (cluster, secrets,
      # tvremote, tvcluster, streaming placement, ...) run here against
      # the Postgres service: each creates, migrates and drops its own
      # scratch database. The `make migrate` above already made the
      # cluster-wide maktaba_worker role, and the service user is a
      # superuser, so the roles and extensions (pg_trgm, unaccent,
      # pgcrypto) the migrations want are there.
      - name: Run integration tier
        run: make test-integration INTEGRATION_GO_PG_URL="$DATABASE_URL"

      # The pipeline's file tests (Epic 47: verify, swap, trash, convert, dedup)
      # make their media with real ffmpeg and skip without it. ffmpeg is
      # installed only after the integration tier: on PATH earlier, it would
      # also switch on the Go real-ffmpeg suites that belong to media-e2e.
      - name: Apt package cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-integration-${{ hashFiles('tools/ci/apt-install.sh', '.github/workflows/_integration.yml') }}
          restore-keys: apt-integration-

      - name: Install ffmpeg
        timeout-minutes: 15
        env:
          APT_INSTALL_TIMEOUT: "300"
          APT_CACHE_DIR: /home/runner/apt-cache
        run: |
          tools/ci/apt-install.sh ffmpeg >/dev/null
          ffmpeg -hide_banner -version | sed -n 1p

      - name: Pipeline file tests, real ffmpeg
        working-directory: pipeline
        env:
          MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
        run: uv run pytest -q -m integration tests/library_mgmt -p no:cacheprovider -rs

      # Tests with no tier marker ran in no job: `make test-unit` takes `-m unit` and the
      # tier above `-m integration`, and 45% of the pipeline's tests carry neither (the
      # job_stages seed/graph parity and help coverage among them, which had drifted).
      # They run here, on SQLite and this job's Postgres, with ffmpeg on PATH.
      - name: Pipeline tests without a tier marker
        working-directory: pipeline
        env:
          MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
        run: uv run pytest -q -m "not unit and not integration and not e2e" -p no:cacheprovider

      # Story 31.R: the extension relay end to end in two processes — the Go hub
      # and service door (api/internal/cluster/agent/relayfixture) and a Python
      # node running the Plex stages through it — on a scratch database of the
      # Postgres service (the pipeline's Postgres tests read MAKTABA_TEST_PG_URL).
      - name: Extension relay, two processes
        working-directory: pipeline
        env:
          MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
        run: uv run pytest -q -m integration tests/cluster/test_relay_two_process.py -p no:cacheprovider

      # The cloud module lives outside the Makefile's GO_MODULES set, so
      # `make test-integration` skips it. Run its integration-tagged
      # tests explicitly against the Postgres service container. The
      # relay/api stores + migrations are the integration surface; this
      # gate compiles the `integration` build tag and runs any such
      # tests (a no-op until they land) so the wiring is in place.
      - name: Run cloud integration tests
        working-directory: cloud
        env:
          MAKTABA_CLOUD_DB_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
        run: go test -tags=integration -count=1 ./...

      - name: Save the apt package cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: apt-integration-${{ hashFiles('tools/ci/apt-install.sh', '.github/workflows/_integration.yml') }}

  # Epic 35 story 35.5 AC6: the previous stable release against this build's database. Its
  # repository tests run on this build's migrations (a rollback runs it there), and the
  # nodes' schema guard is checked both ways (a machine behind its home, one ahead): an
  # old node against a new home at the schema level, not an old node process. A failure
  # fails the build unless a newer migration is marked "Breaking for the previous release"
  # (tools/compat-prev/run.sh).
  compat-prev:
    if: inputs.compat_prev
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
      PGPASSWORD: maktaba

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # the previous release's tag and its tree
          fetch-depth: 0

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache

      # this job's Go modules, retried (offline: false: see .github/actions/go-mod-download)
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api
          offline: "false"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U maktaba >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::Postgres not ready after 60s"
          exit 1

      - name: The previous release on this build's database
        run: make compat-prev

  # Epic 57 story 57.13: the parental bypass rehearsal. A home is seeded on this job's
  # Postgres behind the production router, and a caller held to 9+ (the restricted child,
  # the child through the cloud, through the relay's loopback path, and an unrestricted
  # account whose device said 9+) asks every probe of the surface registry
  # (api/internal/parental/surfaces.go) and every surface a GET cannot ask for what is
  # above its limit. An answer that names a hidden subject, or that differs from the
  # answer for an id that names nothing, fails the job. The rehearsal also proves itself:
  # an unrestricted viewer must be shown the fixtures, and with the filter taken off one
  # surface it must fail naming it. The story's other attempts (the role table, the time
  # rules on a fake clock, the device signal's ratchet, the registry walk) run beside it.
  parental-bypass:
    if: inputs.parental_bypass
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api

      - name: The rehearsal
        working-directory: api
        # the home logs every request it answers: the whole output, the home's log with
        # it, is kept below whether the rehearsal passes or not
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/parental-bypass"
          mkdir -p "$out"
          set +e
          go test -tags parental_bypass -count=1 -timeout 10m -v \
            -run 'TestParentalBypass|TestP57|TestPGTime|TestDeviceSignalRidesTheAccessToken|TestEveryRouteHasParentalSurface|TestParentalSurfaces' \
            ./internal/router/ > "$out/rehearsal.log" 2>&1
          rc=$?
          set -e
          # the tests' own lines; the home's request log stays in the file
          grep -E '^(=== RUN|--- |\s+p57_|\s+parental_|PASS|FAIL|ok|panic)' "$out/rehearsal.log" | grep -v '^=== RUN' || true
          ../tools/ci/no-pg-skips.sh "$out/rehearsal.log"
          for t in TestParentalBypass TestParentalBypassSeesWhatIsThere TestParentalBypassCatchesAMissingFilter TestP57RoleTable; do
            grep -q -- "--- PASS: $t " "$out/rehearsal.log" || { echo "::error::$t did not pass"; rc=1; }
          done
          {
            echo "### Parental bypass rehearsal"
            echo
            echo '```'
            grep -E 'registry probes, [0-9]+ requests, [0-9]+ leaks|surfaces show the fixtures' "$out/rehearsal.log" | sed -E 's/^ +[a-z0-9_]+\.go:[0-9]+: //' || true
            echo "passed: $(grep -c -- '--- PASS' "$out/rehearsal.log" || true), failed: $(grep -c -- '--- FAIL' "$out/rehearsal.log" || true)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep the home's log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: parental-bypass-log
          path: ${{ runner.temp }}/parental-bypass
          if-no-files-found: ignore

