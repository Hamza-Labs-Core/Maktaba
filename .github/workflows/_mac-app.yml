# Reusable Maktaba.app gate (Epic 36, story 36.7): on an Apple Silicon runner, build the
# server payload (Go binaries with the web UI, pinned Postgres / ffmpeg / Python checked
# against tools/release/mac-app/pins.env, the pipeline wheel + constraints), bundle it into
# Maktaba.app with tauri, and smoke-test both (tools/release/mac-app/check.sh): every binary
# starts, every Mach-O is arm64 and self-contained, Postgres initdb/start/extensions, an
# offline venv, nothing written into the payload, the bundle layout and the launcher's
# app-bundle mode. Unsigned: signing needs the Developer ID (desktop-release.yml).

name: Mac app

on:
  workflow_call:

permissions:
  contents: read

jobs:
  mac-app:
    name: Maktaba.app (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cmd/maktaba-server/go.sum
            cmd/maktaba-launcher/go.sum

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # the constraints name PyTorch's index: uv export --emit-index-url needs uv 0.12+
          # (build-release.sh checks), and one uv version writes them the same every run
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      - name: Install web + desktop deps
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C apps/desktop install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # the pinned third-party downloads (~110 MB), keyed on their checksums
      - uses: actions/cache@v4
        with:
          path: build/mac-app/downloads
          key: mac-app-downloads-${{ hashFiles('tools/release/mac-app/pins.env') }}

      - name: shellcheck
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck -x tools/release/mac-app/payload.sh tools/release/mac-app/check.sh tools/release/mac-app/build-app.sh \
            tools/release/mac-app/lib.sh tools/release/mac-app/pins-check.sh tools/release/mac-app/tauri-build.sh \
            tools/release/mac-app/tauri-build-check.sh

      # dry run of the pins (pins.env complete) and the checked download, offline
      - name: Pins (dry run)
        run: bash tools/release/mac-app/pins-check.sh

      # what tauri gets to notarize with: never an ad-hoc app, never empty settings, and the
      # release's Mac legs build through the same script
      - name: Notarization settings (dry run)
        run: bash tools/release/mac-app/tauri-build-check.sh

      # In the release's environment without the Apple secrets: desktop-release.yml's "Build
      # the Tauri bundles" exports these set but empty, which made tauri notarize the ad-hoc
      # app and fail every release's macos-arm64 leg (v0.3.0-rc.7, v0.3.1).
      - name: Build Maktaba.app with the payload, and check it
        env:
          VERSION: v0.0.0-ci.${{ github.run_number }}
          APPLE_ID: ''
          APPLE_PASSWORD: ''
          APPLE_TEAM_ID: ''
        run: make mac-app

      - name: Sizes
        if: always()
        run: |
          {
            echo "### Maktaba.app (macOS arm64, unsigned)"
            echo '```'
            du -sh build/mac-app/server/* 2>/dev/null || true
            du -sh build/mac-app/server apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Maktaba.app \
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
