# Maktaba CI — single merge gate (Story 22.1).
#
# The gates fan out from `changes`; the `ci-success` rollup is the only
# job branch protection requires. Adding a new gate means wiring it into
# `ci-success.needs:` — branch protection config never has to change.
#
# Third-party Actions are pinned to a full semver tag here; Renovate
# rewrites them to commit SHAs (Story 22.7-supply-chain). Until that
# story lands, treat the tags below as the source of truth and keep
# them in lock-step with the reusable workflows.

name: CI

on:
  # main, and a maintenance line's release/* branch: the tag guard (tools/release/tag-guard.sh)
  # waits for this workflow's run on a tag's commit, a maintenance release's included
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  # Cancel in-progress runs for the same PR; never cancel main pushes.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Path filter — short-circuits the heavy gates for docs-only PRs (EC3).
    runs-on: ubuntu-22.04
    outputs:
      # docs only: no file outside the docs changed (code), and nothing in .github/ or the
      # Makefile (meta), which count as code whatever their extension
      docs_only: ${{ steps.code.outputs.code != 'true' && steps.filter.outputs.meta != 'true' }}
      mac_app: ${{ steps.filter.outputs.mac_app }}
      win_app: ${{ steps.filter.outputs.win_app }}
      linux_app: ${{ steps.filter.outputs.linux_app }}
      android_apps: ${{ steps.filter.outputs.android_apps }}
    steps:
      - uses: actions/checkout@v6.0.2
      # A filter is true when at least one changed file matches it. Whether a file
      # matches a filter of several patterns is the step's predicate-quantifier: 'some'
      # (the default: any one pattern) or 'every' (all of them, an exclusion included).
      # (A nested key in a filter is a change type, such as `added|modified:`, so an
      # `every:` key there matches no file: docs_only was never true.)
      - uses: dorny/paths-filter@v4.0.1
        id: code
        with:
          predicate-quantifier: 'every'
          filters: |
            # a changed file outside the docs
            code:
              - '**'
              - '!specs/**'
              - '!docs/**'
              - '!**/*.md'
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            # code whatever its extension: the workflows and the Makefile, and the
            # markdown that code, tests, lint or a build read. A test that reads a
            # markdown file says so here (test_docs_links checks its own are listed).
            meta:
              - '.github/**'
              - 'Makefile'
              # the help pages the web bundles and its coverage tests check
              - 'web/src/help/**'
              # the migrations' MANIFEST.md, read by the schema guard and genrelease
              - 'shared/db/migrations/**'
              # the TV runbook and Epic 32's specs: test_docs_links checks their links,
              # and the anchors the Live TV admin page links to
              - 'docs/tv-cluster-and-remote.md'
              - 'specs/epics/32-tv-streaming-cluster-remote/**'
              # the update docs and Epic 35's specs: test_docs_links checks their links
              # (story 35.15 TC5)
              - 'docs/updates.md'
              - 'docs/auto-update.md'
              - 'docs/cluster/**'
              - 'deploy/packaging/README.md'
              - 'deploy/packaging/upgrade.md'
              - 'deploy/packaging/node/README.md'
              - 'specs/epics/35-cluster-full-nodes-and-updates/**'
              # the web's markdown (test-cases/, help/): lint-web's prettier --check
              - 'web/**/*.md'
              # the pipeline's README: the wheel's metadata (pyproject readme)
              - 'pipeline/README.md'
            # The Maktaba.app gate (macOS arm64, ~20 min) runs only when what goes into
            # the app or how it is built changes.
            mac_app:
              - 'tools/release/mac-app/**'
              - 'apps/desktop/**'
              - 'cmd/maktaba-launcher/**'
              - 'deploy/packaging/node/build-release.sh'
              - 'pipeline/pyproject.toml'
              - 'pipeline/uv.lock'
              - '.github/workflows/_mac-app.yml'
              - '.github/workflows/desktop-release.yml'
              - 'Makefile'
            # The Windows app gate (windows-latest, ~25 min): what goes into the app or its
            # installer, or how they are built.
            win_app:
              - 'tools/release/win-app/**'
              - 'apps/desktop/**'
              - 'cmd/maktaba-launcher/**'
              - 'deploy/packaging/node/build-release.sh'
              - 'pipeline/pyproject.toml'
              - 'pipeline/uv.lock'
              - 'pipeline/src/maktaba_pipeline/venv_bootstrap.py'
              - '.github/workflows/_win-app.yml'
              - '.github/workflows/desktop-release.yml'
              - 'Makefile'
            # The Linux app gate (x86_64 + aarch64, ~25 min each): what goes into the
            # payload or the app, or how they are built.
            linux_app:
              - 'tools/release/linux-app/**'
              - 'apps/desktop/**'
              - 'cmd/maktaba-launcher/**'
              - 'deploy/packaging/node/build-release.sh'
              - 'deploy/docker/server/**'
              - 'pipeline/pyproject.toml'
              - 'pipeline/uv.lock'
              - 'pipeline/src/maktaba_pipeline/venv_bootstrap.py'
              - '.github/workflows/_linux-app.yml'
              - 'Makefile'
            # The native Android apps (Player and Remote, ~10 min): their project and gate.
            android_apps:
              - 'apps/android/**'
              - '.github/workflows/_android-apps.yml'

  lint:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_lint.yml

  unit:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_unit.yml

  integration:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_integration.yml

  replica:
    # Epic 37: the machines' copies and switching the home against real Postgres 16,
    # with the end-to-end runs (see _replica.yml)
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_replica.yml

  e2e:
    needs: [changes, integration]
    # Fork PRs have no secrets, so e2e (which may need them) is skipped
    # with a maintainer-rerun comment. EC2 in story-22-01.
    if: >-
      needs.changes.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    uses: ./.github/workflows/_e2e.yml

  media-e2e:
    # The Go tests that need a real ffmpeg (and Postgres); they skip in
    # every other tier. Its own job and budget (see _media-e2e.yml).
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_media-e2e.yml

  perf-ci:
    needs: [changes, integration]
    if: >-
      needs.changes.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    uses: ./.github/workflows/_perf-ci.yml

  build-artifacts:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_build-artifacts.yml

  node-packaging:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_node-packaging.yml

  launcher:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/_launcher.yml

  mac-app:
    needs: [changes]
    if: needs.changes.outputs.mac_app == 'true'
    uses: ./.github/workflows/_mac-app.yml

  win-app:
    needs: [changes]
    if: needs.changes.outputs.win_app == 'true'
    uses: ./.github/workflows/_win-app.yml

  linux-app:
    needs: [changes]
    if: needs.changes.outputs.linux_app == 'true'
    uses: ./.github/workflows/_linux-app.yml

  android-apps:
    needs: [changes]
    if: needs.changes.outputs.android_apps == 'true'
    uses: ./.github/workflows/_android-apps.yml

  # The Linux app's pinned downloads (~150 MB a runner) in a cache on main: a pull
  # request's run restores main's caches but not another pull request's, so without
  # this one every run downloads them again (and fails while their host is down).
  # Only a push to main saves it; when it is there already this is one lookup.
  linux-app-downloads:
    if: github.event_name == 'push'
    name: Linux app downloads (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v6.0.2
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}
          lookup-only: true
      # missing: start from an earlier pins.env's cache, so only the changed pieces download
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}
          restore-keys: linux-app-downloads-${{ matrix.arch }}-
      - name: Download the pinned files
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/release/linux-app/payload.sh --fetch-only
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}

  pr-body-check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_pr-body-check.yml

  fork-rerun-comment:
    # EC2: bot comment on fork PRs telling maintainers how to rerun
    # the gated jobs once they've reviewed the diff.
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == true
      && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const marker = "<!-- maktaba:fork-rerun-needed -->";
            const body = `${marker}
            **Fork PR detected** — \`e2e\` and \`perf-ci\` were skipped because secrets are unavailable to forked workflows.

            A maintainer must rerun those gates from a same-repo branch before merging. See \`docs/ci.md\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  ci-success:
    # The single status check pinned by branch protection. All gates
    # report into this one job; a green ci-success means the merge
    # gate is satisfied.
    needs:
      - changes
      - lint
      - unit
      - integration
      - replica
      - e2e
      - media-e2e
      - perf-ci
      - build-artifacts
      - node-packaging
      - launcher
      - mac-app
      - win-app
      - linux-app
      - android-apps
      - pr-body-check
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Gate results:"
          echo "$RESULTS"
          # Fail if any required gate failed or was cancelled. Skipped
          # is acceptable (docs-only PR, fork-skipped e2e/perf-ci), but not
          # for the path filter itself: when it fails every gate is skipped.
          fail=0
          changes=$(echo "$RESULTS" | jq -r '.changes.result // "missing"')
          echo "  changes: $changes"
          if [ "$changes" != success ]; then fail=1; fi
          for gate in lint unit integration replica e2e media-e2e perf-ci build-artifacts node-packaging launcher mac-app win-app linux-app android-apps pr-body-check; do
            result=$(echo "$RESULTS" | jq -r ".\"$gate\".result // \"skipped\"")
            echo "  $gate: $result"
            case "$result" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          if [ $fail -ne 0 ]; then
            echo "::error::One or more required gates failed or were cancelled."
            exit 1
          fi
          echo "All gates passed (or skipped intentionally)."
