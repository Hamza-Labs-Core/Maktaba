# Maktaba CI — single merge gate (Story 22.1).
#
# The gates fan out from `changes`; the `ci-success` rollup is the only
# job branch protection requires. Adding a new gate means wiring it into
# `ci-success.needs:` — branch protection config never has to change.
#
# CI runs what a change touches (decided 2026-11-02): on a pull request each job runs
# only when a file it builds or tests changed (the filters in .github/ci-paths.yml); on a
# push to main or release/* every job runs, which is what the tag guard waits for. A job
# skipped by its filter counts as passed in ci-success; a failed or cancelled one fails it.
# Every job is gated by a filter or marked with a `# ci-paths:` comment (always-run,
# push-only, pr-only, not-a-gate): tools/ci/ci_paths.py checks that in the lint job, and
# `tools/ci/ci_paths.py which <files>` says which jobs a change runs.
#
# A pull request that changes only the Claude trail (docs/claude-trail.md) runs nothing but
# `changes` and `ci-success`: a trail update goes in its own pull request, with no CI and
# no tests. The always-run jobs are gated by the `repo` output: a file other than the trail
# changed. No filter matches the trail.
#
# A push to main or release/* that changes only the trail starts no run at all (the push
# trigger's paths-ignore; it skips only when every changed file is the trail), so a trail
# commit never joins the `ci-main` group and never replaces the pending run of the code
# commit before it. Trail-only commits are never tagged: the tag goes on a code commit
# (deploy/packaging/README.md, "Release flow"). update-rehearsal.yml does the same.
#
# Third-party Actions are pinned to a full semver tag here; Renovate
# rewrites them to commit SHAs (Story 22.7-supply-chain). Until that
# story lands, treat the tags below as the source of truth and keep
# them in lock-step with the reusable workflows.

name: CI

on:
  # main, and a maintenance line's release/* branch: the tag guard (tools/release/tag-guard.sh)
  # waits for this workflow's run on a tag's commit, a maintenance release's included
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
    # a trail-only commit starts no run, so it never replaces the code commit's (see above)
    paths-ignore: ['docs/claude-trail.md']

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  # A pull request: one group per PR, a new push cancels its older run.
  # A push to main: one group for all of main, NOT cancel-in-progress. The running main run
  # always finishes; GitHub keeps at most one pending run in the group, a newer commit's run
  # replacing (cancelling) the older pending one. So main always completes a run, and the
  # next one is the newest commit's. (With cancel-in-progress a merge every few minutes
  # cancelled every hour-long run before it finished, and nothing could be tagged.) The tag
  # goes on the newest main commit whose own run finished green. A re-run (run_attempt > 1)
  # of a main commit gets its commit's own group, so it never displaces main's pending run.
  # A release/** push: one group per commit, never cancelled (as before).
  # tools/ci/tests/test_ci_paths.py checks these groups.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1') && 'main' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # The path filters: one output per filter of .github/ci-paths.yml, true on a push.
    runs-on: ubuntu-22.04
    outputs:
      # a file other than the Claude trail changed: the always-run jobs run
      repo: ${{ github.event_name != 'pull_request' || steps.repo.outputs.repo == 'true' }}
      lint_go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lint_go == 'true' }}
      lint_pipeline: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lint_pipeline == 'true' }}
      lint_web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lint_web == 'true' }}
      catalog: ${{ github.event_name != 'pull_request' || steps.filter.outputs.catalog == 'true' }}
      unit_go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.unit_go == 'true' }}
      unit_pipeline: ${{ github.event_name != 'pull_request' || steps.filter.outputs.unit_pipeline == 'true' }}
      unit_web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.unit_web == 'true' }}
      unit_tokens: ${{ github.event_name != 'pull_request' || steps.filter.outputs.unit_tokens == 'true' }}
      desktop_shell: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop_shell == 'true' }}
      mdns: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mdns == 'true' }}
      integration: ${{ github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true' }}
      compat_prev: ${{ github.event_name != 'pull_request' || steps.filter.outputs.compat_prev == 'true' }}
      replica: ${{ github.event_name != 'pull_request' || steps.filter.outputs.replica == 'true' }}
      components: ${{ github.event_name != 'pull_request' || steps.filter.outputs.components == 'true' }}
      components_chaos: ${{ github.event_name != 'pull_request' || steps.filter.outputs.components_chaos == 'true' }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.e2e == 'true' }}
      media_e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.media_e2e == 'true' }}
      perf_ci: ${{ github.event_name != 'pull_request' || steps.filter.outputs.perf_ci == 'true' }}
      build_artifacts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build_artifacts == 'true' }}
      node_packaging: ${{ github.event_name != 'pull_request' || steps.filter.outputs.node_packaging == 'true' }}
      components_packs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.components_packs == 'true' }}
      release_venv: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release_venv == 'true' }}
      launcher: ${{ github.event_name != 'pull_request' || steps.filter.outputs.launcher == 'true' }}
      mac_app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mac_app == 'true' }}
      win_app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.win_app == 'true' }}
      linux_app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.linux_app == 'true' }}
      android_apps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android_apps == 'true' }}
      android_tv: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android_tv == 'true' }}
      desktop_player: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop_player == 'true' }}
      apple_apps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.apple_apps == 'true' }}
      devportal: ${{ github.event_name != 'pull_request' || steps.filter.outputs.devportal == 'true' }}
      wiki: ${{ github.event_name != 'pull_request' || steps.filter.outputs.wiki == 'true' }}
      # the Player's own files, or a Player object among the project file's changes
      apple_player_ui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.apple_player_ui == 'true' || steps.apple.outputs.player_ui == 'true' }}
    steps:
      # a pull request's merge commit and its first parent (the base): the project file
      # at both
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2
      # A filter is true when a changed file matches any one of its globs (paths-filter's
      # default predicate-quantifier 'some', so the file has no `!` globs: under 'some' a
      # `!x` matches nearly every file). On a push it does not run: every output is true.
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/ci-paths.yml
      # `repo`: a changed file other than docs/claude-trail.md. Here every glob must match
      # (predicate-quantifier every), so the one negated glob matches any other file.
      - uses: dorny/paths-filter@v4.0.1
        id: repo
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            repo:
              - '!docs/claude-trail.md'
      # Every app shares apps/apple/Maktaba.xcodeproj/project.pbxproj: the Player's UI tests
      # run when one of the objects that changed in it is the Player's (renaming the Remote
      # changes only the Remote's).
      - name: Does the project file change touch the Player?
        id: apple
        if: >-
          github.event_name == 'pull_request'
          && steps.filter.outputs.apple_apps == 'true'
          && steps.filter.outputs.apple_player_ui != 'true'
        run: python3 tools/ci/apple_player_scope.py --base HEAD^1 --head HEAD

  lint:
    # ci-paths: always-run
    # Its repository checks (no binaries, this routing's guard and tests) run on every pull
    # request but a trail-only one; each language's linters when its files changed.
    needs: [changes]
    if: needs.changes.outputs.repo == 'true'
    uses: ./.github/workflows/_lint.yml
    with:
      go: ${{ needs.changes.outputs.lint_go == 'true' }}
      pipeline: ${{ needs.changes.outputs.lint_pipeline == 'true' }}
      web: ${{ needs.changes.outputs.lint_web == 'true' }}
      catalog: ${{ needs.changes.outputs.catalog == 'true' }}

  unit:
    needs: [changes]
    if: >-
      needs.changes.outputs.unit_go == 'true'
      || needs.changes.outputs.unit_pipeline == 'true'
      || needs.changes.outputs.unit_web == 'true'
      || needs.changes.outputs.unit_tokens == 'true'
      || needs.changes.outputs.desktop_shell == 'true'
      || needs.changes.outputs.mdns == 'true'
    uses: ./.github/workflows/_unit.yml
    with:
      go: ${{ needs.changes.outputs.unit_go == 'true' }}
      pipeline: ${{ needs.changes.outputs.unit_pipeline == 'true' }}
      web: ${{ needs.changes.outputs.unit_web == 'true' }}
      tokens: ${{ needs.changes.outputs.unit_tokens == 'true' }}
      desktop_shell: ${{ needs.changes.outputs.desktop_shell == 'true' }}
      mdns: ${{ needs.changes.outputs.mdns == 'true' }}

  integration:
    needs: [changes]
    if: needs.changes.outputs.integration == 'true' || needs.changes.outputs.compat_prev == 'true'
    uses: ./.github/workflows/_integration.yml
    with:
      integration: ${{ needs.changes.outputs.integration == 'true' }}
      compat_prev: ${{ needs.changes.outputs.compat_prev == 'true' }}

  replica:
    # Epic 37: the machines' copies and switching the home against real Postgres 16,
    # with the end-to-end runs (see _replica.yml)
    needs: [changes]
    if: needs.changes.outputs.replica == 'true'
    uses: ./.github/workflows/_replica.yml

  components:
    # Epic 51: components-live (N1-N5) and, on runner changes, components-chaos (N6),
    # real sleepy workers on Postgres (see _components.yml)
    needs: [changes]
    if: needs.changes.outputs.components == 'true' || needs.changes.outputs.components_chaos == 'true'
    uses: ./.github/workflows/_components.yml
    with:
      live: ${{ needs.changes.outputs.components == 'true' }}
      chaos: ${{ needs.changes.outputs.components_chaos == 'true' }}

  e2e:
    needs: [changes, integration]
    # After integration (not when it failed); also when integration was not needed. Fork
    # PRs have no secrets, so e2e (which may need them) is skipped with a maintainer-rerun
    # comment. EC2 in story-22-01.
    if: >-
      !cancelled()
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
      && needs.changes.outputs.e2e == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    uses: ./.github/workflows/_e2e.yml

  media-e2e:
    # The Go tests that need a real ffmpeg (and Postgres); they skip in
    # every other tier. Its own job and budget (see _media-e2e.yml).
    needs: [changes]
    if: needs.changes.outputs.media_e2e == 'true'
    uses: ./.github/workflows/_media-e2e.yml

  perf-ci:
    needs: [changes, integration]
    if: >-
      !cancelled()
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
      && needs.changes.outputs.perf_ci == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    uses: ./.github/workflows/_perf-ci.yml

  build-artifacts:
    needs: [changes]
    if: needs.changes.outputs.build_artifacts == 'true'
    uses: ./.github/workflows/_build-artifacts.yml

  node-packaging:
    needs: [changes]
    if: needs.changes.outputs.node_packaging == 'true' || needs.changes.outputs.release_venv == 'true'
    uses: ./.github/workflows/_node-packaging.yml
    with:
      packaging: ${{ needs.changes.outputs.node_packaging == 'true' }}
      release_venv: ${{ needs.changes.outputs.release_venv == 'true' }}

  components-packs:
    # Epic 51 story 51.15: this commit's packs built, signed by a fake Sigstore and
    # verified with the e2e trust root; bad signature, sha256, path traversal and expiry
    # refused (see _components-packs.yml)
    needs: [changes]
    if: needs.changes.outputs.components_packs == 'true'
    uses: ./.github/workflows/_components-packs.yml

  launcher:
    needs: [changes]
    if: needs.changes.outputs.launcher == 'true'
    uses: ./.github/workflows/_launcher.yml

  mac-app:
    needs: [changes]
    if: needs.changes.outputs.mac_app == 'true'
    uses: ./.github/workflows/_mac-app.yml

  win-app:
    needs: [changes]
    if: needs.changes.outputs.win_app == 'true'
    uses: ./.github/workflows/_win-app.yml

  linux-app:
    needs: [changes]
    if: needs.changes.outputs.linux_app == 'true'
    uses: ./.github/workflows/_linux-app.yml

  android-apps:
    needs: [changes]
    if: needs.changes.outputs.android_apps == 'true'
    uses: ./.github/workflows/_android-apps.yml

  android-tv:
    needs: [changes]
    if: needs.changes.outputs.android_tv == 'true'
    uses: ./.github/workflows/_android-tv.yml

  desktop-player:
    needs: [changes]
    if: needs.changes.outputs.desktop_player == 'true'
    uses: ./.github/workflows/_desktop-player.yml

  apple-apps:
    # the build job for any Apple change; the Player's UI tests for the Player's
    needs: [changes]
    if: needs.changes.outputs.apple_apps == 'true' || needs.changes.outputs.apple_player_ui == 'true'
    permissions:
      contents: read
      actions: read # a UI test shard fetches the build's artifact as soon as it is uploaded
    uses: ./.github/workflows/_apple-apps.yml
    with:
      build: ${{ needs.changes.outputs.apple_apps == 'true' }}
      player_ui: ${{ needs.changes.outputs.apple_player_ui == 'true' }}

  # The Linux app's pinned downloads (~150 MB a runner) in a cache on main: a pull
  # request's run restores main's caches but not another pull request's, so without
  # this one every run downloads them again (and fails while their host is down).
  # Only a push to main saves it; when it is there already this is one lookup.
  linux-app-downloads:
    # ci-paths: push-only, not-a-gate
    if: github.event_name == 'push'
    name: Linux app downloads (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v6.0.2
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}
          lookup-only: true
      # missing: start from an earlier pins.env's cache, so only the changed pieces download
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}
          restore-keys: linux-app-downloads-${{ matrix.arch }}-
      - name: Download the pinned files
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/release/linux-app/payload.sh --fetch-only
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}

  # maktaba.dev, the developer portal: build, tests and the public-safety scan. A pull
  # request only builds it; devportal-deploy.yml deploys main.
  devportal:
    needs: [changes]
    if: needs.changes.outputs.devportal == 'true'
    uses: ./.github/workflows/_devportal.yml
    with:
      upload: ${{ github.event_name == 'pull_request' }}

  # The in-repo wiki app (web/wiki-app): its database matches the specs it is generated
  # from (docs/wiki/db/generate_wiki.py --check, and the generator's tests), and it builds.
  wiki:
    needs: [changes]
    if: needs.changes.outputs.wiki == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - name: The wiki database matches the specs
        run: python3 docs/wiki/db/generate_wiki.py --check
      - name: The generator's tests
        run: python3 -m unittest discover -s docs/wiki/db -p 'test_*.py' -v
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/packages/devportal/.nvmrc
          cache: npm
          cache-dependency-path: web/wiki-app/package-lock.json
      - name: The wiki app builds
        working-directory: web/wiki-app
        run: |
          npm ci --no-audit --no-fund
          npm run build

  pr-body-check:
    # ci-paths: always-run, pr-only
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.repo == 'true'
    uses: ./.github/workflows/_pr-body-check.yml

  # Code that changes needs its tests changed too (tools/affected-tests, docs/ci.md): the
  # same gate as the pre-push hook (.githooks/pre-push), so a push that skipped the hook
  # cannot get past it. A commit in the pull request with a `No-Test-Change: <reason>`
  # trailer lets it through. The coverage map comes from coverage-map.yml (main); without
  # one the gate works from its searches. Seconds: it reads git, it runs no test.
  affected-tests:
    # ci-paths: always-run, pr-only
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the coverage map artifact
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false
      - name: The hook and scripts
        run: shellcheck -x .githooks/pre-push tools/affected-tests/*.sh
      - name: Changed code has its tests changed
        working-directory: tools/affected-tests
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: go run . gate -C ../.. --range "$BASE...$HEAD"

  fork-rerun-comment:
    # EC2: bot comment on fork PRs telling maintainers how to rerun
    # the gated jobs once they've reviewed the diff (when the change selects them).
    # ci-paths: pr-only, not-a-gate
    needs: [changes]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == true
      && (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.perf_ci == 'true')
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const marker = "<!-- maktaba:fork-rerun-needed -->";
            const body = `${marker}
            **Fork PR detected** — \`e2e\` and \`perf-ci\` were skipped because secrets are unavailable to forked workflows.

            A maintainer must rerun those gates from a same-repo branch before merging. See \`docs/ci.md\`.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  ci-success:
    # The single status check pinned by branch protection. All gates
    # report into this one job; a green ci-success means the merge
    # gate is satisfied.
    needs:
      - changes
      - lint
      - unit
      - integration
      - replica
      - components
      - e2e
      - media-e2e
      - perf-ci
      - build-artifacts
      - node-packaging
      - components-packs
      - launcher
      - mac-app
      - win-app
      - linux-app
      - android-apps
      - android-tv
      - desktop-player
      - apple-apps
      - devportal
      - wiki
      - pr-body-check
      - affected-tests
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Gate results:"
          echo "$RESULTS"
          # Fail if any gate failed or was cancelled. Skipped is acceptable: its path filter
          # did not select it (.github/ci-paths.yml), a fork PR's e2e/perf-ci, a pull request's
          # push-only job. Not for the path filter itself: when it fails every gate is
          # skipped. Every job in needs: is checked (tools/ci/ci_paths.py keeps every gate
          # in needs:).
          fail=0
          changes=$(echo "$RESULTS" | jq -r '.changes.result // "missing"')
          echo "  changes: $changes"
          if [ "$changes" != success ]; then fail=1; fi
          for gate in $(echo "$RESULTS" | jq -r 'keys[] | select(. != "changes")'); do
            result=$(echo "$RESULTS" | jq -r ".\"$gate\".result // \"skipped\"")
            echo "  $gate: $result"
            case "$result" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          if [ $fail -ne 0 ]; then
            echo "::error::One or more required gates failed or were cancelled."
            exit 1
          fi
          echo "All gates passed (or were not selected by the change)."
