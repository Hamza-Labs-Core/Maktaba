# Maktaba release pipeline (Story 22.5 AC2, 22.2 AC5, 22.3 AC1).
#
# Triggered ONLY by a `v*` tag push — it is inert for branch pushes and
# pull requests, so it never adds a status check to a PR and never
# blocks the `ci-success` merge gate. A self-hoster gets a versioned,
# signed release from one `git tag vX.Y.Z && git push --tags`.
#
# Flow (tag -> rebuild-from-tag -> package -> sign -> publish):
#   1. build-artifacts  cross-compile the api/streaming (+cloud relay) Go
#                        targets + web bundle from the tagged tree, for
#                        linux/{amd64,arm64}, darwin/{amd64,arm64}, and
#                        windows/amd64.
#   2. build-server      cross-compile the unified maktaba-server binary
#                        (web UI embedded) for all five OS/arch targets on
#                        one runner, reusing the web bundle from step 1.
#   3. build-images      build + push the five container images to GHCR,
#                        multi-arch (linux/amd64,linux/arm64) via QEMU +
#                        buildx, with OCI version labels and a per-image
#                        manifest-list digest.
#   4. package-archives  pack per-platform .tar.gz (linux/macOS) and .zip
#                        (windows) of the server binaries + README +
#                        LICENSE + sample config (+ systemd unit on Linux).
#   5. package-nfpm      build native .deb (Debian/Ubuntu) and .rpm
#                        (Fedora/RHEL) for linux/{amd64,arm64} with nfpm.
#   5b. package-node     the worker side of a multi-instance home (Epic 31):
#                        the pipeline wheel stamped with the tag, its
#                        dependency constraints from uv.lock, and the node
#                        installer archives (maktaba-node-<ver>.tar.gz /
#                        .zip) that install that wheel with no checkout.
#   0. guard             the tag-order guard (_tag-guard.yml: above every
#                        published release, on main, CI passed), which
#                        also opens the tag's release as a DRAFT.
#   6. sign-and-release  write release.json (Epic 35 story 35.1) and check
#                        it against the migrations / SCHEMA_REV, checksum
#                        every artifact (release-manifest.json among them),
#                        keyless-cosign-sign the checksums file (Sigstore
#                        bundle + legacy .sig/.pem) AND each pushed image
#                        digest, verify the result with the same in-process
#                        verifier every machine installs through, generate
#                        the Homebrew formula, then attach archives +
#                        packages + checksums + signatures to the draft and
#                        publish it once complete (tools/release/
#                        release-assets.sh: release.yml's signed set and
#                        the server-carrying apps in latest.json; the last
#                        workflow to finish publishes). A published release
#                        is never rewritten: a re-run only adds missing
#                        files, and every output is deterministic (the
#                        commit's time, sorted archives).
#
# Signing identity: keyless cosign via the workflow's OIDC token
# (`id-token: write`). No long-lived private key, no repo secret to
# provision. The signer is exactly this workflow, run by the tag push it
# publishes; verify with the exact identity (a regexp over the repository
# name would also accept a fork's release workflow):
#
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity \
#       https://github.com/Hamza-Labs-Core/Maktaba/.github/workflows/release.yml@refs/tags/vX.Y.Z \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
#
# Machines verify the same bundle in process (shared/go/releaseverify), with
# no cosign binary and no network: the bundle carries the Rekor inclusion
# proof; the Sigstore trusted root is compiled in and refreshed through TUF.
#
# OPERATOR NOTE: GHCR push uses the auto-provisioned `GITHUB_TOKEN`
# (`packages: write`); no secret to set. If you fork to a registry that
# is NOT ghcr.io, set the `MAKTABA_REGISTRY` repo variable and provide
# the matching login secret — the `docker/login-action` step below reads
# `secrets.REGISTRY_TOKEN` when set and otherwise falls back to
# `GITHUB_TOKEN`/GHCR (see the "Registry login" step).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One run per tag at a time, never cancelled (rc.1 ran twice, 3 s apart): a second run
# waits, then finds the release's files there and adds only what is missing.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.MAKTABA_REGISTRY || 'ghcr.io/hamza-labs-core' }}

jobs:
  guard:
    uses: ./.github/workflows/_tag-guard.yml
    permissions:
      contents: write
      actions: read
    with:
      create_draft: true

  # A re-run of a published tag (the guard's published) builds, pushes and signs nothing:
  # its signed files and its images stay as they were published (a re-run moved the images'
  # tags, :latest among them, before its upload was refused). Only a draft is rebuilt. Every
  # job below needs build-artifacts, package-node or package-linux-payload, so all skip.
  build-artifacts:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [guard]
    if: needs.guard.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, goos: linux,   goarch: amd64 }
          - { os: ubuntu-22.04, goos: linux,   goarch: arm64 }
          - { os: macos-14,     goos: darwin,  goarch: arm64 }
          # darwin/amd64 cross-compiles from the arm64 macOS runner
          # (CGO_ENABLED=0); windows/amd64 cross-compiles from ubuntu.
          - { os: macos-14,     goos: darwin,  goarch: amd64 }
          - { os: ubuntu-22.04, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cloud/go.sum

      - name: Set up pnpm
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: web
        run: pnpm install --frozen-lockfile

      # VERSION comes from the tag, not `git describe`, so the artifact
      # version string is exactly the tag the maintainer pushed. The
      # streaming binary is built with -tags tvstaging (TV staging and hot
      # swap, Epic 33.5-33.9) through the Makefile's STREAMING_TAGS.
      - name: Build Go binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          STREAMING_TAGS: tvstaging
        run: make build-go

      # The maktaba-cloud (relay) binary is server-only, so it ships for
      # linux/{amd64,arm64} only — the VPS deploy targets (no darwin
      # relay). Version-stamped with the same reproducibility envelope as
      # the other binaries; main.{Version,Commit,BuiltAt} live in
      # cloud/cmd/maktaba-cloud.
      - name: Build + stage cloud (relay) binary
        if: matrix.goos == 'linux'
        working-directory: cloud
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-buildid= -s -w \
              -X main.Version=${VERSION} \
              -X main.Commit=${COMMIT} \
              -X main.BuiltAt=$(git log -1 --pretty=%ct)" \
            -o "../dist/maktaba-cloud-${GOOS}-${GOARCH}" ./cmd/maktaba-cloud

      - name: Build web bundle
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          VERSION: ${{ github.ref_name }}
        run: make build-web

      - name: Stage release binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp api/bin/maktaba-api "dist/maktaba-api-${GOOS}-${GOARCH}"
          cp streaming/bin/maktaba-streaming "dist/maktaba-streaming-${GOOS}-${GOARCH}"

      - name: Upload release binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

      - name: Upload web bundle
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-web-bundle
          path: web/dist
          retention-days: 7

  # The unified maktaba-server binary embeds the (platform-independent)
  # web bundle, so it cross-compiles for every OS/arch on a single runner
  # once the bundle exists — no per-platform Node toolchain needed. Same
  # reproducibility envelope (-trimpath, pinned SOURCE_DATE_EPOCH, version
  # stamped from the tag) as the Makefile `server` target.
  build-server:
    name: build maktaba-server (all platforms)
    needs: [build-artifacts]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            cmd/maktaba-server/go.sum

      - name: Download web bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-web-bundle
          path: web/dist

      - name: Cross-compile maktaba-server
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          PKG="github.com/Hamza-Labs-Core/Maktaba/cmd/maktaba-server/internal/version"
          # Pin the build timestamp to the tagged commit for reproducibility.
          SDE="$(git log -1 --pretty=%ct)"
          # Stage the prebuilt web bundle into the embed directory.
          EMBED="cmd/maktaba-server/internal/webui/dist"
          rm -rf "${EMBED}"
          mkdir -p "${EMBED}"
          cp -R web/dist/. "${EMBED}/"
          touch "${EMBED}/.gitkeep"
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          LDFLAGS="-buildid= -s -w \
            -X ${PKG}.Version=${VERSION} \
            -X ${PKG}.Commit=${COMMIT} \
            -X ${PKG}.BuildDate=${SDE}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="${GITHUB_WORKSPACE}/dist/maktaba-server-${os}-${arch}"
            [ "${os}" = windows ] && out="${out}.exe"
            echo "==> maktaba-server ${os}/${arch}"
            ( cd cmd/maktaba-server && \
              GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 SOURCE_DATE_EPOCH="${SDE}" \
              go build -trimpath -tags embed_web -ldflags "${LDFLAGS}" -o "${out}" . )
            # maktaba-launcher (Epic 35 story 35.2): the small stable process the
            # OS service runs; it starts bin/releases/<current>/maktaba-server.
            lout="${GITHUB_WORKSPACE}/dist/maktaba-launcher-${os}-${arch}"
            [ "${os}" = windows ] && lout="${lout}.exe"
            ( cd cmd/maktaba-launcher && \
              GOOS="${os}" GOARCH="${arch}" CGO_ENABLED=0 SOURCE_DATE_EPOCH="${SDE}" \
              go build -trimpath -ldflags "-buildid= -s -w -X main.Version=${VERSION}" -o "${lout}" . )
          done
          ls -l "${GITHUB_WORKSPACE}/dist"

      - name: Upload maktaba-server binaries
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-server
          path: dist/*
          retention-days: 7

  build-images:
    name: image (${{ matrix.svc }})
    needs: [guard, build-artifacts]
    runs-on: ubuntu-22.04
    # Multi-arch raises the ceiling: the Go images cross-compile via
    # TARGETARCH (cheap), but the web (node) and pipeline (python) images
    # build their arm64 leg under QEMU emulation, which is slow.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        svc: [api, streaming, pipeline, web, cloud]
    # NOTE: job-level `outputs` are NOT merged across matrix legs by
    # GitHub Actions (the map resolves from a single leg), so the
    # immutable per-image digest is handed off via a per-leg artifact
    # (`digest-<svc>`) that sign-and-release downloads and assembles.
    steps:
      - uses: actions/checkout@v6.0.2

      # QEMU registers binfmt handlers so buildx can emulate linux/arm64
      # on the amd64 runner for the non-cross-compiling image legs.
      - uses: docker/setup-qemu-action@v3.6.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Registry login
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY == 'ghcr.io/hamza-labs-core' && 'ghcr.io' || env.REGISTRY }}
          username: ${{ github.actor }}
          # Falls back to GITHUB_TOKEN (GHCR) when REGISTRY_TOKEN is
          # unset, so this repo works out of the box; forks pushing to a
          # third-party registry set the REGISTRY_TOKEN secret.
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # The images' build time is the tagged commit's (as the binaries'), not 0.
      - name: Source date
        id: sde
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      # `:latest` moves only with the tag the guard says is the latest (the highest stable
      # version, as GitHub's latest release: releaseorder.Latest); a pre-release
      # (v0.3.0-rc.1) or a maintenance release of an older line is pushed as itself.
      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/maktaba-${{ matrix.svc }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ needs.guard.outputs.latest }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${TAG}"
            if [ "${LATEST}" = true ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # rewrite-timestamp: every layer's files carry the commit's time (SOURCE_DATE_EPOCH),
      # so a re-run builds the same layers (the attestations still record their build).
      - name: Build and push ${{ matrix.svc }}
        id: build
        uses: docker/build-push-action@v7.2.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.sde.outputs.epoch }}
        with:
          # All Dockerfiles take the repo root as build context.
          context: .
          file: ${{ matrix.svc }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.epoch }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Keyless cosign over the immutable digest (22.2 AC5: images
      # signed). --yes suppresses the transparency-log confirmation
      # prompt; the OIDC identity is the workflow itself.
      - name: Sign image (keyless cosign)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/maktaba-${{ matrix.svc }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

      # Hand the {svc, digest} pair off to sign-and-release via a unique
      # per-leg artifact, because matrix job `outputs` do NOT merge.
      - name: Stage digest for hand-off
        env:
          SVC: ${{ matrix.svc }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digest-out
          printf '%s %s\n' "${SVC}" "${DIGEST}" > "digest-out/${SVC}"
          cat "digest-out/${SVC}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.svc }}
          path: digest-out/${{ matrix.svc }}
          retention-days: 7

  # Per-platform distributable archives: each holds the unified server
  # plus the api/streaming siblings it forks, the docs, a sample config,
  # and (on Linux) the systemd unit. .tar.gz for linux/macOS, .zip for
  # windows. install.sh + the Homebrew formula consume these.
  package-archives:
    name: package archives
    needs: [build-artifacts, build-server]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download maktaba-server binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-server
          path: srv

      - name: Download api/streaming binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-bin-*
          path: bins
          merge-multiple: true

      - name: Assemble archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          sde="$(git log -1 --pretty=%ct)"
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "${os}" = windows ] && ext=".exe"
            stage="$(mktemp -d)"
            cp "srv/maktaba-server-${os}-${arch}${ext}" "${stage}/maktaba-server${ext}"
            cp "srv/maktaba-launcher-${os}-${arch}${ext}" "${stage}/maktaba-launcher${ext}"
            # api/streaming binaries are staged without an .exe suffix by
            # the build matrix; give them one inside windows archives.
            cp "bins/maktaba-api-${os}-${arch}"       "${stage}/maktaba-api${ext}"
            cp "bins/maktaba-streaming-${os}-${arch}" "${stage}/maktaba-streaming${ext}"
            # Artifact download drops the +x bit (artifacts are re-zipped),
            # so restore it before archiving.
            chmod 0755 "${stage}/maktaba-server${ext}" "${stage}/maktaba-launcher${ext}" \
                       "${stage}/maktaba-api${ext}" \
                       "${stage}/maktaba-streaming${ext}"
            cp README.md LICENSE "${stage}/"
            cp deploy/server.toml.example "${stage}/server.toml.example"
            if [ "${os}" = linux ]; then
              cp deploy/packaging/systemd/maktaba-server.service "${stage}/"
            fi
            base="maktaba-server-${ver}-${os}-${arch}"
            if [ "${os}" = windows ]; then
              # Deterministic zip: sorted names, the commit's time on every file (UTC: zip
              # keeps local times), no extra attributes (-X).
              find "${stage}" -exec touch -h -d "@${sde}" {} +
              ( cd "${stage}" && find . -type f | sed 's|^\./||' | LC_ALL=C sort | TZ=UTC zip -qX -@ - ) > "out/${base}.zip"
            else
              # Deterministic tar: sorted names, pinned mtime, no uid/gid.
              tar --sort=name --mtime="@${sde}" \
                  --owner=0 --group=0 --numeric-owner \
                  -C "${stage}" -czf "out/${base}.tar.gz" .
            fi
            rm -rf "${stage}"
          done
          ls -l out

      - name: Upload archives
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-archives
          path: out/*
          retention-days: 7

  # Native Linux packages via nfpm: {.deb,.rpm} x {amd64,arm64}. nfpm
  # expands ${ARCH}/${VERSION} in nfpm.yaml from the exported env; the
  # referenced binaries must be staged under ./dist first.
  package-nfpm:
    name: package deb + rpm
    needs: [build-artifacts, build-server]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # GOTOOLCHAIN=auto: nfpm needs a newer Go than the runner's, and setup-go sets
      # GOTOOLCHAIN=local; a setup-go that left the runner's Go first on PATH (its
      # download not installed) then failed this step. Go fetches what nfpm asks for.
      - name: Install nfpm
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Download maktaba-server binaries
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-server
          path: dist

      - name: Download api/streaming binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-bin-*
          path: dist
          merge-multiple: true

      - name: Build .deb and .rpm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # the packages' file times and build time are the commit's: a re-run builds the
          # same bytes
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          mkdir -p out pkgroot
          for arch in amd64 arm64; do
            # nfpm doesn't env-expand contents[].src, so stage this arch's
            # binaries to the fixed pkgroot/ paths nfpm.yaml references.
            install -m 0755 "dist/maktaba-server-linux-${arch}"    pkgroot/maktaba-server
            install -m 0755 "dist/maktaba-launcher-linux-${arch}"  pkgroot/maktaba-launcher
            install -m 0755 "dist/maktaba-api-linux-${arch}"       pkgroot/maktaba-api
            install -m 0755 "dist/maktaba-streaming-linux-${arch}" pkgroot/maktaba-streaming
            export ARCH="${arch}" VERSION="${TAG#v}"
            echo "==> nfpm ${arch}"
            nfpm package -f deploy/packaging/nfpm.yaml -p deb -t out/
            nfpm package -f deploy/packaging/nfpm.yaml -p rpm -t out/
          done
          # A pre-release version is 0.1.0~rc.1 inside the package (so apt/dnf
          # order it before 0.1.0), but GitHub renames "~" in an asset's name
          # to ".", and checksums.txt would then name a file the release does
          # not have. The file names use "." from the start.
          for f in out/*~*; do
            [ -e "$f" ] || continue
            mv "$f" "${f//\~/.}"
          done
          ls -l out

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-packages
          path: out/*
          retention-days: 7

  # The node's assets: what a machine needs to join a home without a git
  # checkout (deploy/packaging/node/build-release.sh; the CI node-packaging
  # gate builds and installs the same assets on every PR).
  package-node:
    name: package node (wheel + installer)
    needs: [guard]
    if: needs.guard.outputs.published != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # the constraints name PyTorch's index: uv export --emit-index-url needs uv 0.12+
          # (build-release.sh checks), and one uv version writes them the same every run
          version: "0.13.4"

      - name: Build the wheel, constraints and installer archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            deploy/packaging/node/build-release.sh --version "${TAG}" --out out
          ls -l out

      - name: Upload node assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-node
          path: out/*
          retention-days: 7

  # The Linux server payload (Epic 39 stories 39.2, 39.10): the tree the Linux
  # app carries in usr/share/maktaba/server, as a tarball for a machine
  # without a desktop (install.sh --app) and for its updates (checked
  # against the signed checksums.txt like every asset). Built on each
  # architecture: its Postgres libraries come from the runner.
  package-linux-payload:
    name: package Linux payload (${{ matrix.arch }})
    needs: [guard]
    if: needs.guard.outputs.published != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # one architecture failing must not cancel the other: the release ships
      # the payloads that built (sign-and-release names a missing one)
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cmd/maktaba-server/go.sum
            cmd/maktaba-launcher/go.sum

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # the uv every other release job uses (desktop-release.yml's too): another
          # version wrote other constraints, so the Linux payload tarball and the app's
          # own payload of one release differed (v0.3.0: 0.13.5 here, 0.13.4 there)
          version: "0.13.4"

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps and the build tools
        run: |
          pnpm -C web install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf zip ffmpeg

      # check.sh: no ffmpeg in the payload, and the server takes the runner's
      # (Ubuntu 22.04's, as the app's users get theirs from their distribution)
      - name: Build the payload, check it, pack it
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tools/release/linux-app/payload.sh --version "${TAG}"
          tools/release/linux-app/check.sh --ffmpeg ok
          ver="${TAG#v}"
          sde="$(git log -1 --pretty=%ct)"
          mkdir -p out
          # deterministic: sorted names, pinned mtime, no uid/gid; hard links
          # stored as the files they are (the runtime's unpack takes files,
          # directories and symlinks only, and check.sh refuses hard links)
          tar --sort=name --mtime="@${sde}" --owner=0 --group=0 --numeric-owner --hard-dereference \
            -C build/linux-app -czf "out/maktaba-linux-payload-${ver}-${ARCH}.tar.gz" server
          ls -l out

      - name: Upload the payload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux-payload-${{ matrix.arch }}
          path: out/*
          retention-days: 7

  # The Linux payloads do not hold the release back: a leg that failed leaves its
  # architecture out (the notes say so), the rest is published. Every other job must pass.
  sign-and-release:
    name: sign + publish release
    needs: [build-artifacts, build-server, build-images, package-archives, package-nfpm, package-node, package-linux-payload]
    if: >-
      !cancelled() &&
      needs.build-artifacts.result == 'success' && needs.build-server.result == 'success' &&
      needs.build-images.result == 'success' && needs.package-archives.result == 'success' &&
      needs.package-nfpm.result == 'success' && needs.package-node.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write   # gh release create
      id-token: write   # keyless cosign OIDC
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.10.0

      # gen-release-json and the release self-check (shared/go/releaseverify).
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Download release binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-bin-*
          path: staged
          merge-multiple: true

      - name: Download platform archives
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-archives
          path: staged/archives

      - name: Download native packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-packages
          path: staged/packages

      - name: Download web bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-web-bundle
          path: staged/web-dist

      - name: Download node assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-node
          path: staged/node

      # none when both legs failed
      - name: Download the Linux payloads
        if: needs.package-linux-payload.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-linux-payload-*
          path: staged/linux-payload
          merge-multiple: true

      # One artifact per build-images matrix leg ("digest-<svc>", each a
      # single file named "<svc>" holding "<svc> sha256:...").
      - name: Download image digests
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Assemble release tree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Per-platform server archives (.tar.gz / .zip) and native
          # packages (.deb / .rpm) are the primary download artifacts; the
          # server/api/streaming binaries live inside them, not loose.
          cp staged/archives/* dist/
          cp staged/packages/* dist/
          # The Linux server payloads (Epic 39): a machine without a desktop
          # installs and updates from these. An architecture whose leg failed is
          # left out, and the notes say so (LINUX_PAYLOAD_MISSING).
          ver="${TAG#v}"
          missing=""
          for arch in x86_64 aarch64; do
            f="staged/linux-payload/maktaba-linux-payload-${ver}-${arch}.tar.gz"
            if [ -f "$f" ]; then cp "$f" dist/; else missing="${missing:+$missing }$arch"; fi
          done
          echo "LINUX_PAYLOAD_MISSING=${missing}" >>"$GITHUB_ENV"
          [ -z "$missing" ] || echo "::warning::no Linux payload for ${missing}: published without it"
          # The release's migrations (Epic 35 phase B), signed with the rest and named in
          # release.json: a home's update rehearses them on a scratch copy of its
          # database, and a plain server install migrates with them.
          sde="$(git log -1 --pretty=%ct)"
          ( cd shared/db/migrations && ls -1 *.sql ) > migrations.list
          tar --sort=name --mtime="@${sde}" --owner=0 --group=0 --numeric-owner \
              -C shared/db/migrations -czf "dist/maktaba-migrations-${ver}.tar.gz" -T migrations.list
          rm -f migrations.list
          # The installer itself, listed in checksums.txt and so signed with the rest:
          # a machine fetches it from the release and verifies it like the payload
          # (specs/epics/39-linux-app/headless.md) before running it.
          cp deploy/packaging/install.sh dist/install.sh
          # The node's wheel, constraints and installer archives (a worker
          # machine joins a home with these; no checkout).
          cp staged/node/* dist/
          # The cloud (relay) binary ships loose — it's a separate VPS
          # deploy target, not part of the home-server archives. Restore
          # the +x bit dropped by artifact download.
          find staged -maxdepth 1 -type f -name 'maktaba-cloud-*' -exec cp {} dist/ \;
          chmod 0755 dist/maktaba-cloud-* 2>/dev/null || true
          # Tar the web bundle so the Release has one downloadable asset (deterministic:
          # sorted names, the commit's time, no owner; gzip without a name or time).
          tar --sort=name --mtime="@${sde}" --owner=0 --group=0 --numeric-owner \
              -C staged/web-dist -cf - . | gzip -n > "dist/maktaba-web-${TAG}.tar.gz"
          ls -l dist

      # Fill the Homebrew formula template with this release's version and
      # the SHA-256 of each macOS archive, then publish it as a release
      # asset. If a tap repo + token are configured, also push it there.
      - name: Generate Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          sha_arm="$(sha256sum "dist/maktaba-server-${ver}-darwin-arm64.tar.gz" | awk '{print $1}')"
          sha_amd="$(sha256sum "dist/maktaba-server-${ver}-darwin-amd64.tar.gz" | awk '{print $1}')"
          # only the formula's own lines: its header comment names the placeholders
          sed -e "/^[[:space:]]*#/!s/__VERSION__/${ver}/g" \
              -e "/^[[:space:]]*#/!s/__SHA256_DARWIN_ARM64__/${sha_arm}/g" \
              -e "/^[[:space:]]*#/!s/__SHA256_DARWIN_AMD64__/${sha_amd}/g" \
              deploy/packaging/homebrew/maktaba.rb > dist/maktaba.rb
          echo "----- generated dist/maktaba.rb -----"
          cat dist/maktaba.rb

      # Optional: commit the formula to a separate homebrew-tap repo so
      # `brew install <owner>/tap/maktaba` works. No-op unless both the
      # HOMEBREW_TAP_REPO repo variable (e.g. "owner/homebrew-tap") and a
      # HOMEBREW_TAP_TOKEN secret (a PAT with `contents:write` on the tap)
      # are set — so the default repo's release still succeeds without it.
      # never for a pre-release: the tap's formula is the stable one
      - name: Publish formula to tap
        if: ${{ vars.HOMEBREW_TAP_REPO != '' && !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_REPO set but HOMEBREW_TAP_TOKEN secret missing; skipping tap push." >&2
            exit 0
          fi
          tmp="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" "${tmp}"
          mkdir -p "${tmp}/Formula"
          cp dist/maktaba.rb "${tmp}/Formula/maktaba.rb"
          git -C "${tmp}" config user.name "maktaba-release-bot"
          git -C "${tmp}" config user.email "maktaba@hamzalabs.dev"
          git -C "${tmp}" add Formula/maktaba.rb
          if git -C "${tmp}" diff --cached --quiet; then
            echo "Formula already up to date in tap."
          else
            git -C "${tmp}" commit -m "maktaba ${TAG}"
            git -C "${tmp}" push origin HEAD
          fi

      # The previous release's release.json bounds breaks_previous_home and carries
      # min_upgrade_from forward: the highest published version below this tag, the
      # highest stable one for a stable tag (not the newest created: v0.4.0 after
      # v0.4.0-rc.3 compares with v0.3.x, where stable homes come from). Older releases
      # without a release.json are passed over, highest first.
      - name: Fetch the previous release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          published="$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName')"
          prev=""
          while :; do
            cand="$(printf '%s\n' "${published}" | (cd tools/release && go run ./cmd/release-order previous --tag "${TAG}"))"
            [ -n "${cand}" ] || break
            if gh release download "${cand}" --pattern release.json --output prev-release.json --clobber 2>/dev/null; then
              prev="${cand}"; break
            fi
            published="$(printf '%s\n' "${published}" | grep -vx "${cand}")"
          done
          echo "previous release with release.json: ${prev:-none}"

      # release.json (Epic 35 design §3.1): version, schema revisions,
      # protocol numbers, per-platform archive + inner binary digests, the
      # pipeline wheel and constraints. It is listed in checksums.txt, so the
      # one signature covers it.
      - name: Write release.json
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        working-directory: tools/release
        run: |
          set -euo pipefail
          prev=()
          if [ -f ../../prev-release.json ]; then prev=(--previous ../../prev-release.json); fi
          # "published" is the tag's own time (an annotated tag's, else its commit's): a
          # re-run writes the same release.json, so the signed checksums do not change
          published="$(git for-each-ref "refs/tags/${TAG}" --format='%(taggerdate:iso-strict)')"
          [ -n "${published}" ] || published="$(git log -1 --format=%cI "${SHA}")"
          go run ./cmd/gen-release-json --tag "${TAG}" --commit "${SHA}" --published "${published}" \
            --dist ../../dist --repo ../.. "${prev[@]}" > ../../dist/release.json
          cat ../../dist/release.json

      # Story 35.1 AC2 / TC9: schema_rev must equal SCHEMA_REV and SchemaRev,
      # min_node_schema / breaks_previous_home must match the MANIFEST.md
      # markers, and the embedded Sigstore root must be under 90 days old.
      - name: release-manifest-check
        run: |
          set -euo pipefail
          prev=()
          if [ -f prev-release.json ]; then prev=(--previous ../../prev-release.json); fi
          ( cd tools/release && go run ./cmd/gen-release-json --check ../../dist/release.json --repo ../.. "${prev[@]}" )
          ( cd shared/go/releaseverify && MAKTABA_RELEASE_BUILD=1 go test -run TestEmbeddedRootAge -count=1 . )

      # Before the checksums: release-manifest.json (the images' digests) is signed with the rest.
      - name: Write release manifest
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # the commit's time: a re-run writes the same file (it is in checksums.txt)
          built_at="$(date -u -d "@$(git log -1 --pretty=%ct)" +%Y-%m-%dT%H:%M:%SZ)"
          # Each digests/<svc> file holds "<svc> sha256:<64hex>" written by
          # the matching build-images matrix leg. Read all four (fail loud
          # if any leg's digest is missing) so the manifest records the
          # real, distinct, immutable digest per component.
          digest_of() {
            local svc="$1" f="digests/$1" d
            test -f "$f" || { echo "missing digest artifact for ${svc}" >&2; exit 1; }
            d="$(awk -v s="$svc" '$1==s {print $2}' "$f")"
            case "$d" in
              sha256:*) ;;
              *) echo "bad digest for ${svc}: '${d}'" >&2; exit 1 ;;
            esac
            printf '%s' "$d"
          }
          DIGEST_API="$(digest_of api)"
          DIGEST_STREAMING="$(digest_of streaming)"
          DIGEST_PIPELINE="$(digest_of pipeline)"
          DIGEST_WEB="$(digest_of web)"
          DIGEST_CLOUD="$(digest_of cloud)"
          # schema_rev comes from release.json (derived from the migration
          # set, checked against SCHEMA_REV/SchemaRev). rollback_* stay
          # empty/0 until the rollback-tracking story lands.
          SCHEMA_REV="$(jq -r .schema_rev dist/release.json)"
          cat > dist/release-manifest.json <<EOF
          {
            "version": "${ver}",
            "git_sha": "${SHA}",
            "built_at": "${built_at}",
            "schema_rev": ${SCHEMA_REV},
            "components": {
              "api":       {"image": "${REGISTRY}/maktaba-api:${TAG}",       "sha256": "${DIGEST_API}"},
              "streaming": {"image": "${REGISTRY}/maktaba-streaming:${TAG}", "sha256": "${DIGEST_STREAMING}"},
              "pipeline":  {"image": "${REGISTRY}/maktaba-pipeline:${TAG}",  "sha256": "${DIGEST_PIPELINE}"},
              "web":       {"image": "${REGISTRY}/maktaba-web:${TAG}",       "sha256": "${DIGEST_WEB}"},
              "cloud":     {"image": "${REGISTRY}/maktaba-cloud:${TAG}",     "sha256": "${DIGEST_CLOUD}"}
            },
            "rollback_to": "",
            "rollback_schema_rev": 0
          }
          EOF
          cat dist/release-manifest.json

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # LC_ALL=C + sorted file list => byte-stable manifest, mirrors
          # the Makefile `checksums` target.
          find . -maxdepth 1 -type f ! -name 'checksums.txt' \
            | sort | LC_ALL=C xargs sha256sum > checksums.txt
          cat checksums.txt

      # Keyless cosign over the checksums manifest (22.2 AC5: binaries
      # signed). Emits checksums.txt.sig + checksums.txt.pem; the .pem
      # is the Fulcio cert that binds the signature to this workflow's
      # OIDC identity (verifiable offline by a self-hoster).
      #
      # checksums.txt.sigstore.json is the Sigstore bundle (certificate,
      # signature, Rekor entry with its inclusion proof): what every Maktaba
      # machine verifies, offline (story 35.1). The .sig/.pem pair stays for
      # humans and older tooling.
      - name: Sign checksums (keyless cosign)
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            --new-bundle-format \
            checksums.txt
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt

      # The release verifies with the code that installs it, before it is
      # published: the Sigstore bundle against the embedded trusted root, the
      # exact identity of this workflow for this tag, the Rekor inclusion
      # proof, release.json and every file checksums.txt lists.
      - name: Verify the signed release (releaseverify)
        env:
          TAG: ${{ github.ref_name }}
        working-directory: shared/go/releaseverify
        run: go run ./cmd/releaseverify --tag "${TAG}" --dir ../../../dist --repo "${GITHUB_REPOSITORY}"

      - name: Attach the files to the release, publish it once complete
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          # the apps' feed is required before publishing when the apps can update
          REQUIRE_FEED: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
        run: |
          set -euo pipefail
          # the notes print the exact identity machines pin for this tag (releaseverify:
          # this workflow at refs/tags/<tag>), never a regular expression (story 35.15)
          notes="$(cd tools/release && go run ./cmd/release-notes --tag "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --linux-payload-missing "${LINUX_PAYLOAD_MISSING:-}")"
          # The guard opened the release as a draft; the notes go on it (a published
          # release keeps its own). The files are attached (a published release only gains
          # missing ones, and a re-run whose checksums.txt differs is refused), then the
          # release is published once complete: this signed set, and the apps that carry
          # the server in latest.json (desktop-release.yml); whichever workflow finishes
          # last publishes. It becomes the latest only as the highest stable version with
          # every desktop platform in its feed (never a pre-release or a maintenance one).
          NOTES="${notes}" tools/release/release-assets.sh ensure "${TAG}"
          tools/release/release-assets.sh upload "${TAG}" dist/*
          tools/release/release-assets.sh publish "${TAG}"
