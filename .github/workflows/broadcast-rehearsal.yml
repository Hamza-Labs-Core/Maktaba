# The broadcast rehearsal (Epic 50 story 50.29, docs/cloud-rehearsal.md "The broadcast
# rehearsal"): this commit's broadcast edge in Miniflare (several simulated locations, each with
# its own cache) and a home running the streaming service's broadcaster on a test pattern
# (tools/rehearsal-cloud/broadcast/compose.yml), watched by simulated viewers
# (tools/broadcast-viewers). No Cloudflare account, no DNS, no secret: the cloud's part is signed
# with its TEST key in the test.
#
# Jobs: unit (T01–T03 without Docker: the viewers, the verdict, the home's control port), images,
# one job per scenario with a body (the matrix is the catalog's, tools/broadcast-viewers/rehearsal/
# catalog.go), and broadcast-rehearsal, the verdict: every scenario's record in one report (the
# fan-out table, the latency percentiles), the unbuilt ones as expected failures. A pull request
# runs the short set (100 viewers, 60 s a step); the nightly run the full set (1,000 viewers,
# 300 s a step, the 24 h fast-clock and the Hetzner scenarios).

name: Broadcast rehearsal

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'web/packages/broadcast-edge/**'
      # the Stream fallback's signer, bundled into the edge
      - 'web/packages/tvsite/src/sign.ts'
      - 'cloud/internal/broadcast/**'
      - 'streaming/internal/broadcast/**'
      - 'api/internal/broadcast/**'
      - 'streaming/internal/relay/**'
      - 'streaming/cmd/rehearsal-broadcast-home/**'
      - 'streaming/go.mod'
      - 'streaming/go.sum'
      - 'tools/broadcast-viewers/**'
      - 'tools/rehearsal-cloud/broadcast/**'
      - '.github/workflows/broadcast-rehearsal.yml'
  push:
    branches: [main, 'release/**']
    paths-ignore: ['docs/claude-trail.md', 'docs/trail/**']
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC: the full set
  workflow_dispatch:
    inputs:
      set:
        description: "Which set to run"
        type: choice
        options: [pr, nightly]
        default: pr

permissions:
  contents: read

concurrency:
  group: broadcast-rehearsal-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SET: ${{ github.event_name == 'schedule' && 'nightly' || inputs.set || 'pr' }}

jobs:
  unit:
    name: unit (viewers, verdict, home)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.sets.outputs.matrix }}
      unbuilt: ${{ steps.sets.outputs.unbuilt }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/broadcast-viewers/go.mod
          # the viewers' module has no dependency (no go.sum); the home's tests are streaming's
          cache-dependency-path: streaming/go.sum
      - name: The viewers and the verdict (T01, T02)
        working-directory: tools/broadcast-viewers
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./... && go vet -tags broadcastrehearsal ./...
          go test -race -count=1 ./...
      - name: The rehearsal's home
        working-directory: streaming
        run: CGO_ENABLED=0 go test -count=1 ./cmd/rehearsal-broadcast-home/
      - name: The sets
        id: sets
        working-directory: tools/broadcast-viewers
        run: |
          echo "matrix=$(go run ./cmd/broadcast-report -matrix "$SET")" >> "$GITHUB_OUTPUT"
          echo "unbuilt=$(go run ./cmd/broadcast-report -unbuilt "$SET")" >> "$GITHUB_OUTPUT"

  images:
    name: images (this commit's edge and home)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build
        run: |
          docker build -f tools/rehearsal-cloud/broadcast/Dockerfile.edge -t maktaba-broadcast-edge:rehearsal .
          docker build -f tools/rehearsal-cloud/broadcast/Dockerfile.home -t maktaba-broadcast-home:rehearsal .
      - name: Save
        run: docker save maktaba-broadcast-edge:rehearsal maktaba-broadcast-home:rehearsal | gzip -1 > /tmp/broadcast-images.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: broadcast-images
          path: /tmp/broadcast-images.tar.gz
          retention-days: 1

  scenario:
    name: ${{ matrix.scenario }}
    needs: [unit, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.unit.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/broadcast-viewers/go.mod
          cache: false # the viewers' module has no dependency
      - name: Download broadcast-images
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: broadcast-images
          path: /tmp
      - name: Wait 20s to retry the download
        if: steps.dl.outcome == 'failure'
        run: sleep 20
      - name: Download broadcast-images (attempt 2)
        if: steps.dl.outcome == 'failure'
        uses: actions/download-artifact@v8.0.1
        with:
          name: broadcast-images
          path: /tmp
      - name: Load the images
        run: gunzip -c /tmp/broadcast-images.tar.gz | docker load
      - name: Run ${{ matrix.scenario }}
        env:
          REHEARSAL_OUT: ${{ runner.temp }}/broadcast
        working-directory: tools/broadcast-viewers
        run: |
          ulimit -n 65536 || true
          if [ "$SET" = nightly ]; then
            # the full fan-out (story 50.29 §2): 1 → 10 → 100 → 1,000 viewers, 5 minutes a step
            export BROADCAST_VIEWERS=1000 BROADCAST_STEP_SECONDS=300
          fi
          go test -tags broadcastrehearsal -run "TestBroadcast/${{ matrix.scenario }}$" -timeout 70m -v ./rehearsal/ 2>&1 | tee "${RUNNER_TEMP}/scenario.log"
          exit "${PIPESTATUS[0]}"
      # the stack's logs, the scenario's record and its test log, whether it passed or not
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: broadcast-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/broadcast
            ${{ runner.temp }}/scenario.log
          retention-days: 14

  broadcast-rehearsal:
    name: broadcast-rehearsal
    needs: [unit, images, scenario]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/broadcast-viewers/go.mod
          cache: false # the viewers' module has no dependency
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          pattern: broadcast-broadcast-*
          path: ${{ runner.temp }}/results
      # the scenarios without a body yet: their records (XFAIL, or a failure if one is not listed)
      - name: The unbuilt scenarios
        if: needs.unit.outputs.unbuilt != ''
        env:
          REHEARSAL_OUT: ${{ runner.temp }}/results/unbuilt
          PATTERN: ${{ needs.unit.outputs.unbuilt }}
        working-directory: tools/broadcast-viewers
        run: go test -tags broadcastrehearsal -run "$PATTERN" -count=1 -v ./rehearsal/
      - name: The verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
        working-directory: tools/broadcast-viewers
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          fail=0
          go run ./cmd/broadcast-report "${RUNNER_TEMP}/results" > "${RUNNER_TEMP}/report.md" || fail=1
          cat "${RUNNER_TEMP}/report.md" >> "$GITHUB_STEP_SUMMARY"
          for j in unit images scenario; do
            r="$(echo "$RESULTS" | jq -r ".\"$j\".result")"
            [ "$r" = success ] || { echo "::error::$j: $r"; fail=1; }
          done
          exit $fail
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: broadcast-report
          path: ${{ runner.temp }}/report.md
          retention-days: 30
