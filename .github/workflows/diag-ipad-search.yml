# DIAGNOSTIC ONLY (scratch branch diag/ipad-search-272, never merged): the iPad search field's
# refocus after a submitted search, on iPadOS 27.2 (the xcode-27 image).
name: diag ipad search 27.2

on:
  push:
    branches: ['diag/ipad-search-272']

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.variant }})
    runs-on: xcode-27
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [asis, edge]
    env:
      RESULTS: ${{ github.workspace }}/build/diag
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Select Xcode
        run: python3 tools/apple/xcode.py select --min 27
      - name: The results list without its top scroll edge effect
        if: matrix.variant == 'edge'
        run: |
          python3 - <<'PY'
          p = 'apps/apple/Player/Search/SearchScreen.swift'
          s = open(p).read()
          lines = s.split('\n')
          # the second `.listStyle(.plain)` is ResultsList's
          idx = [i for i, l in enumerate(lines) if l.strip() == '.listStyle(.plain)']
          assert len(idx) == 2, idx
          i = idx[1]
          lines.insert(i + 1, lines[i].replace('.listStyle(.plain)', '.scrollEdgeEffectHidden(true, for: .top)'))
          open(p, 'w').write('\n'.join(lines))
          PY
          git diff
      - name: Make, boot and settle the iPad simulator (as _apple-apps.yml)
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS"
          xcrun simctl list runtimes
          udid=$(python3 tools/apple/xcode.py simulator ipad "diag-${GITHUB_RUN_ID}-${{ matrix.variant }}")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl ui "$udid" appearance dark
          for key in KeyboardAutocorrection KeyboardPrediction KeyboardShowPredictionBar KeyboardCheckSpelling \
                     KeyboardAutocapitalization KeyboardContinuousPathEnabled; do
            xcrun simctl spawn "$udid" defaults write com.apple.Preferences "$key" -bool false
          done
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences AutomaticMinimizationEnabled -bool false
          # what the simulator says about keyboards
          xcrun simctl spawn "$udid" defaults read com.apple.Preferences 2>/dev/null | grep -i -E 'keyboard|hardware' || true
          python3 tools/apple/sim-settle.py "$udid" "$RESULTS/settle.log" --max 480
      - name: Run the tests
        working-directory: apps/apple
        run: |
          set -uo pipefail
          tests=(testDiagRefocusNoResults testDiagRefocusAfterClear testATitleTappedWhileRefiningLetsTheKeyboardGoAndOpensItsPage)
          if [ "${{ matrix.variant }}" = edge ]; then tests=(testDiagRefocusAfterSubmit testATitleTappedWhileRefiningLetsTheKeyboardGoAndOpensItsPage); fi
          for t in "${tests[@]}"; do
            xcodebuild test -project Maktaba.xcodeproj -scheme "Maktaba Player iPad" -destination "id=$UDID" \
              -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath "$RESULTS/$t.xcresult" \
              -only-testing "Maktaba Player iPad UITests/PlayerSearchUITests/$t" > "$RESULTS/$t.log" 2>&1 && st=0 || st=$?
            echo "$t: exit $st"
            grep -E 'Test Case .*(passed|failed)|error: -\[' "$RESULTS/$t.log" | cut -c1-300 || true
          done
      - name: Delete the simulator
        if: always() && env.UDID != ''
        run: |
          xcrun simctl spawn "$UDID" log show --style compact --info --last 15m \
            --predicate 'subsystem BEGINSWITH "com.hamzalabs.maktaba" OR process == "TextInput" OR eventMessage CONTAINS[c] "keyboard"' > "$RESULTS/sim.log" 2>/dev/null || true
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: diag-${{ matrix.variant }}
          path: build/diag
          retention-days: 5
