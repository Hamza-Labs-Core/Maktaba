# The Sigstore trusted root every Maktaba machine verifies releases with is compiled into
# shared/go/releaseverify (trusted_root.json, refreshed through Sigstore's TUF repository by
# its `go generate`). A release build refuses a root older than 90 days, and nothing
# refreshed it: the root embedded on 2026-10-19 would have failed every release from
# 2027-01-17. Every week this refreshes it and, when the root changed or the embedded one is
# 45 days old (well before CI's 60-day warning: tools/release/trusted-root-age.sh), opens a
# pull request with the new files.
#
# A pull request opened with GITHUB_TOKEN starts no CI run by itself (GitHub's rule): set
# the MAKTABA_BOT_TOKEN secret (a token with contents and pull-requests write) to have CI
# run on it, or push an empty commit to its branch.

name: Sigstore trusted root

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-root
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: shared/go/releaseverify/go.mod
          cache-dependency-path: shared/go/releaseverify/go.sum

      - name: How old is the embedded root
        id: age
        run: |
          set -euo pipefail
          tools/release/trusted-root-age.sh || true
          fetched="$(sed -n 's/.*"fetched_at": *"\([^"]*\)".*/\1/p' shared/go/releaseverify/trusted_root.meta.json)"
          echo "days=$(( ($(date -u +%s) - $(date -u -d "${fetched}" +%s)) / 86400 ))" >>"$GITHUB_OUTPUT"

      - name: Refresh it from Sigstore's TUF repository
        working-directory: shared/go/releaseverify
        run: go generate ./...

      - name: The pipeline's copy follows it
        # a worker-only machine verifies the release it converts to with sigstore-python
        # (story 35.8 AC8), against the same root
        run: cp shared/go/releaseverify/trusted_root.json pipeline/src/maktaba_pipeline/cluster/agent/sigstore_trusted_root.json

      - name: The refreshed root verifies a release as the old one did
        working-directory: shared/go/releaseverify
        run: go test -count=1 ./...

      - name: Open a pull request when it changed, or is getting old
        env:
          GH_TOKEN: ${{ secrets.MAKTABA_BOT_TOKEN || github.token }}
          DAYS: ${{ steps.age.outputs.days }}
        run: |
          set -euo pipefail
          if git diff --quiet -- shared/go/releaseverify/trusted_root.json && [ "${DAYS}" -lt 45 ]; then
            echo "the trusted root is unchanged and ${DAYS} days old: nothing to do"
            exit 0
          fi
          branch="trusted-root/$(date -u +%Y-%m-%d)"
          if gh pr list --state open --search "head:trusted-root/" --json number --jq '.[].number' | grep -q .; then
            echo "a trusted-root pull request is open already"
            exit 0
          fi
          git config user.name "maktaba-release-bot"
          git config user.email "maktaba@hamzalabs.dev"
          git checkout -b "${branch}"
          git add shared/go/releaseverify/trusted_root.json shared/go/releaseverify/trusted_root.meta.json \
            pipeline/src/maktaba_pipeline/cluster/agent/sigstore_trusted_root.json
          git commit -m "chore(releaseverify): refresh the embedded Sigstore trusted root"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "chore(releaseverify): refresh the embedded Sigstore trusted root" \
            --body "The weekly refresh of the Sigstore trusted root compiled into releaseverify (\`go generate\` in shared/go/releaseverify, through Sigstore's TUF repository). Release builds refuse a root older than 90 days; the embedded one was ${DAYS} days old. Merge it before then."
