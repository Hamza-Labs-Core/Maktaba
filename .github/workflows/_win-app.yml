# Reusable Windows app gate (Epic 38, story 38.11): on windows-latest, build the server
# payload (Go binaries with the web UI, pinned Postgres / ffmpeg / Python checked against
# tools/release/win-app/pins.env, the Visual C++ runtime, the pipeline wheel + constraints),
# bundle it with Maktaba.exe into the NSIS installer with tauri, and smoke-test both
# (tools/release/win-app/check.sh): every program starts, every PE file is x86_64 and loads
# nothing from outside the payload but Windows, NVENC, Postgres initdb/start/extensions on
# the payload's runtime, an offline venv, nothing written into the payload, the launcher's
# app-bundle mode, and a silent install + uninstall that leaves the state beside it alone.
# Unsigned: Authenticode signing is deferred (tools/release/win-app/README.md).

name: Windows app

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scripts:
    # shellcheck is not on the Windows image; the scripts and payload_tool.py's tests are
    # checked here
    name: Windows app scripts (shellcheck, payload_tool)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - name: shellcheck
        run: |
          shellcheck --version | sed -n 1,2p
          shellcheck -x tools/release/win-app/payload.sh tools/release/win-app/check.sh \
            tools/release/win-app/build-app.sh tools/release/win-app/test-hooks.sh \
            deploy/packaging/node/build-release.sh

      - name: payload_tool.py tests
        run: python3 tools/release/win-app/test_payload_tool.py -v

  win-app:
    name: Windows app (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2

      # The server agent starts an ordered release's installer (agent_orders.rs), which stops
      # the agent and then runs its sign-in task again: a task's child must outlive the task's
      # process, and the task must run again meanwhile. A throwaway task on this runner.
      - name: A task's child outlives it, and the task runs again meanwhile
        shell: pwsh
        run: ./tools/release/win-app/check-task-children.ps1

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api streaming cmd/maktaba-server cmd/maktaba-launcher cloud

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # the constraints name PyTorch's index: uv export --emit-index-url needs uv 0.12+
          # (build-release.sh checks), and one uv version writes them the same every run
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          # restore main's uv cache; only a push to main saves it
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      # restore only: main's entries (.github/actions/node-cache); only a push to main saves
      - name: pnpm store
        id: pnpm-cache
        uses: ./.github/actions/node-cache
        with:
          package-manager: pnpm
          lock-hash: ${{ hashFiles('web/pnpm-lock.yaml', 'apps/desktop/pnpm-lock.yaml') }}

      - name: Install web + desktop deps
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C apps/desktop install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # pull requests and tags restore main's build; only a push to main saves
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # every pinned download (~180 MB) in one cache, keyed on the runner's OS and arch and on
      # pins.env, so a pin bump misses; an earlier pins.env's entry is restored as a start
      # (every file is checked against its pin, only what changed downloads). Saved on a miss
      # on any ref: main's serves every pull request, a pull request's its own reruns.
      - id: downloads-cache
        uses: actions/cache/restore@v4
        with:
          # a cancelled download's .part is never kept
          path: |
            build/win-app/downloads
            !build/win-app/downloads/*.part
          key: win-app-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/release/win-app/pins.env') }}
          restore-keys: win-app-downloads-${{ runner.os }}-${{ runner.arch }}-

      # on a miss, every piece payload.sh downloads, under payload.sh's names in its download
      # folder, checked and retried by tools/release/fetch-pinned.sh, which payload.sh's fetch
      # uses as well; files no pin names any more are dropped. payload.sh then checks each
      # and downloads none.
      - name: The pinned downloads, retried
        id: prefetch
        if: steps.downloads-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . tools/release/win-app/pins.env
          f=tools/release/fetch-pinned.sh d=build/win-app/downloads
          $f "$PYTHON_URL" "$PYTHON_SHA256" "$d/cpython-$PYTHON_VERSION.tar.gz"
          $f "$POSTGRES_URL" "$POSTGRES_SHA256" "$d/postgresql-$POSTGRES_VERSION.zip"
          $f "$PGVECTOR_URL" "$PGVECTOR_SHA256" "$d/pgvector-$PGVECTOR_VERSION.tar.gz"
          $f "$FFMPEG_URL" "$FFMPEG_SHA256" "$d/ffmpeg-$FFMPEG_VERSION.zip"
          keep=" cpython-$PYTHON_VERSION.tar.gz postgresql-$POSTGRES_VERSION.zip pgvector-$PGVECTOR_VERSION.tar.gz ffmpeg-$FFMPEG_VERSION.zip "
          for x in "$d"/*; do
            case "$keep" in *" ${x##*/} "*) ;; *) echo "dropping ${x##*/} (no pin names it)"; rm -rf "$x" ;; esac
          done
          echo complete=true >>"$GITHUB_OUTPUT"

      # saved when a download failed too: fetch-pinned.sh moves a file in only once its SHA-256
      # is the pin's, so every file here is good. A failed prefetch saved nothing before, and
      # main's run never got an entry (2026-11-08: pgvector's archive 504'd after the others
      # had downloaded). A complete folder goes under the pins' key; a partial one under that
      # key and -partial-<run>, which the exact key never matches and restore-keys finds, so
      # the next run downloads only what is missing.
      - name: Save the pinned downloads
        if: always() && (steps.prefetch.outcome == 'success' || steps.prefetch.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          # a cancelled download's .part is never kept
          path: |
            build/win-app/downloads
            !build/win-app/downloads/*.part
          key: win-app-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/release/win-app/pins.env') }}${{ steps.prefetch.outputs.complete != 'true' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}

      # tauri's NSIS bundler downloads its toolset from GitHub releases with no retry (a 504
      # failed this job): the two files tauri-cli 2.12.3 pins (nsis/mod.rs: NSIS_URL and
      # NSIS_TAURI_UTILS_URL, checked there by SHA-1 DB14F8AF... and 75197FEE...), here by
      # SHA-256, cached, retried, and laid out in %LOCALAPPDATA%\tauri\NSIS as the bundler
      # lays them out, so it finds every file with its hash and downloads nothing. A tauri
      # that pins others finds NSIS.exe's hash changed and downloads its own, as before.
      - id: nsis-pin
        env:
          NSIS_URL: https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip
          NSIS_SHA256: ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8
          UTILS_URL: https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll
          UTILS_SHA256: 5ba143b5db4a87d32d6e7802e033330aae56cbceabe0d1e3ba41948385ad4709
        run: |
          {
            echo "key=$(tools/release/fetch-pinned.sh --key "$NSIS_URL" "$NSIS_SHA256")-utils-0.5.3-${UTILS_SHA256:0:16}"
            echo "nsis_url=$NSIS_URL"
            echo "nsis_sha256=$NSIS_SHA256"
            echo "utils_url=$UTILS_URL"
            echo "utils_sha256=$UTILS_SHA256"
          } >>"$GITHUB_OUTPUT"
      - id: nsis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ci-pinned/nsis
          key: ${{ steps.nsis-pin.outputs.key }}
      - name: tauri's NSIS toolset, retried
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NSIS_URL: ${{ steps.nsis-pin.outputs.nsis_url }}
          NSIS_SHA256: ${{ steps.nsis-pin.outputs.nsis_sha256 }}
          UTILS_URL: ${{ steps.nsis-pin.outputs.utils_url }}
          UTILS_SHA256: ${{ steps.nsis-pin.outputs.utils_sha256 }}
        run: |
          set -euo pipefail
          d=build/ci-pinned/nsis
          zip="$(tools/release/fetch-pinned.sh "$NSIS_URL" "$NSIS_SHA256" "$d/nsis-3.13.zip")"
          dll="$(tools/release/fetch-pinned.sh "$UTILS_URL" "$UTILS_SHA256" "$d/nsis_tauri_utils.dll")"
          tools="$(cygpath -u "$LOCALAPPDATA")/tauri"
          if [ -e "$tools/NSIS" ]; then
            echo "tauri's NSIS is already in $tools/NSIS: tauri checks it"
          else
            mkdir -p "$tools"
            unzip -q "$zip" -d "$tools"
            mv "$tools/nsis-3.13" "$tools/NSIS"
            mkdir -p "$tools/NSIS/Plugins/x86-unicode/additional"
            cp "$dll" "$tools/NSIS/Plugins/x86-unicode/additional/nsis_tauri_utils.dll"
            echo "tauri's NSIS laid out in $tools/NSIS"
          fi
      - name: Save tauri's NSIS toolset
        if: steps.nsis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ci-pinned/nsis
          key: ${{ steps.nsis-pin.outputs.key }}

      # make is MinGW's (C:\mingw64\bin) on the image; payload.sh builds the Go binaries with it,
      # and pgvector with the image's Visual C++ (vcvars64, nmake). Here a pgvector that does
      # not build fails the gate; a release (desktop-release) ships without it instead.
      - name: Build the Windows app with the payload, and check it
        env:
          VERSION: v0.0.0-ci.${{ github.run_number }}
          # the pinned downloads go by the GitHub API first (tools/release/fetch-pinned.sh)
          GITHUB_TOKEN: ${{ github.token }}
          WIN_APP_REQUIRE_PGVECTOR: "1"
        run: make win-app

      - name: Sizes
        if: always()
        run: |
          {
            echo "### Windows app (x86_64, NSIS, unsigned)"
            echo '```'
            du -sh build/win-app/server/* 2>/dev/null || true
            du -sh build/win-app/server apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # this job writes its runner's one Go cache entry (.github/actions/go-cache), every
      # module of the checkout in it first; only a push to main writes it
      - name: Every module in the Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/go-cache-fill.sh
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

      - name: Save the pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.key != '' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.key }}
