# Maktaba desktop client packaging (client-packaging epic) — Tauri 2.
#
# Triggered on `v*` tags. Builds the desktop installers for all three
# desktop OSes on their native runners (Tauri does NOT cross-compile the
# native shell) and attaches them to the GitHub Release for that tag:
#
#   macOS     →  .dmg, two of them:
#                 arm64  — Maktaba.app WITH the server inside (Epic 36, story 36.7):
#                          Contents/Resources/server built by tools/release/mac-app/
#                          payload.sh (Go binaries, Postgres, ffmpeg, Python, the
#                          pipeline wheel), macOS 15+
#                 (no Intel Mac build since v0.3.15: Apple silicon only)
#   Windows   →  the NSIS -setup.exe WITH the server inside (Epic 38, story 38.11):
#                <install>\server built by tools/release/win-app/payload.sh (the same
#                pieces, x86_64, plus the Visual C++ runtime), a current-user install in
#                %LOCALAPPDATA%\Maktaba whose hooks stop / start the server around it.
#                No .msi: Windows Installer's per-machine install in Program Files cannot
#                hold a per-user server. A client from an earlier .msi (a WiX install of the
#                same name and publisher): an interactive or passive (/P, the updater's) run
#                of the installer removes it with its msiexec uninstall, which asks for an
#                administrator; a silent run (/S) shows no pages and leaves it beside the new
#                per-user app. Plus a portable .zip of the raw exe (the client).
#   Linux     →  .AppImage + .deb + .rpm, x86_64 and aarch64, each WITH the server inside
#                (Epic 39): usr/share/maktaba/server built by tools/release/linux-app/payload.sh
#                (no ffmpeg: the distribution's; the .deb and the .rpm depend on it)
#
# THE PLAYERS (Epic 42.4)
# -----------------------
# Maktaba Player for Windows and Linux (apps/desktop-player, Compose for Desktop): the
# `player` legs build Maktaba-Player_<v>_x64.msi (a current-user install), and
# maktaba-player_<v>_<amd64|arm64>.deb + maktaba-player-<v>.<x86_64|aarch64>.rpm, each with
# its own Java runtime. They are signed with the same updater key as the server apps
# (`tauri signer sign --app-version`: the version is in the signed trusted comment) and get
# their own feed, latest-player.json (updater-feed --family player), whose platform keys
# (windows-x86_64-player, linux-x86_64-player-deb, ...) no server app reads, so a player
# never takes a server bundle nor the other way round. (The Mac's player is the Apple app,
# apps/apple.) A release is marked the latest only once both feeds have every platform.
#
# NOTHING IS PUBLIC BEFORE IT IS CHECKED
# --------------------------------------
# The tag-order guard runs first (_tag-guard.yml). Each leg builds (`tauri build`:
# signing, notarization, the updater signatures) and checks its bundles, then hands the
# checked files to the `publish` job as an artifact. `publish` runs once, after every
# leg: it attaches the files to the tag's release (a draft until it is complete) and only
# then writes latest.json, the updater feed, over all of them
# (tools/release/cmd/updater-feed). A leg that fails attaches nothing, so no updater is
# ever pointed at a bundle that failed its checks. The release is published once
# release.yml's signed files and the apps that carry the server are in (whichever
# workflow finishes last publishes: tools/release/release-assets.sh).
#
# WEB FRONTEND
# ------------
# All three wrap the SAME `web/dist` SPA bundle. The repo has no pnpm
# workspace, so the config's `beforeBuildCommand` (`pnpm --filter
# maktaba-web build`) cannot resolve in CI. We therefore build `web/dist`
# ourselves in a step and then blank `build.beforeBuildCommand` in
# `tauri.conf.json` in place (a tiny cross-platform Node rewrite) so
# `tauri build` just bundles the already-built frontend. (We rewrite the
# file rather than pass `--config '{...}'` because tauri-action's arg
# splitter mangles the JSON's quotes.)
#
# CODE SIGNING
# ------------
# macOS signs and notarizes when the Apple secrets are set; without them the
# build is UNSIGNED and still green (a local-style app: right-click > Open).
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  its export password
#   APPLE_SIGNING_IDENTITY      optional, e.g. "Developer ID Application: Hamza Labs (TEAMID)"
#                               (default: the identity found in the certificate)
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarization (an app-specific password), or
#   APPLE_API_KEY_P8 / APPLE_API_KEY_ID / APPLE_API_ISSUER   an App Store Connect API key
# Every Mach-O in the server payload is signed by payload.sh (hardened runtime,
# timestamp; python3 with tools/release/mac-app/entitlements/python.plist), then
# tauri signs + notarizes + staples the app, then the .dmg is notarized and
# stapled here before it is staged for the publish job.
# Windows (WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD, Authenticode)
# stays deferred: the owner's decision (tools/release/win-app/README.md, Signing).
# The updater key: TAURI_SIGNING_PRIVATE_KEY(_PASSWORD).
name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One run per tag at a time, never cancelled.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    uses: ./.github/workflows/_tag-guard.yml
    permissions:
      contents: write
      actions: read

  desktop:
    name: desktop (${{ matrix.label }})
    needs: [guard]
    # builds and checks only; the publish job attaches what passed
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: the server payload rides in Contents/Resources/server
          # (the overlay payload.sh writes adds it as a resource). `payload` names
          # the tools/release/<payload>/ directory that builds it.
          - label: macos-arm64
            os: macos-15
            rust-targets: aarch64-apple-darwin
            payload: mac-app
            args: '--target aarch64-apple-darwin --bundles app,dmg --config ../../build/mac-app/tauri.mac-app.conf.json'
          # Windows x86_64: the server payload in <install>\server (the overlay adds
          # it as a resource, with the NSIS installer's hooks).
          - label: windows
            os: windows-latest
            rust-targets: ''
            payload: win-app
            args: '--bundles nsis --config ../../build/win-app/tauri.win-app.conf.json'
          # Linux: the server payload rides in usr/share/maktaba/server (the overlay
          # linux-app/payload.sh writes maps it into each bundle), Epic 39. linux-app/bundle.sh
          # makes the AppImage, the .deb and the .rpm (a pre-release's packages carry their
          # own versions: two passes), so no --bundles here.
          - label: linux-x86_64
            os: ubuntu-22.04
            rust-targets: ''
            linux_payload: true
            args: '--config ../../build/linux-app/tauri.linux-app.conf.json'
          - label: linux-aarch64
            os: ubuntu-22.04-arm
            rust-targets: ''
            linux_payload: true
            args: '--config ../../build/linux-app/tauri.linux-app.conf.json'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPLE_SIGN: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE != '' }}
      MAC_CODESIGN: ${{ secrets.MAC_CODESIGN_P12 != '' }}
      # notarized with either credential: the Apple ID trio (an app-specific password) or an
      # App Store Connect API key (APPLE_API_KEY_P8, the .p8's text; its key id; the issuer)
      APPLE_NOTARIZE: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE != '' && ((secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '') || (secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '')) }}
    steps:
      - uses: actions/checkout@v6.0.2

      # Linux GUI build deps for Tauri 2 (webkit2gtk 4.1, appindicator,
      # rsvg, patchelf for AppImage). No-op on macOS/Windows.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip libarchive-tools rpm \
            ffmpeg

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Build the shared web bundle that the Tauri shell wraps. Cross-OS
      # safe (no `make`, which is absent on the Windows runner): install,
      # generate design tokens, then `vite build` → web/dist.
      - name: Build web bundle
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          node design-system/build/build-tokens.mjs
          pnpm build

      - uses: actions/setup-go@v6.4.0
        if: matrix.payload || matrix.linux_payload
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cmd/maktaba-server/go.sum
            cmd/maktaba-launcher/go.sum

      - uses: astral-sh/setup-uv@v8.1.0
        if: matrix.payload || matrix.linux_payload
        with:
          # the constraints name PyTorch's index: uv export --emit-index-url needs uv 0.12+
          # (build-release.sh checks), and one uv version writes them the same every run
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/cache@v4
        if: matrix.payload
        with:
          path: build/${{ matrix.payload }}/downloads
          key: ${{ matrix.payload }}-downloads-${{ hashFiles(format('tools/release/{0}/pins.env', matrix.payload)) }}

      - uses: actions/cache@v4
        if: matrix.linux_payload
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ runner.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}

      # The Developer ID certificate in a throwaway keychain; its identity is
      # what payload.sh and tauri sign with. Imported after the
      # third-party setup actions, so none of them runs with it unlocked.
      - name: Import the Developer ID certificate
        if: env.APPLE_SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(openssl rand -hex 16)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          # the new keychain first, the existing ones kept (one path per word)
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          fi
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >>"$GITHUB_ENV"

      # Without the Apple secrets: Maktaba's own code-signing certificate (self-signed), so
      # the app keeps one identity across updates and macOS keeps its privacy grants
      # (payload.sh, MAKTABA_MAC_SIGN_IDENTITY). Ad hoc only when this is missing too.
      - name: Import Maktaba's code-signing certificate
        if: startsWith(matrix.os, 'macos') && env.APPLE_SIGN != 'true' && env.MAC_CODESIGN == 'true'
        env:
          MAC_CODESIGN_P12: ${{ secrets.MAC_CODESIGN_P12 }}
          MAC_CODESIGN_P12_PASSWORD: ${{ secrets.MAC_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/maktaba-signing.keychain-db"
          kcpw="$(openssl rand -hex 16)"
          printf '%s' "$MAC_CODESIGN_P12" | base64 --decode >"$RUNNER_TEMP/maktaba.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/maktaba.p12" -k "$kc" -P "$MAC_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/maktaba.p12"
          echo "MAKTABA_MAC_SIGN_IDENTITY=Maktaba Code Signing" >>"$GITHUB_ENV"

      # Epic 16: the license-server public key over the placeholder before any
      # build (tools/release/license-key.sh); a release without it fails.
      - name: Embed the license-server key
        shell: bash
        env:
          MAKTABA_LICENSE_PUBKEY: ${{ vars.MAKTABA_LICENSE_PUBKEY }}
        run: tools/release/license-key.sh --require

      # The server payload (on a Mac signed when the identity is there) and the
      # tauri overlay that bundles it, then a smoke test of the payload alone.
      # Git Bash on Windows (make is MinGW's there).
      - name: Build the server payload
        if: matrix.payload
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          PAYLOAD: ${{ matrix.payload }}
        run: |
          set -euo pipefail
          "tools/release/$PAYLOAD/payload.sh" --version "$VERSION"
          "tools/release/$PAYLOAD/check.sh"

      # The Linux server payload for this runner's architecture and the overlay
      # that maps it into the AppImage, the .deb and the .rpm (Epic 39).
      - name: Build the Linux server payload
        if: matrix.linux_payload
        env:
          VERSION: ${{ github.ref_name }}
        run: tools/release/linux-app/payload.sh --version "$VERSION"

      - name: Install desktop deps (Tauri CLI + API bindings)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Blank `beforeBuildCommand` so `tauri build` does NOT try to rebuild
      # the frontend via the workspace-`--filter` command (no workspace in
      # CI). web/dist was already built above. Cross-platform (bash on the
      # Windows runner is git-bash; Node is on PATH from setup-node).
      # Blank beforeBuildCommand (no workspace in CI) AND stamp the
      # product version from the pushed tag (Story 28.1): the Tauri
      # updater compares the app's own version against latest.json, so a
      # hardcoded "0.1.0" would mis-compare. Strip the leading "v".
      # WiX only takes a numeric major.minor.patch[.build], and the bundler
      # rejects a pre-release such as 0.3.0-rc.1 for the msi target, so a
      # pre-release tag gives the MSI its numeric core (0.3.0). NSIS drops
      # the suffix itself. Windows Installer then treats the rc and the
      # final 0.3.0 MSI as the same version; Tauri's template allows that
      # upgrade. Linux's packages take their own forms of a pre-release
      # (the .deb 0.3.0~rc.1, the .rpm 0.3.0 release 0.1.rc.1), in
      # tools/release/linux-app/bundle.sh.
      # The updater (Epic 36 story 36.8, Epic 38/39): with the signing key
      # secret, the bundles get updater artifacts (.app.tar.gz, -setup.exe,
      # .AppImage, .deb, .rpm, each with its .sig), and the publish job writes
      # latest.json from them once every leg is attached (updater-feed: one key
      # per platform and bundle type, linux-x86_64-deb, ...); the app checks them
      # against the public key in the repository
      # variable TAURI_UPDATER_PUBKEY, stamped into tauri.conf.json here. A
      # key without its public half fails the build (the apps could never
      # verify an update); no key builds as before, without updater artifacts.
      - name: Neutralise in-config frontend rebuild + stamp version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          node -e "
            const fs = require('fs');
            const f = 'apps/desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.build.beforeBuildCommand = '';
            const v = (process.env.TAG || '').replace(/^v/, '');
            if (v) c.version = v;
            const core = v.split(/[-+]/)[0];
            if (core !== v) c.bundle.windows.wix.version = core;
            if (process.env.UPDATER_KEY === 'true') {
              const pub = (process.env.UPDATER_PUBKEY || '').trim();
              if (!pub) {
                console.log('::error::TAURI_SIGNING_PRIVATE_KEY is set but the repository variable TAURI_UPDATER_PUBKEY is not: the apps could not verify their updates');
                process.exit(1);
              }
              c.bundle.createUpdaterArtifacts = true;
              c.plugins.updater.pubkey = pub;
            } else {
              console.log('::notice::no TAURI_SIGNING_PRIVATE_KEY: bundles without updater artifacts (no latest.json)');
            }
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
            console.log('version=' + c.version + ' wix.version=' + (c.bundle.windows.wix.version || '(from version)') +
              ' updater=' + (c.bundle.createUpdaterArtifacts === true));
          "

      # `tauri build`, nothing published: it signs each updater bundle (.sig) when
      # the signing key secret is present (Story 28.4). A fork without
      # TAURI_SIGNING_* still produces UNSIGNED installers and no updater
      # signatures — the secrets resolve empty, so the build stays green
      # (matching the deferred Apple/Windows cert posture).
      - name: Build the Tauri bundles
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri signs with the imported identity (none: ad hoc, the overlay's "-") and,
          # with the Apple ID trio, notarizes and staples the .app. Without the secrets
          # these are set but empty, which tauri takes as a request to notarize (and fails:
          # "Team ID must be at least 3 characters", v0.3.0-rc.7 and v0.3.1). Only the Mac
          # legs notarize, and they build through tools/release/mac-app/tauri-build.sh, the
          # one place that decides: it unsets them unless the app can be notarized (a
          # Developer ID and a complete set). CI's mac-app gate builds through it with these
          # same empty values, and tauri-build-check.sh dry-runs it. (This replaces #277's
          # unset of the empty trio in this step: the same case, now covered and tested.)
          APPLE_ID: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # or an App Store Connect API key (tauri-build.sh takes either set)
          APPLE_API_KEY_P8: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_API_ISSUER || '' }}
          ARGS: ${{ matrix.args }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ARGS is a list of words (the targets, the bundles, the payload overlay)
          read -r -a words <<<"$ARGS"
          if [ "$RUNNER_OS" = Linux ]; then
            # the AppImage, the .deb and the .rpm at the tag's version (a pre-release's
            # packages in their own forms, the app still the tag's semver)
            ../../tools/release/linux-app/bundle.sh "$TAG" "${words[@]}"
          elif [ "$RUNNER_OS" = macOS ]; then
            # the API key's .p8 as a file for tauri (APPLE_API_KEY_PATH)
            if [ -n "${APPLE_API_KEY_P8:-}" ]; then
              printf '%s\n' "$APPLE_API_KEY_P8" >"$RUNNER_TEMP/notary-key.p8"
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
            fi
            unset APPLE_API_KEY_P8
            ../../tools/release/mac-app/tauri-build.sh "${words[@]}"
          else
            pnpm tauri build "${words[@]}"
          fi

      - name: Check the app bundle
        if: matrix.payload == 'mac-app'
        run: |
          set -euo pipefail
          app=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Maktaba.app
          if [ "$APPLE_NOTARIZE" = true ]; then
            # its ticket stapled (again, with retries), so Gatekeeper judges it offline
            tools/release/mac-app/staple.sh "$app"
            tools/release/mac-app/check.sh --app "$app" --notarized
          elif [ "$APPLE_SIGN" = true ]; then
            tools/release/mac-app/check.sh --app "$app" --signed
          else
            tools/release/mac-app/check.sh --app "$app"
          fi
          du -sh "$app" apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      # Each bundle's payload installs the way the app installs it (every file
      # checked), and the copy passes the payload smoke test.
      - name: Check the Linux bundles
        if: matrix.linux_payload
        run: |
          set -euo pipefail
          b=apps/desktop/src-tauri/target/release/bundle
          tools/release/linux-app/check-app.sh "$b"/appimage/*.AppImage "$b"/deb/*.deb "$b"/rpm/*.rpm
          du -sh "$b"/appimage/*.AppImage "$b"/deb/*.deb "$b"/rpm/*.rpm

      # A silent install of the installer tauri built into a temporary
      # folder (with a state already there), the checks on the installed payload,
      # then a silent uninstall that must leave that state alone. It takes about
      # 2 minutes; twice (v0.3.27, v0.3.32) it hung until GitHub lost the runner,
      # which keeps no log. Ended at 15 minutes, a hang fails here with its log.
      - name: Check the Windows installer
        if: matrix.payload == 'win-app'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          setup=(apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          [ "${#setup[@]}" -eq 1 ] && [ -f "${setup[0]}" ] || { echo "::error::expected one NSIS installer, got: ${setup[*]}"; exit 1; }
          tools/release/win-app/check.sh --installer "${setup[0]}"
          du -sh build/win-app/server "${setup[0]}"

      # tauri notarizes the .app inside the .dmg; the .dmg itself is notarized
      # and stapled here (so it opens offline without a Gatekeeper prompt),
      # before it is staged.
      - name: Notarize + staple the .dmg
        if: env.APPLE_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TARGET: ${{ matrix.rust-targets }}
        run: |
          set -euo pipefail
          # the Apple ID trio when it is set, else the API key
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          else
            printf '%s\n' "$APPLE_API_KEY_P8" >"$RUNNER_TEMP/notary-key.p8"
            auth=(--key "$RUNNER_TEMP/notary-key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER")
          fi
          for dmg in apps/desktop/src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg; do
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 60m
            # stapling fetches the ticket from Apple's CloudKit; a dropped connection there
            # failed whole releases (v0.3.10, v0.3.14: "The network connection was lost",
            # error 68), so it is retried (the same script staples the .app above)
            tools/release/mac-app/staple.sh "$dmg"
          done

      # Windows "portable" deliverable: zip the raw built executable so
      # users who can't run an installer get a self-contained .zip. Runs
      # only on the Windows leg. The Tauri CLI renames the built exe to
      # tauri.conf.json's mainBinaryName (Maktaba.exe); without one it keeps
      # the Cargo [[bin]] name. Both are read here rather than hard-coded.
      - name: Package Windows portable .zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^v', ''
          $src = 'apps/desktop/src-tauri'
          $name = (Get-Content "$src/tauri.conf.json" -Raw | ConvertFrom-Json).mainBinaryName
          if (-not $name) {
            $meta = cargo metadata --no-deps --format-version 1 --manifest-path "$src/Cargo.toml" | ConvertFrom-Json
            $name = ($meta.packages[0].targets | Where-Object { $_.kind -contains 'bin' } | Select-Object -First 1).name
          }
          $exe = Get-Item -LiteralPath "$src/target/release/$name.exe" -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "$name.exe not found under $src/target/release — did the Tauri build succeed?"
          }
          New-Item -ItemType Directory -Force -Path out/release | Out-Null
          $zip = "out/release/maktaba-windows-portable-$version.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force

      # This leg's checked files for the publish job: the bundles as tauri names
      # them, with their updater signatures (.sig). The macOS updater archive is
      # Maktaba.app.tar.gz on both architectures, so it takes the .dmg's version and
      # architecture (Maktaba_<v>_<aarch64|x64>.app.tar.gz).
      - name: Stage the checked bundles
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.rust-targets }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          v="${TAG#v}"
          b="apps/desktop/src-tauri/target/${TARGET:+$TARGET/}release/bundle"
          mkdir -p out/release
          case "$RUNNER_OS" in
            macOS)
              arch=x64
              [ "$TARGET" != aarch64-apple-darwin ] || arch=aarch64
              cp "$b"/dmg/*.dmg out/release/
              for f in "$b"/macos/*.app.tar.gz; do
                n="$(basename "$f" .app.tar.gz)_${v}_${arch}.app.tar.gz"
                cp "$f" "out/release/$n"
                [ ! -f "$f.sig" ] || cp "$f.sig" "out/release/$n.sig"
              done
              ;;
            Windows)
              cp "$b"/nsis/*-setup.exe "$b"/nsis/*-setup.exe.sig out/release/
              ;;
            Linux)
              cp "$b"/appimage/*.AppImage "$b"/appimage/*.AppImage.sig "$b"/deb/*.deb "$b"/deb/*.deb.sig \
                "$b"/rpm/*.rpm "$b"/rpm/*.rpm.sig out/release/
              ;;
          esac
          ls -l out/release

      - name: Hand them to the publish job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-${{ matrix.label }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 7

  # The desktop Player for Windows and Linux (Epic 42.4): build, check, name and sign; the
  # publish job attaches what passed and writes latest-player.json.
  player:
    name: player (${{ matrix.label }})
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            tasks: packageMsi
          - label: linux-x86_64
            os: ubuntu-22.04
            tasks: packageDeb packageRpm
          - label: linux-aarch64
            os: ubuntu-22.04-arm
            tasks: packageDeb packageRpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SIGN: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Gradle wrapper is Gradle's
        working-directory: apps/desktop-player
        run: |
          set -euo pipefail
          version=$(sed -n 's#.*/gradle-\(.*\)-bin.zip#\1#p' gradle/wrapper/gradle-wrapper.properties)
          want=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          got=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          [ "${want}" = "${got}" ] || { echo "::error::the Gradle wrapper jar is not Gradle's ${version}"; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Packaging tools (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm fakeroot

      # the version from the tag (the installers take its numeric core) and the apps' updater
      # key, against which the player checks its updates
      - name: Build and check the installers
        working-directory: apps/desktop-player
        env:
          TAG: ${{ github.ref_name }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          args=(-Pmaktaba.version="${TAG#v}")
          [ -z "${UPDATER_PUBKEY}" ] || args+=(-Pmaktaba.updaterPubkey="${UPDATER_PUBKEY}")
          ./gradlew --no-daemon --stacktrace :client:test test ${{ matrix.tasks }} "${args[@]}"
          out=build/compose/binaries/main
          if [ "$RUNNER_OS" = Linux ]; then
            # listed once (grep -q on a pipe ends it early, and tar's write then fails)
            files=$(dpkg-deb -c "$out"/deb/*.deb)
            grep -q '/bin/maktaba-player$' <<<"${files}"
            grep -q '/lib/runtime/' <<<"${files}"
            info=$(rpm -qip "$out"/rpm/*.rpm)
            grep -q '^Name *: maktaba-player' <<<"${info}"
          fi

      # Named as the feed's rules know them (tools/release/updaterfeed: playerRules).
      - name: Stage the checked installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          v="${TAG#v}"
          out=apps/desktop-player/build/compose/binaries/main
          mkdir -p out/player
          case "$RUNNER_OS" in
            Windows)
              cp "$out"/msi/*.msi "out/player/Maktaba-Player_${v}_x64.msi"
              ;;
            Linux)
              deb_arch=amd64 rpm_arch=x86_64
              [ "$(uname -m)" != aarch64 ] || { deb_arch=arm64; rpm_arch=aarch64; }
              cp "$out"/deb/*.deb "out/player/maktaba-player_${v}_${deb_arch}.deb"
              cp "$out"/rpm/*.rpm "out/player/maktaba-player-${v}.${rpm_arch}.rpm"
              ;;
          esac
          ls -l out/player

      - name: Set up pnpm
        if: ${{ env.SIGN == 'true' }}
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        if: ${{ env.SIGN == 'true' }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc

      # the same updater key and tool as the server apps' bundles; without the key the
      # installers are attached unsigned and no latest-player.json is written
      - name: Sign the installers for the updater
        env:
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::notice::no TAURI_SIGNING_PRIVATE_KEY: the players are not signed (no latest-player.json)"
            exit 0
          fi
          (cd apps/desktop && pnpm install --frozen-lockfile)
          for f in out/player/*; do
            (cd apps/desktop && pnpm exec tauri signer sign --app-version "${TAG#v}" "${GITHUB_WORKSPACE}/${f}")
          done
          ls -l out/player

      - name: Hand them to the publish job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: player-${{ matrix.label }}
          path: out/player/*
          if-no-files-found: error
          retention-days: 7

  # Only now is anything public: every leg's checked files are attached to the
  # tag's release, then latest.json is written once, over all of them (no two legs
  # race on it, and it is made from the files, not from a listing of the release).
  # Every signature is checked against the apps' key (TAURI_UPDATER_PUBKEY) first: a
  # rotation slip or a re-sign with the wrong key would strand every app silently.
  # A leg that failed staged nothing: the other platforms' files are attached and the
  # feed is written without it, but a plain tag becomes GitHub's "latest" (the release
  # every app's own feed follows, releases/latest/download/latest.json) only once the
  # feed has every desktop platform, and the job fails meanwhile. v0.3.1 went out as the
  # latest with no darwin-aarch64, and the Apple-silicon apps could take no update.
  # Recovery: `gh run rerun <this run> --failed` builds the failed leg again, and this
  # job writes the feed again from every leg's kept files and marks the release then.
  publish:
    name: publish the checked bundles
    needs: [guard, desktop, player]
    # not for a tag the guard refused (no leg ran)
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release (when release.yml has not yet) and attach to it
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/release/go.mod
          cache-dependency-path: tools/release/go.sum

      - name: Download the checked bundles
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          path: staged
          merge-multiple: true

      - name: Download the checked players
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: player-*
          path: staged-player
          merge-multiple: true

      - name: Attach them to the release, then write latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          REQUIRE_FEED: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
        run: |
          set -euo pipefail
          if [ ! -d staged ] || [ -z "$(ls -A staged)" ]; then
            echo "::error::no leg staged a bundle"
            exit 1
          fi
          # a published release keeps its own bundles and signatures: a re-run's are swapped
          # for them first, so the feed below names the signatures apps download (a full
          # re-run's new signatures made every app's update fail its check)
          tools/release/release-assets.sh adopt "$TAG" staged
          # release.yml's guard opened the release as a draft; a published release only
          # gains the bundles it lacks (a re-run of the failed legs after it was published)
          tools/release/release-assets.sh upload "$TAG" staged/*
          check=()
          [ -z "$UPDATER_PUBKEY" ] || check=(--pubkey "$UPDATER_PUBKEY")
          # exit 3: written, but a desktop platform is missing (a failed leg)
          feed=0
          (cd tools/release && go run ./cmd/updater-feed --dir ../../staged --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" --out ../../latest.json --require desktop "${check[@]}") || feed=$?
          [ "$feed" = 0 ] || [ "$feed" = 3 ] || exit "$feed"
          if [ -f latest.json ]; then
            cat latest.json
            # the feed may change on a published release, as late platforms land
            tools/release/release-assets.sh upload "$TAG" --replace latest.json latest.json
          fi
          # the players (Epic 42.4): their own files and feed, latest-player.json
          player_feed=0
          if [ -d staged-player ] && [ -n "$(ls -A staged-player)" ]; then
            tools/release/release-assets.sh adopt "$TAG" staged-player
            tools/release/release-assets.sh upload "$TAG" staged-player/*
            (cd tools/release && go run ./cmd/updater-feed --family player --dir ../../staged-player \
              --repo "$GITHUB_REPOSITORY" --tag "$TAG" --out ../../latest-player.json --require player "${check[@]}") || player_feed=$?
            [ "$player_feed" = 0 ] || [ "$player_feed" = 3 ] || exit "$player_feed"
            if [ -f latest-player.json ]; then
              cat latest-player.json
              tools/release/release-assets.sh upload "$TAG" --replace latest-player.json latest-player.json
            fi
          else
            echo "::warning::no player leg staged an installer"
            player_feed=3
          fi
          # published once complete (release.yml's signed set, the server apps in the feed);
          # the latest only as the highest stable version with every desktop platform
          tools/release/release-assets.sh publish "$TAG"
          if [ "$feed" = 3 ]; then
            echo "::error::not every desktop leg published: $TAG is not marked the latest release (rerun the failed legs: gh run rerun $GITHUB_RUN_ID --failed)"
            exit 1
          fi
          if [ "$player_feed" = 3 ] && [ "$REQUIRE_FEED" = true ]; then
            echo "::error::not every player leg published: $TAG is not marked the latest release (rerun the failed legs: gh run rerun $GITHUB_RUN_ID --failed)"
            exit 1
          fi
