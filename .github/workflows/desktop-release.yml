# Maktaba desktop client packaging (client-packaging epic) — Tauri 2.
#
# Triggered on `v*` tags. Builds the desktop installers for all three
# desktop OSes on their native runners (Tauri does NOT cross-compile the
# native shell) and attaches them to the GitHub Release for that tag:
#
#   macOS     →  .dmg, two of them:
#                 arm64  — Maktaba.app WITH the server inside (Epic 36, story 36.7):
#                          Contents/Resources/server built by tools/release/mac-app/
#                          payload.sh (Go binaries, Postgres, ffmpeg, Python, the
#                          pipeline wheel), macOS 15+
#                 x86_64 — the client only (Intel Macs keep the Homebrew/node paths)
#   Windows   →  the NSIS -setup.exe WITH the server inside (Epic 38, story 38.11):
#                <install>\server built by tools/release/win-app/payload.sh (the same
#                pieces, x86_64, plus the Visual C++ runtime), a current-user install in
#                %LOCALAPPDATA%\Maktaba whose hooks stop / start the server around it.
#                No .msi: Windows Installer's per-machine install in Program Files cannot
#                hold a per-user server. A client from an earlier .msi (a WiX install of the
#                same name and publisher): an interactive or passive (/P, the updater's) run
#                of the installer removes it with its msiexec uninstall, which asks for an
#                administrator; a silent run (/S) shows no pages and leaves it beside the new
#                per-user app. Plus a portable .zip of the raw exe (the client).
#   Linux     →  .AppImage + .deb + .rpm, x86_64 and aarch64, each WITH the server inside
#                (Epic 39): usr/share/maktaba/server built by tools/release/linux-app/payload.sh
#                (no ffmpeg: the distribution's; the .deb and the .rpm depend on it)
#
# NOTHING IS PUBLIC BEFORE IT IS CHECKED
# --------------------------------------
# Each leg builds (`tauri build`: signing, notarization, the updater signatures) and
# checks its bundles, then hands the checked files to the `publish` job as an
# artifact. `publish` runs once, after every leg: it attaches the files to the tag's
# release and only then writes latest.json, the updater feed, over all of them
# (tools/release/cmd/updater-feed). A leg that fails attaches nothing, so no updater is
# ever pointed at a bundle that failed its checks; the other platforms still publish.
#
# WEB FRONTEND
# ------------
# All three wrap the SAME `web/dist` SPA bundle. The repo has no pnpm
# workspace, so the config's `beforeBuildCommand` (`pnpm --filter
# maktaba-web build`) cannot resolve in CI. We therefore build `web/dist`
# ourselves in a step and then blank `build.beforeBuildCommand` in
# `tauri.conf.json` in place (a tiny cross-platform Node rewrite) so
# `tauri build` just bundles the already-built frontend. (We rewrite the
# file rather than pass `--config '{...}'` because tauri-action's arg
# splitter mangles the JSON's quotes.)
#
# CODE SIGNING
# ------------
# macOS signs and notarizes when the Apple secrets are set; without them the
# build is UNSIGNED and still green (a local-style app: right-click > Open).
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  its export password
#   APPLE_SIGNING_IDENTITY      optional, e.g. "Developer ID Application: Hamza Labs (TEAMID)"
#                               (default: the identity found in the certificate)
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   notarization (an app-specific password)
# Every Mach-O in the server payload is signed by payload.sh (hardened runtime,
# timestamp; python3 with tools/release/mac-app/entitlements/python.plist), then
# tauri signs + notarizes + staples the app, then the .dmg is notarized and
# stapled here before it is staged for the publish job.
# Windows (WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD, Authenticode)
# stays deferred: the owner's decision (tools/release/win-app/README.md, Signing).
# The updater key: TAURI_SIGNING_PRIVATE_KEY(_PASSWORD).
name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (${{ matrix.label }})
    # builds and checks only; the publish job attaches what passed
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: the server payload rides in Contents/Resources/server
          # (the overlay payload.sh writes adds it as a resource). `payload` names
          # the tools/release/<payload>/ directory that builds it.
          - label: macos-arm64
            os: macos-15
            rust-targets: aarch64-apple-darwin
            payload: mac-app
            args: '--target aarch64-apple-darwin --bundles app,dmg --config ../../build/mac-app/tauri.mac-app.conf.json'
          - label: macos-x86_64
            os: macos-15
            rust-targets: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          # Windows x86_64: the server payload in <install>\server (the overlay adds
          # it as a resource, with the NSIS installer's hooks).
          - label: windows
            os: windows-latest
            rust-targets: ''
            payload: win-app
            args: '--bundles nsis --config ../../build/win-app/tauri.win-app.conf.json'
          # Linux: the server payload rides in usr/share/maktaba/server (the overlay
          # linux-app/payload.sh writes maps it into each bundle), Epic 39.
          - label: linux-x86_64
            os: ubuntu-22.04
            rust-targets: ''
            linux_payload: true
            args: '--bundles appimage,deb,rpm --config ../../build/linux-app/tauri.linux-app.conf.json'
          - label: linux-aarch64
            os: ubuntu-22.04-arm
            rust-targets: ''
            linux_payload: true
            args: '--bundles appimage,deb,rpm --config ../../build/linux-app/tauri.linux-app.conf.json'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPLE_SIGN: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE != '' }}
      APPLE_NOTARIZE: ${{ startsWith(matrix.os, 'macos') && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v6.0.2

      # Linux GUI build deps for Tauri 2 (webkit2gtk 4.1, appindicator,
      # rsvg, patchelf for AppImage). No-op on macOS/Windows.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zip libarchive-tools rpm \
            ffmpeg

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Build the shared web bundle that the Tauri shell wraps. Cross-OS
      # safe (no `make`, which is absent on the Windows runner): install,
      # generate design tokens, then `vite build` → web/dist.
      - name: Build web bundle
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          node design-system/build/build-tokens.mjs
          pnpm build

      - uses: actions/setup-go@v6.4.0
        if: matrix.payload || matrix.linux_payload
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cmd/maktaba-server/go.sum
            cmd/maktaba-launcher/go.sum

      - uses: astral-sh/setup-uv@v8.1.0
        if: matrix.payload || matrix.linux_payload
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/cache@v4
        if: matrix.payload
        with:
          path: build/${{ matrix.payload }}/downloads
          key: ${{ matrix.payload }}-downloads-${{ hashFiles(format('tools/release/{0}/pins.env', matrix.payload)) }}

      - uses: actions/cache@v4
        if: matrix.linux_payload
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ runner.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}

      # The Developer ID certificate in a throwaway keychain; its identity is
      # what payload.sh and tauri sign with. Imported after the
      # third-party setup actions, so none of them runs with it unlocked.
      - name: Import the Developer ID certificate
        if: env.APPLE_SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(openssl rand -hex 16)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          # the new keychain first, the existing ones kept (one path per word)
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          fi
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >>"$GITHUB_ENV"

      # The server payload (on a Mac signed when the identity is there) and the
      # tauri overlay that bundles it, then a smoke test of the payload alone.
      # Git Bash on Windows (make is MinGW's there).
      - name: Build the server payload
        if: matrix.payload
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          PAYLOAD: ${{ matrix.payload }}
        run: |
          set -euo pipefail
          "tools/release/$PAYLOAD/payload.sh" --version "$VERSION"
          "tools/release/$PAYLOAD/check.sh"

      # The Linux server payload for this runner's architecture and the overlay
      # that maps it into the AppImage, the .deb and the .rpm (Epic 39).
      - name: Build the Linux server payload
        if: matrix.linux_payload
        env:
          VERSION: ${{ github.ref_name }}
        run: tools/release/linux-app/payload.sh --version "$VERSION"

      - name: Install desktop deps (Tauri CLI + API bindings)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Blank `beforeBuildCommand` so `tauri build` does NOT try to rebuild
      # the frontend via the workspace-`--filter` command (no workspace in
      # CI). web/dist was already built above. Cross-platform (bash on the
      # Windows runner is git-bash; Node is on PATH from setup-node).
      # Blank beforeBuildCommand (no workspace in CI) AND stamp the
      # product version from the pushed tag (Story 28.1): the Tauri
      # updater compares the app's own version against latest.json, so a
      # hardcoded "0.1.0" would mis-compare. Strip the leading "v".
      # WiX only takes a numeric major.minor.patch[.build], and the bundler
      # rejects a pre-release such as 0.3.0-rc.1 for the msi target, so a
      # pre-release tag gives the MSI its numeric core (0.3.0). NSIS drops
      # the suffix itself. Windows Installer then treats the rc and the
      # final 0.3.0 MSI as the same version; Tauri's template allows that
      # upgrade.
      # The updater (Epic 36 story 36.8, Epic 38/39): with the signing key
      # secret, the bundles get updater artifacts (.app.tar.gz, -setup.exe,
      # .AppImage, .deb, .rpm, each with its .sig), and the publish job writes
      # latest.json from them once every leg is attached (updater-feed: one key
      # per platform and bundle type, linux-x86_64-deb, ...); the app checks them
      # against the public key in the repository
      # variable TAURI_UPDATER_PUBKEY, stamped into tauri.conf.json here. A
      # key without its public half fails the build (the apps could never
      # verify an update); no key builds as before, without updater artifacts.
      - name: Neutralise in-config frontend rebuild + stamp version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          node -e "
            const fs = require('fs');
            const f = 'apps/desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.build.beforeBuildCommand = '';
            const v = (process.env.TAG || '').replace(/^v/, '');
            if (v) c.version = v;
            const core = v.split(/[-+]/)[0];
            if (core !== v) c.bundle.windows.wix.version = core;
            if (process.env.UPDATER_KEY === 'true') {
              const pub = (process.env.UPDATER_PUBKEY || '').trim();
              if (!pub) {
                console.log('::error::TAURI_SIGNING_PRIVATE_KEY is set but the repository variable TAURI_UPDATER_PUBKEY is not: the apps could not verify their updates');
                process.exit(1);
              }
              c.bundle.createUpdaterArtifacts = true;
              c.plugins.updater.pubkey = pub;
            } else {
              console.log('::notice::no TAURI_SIGNING_PRIVATE_KEY: bundles without updater artifacts (no latest.json)');
            }
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
            console.log('version=' + c.version + ' wix.version=' + (c.bundle.windows.wix.version || '(from version)') +
              ' updater=' + (c.bundle.createUpdaterArtifacts === true));
          "

      # `tauri build`, nothing published: it signs each updater bundle (.sig) when
      # the signing key secret is present (Story 28.4). A fork without
      # TAURI_SIGNING_* still produces UNSIGNED installers and no updater
      # signatures — the secrets resolve empty, so the build stays green
      # (matching the deferred Apple/Windows cert posture).
      - name: Build the Tauri bundles
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri signs with the imported identity (empty: unsigned) and, with
          # the Apple ID trio, notarizes and staples the .app.
          APPLE_ID: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.APPLE_NOTARIZE == 'true' && secrets.APPLE_TEAM_ID || '' }}
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          # ARGS is a list of words (the targets, the bundles, the payload overlay)
          read -r -a words <<<"$ARGS"
          pnpm tauri build "${words[@]}"

      - name: Check the app bundle
        if: matrix.payload == 'mac-app'
        run: |
          set -euo pipefail
          app=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Maktaba.app
          if [ "$APPLE_NOTARIZE" = true ]; then
            tools/release/mac-app/check.sh --app "$app" --notarized
          elif [ "$APPLE_SIGN" = true ]; then
            tools/release/mac-app/check.sh --app "$app" --signed
          else
            tools/release/mac-app/check.sh --app "$app"
          fi
          du -sh "$app" apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      # Each bundle's payload installs the way the app installs it (every file
      # checked), and the copy passes the payload smoke test.
      - name: Check the Linux bundles
        if: matrix.linux_payload
        run: |
          set -euo pipefail
          b=apps/desktop/src-tauri/target/release/bundle
          tools/release/linux-app/check-app.sh "$b"/appimage/*.AppImage "$b"/deb/*.deb "$b"/rpm/*.rpm
          du -sh "$b"/appimage/*.AppImage "$b"/deb/*.deb "$b"/rpm/*.rpm

      # A silent install of the installer tauri built into a temporary
      # folder (with a state already there), the checks on the installed payload,
      # then a silent uninstall that must leave that state alone.
      - name: Check the Windows installer
        if: matrix.payload == 'win-app'
        shell: bash
        run: |
          set -euo pipefail
          setup=(apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          [ "${#setup[@]}" -eq 1 ] && [ -f "${setup[0]}" ] || { echo "::error::expected one NSIS installer, got: ${setup[*]}"; exit 1; }
          tools/release/win-app/check.sh --installer "${setup[0]}"
          du -sh build/win-app/server "${setup[0]}"

      # tauri notarizes the .app inside the .dmg; the .dmg itself is notarized
      # and stapled here (so it opens offline without a Gatekeeper prompt),
      # before it is staged.
      - name: Notarize + staple the .dmg
        if: env.APPLE_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.rust-targets }}
        run: |
          set -euo pipefail
          for dmg in apps/desktop/src-tauri/target/"$TARGET"/release/bundle/dmg/*.dmg; do
            codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 60m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      # Windows "portable" deliverable: zip the raw built executable so
      # users who can't run an installer get a self-contained .zip. Runs
      # only on the Windows leg. The Tauri CLI renames the built exe to
      # tauri.conf.json's mainBinaryName (Maktaba.exe); without one it keeps
      # the Cargo [[bin]] name. Both are read here rather than hard-coded.
      - name: Package Windows portable .zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^v', ''
          $src = 'apps/desktop/src-tauri'
          $name = (Get-Content "$src/tauri.conf.json" -Raw | ConvertFrom-Json).mainBinaryName
          if (-not $name) {
            $meta = cargo metadata --no-deps --format-version 1 --manifest-path "$src/Cargo.toml" | ConvertFrom-Json
            $name = ($meta.packages[0].targets | Where-Object { $_.kind -contains 'bin' } | Select-Object -First 1).name
          }
          $exe = Get-Item -LiteralPath "$src/target/release/$name.exe" -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "$name.exe not found under $src/target/release — did the Tauri build succeed?"
          }
          New-Item -ItemType Directory -Force -Path out/release | Out-Null
          $zip = "out/release/maktaba-windows-portable-$version.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force

      # This leg's checked files for the publish job: the bundles as tauri names
      # them, with their updater signatures (.sig). The macOS updater archive is
      # Maktaba.app.tar.gz on both architectures, so it takes the .dmg's version and
      # architecture (Maktaba_<v>_<aarch64|x64>.app.tar.gz).
      - name: Stage the checked bundles
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.rust-targets }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          v="${TAG#v}"
          b="apps/desktop/src-tauri/target/${TARGET:+$TARGET/}release/bundle"
          mkdir -p out/release
          case "$RUNNER_OS" in
            macOS)
              arch=x64
              [ "$TARGET" != aarch64-apple-darwin ] || arch=aarch64
              cp "$b"/dmg/*.dmg out/release/
              for f in "$b"/macos/*.app.tar.gz; do
                n="$(basename "$f" .app.tar.gz)_${v}_${arch}.app.tar.gz"
                cp "$f" "out/release/$n"
                [ ! -f "$f.sig" ] || cp "$f.sig" "out/release/$n.sig"
              done
              ;;
            Windows)
              cp "$b"/nsis/*-setup.exe "$b"/nsis/*-setup.exe.sig out/release/
              ;;
            Linux)
              cp "$b"/appimage/*.AppImage "$b"/appimage/*.AppImage.sig "$b"/deb/*.deb "$b"/deb/*.deb.sig \
                "$b"/rpm/*.rpm "$b"/rpm/*.rpm.sig out/release/
              ;;
          esac
          ls -l out/release

      - name: Hand them to the publish job
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-${{ matrix.label }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 7

  # Only now is anything public: every leg's checked files are attached to the
  # tag's release, then latest.json is written once, over all of them (no two legs
  # race on it, and it is made from the files, not from a listing of the release).
  # A leg that failed staged nothing: the other platforms publish, and the failed
  # one's apps stay on the version they run.
  publish:
    name: publish the checked bundles
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release (when release.yml has not yet) and attach to it
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/release/go.mod
          cache-dependency-path: tools/release/go.sum

      - name: Download the checked bundles
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          path: staged
          merge-multiple: true

      - name: Attach them to the release, then write latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -d staged ] || [ -z "$(ls -A staged)" ]; then
            echo "::error::no leg staged a bundle"
            exit 1
          fi
          # release.yml may not have made the release yet; it sets the final flags
          # (a pre-release for a tag with a suffix, the latest for a plain one)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$TAG" in *-*) kind=(--prerelease --latest=false) ;; *) kind=(--latest=false) ;; esac
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "" "${kind[@]}" ||
              gh release view "$TAG" >/dev/null # made meanwhile by release.yml
          fi
          gh release upload "$TAG" staged/* --clobber
          (cd tools/release && go run ./cmd/updater-feed --dir ../../staged --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" --out ../../latest.json)
          if [ -f latest.json ]; then
            cat latest.json
            gh release upload "$TAG" latest.json --clobber
          fi
