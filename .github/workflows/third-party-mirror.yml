# Unmodified copies of exactly the third-party files the Linux payload pins
# (tools/release/linux-app/pins.env) in this repository's release `third-party-mirror`:
# payload.sh's second source when a file's own host is down (MIRROR_URL there), kept only
# as a fallback for CI. Runs on main only.
#
# fetch (per architecture, read-only, no credentials kept): from main's downloads cache
# when it has a file, else upstream, one file at a time (at most 20 minutes each), each
# checked against its pinned SHA-256 by `payload.sh --fetch-only --only PIECE`; whatever
# passed is handed on as an artifact, even when another file failed.
# publish (the only job that writes, and it talks to GitHub alone): makes the release or
# refreshes its notes, checks each handed-on file against its pin again and uploads it
# under its digest name (`payload.sh --pinned`) when the mirror lacks it, going on past a
# failed upload; then THIRD-PARTY-NOTICES.md and the GPL-3.0 text, and removes every
# asset no pin names. The release is a prerelease, never the latest (install.sh resolves
# releases/latest), with no version tag, so no release workflow and no update check sees it.
name: Third-party mirror

on:
  push:
    branches: [main]
    paths:
      - 'tools/release/linux-app/pins.env'
      - 'tools/release/linux-app/payload.sh'
      - 'tools/release/linux-app/licenses/**'
      - '.github/workflows/third-party-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: third-party-mirror
  cancel-in-progress: false

env:
  TAG: third-party-mirror

jobs:
  fetch:
    name: fetch (${{ matrix.arch }})
    # main's pins only: a branch's pins.env never decides what the mirror holds
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100 # four files, at most 20 minutes each
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false # this job talks to third-party hosts

      # main's downloads (ci.yml linux-app-downloads), this pins.env's or an earlier one's:
      # what is in it needs no upstream host
      - uses: actions/cache/restore@v4
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}
          restore-keys: linux-app-downloads-${{ matrix.arch }}-

      - name: Fetch each pinned file, checked against its SHA-256, one at a time
        id: fetch
        env:
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          tools/release/linux-app/payload.sh --pinned >"$RUNNER_TEMP/pinned" || exit 1
          ok="$RUNNER_TEMP/ok"
          mkdir -p "$ok"
          failed=""
          while read -r arch piece name _ _ mname; do
            [ "$arch" = "$WANT_ARCH" ] || continue
            if timeout 20m tools/release/linux-app/payload.sh --fetch-only --only "$piece"; then
              cp "build/linux-app/downloads/$name" "$ok/$mname"
            else
              echo "::warning::$name: not fetched, not mirrored this time"
              failed="$failed $name"
            fi
          done <"$RUNNER_TEMP/pinned"
          echo "failed=$failed" >>"$GITHUB_OUTPUT"

      - name: Hand the checked files to the publish job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mirror-${{ matrix.arch }}
          path: ${{ runner.temp }}/ok/*
          if-no-files-found: warn
          retention-days: 3

      - name: Fail when a pinned file was not fetched
        if: steps.fetch.outputs.failed != ''
        run: |
          echo "::error::not fetched for ${{ matrix.arch }}:${{ steps.fetch.outputs.failed }}"
          exit 1

  publish:
    name: publish
    needs: fetch
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write # the mirror release: make it, upload to it, remove what no pin names
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false # gh takes the token from the environment

      # none when every fetch failed: the notices and the pruning still run
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          pattern: mirror-*
          path: ${{ runner.temp }}/ok
          merge-multiple: true

      - name: Make the release, or refresh its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="Unmodified upstream builds, kept only as a fallback for CI: the Linux app's payload build (tools/release/linux-app/payload.sh) downloads a file from here when its own host is down, and checks it against the SHA-256 pinned in tools/release/linux-app/pins.env. Only files pinned there are kept here. Every file, its upstream download, licence and source: THIRD-PARTY-NOTICES.md; ffmpeg and ffprobe are under the GPL version 3 (GPL-3.0.txt)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false --notes "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Third-party mirror (Linux payload)" --notes "$notes"
          fi

      - name: Upload each checked file the mirror lacks, then the notices; remove what no pin names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          pinned="$RUNNER_TEMP/pinned"
          tools/release/linux-app/payload.sh --pinned >"$pinned" || exit 1
          ok="$RUNNER_TEMP/ok"
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')" || exit 1
          failed=0
          while read -r _ _ name sha _ mname; do
            f="$ok/$mname"
            [ -f "$f" ] || continue # not fetched this time: the fetch job said so
            if [ "$(sha256sum "$f" | cut -d' ' -f1)" != "$sha" ]; then
              echo "::error::$name: not its pinned SHA-256, not uploaded"
              failed=1
            elif printf '%s\n' "$have" | grep -qxF "$mname"; then
              echo "$mname: there already"
            elif gh release upload "$TAG" "$f"; then
              echo "$mname: uploaded"
            else
              echo "::error::$mname: the upload failed"
              failed=1
            fi
          done <"$pinned"

          docs="$RUNNER_TEMP/docs"
          mkdir -p "$docs"
          tools/release/linux-app/payload.sh --notices >"$docs/THIRD-PARTY-NOTICES.md" || exit 1
          cp tools/release/linux-app/licenses/GPL-3.0.txt "$docs/GPL-3.0.txt"
          gh release upload "$TAG" "$docs/THIRD-PARTY-NOTICES.md" "$docs/GPL-3.0.txt" --clobber || failed=1

          # 2 architectures x 4 pieces: a short list (a failed --pinned) never prunes
          keep="$(awk 'NF == 6 { print $6 }' "$pinned")"
          if [ "$(printf '%s\n' "$keep" | grep -c .)" -ne 8 ]; then
            echo "::error::--pinned did not name 8 files: nothing removed"
            exit 1
          fi
          keep="$keep"$'\n'THIRD-PARTY-NOTICES.md$'\n'GPL-3.0.txt
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            if ! printf '%s\n' "$keep" | grep -qxF "$asset"; then
              gh release delete-asset "$TAG" "$asset" --yes && echo "$asset: removed (no pin names it)"
            fi
          done
          exit "$failed"
