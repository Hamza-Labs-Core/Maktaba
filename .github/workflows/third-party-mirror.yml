# Exact copies of the Linux payload's third-party files (tools/release/linux-app/pins.env)
# in this repository's release `third-party-mirror`: payload.sh's second source when a
# file's own host is down (MIRROR_URL in pins.env). Each file is fetched and checked
# against its pinned SHA-256 by `payload.sh --fetch-only` before it is uploaded, under the
# name payload.sh caches it by; a file already there is kept. The release is a prerelease
# and never the latest (install.sh resolves releases/latest), with no version tag, so no
# release workflow runs for it.
name: Third-party mirror

on:
  push:
    branches: [main]
    paths:
      - 'tools/release/linux-app/pins.env'
      - '.github/workflows/third-party-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: mirror (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write # create the mirror release and upload to it
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Fetch the pinned files, each checked against its SHA-256
        run: tools/release/linux-app/payload.sh --fetch-only --cache "$RUNNER_TEMP/mirror"

      - name: Upload the ones the mirror lacks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: third-party-mirror
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Third-party mirror (Linux payload)" \
              --notes "Exact copies of the third-party files the Linux app's server payload is built from (tools/release/linux-app/pins.env), each checked against its pinned SHA-256 before it was uploaded. payload.sh fetches from here only when a file's own host fails, and checks the copy the same way. Sources and licences: tools/release/linux-app/README.md." ||
              gh release view "$TAG" >/dev/null # made meanwhile by the other architecture's job
          fi
          have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for f in "$RUNNER_TEMP"/mirror/*; do
            n="$(basename "$f")"
            if printf '%s\n' "$have" | grep -qxF "$n"; then
              echo "$n: there already"
            else
              gh release upload "$TAG" "$f"
            fi
          done
