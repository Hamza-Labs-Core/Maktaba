# Maktaba TV client packaging (client-packaging epic).
#
# Triggered on `v*` tags. Unlike mobile/desktop, the TV apps are FULLY
# NATIVE (a 10-foot D-pad UI can't reuse the web view) — so there is no
# web bundle to build here. Two independent native builds:
#
#   Android TV  →  maktaba-tv-<version>.apk   (Compose-for-TV + Media3, the `google` flavor)
#   Fire TV     →  maktaba-tv-<version>-amazon.apk   (the same app's `amazon` flavor, story 58.05),
#                  then staged in the Amazon Appstore's open edit (tools/release/amazon_submit.py)
#   tvOS        →  a tvOS simulator build of the "Maktaba TV" scheme (compile
#                  check). The signed App Store build is archived and uploaded
#                  to TestFlight by testflight.yml, on the same tag.
#
# Bundle / application id on both: com.hamzalabs.maktaba.tv
#
# SIGNING
# -------
# Android TV: `assembleGoogleRelease` yields an UNSIGNED apk unless a keystore is
# provided. Signing runs only when the secrets are present (forks without
# them still get a green "assembles" run). Only a signed APK is attached
# to the Release; an unsigned one stays a workflow artifact
# (`maktaba-tv-<version>-unsigned.apk`) and the run warns. Reuses the same
# secret names as the mobile workflow:
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# Fire TV: the `amazon` APK is signed the same way with its own Amazon upload key, only when
# AMAZON_KEYSTORE_BASE64 / AMAZON_KEY_ALIAS / AMAZON_KEY_PASSWORD are set (Amazon re-signs the
# app for the store; docs/stores/amazon.md). An unsigned one is kept as a workflow artifact only.
# With the App Submission API's AMAZON_APPSTORE_CLIENT_ID / AMAZON_APPSTORE_CLIENT_SECRET /
# AMAZON_APPSTORE_APP_ID also set, the signed APK is staged in the app's open edit; a person
# sends it to Live App Testing and commits it after the real-device checklist. Nothing here
# commits a version to the store.
# tvOS: signed and uploaded to TestFlight by testflight.yml (its "Maktaba TV" leg:
# Xcode's automatic cloud signing with the App Store Connect API key). Nothing is
# signed here. See docs/testflight.md.
name: TV Release

on:
  push:
    tags:
      - 'v*'
  # A tag's run by hand, when its push run is missing or failed for good: `gh workflow run
  # <this> --ref vX.Y.Z -f tag=vX.Y.Z` (the release session's tag push starts the push run). The tag
  # guard refuses a dispatched run whose ref is not that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "The v* tag to release (dispatch with --ref set to it)"
        required: true
        type: string

permissions:
  contents: read

# One run per tag at a time, never cancelled.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the tag-order guard (release.yml's guard opens the release as a draft)
  guard:
    uses: ./.github/workflows/_tag-guard.yml
    permissions:
      contents: write
      actions: read

  android-tv:
    name: android-tv (apk)
    needs: [guard]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write # gh release upload
    # Hoisted to job level so the "Sign" step's `if:` can read them.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      AMAZON_KEYSTORE_BASE64: ${{ secrets.AMAZON_KEYSTORE_BASE64 }}
      AMAZON_KEY_ALIAS: ${{ secrets.AMAZON_KEY_ALIAS }}
      AMAZON_KEY_PASSWORD: ${{ secrets.AMAZON_KEY_PASSWORD }}
      AMAZON_APPSTORE_CLIENT_ID: ${{ secrets.AMAZON_APPSTORE_CLIENT_ID }}
      AMAZON_APPSTORE_CLIENT_SECRET: ${{ secrets.AMAZON_APPSTORE_CLIENT_SECRET }}
      AMAZON_APPSTORE_APP_ID: ${{ secrets.AMAZON_APPSTORE_APP_ID }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The default package list includes the long-removed `tools`
        # package, which current sdkmanager rejects. compileSdk 37 (the
        # shared core's) is installed here; AGP fetches its build-tools.
        with:
          packages: platform-tools platforms;android-37.0

      # the Google Play build and the Fire TV build, the same version (the tag's)
      - name: Assemble release APKs
        working-directory: apps/tv/android
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          version="${TAG#v}"
          code="$(../../../tools/release/play-version.sh "$TAG" | sed -n 's/^code=//p')"
          ./gradlew --no-daemon :app:assembleGoogleRelease :app:assembleAmazonRelease \
            -Pmaktaba.versionName="$version" -Pmaktaba.versionCode="$code"

      - name: Sign APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/tv/android
        run: |
          set -euo pipefail
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/maktaba-tv.keystore"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${RUNNER_TEMP}/maktaba-tv.keystore" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "app/build/outputs/apk/google/release/app-google-release-signed.apk" \
            "app/build/outputs/apk/google/release/app-google-release-unsigned.apk"

      - name: Sign the Fire TV APK
        if: ${{ env.AMAZON_KEYSTORE_BASE64 != '' }}
        working-directory: apps/tv/android
        run: |
          set -euo pipefail
          echo "${AMAZON_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/maktaba-tv-amazon.keystore"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${RUNNER_TEMP}/maktaba-tv-amazon.keystore" \
            --ks-key-alias "${AMAZON_KEY_ALIAS}" \
            --ks-pass "pass:${AMAZON_KEY_PASSWORD}" \
            --key-pass "pass:${AMAZON_KEY_PASSWORD}" \
            --out "app/build/outputs/apk/amazon/release/app-amazon-release-signed.apk" \
            "app/build/outputs/apk/amazon/release/app-amazon-release-unsigned.apk"
          rm -f "${RUNNER_TEMP}/maktaba-tv-amazon.keystore"

      # Android won't install an unsigned APK, so an unsigned build gets an
      # -unsigned name and is not attached to the Release.
      - name: Collect artifact
        id: collect
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          apk_dir="apps/tv/android/app/build/outputs/apk/google/release"
          if [ -f "${apk_dir}/app-google-release-signed.apk" ]; then
            apk="maktaba-tv-${version}.apk"
            cp "${apk_dir}/app-google-release-signed.apk" "out/${apk}"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            apk="maktaba-tv-${version}-unsigned.apk"
            cp "${apk_dir}/app-google-release-unsigned.apk" "out/${apk}"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            msg="ANDROID_KEYSTORE_BASE64 is not set, so the Android TV APK is unsigned. It is kept in the maktaba-tv-android workflow artifact and not attached to the ${TAG} release."
            echo "::warning title=Android TV build not signed::${msg}"
            printf '### Android TV: not attached to the release\n\n%s\n' "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
          ( cd out && sha256sum "${apk}" > "${apk}.sha256" )
          # the Fire TV build (story 58.05): attached only when signed, like the Android TV one
          amazon_dir="apps/tv/android/app/build/outputs/apk/amazon/release"
          if [ -f "${amazon_dir}/app-amazon-release-signed.apk" ]; then
            amazon="maktaba-tv-${version}-amazon.apk"
            cp "${amazon_dir}/app-amazon-release-signed.apk" "out/${amazon}"
            echo "amazon_signed=true" >> "$GITHUB_OUTPUT"
            echo "amazon_apk=out/${amazon}" >> "$GITHUB_OUTPUT"
          else
            amazon="maktaba-tv-${version}-amazon-unsigned.apk"
            mkdir -p out-unsigned
            cp "${amazon_dir}/app-amazon-release-unsigned.apk" "out-unsigned/${amazon}"
            echo "amazon_signed=false" >> "$GITHUB_OUTPUT"
            msg="AMAZON_KEYSTORE_BASE64 is not set, so the Fire TV APK is unsigned. It is kept in the maktaba-tv-amazon-unsigned workflow artifact, not attached to the ${TAG} release, and not staged in the Amazon Appstore."
            echo "::warning title=Fire TV build not signed::${msg}"
            printf '### Fire TV: not attached to the release\n\n%s\n' "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
          ( cd out && for f in maktaba-tv-*-amazon.apk; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done; true )
          ls -l out out-unsigned 2>/dev/null || true

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maktaba-tv-android
          path: out/*
          retention-days: 14

      - name: Upload the unsigned Fire TV APK
        if: steps.collect.outputs.amazon_signed != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maktaba-tv-amazon-unsigned
          path: out-unsigned/*
          retention-days: 14

      # Signed builds only. It used to be the first to get here and created the public
      # release before any signed file existed (a home that looked then never verified
      # it); now it uploads to the draft release.yml's guard opened.
      - name: Attach to GitHub Release
        if: steps.collect.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # To the tag's release, a draft until release.yml's signed files and the server apps
        # are in (it is never made public or the latest from here); a published release only
        # gains the files it lacks.
        run: tools/release/release-assets.sh upload "${TAG}" out/*

      # Story 58.05: the signed Fire TV APK waits in the Amazon Appstore's open edit as a draft.
      # Amazon's API cannot make a Live App Testing version, and a committed edit goes to review
      # and the store: a person sends it to Live App Testing from the Developer Console, runs the
      # real-device checklist (docs/stores/amazon.md), then commits (amazon_submit.py commit,
      # which refuses without a passed checklist result for the version).
      - name: Stage the Fire TV APK in the Amazon Appstore
        if: steps.collect.outputs.amazon_signed == 'true'
        env:
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.collect.outputs.amazon_apk }}
        run: |
          set -uo pipefail
          python3 tools/release/amazon_submit.py stage --apk "$APK" --version "${TAG#v}"
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "::notice::The Amazon App Submission API is not set up (AMAZON_APPSTORE_*): upload $(basename "$APK") from the release in the Developer Console."
            exit 0
          fi
          exit "$status"

  tvos:
    name: tvos (compile check; TestFlight in testflight.yml)
    needs: [guard]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      # The Apple TV app is the "Maktaba TV" target of apps/apple/Maktaba.xcodeproj (on
      # MaktabaKit, the Apple apps' shared package): a simulator build, the same check
      # `make tv-build-ios` runs locally.
      - name: Build the Apple TV app (tvOS simulator)
        run: make tv-build-ios

      # Distribution is testflight.yml's: on the same tag its "Maktaba TV" leg archives the
      # app for tvOS, signs it (automatic cloud signing) and uploads it to TestFlight. This
      # job only guards that the sources still compile.
      - name: Note tvOS distribution
        run: |
          echo "::notice::Apple TV app built. The signed build is uploaded to TestFlight by the TestFlight workflow (testflight.yml, its Maktaba TV leg) on this tag; see docs/testflight.md."
