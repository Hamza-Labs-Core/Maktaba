# TEMPORARY (removed before merge): measures the grouped search on 10.5 M segments.
name: Search perf (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
          --shm-size=1g
    env:
      DATABASE_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Run migrations
        run: make migrate
      - name: Grouped search on 10.5 M segments
        working-directory: api
        env:
          MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
          MAKTABA_SEARCH_PERF_SEGMENTS: "10500000"
        run: go test -count=1 -timeout 70m -run 'TestSearch_Postgres' -v ./internal/handlers/search/
