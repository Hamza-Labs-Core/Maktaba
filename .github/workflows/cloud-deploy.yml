# Maktaba Cloud on one node: deploy a release to QA or production, then test it there
# (docs/cloud-single-node.md). By hand only: Actions → Cloud deploy → target, release.
#
#   resolve  the release's images by digest (maktaba-cloud, maktaba-server for the test home,
#            maktaba-caddy), each verified with cosign against the workflow that signed it; the
#            cloud rehearsal passed on the release's commit (tools/release/cloud-guard.sh);
#            production only: this run is main's, and a QA run of main passed with the same
#            image digests (the release's, Postgres and Redis) and the same files (this workflow,
#            the rehearsal guard, deploy/cloud-relay with its tests), which main still has; its web
#            bundle, by its SHA-256, is the one production gets. A re-run checks it all again
#   web      the cloud web app (web/cloud) built from the release's source (QA only)
#   deploy   ops/rollout.sh begin (room, the images pulled, a backup, the present set saved), the
#            node's DNS records (with CLOUDFLARE_DNS_TOKEN), setup.sh (idempotent), the web
#            bundle, deploy.sh apply (migrate, swap, health), a unit of the node's own; over SSH
#            with the pinned host key. Any failure from here on, the tests' included, restores the
#            saved set (deploy.sh rollback); a pass commits (deploy.sh commit). A lost runner or a
#            cut session leaves the node to come to a known state by itself
#   test     deploy/cloud-relay/tests/e2e.py against the node: full on QA (a real home linked
#            through the relay, sign-in and play, plans, a relay restart, firewall, backups,
#            load and sizing), smoke on production (the same without the restart and the load)
#   record   QA: the digests and the deploy tree that passed, for production's gate
#
# Secrets: RESEND_API_KEY (each environment's own, qa and prod: the key its mails are sent with;
# without it the node's mail driver stays log), TURNSTILE_SECRET_KEY and TURNSTILE_SITE_KEY (each
# environment's own: the bot check on the web app's pages, off without both), RELAY_SSH_KEY (both nodes), CLOUDFLARE_DNS_TOKEN (Zone → DNS → Edit on maktaba.tv
# and maktaba.dev; without it QA runs on Caddy's own CA and production does not deploy unless
# the CLOUD_TLS variable is "http" with the records made by hand), MAKTABA_LICENSE_SIGNING_KEY
# (the licence signing seed whose public half releases embed, docs/licensing.md: without it a
# node signs with its own key, which no released home trusts), MAKTABA_SYMBOLS_TOKEN.
# Variables: QA_HOST, QA_SSH_USER, QA_SSH_KNOWN_HOSTS; RELAY_HOST, RELAY_SSH_USER,
# RELAY_SSH_KNOWN_HOSTS. Each target's names are in deploy/cloud-relay/targets/<target>.env.
name: Cloud deploy
run-name: cloud deploy ${{ inputs.target || 'qa' }} ${{ inputs.tag || 'latest release' }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where: qa, or prod (only a release QA passed)'
        type: choice
        options: [qa, prod]
        default: qa
      tag:
        description: 'Release tag (vX.Y.Z). Blank: the latest release'
        required: false
        default: ''

permissions:
  contents: read

# one deploy per node at a time, and one under way is never cancelled (GitHub keeps one waiting: a
# newer dispatch takes an older waiting one's place)
concurrency:
  group: cloud-deploy-${{ inputs.target || 'qa' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/hamza-labs-core
  TARGET: ${{ inputs.target || 'qa' }}
  SIGNER: https://github.com/Hamza-Labs-Core/Maktaba/.github/workflows

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read # the cloud rehearsal's runs; QA's runs and their records
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      cloud_ref: ${{ steps.images.outputs.cloud_ref }}
      server_ref: ${{ steps.images.outputs.server_ref }}
      caddy_ref: ${{ steps.images.outputs.caddy_ref }}
      postgres_ref: ${{ steps.images.outputs.postgres_ref }}
      redis_ref: ${{ steps.images.outputs.redis_ref }}
      files: ${{ steps.files.outputs.files }}
      attempt: ${{ github.run_attempt }}
      web_sha256: ${{ steps.qa.outputs.web_sha256 }}
      qa_run: ${{ steps.qa.outputs.run }}
    steps:
      # anything but qa: only main's own copy of this workflow, dispatched by hand
      - name: Production deploys from main only
        if: inputs.target != 'qa'
        env:
          TARGET_INPUT: ${{ inputs.target }}
        run: |
          if [ "$TARGET_INPUT" = prod ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/main ]; then exit 0; fi
          echo "::error::production deploys only from main, by hand (this is $GITHUB_EVENT_NAME of $GITHUB_REF, target '$TARGET_INPUT')"
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $tag"; exit 1; }
          [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false ] \
            || { echo "::error::$tag is a draft or a pre-release"; exit 1; }
          sha="$(git rev-list -n 1 "refs/tags/$tag")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release $tag at $sha"

      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      # each image by digest, and each digest signed by the workflow that built it: the
      # release's by release.yml at the tag, Caddy's by relay.yml on main
      - name: The images, by digest, verified
        id: images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          caddy_tag="$(sed -n 's/^MAKTABA_CADDY_TAG=//p' deploy/cloud-relay/.env.example)"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          verify() {
            cosign verify "$1" --certificate-identity "$2" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "verified $1"
          }
          cloud="$REGISTRY/maktaba-cloud@$(digest "$REGISTRY/maktaba-cloud:$TAG")"
          server="$REGISTRY/maktaba-server@$(digest "$REGISTRY/maktaba-server:$TAG")"
          caddy="$REGISTRY/maktaba-caddy@$(digest "$REGISTRY/maktaba-caddy:$caddy_tag")"
          verify "$cloud" "$SIGNER/release.yml@refs/tags/$TAG"
          verify "$server" "$SIGNER/release.yml@refs/tags/$TAG"
          verify "$caddy" "$SIGNER/relay.yml@refs/heads/main"
          # Postgres and Redis: the digests the compose file pins
          pinned() { sed -n "s/^ *image: \($1:[^ ]*@sha256:[0-9a-f]\{64\}\)$/\1/p" deploy/cloud-relay/docker-compose.yml; }
          postgres="$(pinned postgres)" redis="$(pinned redis)"
          for ref in "$postgres" "$redis"; do
            [ -n "$ref" ] && [ "$(printf '%s\n' "$ref" | wc -l)" = 1 ] || { echo "::error::Postgres and Redis are not each pinned by one digest"; exit 1; }
            docker buildx imagetools inspect "$ref" >/dev/null
          done
          {
            echo "postgres_ref=$postgres"
            echo "redis_ref=$redis"
            echo "cloud_ref=$TAG@${cloud#*@}"
            echo "server_ref=$server"
            echo "caddy_ref=$caddy_tag@${caddy#*@}"
          } >> "$GITHUB_OUTPUT"

      # Epic 50 story 50.06: no cloud deploy of a commit the cloud rehearsal did not pass on
      - name: The cloud rehearsal passed on the release's commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}
          WAIT_SECONDS: '600'
        run: bash tools/release/cloud-guard.sh

      # what a deploy runs: this workflow, the rehearsal guard, and deploy/cloud-relay (its scripts,
      # its compose file and its tests, tests/e2e.py), each by git's hash of it. The workflow's is
      # the running one's (a dispatch runs the file of the commit checked out here)
      - name: The deploy's files
        id: files
        run: |
          set -euo pipefail
          [ "$GITHUB_WORKFLOW_SHA" = "$(git rev-parse HEAD)" ] || { echo "::error::the workflow running is not this commit's"; exit 1; }
          files="$(for f in .github/workflows/cloud-deploy.yml tools/release/cloud-guard.sh deploy/cloud-relay; do
            printf '%s=%s ' "$f" "$(git rev-parse "HEAD:$f")"; done)"
          echo "$files"
          echo "files=${files% }" >> "$GITHUB_OUTPUT"
          # production: main still has them (an old run started again would put older ones back)
          if [ "$TARGET" = prod ]; then
            git fetch -q origin main
            now="$(for f in .github/workflows/cloud-deploy.yml tools/release/cloud-guard.sh deploy/cloud-relay; do
              printf '%s=%s ' "$f" "$(git rev-parse "origin/main:$f")"; done)"
            [ "$now" = "$files" ] || { echo "::error::main has other deploy files by now: dispatch a new run"; exit 1; }
          fi

      # production deploys only what QA passed: the same digests and the same files, in a
      # successful QA run of this workflow on main (its qa-passed record)
      - name: QA passed this release (production only)
        id: qa
        if: env.TARGET == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUD: ${{ steps.images.outputs.cloud_ref }}
          SERVER: ${{ steps.images.outputs.server_ref }}
          CADDY: ${{ steps.images.outputs.caddy_ref }}
          POSTGRES: ${{ steps.images.outputs.postgres_ref }}
          REDIS: ${{ steps.images.outputs.redis_ref }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          set -euo pipefail
          # main's runs only: another branch's copy of this workflow could record anything
          git fetch -q origin main
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cloud-deploy.yml/runs?status=success&branch=main&event=workflow_dispatch&per_page=50" \
            --jq '.workflow_runs[] | select(.head_branch == "main" and .event == "workflow_dispatch") | select(.display_title | startswith("cloud deploy qa ")) | [.id, .head_sha] | @tsv')"
          while read -r run sha; do
            # by its commit, not its branch's name alone (a tag can be named main)
            if [ -z "$sha" ] || ! git merge-base --is-ancestor "$sha" origin/main 2>/dev/null; then continue; fi
            d="$(mktemp -d)"
            gh run download "$run" --repo "$GITHUB_REPOSITORY" -p 'qa-passed-*' -D "$d" >/dev/null 2>&1 || continue
            for rec in "$d"/*/qa-passed.json; do
              [ -s "$rec" ] || continue
              if jq -e --arg c "$CLOUD" --arg s "$SERVER" --arg k "$CADDY" \
                --arg p "$POSTGRES" --arg r "$REDIS" --arg f "$FILES" --arg run "$run" \
                '.cloud_ref == $c and .server_ref == $s and .caddy_ref == $k and .postgres_ref == $p and .redis_ref == $r and .files == $f
                 and .run == $run and (.web_sha256 | test("^[0-9a-f]{64}$"))' "$rec" >/dev/null; then
                echo "QA passed this release and these deploy files in run $run"
                echo "run=$run" >> "$GITHUB_OUTPUT"
                echo "web_sha256=$(jq -r .web_sha256 "$rec")" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          done <<< "$runs"
          echo "::error::no successful QA run of this workflow on main with these images and deploy files: deploy to qa first"
          exit 1

  web:
    needs: [resolve]
    if: inputs.target != 'prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # the web app is built from the release's own source, so it matches the api it calls: a
      # published release's commit, which must be on main (the release session tags main only)
      - name: The release's source (a commit on main)
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/release" "$SHA"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Build the cloud web app (the release's source)
        id: bundle
        working-directory: ${{ runner.temp }}/release/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build:cloud
          tar -C dist-cloud -czf "$RUNNER_TEMP/cloud-web.tar.gz" .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/cloud-web.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # named by what it is: a run started again can leave two
          name: cloud-web-${{ steps.bundle.outputs.sha256 }}
          path: ${{ runner.temp }}/cloud-web.tar.gz
          retention-days: 90

  deploy:
    needs: [resolve, web]
    if: ${{ !cancelled() && (inputs.target != 'prod' || github.ref == 'refs/heads/main') && needs.resolve.result == 'success' && (needs.web.result == 'success' || (inputs.target == 'prod' && needs.web.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # the QA run's web bundle (production)
    environment:
      name: ${{ inputs.target || 'qa' }}
    env:
      # this deploy's name on the node: its commands do nothing to another's
      DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # again here, where the secrets are. This job started again on its own would carry the first
      # attempt's answers: production's gate is asked again, or nothing is deployed.
      - name: Production deploys from main only
        if: inputs.target != 'qa'
        env:
          TARGET_INPUT: ${{ inputs.target }}
          GATE_ATTEMPT: ${{ needs.resolve.outputs.attempt }}
        run: |
          if [ "$TARGET_INPUT" != prod ] || [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::production deploys only from main, by hand"
            exit 1
          fi
          if [ "$GATE_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]; then
            echo "::error::production's gate was asked in attempt $GATE_ATTEMPT, this is $GITHUB_RUN_ATTEMPT: run all jobs again"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: The target
        id: target
        env:
          QA_HOST: ${{ vars.QA_HOST }}
          QA_USER: ${{ vars.QA_SSH_USER }}
          QA_KH: ${{ vars.QA_SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ vars.RELAY_HOST }}
          PROD_USER: ${{ vars.RELAY_SSH_USER }}
          PROD_KH: ${{ vars.RELAY_SSH_KNOWN_HOSTS }}
          HAS_DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN != '' }}
          CLOUD_TLS: ${{ vars.CLOUD_TLS }}
        run: |
          set -euo pipefail
          grep -E '^[A-Z_]+=' "deploy/cloud-relay/targets/$TARGET.env" >> "$GITHUB_ENV"
          if [ "$TARGET" = prod ]; then host="$PROD_HOST" user="$PROD_USER" kh="$PROD_KH"; else host="$QA_HOST" user="$QA_USER" kh="$QA_KH"; fi
          [ -n "$host" ] && [ -n "$user" ] && [ -n "$kh" ] || { echo "::error::the $TARGET host, user or known_hosts variable is not set"; exit 1; }
          if [ "$HAS_DNS_TOKEN" = true ]; then tls=dns
          elif [ "$CLOUD_TLS" = http ]; then tls=http
          elif [ "$TARGET" = qa ]; then tls=internal
          else echo "::error::production needs public certificates: the CLOUDFLARE_DNS_TOKEN secret (or CLOUD_TLS=http with the records made by hand)"; exit 1
          fi
          # every run's log is public; the node's address is nobody's business there
          echo "::add-mask::$host"
          {
            echo "NODE_IP=$host"
            echo "NODE_USER=$user"
            echo "RELAY_TLS=$tls"
          } >> "$GITHUB_ENV"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$kh" > ~/.ssh/known_hosts_node
          echo "node: $TARGET, certificates: $tls"

      - name: SSH to the node (the pinned host key)
        env:
          KEY: ${{ secrets.RELAY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > ~/.ssh/node_key
          cat > ~/.ssh/config <<EOF
          Host node
            HostName $NODE_IP
            User $NODE_USER
            IdentityFile ~/.ssh/node_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts_node
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 20
          EOF
          ssh node true

      # before anything changes on the node: room, the images pulled by digest, a backup, and the
      # present set saved to go back to. A failure here leaves the node as it was.
      - name: Begin (ops/rollout.sh)
        id: begin
        env:
          CLOUD_REF: ${{ needs.resolve.outputs.cloud_ref }}
          CADDY_REF: ${{ needs.resolve.outputs.caddy_ref }}
        run: |
          set -euo pipefail
          tar -C deploy/cloud-relay -czf - . | ssh node 'rm -rf /opt/maktaba-relay-src && mkdir -p /opt/maktaba-relay-src && tar -xzf - -C /opt/maktaba-relay-src'
          # the names expand here, on purpose
          # shellcheck disable=SC2029
          ssh node "command -v docker >/dev/null || SETUP_DOCKER_ONLY=yes bash /opt/maktaba-relay-src/setup.sh; \
            DEPLOY_ID='$DEPLOY_ID' RELAY_DOMAIN='$RELAY_DOMAIN' API_DOMAIN='$API_DOMAIN' APP_DOMAIN='$APP_DOMAIN' RELAY_TLS='$RELAY_TLS' \
            MAKTABA_CLOUD_TAG='$CLOUD_REF' MAKTABA_CADDY_TAG='$CADDY_REF' bash /opt/maktaba-relay-src/ops/rollout.sh begin" </dev/null

      - name: The node's DNS records (with the DNS token)
        if: env.RELAY_TLS == 'dns'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: |
          python3 deploy/cloud-relay/ops/dns-records.py "$DNS_ZONE" "$NODE_IP" \
            "$RELAY_DOMAIN" "*.$RELAY_DOMAIN" "$API_DOMAIN" "$APP_DOMAIN"

      - name: Set up the node (setup.sh, idempotent)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          LICENSE_SIGNING_KEY: ${{ secrets.MAKTABA_LICENSE_SIGNING_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          CLOUD_REF: ${{ needs.resolve.outputs.cloud_ref }}
          CADDY_REF: ${{ needs.resolve.outputs.caddy_ref }}
        run: |
          set -euo pipefail
          # production without it would stop everyone's mail: a warning there
          level=notice; [ "$TARGET" != prod ] || level=warning
          [ -n "${RESEND_API_KEY:-}" ] || echo "::$level::the $TARGET environment has no RESEND_API_KEY: the node's mail driver is log (nothing is delivered)"
          { [ -n "${TURNSTILE_SECRET_KEY:-}" ] && [ -n "${TURNSTILE_SITE_KEY:-}" ]; } || echo "::$level::the $TARGET environment has not both TURNSTILE_SECRET_KEY and TURNSTILE_SITE_KEY: the bot check is off, and strangers' mails have a smaller share"
          # the token on stdin, never on a command line; the names expand here, on purpose
          # shellcheck disable=SC2029
          printf '%s\n' "${CF_API_TOKEN:-}" "${LICENSE_SIGNING_KEY:-}" "${RESEND_API_KEY:-}" "${TURNSTILE_SECRET_KEY:-}" "${TURNSTILE_SITE_KEY:-}" | \
            ssh node "read -r t; read -r k; read -r m; read -r ts; read -r tk; \
            [ -z \"\$t\" ] || export CF_API_TOKEN=\"\$t\"; [ -z \"\$k\" ] || export LICENSE_SIGNING_KEY=\"\$k\"; export RESEND_API_KEY=\"\$m\"; \
            export TURNSTILE_SECRET_KEY=\"\$ts\" TURNSTILE_SITE_KEY=\"\$tk\"; \
            MAIL_ALLOW='${MAIL_ALLOW:-}' MAIL_SUBJECT_PREFIX='${MAIL_SUBJECT_PREFIX:-}' MAIL_DAILY_LIMIT='${MAIL_DAILY_LIMIT:-}' MAIL_MONTHLY_LIMIT='${MAIL_MONTHLY_LIMIT:-}' \
            RELAY_DOMAIN='$RELAY_DOMAIN' API_DOMAIN='$API_DOMAIN' \
            APP_DOMAIN='$APP_DOMAIN' ACME_EMAIL='$ACME_EMAIL' RELAY_TLS='$RELAY_TLS' \
            RELAY_PLANS_ENFORCE='$RELAY_PLANS_ENFORCE' MAKTABA_CLOUD_TAG='$CLOUD_REF' MAKTABA_CADDY_TAG='$CADDY_REF' \
            /usr/local/sbin/maktaba-rollout setup '$DEPLOY_ID'"

      - name: The cloud web app's bundle (QA's build)
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN: ${{ needs.resolve.outputs.qa_run }}
          # what QA recorded (production), or what this run's web job built
          WEB_SHA256: ${{ inputs.target == 'prod' && needs.resolve.outputs.web_sha256 || needs.web.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$WEB_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no web bundle is named"; exit 1; }
          d="$(mktemp -d)"
          run="$GITHUB_RUN_ID"; [ "$TARGET" != prod ] || run="$QA_RUN"
          # the artifact store answers 503 now and then
          for try in 1 2 3; do
            gh run download "$run" --repo "$GITHUB_REPOSITORY" -n "cloud-web-$WEB_SHA256" -D "$d" && break
            [ "$try" -lt 3 ] || exit 1
            sleep 30
          done
          echo "$WEB_SHA256  $d/cloud-web.tar.gz" | sha256sum -c -
          # unpacked beside the version being served; the rollout switches to it in one rename
          # shellcheck disable=SC2029
          ssh node "/usr/local/sbin/maktaba-rollout web '$DEPLOY_ID'" < "$d/cloud-web.tar.gz"

      - name: Deploy (deploy.sh)
        timeout-minutes: 50
        env:
          RELAY_SSH_HOST: ${{ env.NODE_IP }}
          RELAY_SSH_USER: ${{ env.NODE_USER }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          MAKTABA_SYMBOLS_TOKEN: ${{ secrets.MAKTABA_SYMBOLS_TOKEN }}
        run: |
          set -euo pipefail
          RELAY_SSH_KNOWN_HOSTS="$(cat ~/.ssh/known_hosts_node)"
          export RELAY_SSH_KNOWN_HOSTS
          bash deploy/cloud-relay/deploy.sh apply
          ssh node 'cd /opt/maktaba-relay && docker compose --env-file .env ps --format "{{.Service}} {{.Status}}"'

      - name: The node's own CA (certificates before DNS)
        if: env.RELAY_TLS == 'internal'
        run: |
          set -euo pipefail
          ssh node 'cd /opt/maktaba-relay && docker compose --env-file .env exec -T caddy cat /data/caddy/pki/authorities/local/root.crt' > "$RUNNER_TEMP/node-ca.pem"
          openssl x509 -in "$RUNNER_TEMP/node-ca.pem" -noout -subject -enddate
          echo "CA_FILE=$RUNNER_TEMP/node-ca.pem" >> "$GITHUB_ENV"
          echo "PIN_HOSTS=1" >> "$GITHUB_ENV"

      - name: Test (deploy/cloud-relay/tests/e2e.py)
        env:
          HOME_IMAGE: ${{ needs.resolve.outputs.server_ref }}
          RUN_ID: ${{ github.run_id }}${{ github.run_attempt }}
          OUT: ${{ runner.temp }}/e2e
        run: |
          set -euo pipefail
          export NODE_SSH="ssh -F $HOME/.ssh/config node"
          # shellcheck disable=SC2016  # expands on the node
          NODE_PLAN="$(ssh node 'echo "$(nproc) vCPU, $(free -m | awk "/Mem:/{print \$2}") MB"')"
          export NODE_PLAN
          mode=full; [ "$TARGET" = prod ] && mode=smoke
          python3 deploy/cloud-relay/tests/e2e.py --mode "$mode"

      # whatever happened to the test (a runner that stopped it included), nothing it registered
      # stays active or linked
      - name: End the test accounts
        if: always() && steps.begin.outcome == 'success'
        run: |
          set -euo pipefail
          ssh node 'test ! -x /opt/maktaba-relay/ops/cloud-ops.py || /opt/maktaba-relay/ops/cloud-ops.py end-test-accounts' </dev/null | tee "$RUNNER_TEMP/ended.json"
          [ ! -s "$RUNNER_TEMP/ended.json" ] || jq -e '.left_active == 0 and .left_homes == 0' "$RUNNER_TEMP/ended.json" >/dev/null

      - name: The node's logs (on failure)
        if: failure() || cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          ssh node 'cd /opt/maktaba-relay && docker compose --env-file .env ps -a; docker compose --env-file .env logs --tail 300 --no-color' \
            </dev/null > "$RUNNER_TEMP/e2e/node-compose.log" 2>&1 || true

      - name: Commit (the node's set is this one)
        id: commit
        env:
          RELAY_SSH_HOST: ${{ env.NODE_IP }}
          RELAY_SSH_USER: ${{ env.NODE_USER }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
        run: |
          set -euo pipefail
          RELAY_SSH_KNOWN_HOSTS="$(cat ~/.ssh/known_hosts_node)"
          export RELAY_SSH_KNOWN_HOSTS
          bash deploy/cloud-relay/deploy.sh commit

      # anything failed or was cancelled after the deploy began: what was before comes back (a node
      # that can't go back is held, and this step says why). It is a unit of the node's own: started
      # in seconds, and done whether or not this run lives to see it.
      - name: Roll back (what was before this deploy)
        if: (failure() || cancelled()) && steps.begin.outcome != 'skipped' && steps.commit.outcome != 'success'
        env:
          RELAY_SSH_HOST: ${{ env.NODE_IP }}
          RELAY_SSH_USER: ${{ env.NODE_USER }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
        run: |
          set -euo pipefail
          RELAY_SSH_KNOWN_HOSTS="$(cat ~/.ssh/known_hosts_node)"
          export RELAY_SSH_KNOWN_HOSTS
          bash deploy/cloud-relay/deploy.sh rollback

      # before any further action runs on this runner
      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/node_key

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-${{ inputs.target || 'qa' }}
          path: ${{ runner.temp }}/e2e
          retention-days: 30
          if-no-files-found: ignore

  record:
    needs: [resolve, web, deploy]
    if: inputs.target != 'prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: What QA passed
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CLOUD: ${{ needs.resolve.outputs.cloud_ref }}
          SERVER: ${{ needs.resolve.outputs.server_ref }}
          CADDY: ${{ needs.resolve.outputs.caddy_ref }}
          POSTGRES: ${{ needs.resolve.outputs.postgres_ref }}
          REDIS: ${{ needs.resolve.outputs.redis_ref }}
          FILES: ${{ needs.resolve.outputs.files }}
          WEB_SHA256: ${{ needs.web.outputs.sha256 }}
        run: |
          [[ "$WEB_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no web bundle is named"; exit 1; }
          jq -n --arg tag "$TAG" --arg c "$CLOUD" --arg s "$SERVER" --arg k "$CADDY" --arg p "$POSTGRES" --arg r "$REDIS" --arg f "$FILES" \
            --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg w "$WEB_SHA256" \
            '{tag: $tag, cloud_ref: $c, server_ref: $s, caddy_ref: $k, postgres_ref: $p, redis_ref: $r, files: $f, web_sha256: $w, run: $run, workflow_sha: $sha}' \
            > qa-passed.json
          cat qa-passed.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-passed-${{ github.run_attempt }}
          path: qa-passed.json
          retention-days: 90
