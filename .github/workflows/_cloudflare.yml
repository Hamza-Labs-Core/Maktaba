# Epic 50 (stories 50.30, 50.31, 50.34): the cloud's Cloudflare files, checked offline. Called
# by ci.yml on pull requests (the `cloudflare` filter) and by cloudflare-zone.yml before it
# deploys. No secret, no network call to Cloudflare: the tools' tests run against local fakes,
# and the zone and Tunnel files are checked by their own scripts once they exist (50.30, 50.31).

name: Cloudflare (offline checks)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: tools/cloudflare/.nvmrc
          package-manager-cache: false

      # 50.34 T02, T04: the token check and the smoke checks on recorded answers; the ranges'
      # parser; and each tool's own tests as they arrive
      - name: The tools' tests
        run: node --test tools/cloudflare/

      # 50.30 T01: the zone file against its schema and the plan's rule counts
      - name: The zone file
        run: |
          if [ -f tools/cloudflare/zone.mjs ]; then
            node tools/cloudflare/zone.mjs check
          else
            echo "::notice::no zone file yet (story 50.30)"
          fi

      # 50.31 T05: the Tunnel's ingress (no relay name, a 404 catch-all)
      - name: The Tunnel's ingress
        run: |
          if [ -f tools/cloudflare/tunnel.mjs ]; then
            node tools/cloudflare/tunnel.mjs check
          else
            echo "::notice::no Tunnel file yet (story 50.31)"
          fi
