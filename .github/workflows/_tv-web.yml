# Reusable gate for the TV build of the big screen (Epic 58 stories 58.08 and 58.16): /tv/,
# the web UI the Samsung and LG launchers load, served by the home (`pnpm build:tv`).
#
#   - the big screen's Vitest (focus, tabs, letter rail, queue actions, the TV mode: T02);
#   - the build checks' own tests and `build:tv`, which fails on what Chromium 68 cannot run
#     (web/tv-build/tvcheck.mjs: es-check es2017 and the CSS lint, T01);
#   - Playwright on /tv/ against the mock home, D-pad keys only, 1920×1080, dark, English and
#     Arabic, with the CPU throttled ×6 for the timing (T03, T04).
#   - the Samsung and LG launcher (story 58.09): its Vitest (the subnet probe, the bridge, the
#     compatibility vectors, the bridge schema: T01, T02, T03, T06), its catalogs, its build
#     and the --bundle-ui build, checked for Chromium 68, and Playwright on the launcher opened
#     from file:// with a Tizen and a webOS shim, against a mock home on the TV's /24 (T04).
#   - LG webOS (story 58.11): the package's tests, the .ipk packed by ares-package and linted
#     (T02), and Playwright playing a video from /tv/ through the launcher's <video> (T04).
#
# The run keeps the screenshots, the console and network logs, the traces and the report for
# 30 days, passed or failed. No secret, no network call beyond the packages.

name: TV web UI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tv-web:
    name: TV web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      # restore only: main's entries (.github/actions/node-cache); only a push to main saves
      - name: pnpm store
        uses: ./.github/actions/node-cache
        with:
          package-manager: pnpm
          lock-hash: ${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Design tokens
        run: node web/design-system/build/build-tokens.mjs

      - name: The big screen's tests (T02)
        working-directory: web
        run: pnpm exec vitest run src/bigscreen src/tv src/pages/Login.test.tsx src/lib/swRuntime.test.ts src/lib/apiBearer.test.ts

      - name: The launcher's tests (58.09 T01, T02, T03, T06)
        working-directory: web
        run: pnpm exec vitest run ../apps/tv/web/src

      - name: The TV catalogs, English and Arabic
        run: python3 tools/i18n/check_tv_catalogs.py

      - name: The build checks' tests (T01)
        run: node --test web/tv-build/tv.test.mjs

      - name: build:tv, checked for Chromium 68 (T01)
        working-directory: web
        run: pnpm run build:tv

      - name: build:launcher:bundled (--bundle-ui), checked for Chromium 68
        working-directory: web
        run: pnpm run build:launcher:bundled

      - name: build:launcher, checked for Chromium 68
        working-directory: web
        run: pnpm run build:launcher

      # ---- LG webOS (58.11) -------------------------------------------------------------
      - name: The LG package's tests (58.11 T02)
        run: node --test apps/tv/web/webos/webos-package.test.mjs

      # ares-package (@webos-tools/cli, pinned in package.mjs) packs the launcher; nothing is
      # signed (LG signs on submission). The lint opens the .ipk and checks appinfo.json.
      - name: The LG .ipk, packed and linted (58.11 T02)
        env:
          IPK_VERSION: 1.0.${{ github.run_number }}
        run: |
          node apps/tv/web/webos/package.mjs --version "$IPK_VERSION" --out web/test-results/webos
          node apps/tv/web/webos/lint-ipk.mjs "web/test-results/webos/maktaba-webos-$IPK_VERSION.ipk" --version "$IPK_VERSION"

      - name: Chromium for Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: /tv/ with the D-pad, en and ar, and its timing (T03, T04)
        working-directory: web
        env:
          CI: 'true'
        run: pnpm e2e:tv

      - name: The launcher from file://, Samsung and LG, en and ar (58.09 T04)
        working-directory: web
        env:
          CI: 'true'
        run: pnpm e2e:launcher

      # the screenshots, the console and network logs, the traces and the report, passed or
      # failed (.github/actions/tv-logs: 30 days, linked from the job summary; story 58.16)
      - name: App logs
        if: always()
        uses: ./.github/actions/tv-logs
        with:
          name: tv-web-logs
          what: Playwright's screenshots (dark, en and ar), the launcher's log, console and network logs, traces and report
          path: |
            web/test-results/tv
            web/test-results/tv-report
            web/test-results/launcher
            web/test-results/launcher-report
            web/test-results/webos/*.ipk
