# Maktaba mobile client packaging (client-packaging epic) — Capacitor 6.
#
# Triggered on `v*` tags. Builds the iOS and Android wrappers around the
# shared `web/dist` SPA bundle and attaches the installable artifacts to
# the GitHub Release for that tag.
#
#   Android  →  maktaba-<version>.apk   (sideload)
#               maktaba-<version>.aab   (Play Store)
#   iOS      →  maktaba-<version>.ipa   (signing DEFERRED — see below)
#
# The web bundle carries the tag's version (VERSION, story 28.1): the app's
# update banner (story 28.5) compares it with the latest release. Only the
# sideloaded APK shows it (VITE_DISTRIBUTION=sideload); the AAB's bundle is a
# second web build marked store (copied in before bundleRelease), which shows
# none: the Play Store updates it, as the App Store does every iOS build.
#
# NATIVE PROJECTS ARE NOT CHECKED IN
# ----------------------------------
# `apps/mobile/{ios,android}` are gitignored and generated on demand by
# `npx cap add` (see apps/mobile/README.md). So each job scaffolds the
# native project with `cap add`, `cap sync`s the freshly built web bundle
# into it, then drives the platform build tool.
#
# ANDROID SIGNING
# ---------------
# A release APK/AAB is only installable when signed. Signing runs only
# when the keystore secrets are present (so forks without them still get a
# green "compiles + assembles" run, just with unsigned outputs). Only
# signed outputs are attached to the Release; unsigned ones stay a
# workflow artifact (`maktaba-<version>-unsigned.apk`) and the run warns.
# Secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of the .jks/.keystore
#   ANDROID_KEY_ALIAS        key alias inside the store
#   ANDROID_KEY_PASSWORD     key + store password (same value assumed)
#
# iOS SIGNING — DEFERRED (documented TODO)
# ----------------------------------------
# A distributable .ipa requires an Apple Developer account: a Distribution
# certificate + provisioning profile imported into the runner keychain,
# referenced from an ExportOptions.plist. None are provisioned yet, so the
# iOS job ARCHIVES WITHOUT SIGNING (`CODE_SIGNING_ALLOWED=NO`) to prove the
# project compiles and packs, and the signed `exportArchive` → .ipa step is
# left as a guarded TODO. To enable: add APPLE_CERTIFICATE_BASE64,
# APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64 and a real
# ExportOptions.plist, then drop `CODE_SIGNING_ALLOWED=NO`.
name: Mobile Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One run per tag at a time, never cancelled.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the tag-order guard (release.yml's guard opens the release as a draft)
  guard:
    uses: ./.github/workflows/_tag-guard.yml
    permissions:
      contents: write
      actions: read

  android:
    name: android (apk + aab)
    needs: [guard]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write # gh release upload
    # Hoisted to job level so the "Sign" step's `if:` can read them — a
    # step cannot reference its OWN step-level env in its `if` condition,
    # and the `secrets` context isn't available in `if:` at all.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The default package list includes the long-removed `tools`
        # package, which current sdkmanager rejects. Gradle installs the
        # platform + build-tools it needs on first build.
        with:
          packages: platform-tools

      - name: Build web bundle
        working-directory: web
        env:
          VERSION: ${{ github.ref_name }}
          VITE_DISTRIBUTION: sideload
        run: |
          pnpm install --frozen-lockfile
          node design-system/build/build-tokens.mjs
          pnpm build

      # Scaffold the native Android project (gitignored) and copy the web
      # bundle + plugins into it.
      - name: Add + sync Android platform
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          if [ ! -d android ]; then
            npx --no-install cap add android
          fi
          npx --no-install cap sync android

      # Stamp versionName (= tag) and a monotonic versionCode from the tag
      # (Story 28.1). The native project is scaffolded by `cap add`, so we
      # patch the generated build.gradle here. versionCode derivation
      # MAJOR*1_000_000 + MINOR*1_000 + PATCH stays well inside int32.
      - name: Stamp Android version from tag
        working-directory: apps/mobile/android
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          core="${ver%%-*}"
          IFS='.' read -r MA MI PA <<EOF
          ${core}
          EOF
          code=$(( ${MA:-0} * 1000000 + ${MI:-0} * 1000 + ${PA:-0} ))
          sed -i "s/versionName \"[^\"]*\"/versionName \"${ver}\"/" app/build.gradle
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${code}/" app/build.gradle
          echo "versionName=${ver} versionCode=${code}"
          grep -E "versionName|versionCode" app/build.gradle

      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      # The Play Store build's bundle says so: it shows no update banner
      # (story 28.5), the Play Store updates it once its review is through.
      - name: Rebuild the web bundle for the Play Store
        working-directory: web
        env:
          VERSION: ${{ github.ref_name }}
          VITE_DISTRIBUTION: store
        run: pnpm build

      - name: Bundle release AAB
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx --no-install cap copy android
          cd android
          ./gradlew --no-daemon bundleRelease

      # Sign only when a keystore is provided. apksigner (APK) + jarsigner
      # (AAB) live in the Android SDK that setup-android installed.
      - name: Sign Android artifacts
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/maktaba.keystore"
          BUILD_TOOLS="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${RUNNER_TEMP}/maktaba.keystore" \
            --ks-key-alias "${ANDROID_KEY_ALIAS}" \
            --ks-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "app/build/outputs/apk/release/app-release-signed.apk" \
            "${unsigned_apk}"
          jarsigner -keystore "${RUNNER_TEMP}/maktaba.keystore" \
            -storepass "${ANDROID_KEY_PASSWORD}" \
            -keypass "${ANDROID_KEY_PASSWORD}" \
            "app/build/outputs/bundle/release/app-release.aab" \
            "${ANDROID_KEY_ALIAS}"

      # Collect + version-stamp what was produced. Android won't install an
      # unsigned APK and Play rejects an unsigned AAB, so unsigned outputs
      # get an -unsigned name and are not attached to the Release (see
      # "Attach to GitHub Release").
      - name: Collect artifacts
        id: collect
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          apk_dir="apps/mobile/android/app/build/outputs/apk/release"
          aab="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "${apk_dir}/app-release-signed.apk" ]; then
            cp "${apk_dir}/app-release-signed.apk" "out/maktaba-${version}.apk"
            cp "${aab}" "out/maktaba-${version}.aab"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp "${apk_dir}/app-release-unsigned.apk" "out/maktaba-${version}-unsigned.apk"
            cp "${aab}" "out/maktaba-${version}-unsigned.aab"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            msg="ANDROID_KEYSTORE_BASE64 is not set, so the APK and AAB are unsigned. They are kept in the maktaba-android workflow artifact and not attached to the ${TAG} release."
            echo "::warning title=Android build not signed::${msg}"
            printf '### Android: not attached to the release\n\n%s\n' "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
          ( cd out && sha256sum maktaba-*.apk maktaba-*.aab > "maktaba-${version}-android.sha256" )
          ls -l out

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maktaba-android
          path: out/*
          retention-days: 14

      # Signed builds only. Without the keystore this step is skipped (release.yml's
      # guard opens the release).
      - name: Attach to GitHub Release
        if: steps.collect.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # To the tag's release, a draft until release.yml's signed files and the server apps
        # are in (it is never made public or the latest from here); a published release only
        # gains the files it lacks.
        run: tools/release/release-assets.sh upload "${TAG}" out/*

  ios:
    name: ios (ipa — signing deferred)
    needs: [guard]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web bundle
        working-directory: web
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          pnpm install --frozen-lockfile
          node design-system/build/build-tokens.mjs
          pnpm build

      # Scaffold the native iOS project (gitignored), sync the web bundle,
      # then install the CocoaPods the Capacitor plugins declare.
      - name: Add + sync iOS platform
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          if [ ! -d ios ]; then
            npx --no-install cap add ios
          fi
          npx --no-install cap sync ios

      - name: Install CocoaPods
        working-directory: apps/mobile/ios/App
        run: pod install

      # UNSIGNED archive — proves the project compiles + packs on CI.
      # `exportArchive` → a distributable .ipa needs a Distribution cert +
      # provisioning profile (see the header TODO); that step is left out
      # until signing material is provisioned.
      - name: Archive (unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${RUNNER_TEMP}/Maktaba.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # TODO(signing): once Apple Distribution cert + provisioning profile
      # are imported into the keychain and an ExportOptions.plist exists,
      # replace this with:
      #   xcodebuild -exportArchive \
      #     -archivePath "${RUNNER_TEMP}/Maktaba.xcarchive" \
      #     -exportOptionsPlist ExportOptions.plist \
      #     -exportPath "${RUNNER_TEMP}/export"
      #   cp "${RUNNER_TEMP}/export/App.ipa" "out/maktaba-${version}.ipa"
      #   gh release upload "${TAG}" out/maktaba-${version}.ipa --clobber
      - name: Note deferred signing
        run: |
          echo "::notice::iOS archive built UNSIGNED. A distributable .ipa requires Apple signing material — see the TODO in this workflow's 'Archive (unsigned)' step."
