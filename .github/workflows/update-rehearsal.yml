# The update rehearsal (docs/update-rehearsal.md): every update path the owner's Mac app
# runs, rehearsed on a Linux runner before any release. Required since 2026-10-28, after
# two outages in one day: every update path is proven in CI.
#
# The Mac app's install kind is driven through the same code on Linux: the app bundle's
# layout (Maktaba.app/Contents/Resources/server, the launcher run from its bin/, which
# finds the bundle by its path on any OS), its state root (the launcher's guard,
# payload-override, the kept payloads, state/database.json, app-install.json, the restart
# file), the bundled Postgres of a published release's Linux payload (PostgreSQL 16 with
# pgvector), and the desktop app's part of an update played by the test (it stages what
# the home orders, and at the home's go stops the server, swaps the bundle, starts it).
# Two releases' real binaries: the latest published release, built from its tag, and this
# commit; signed by a local fake Sigstore, published on a fake GitHub (-tags e2etrust).
#
# Jobs: kit (the binaries and the bundled Postgres), seed (the seeded homes, cached per
# previous release: two million vectors take minutes to make; each scenario takes its
# seed from this run, as an artifact), one job per scenario
# (api/rehearsal_*_e2e_test.go), and update-rehearsal, the verdict. A scenario whose fix
# has not merged yet is expected to fail (tools/rehearsal/expected-failures.txt): its
# failure is reported, not counted, until the fix's PR is in the commit rehearsed; from
# then on it is required. The release's tag guard (tools/release/tag-guard.sh) refuses to
# release a commit this workflow did not pass on.

name: Update rehearsal

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      # the update, the restore, the migrations, the supervisor, the launcher, TV staging,
      # the schema
      - 'cmd/maktaba-server/internal/updater/**'
      - 'cmd/maktaba-server/internal/dbsafe/**'
      - 'cmd/maktaba-server/internal/pgbundle/**'
      - 'cmd/maktaba-server/internal/apppayload/**'
      - 'cmd/maktaba-server/internal/appruntime/**'
      - 'cmd/maktaba-server/internal/supervisor/**'
      - 'cmd/maktaba-server/internal/attempts/**'
      - 'cmd/maktaba-server/internal/config/**'
      - 'cmd/maktaba-server/internal/devmigrate/**'
      - 'cmd/maktaba-server/internal/nodecopy/**'
      - 'cmd/maktaba-server/internal/selfupdate/**'
      - 'cmd/maktaba-server/internal/machineagent/**'
      - 'cmd/maktaba-server/internal/componentseed/**'
      - 'shared/components/**'
      # the packs an update carries (story 51.18, scenarios 13 and 14)
      - 'cmd/maktaba-server/internal/packs/**'
      - 'shared/go/componentpack/**'
      - 'tools/release/packs/**'
      - 'tools/release/componentsindex/**'
      - 'tools/release/cmd/**'
      - 'cmd/maktaba-server/serve*.go'
      - 'cmd/maktaba-server/stream_gate*.go'
      - 'cmd/maktaba-server/cmd_serve.go'
      - 'cmd/maktaba-server/cmd_update*.go'
      - 'cmd/maktaba-server/cmd_restore.go'
      - 'cmd/maktaba-server/go.mod'
      - 'cmd/maktaba-launcher/**'
      - 'api/internal/updates/**'
      - 'api/internal/tvchange/**'
      - 'api/internal/cluster/**'
      - 'api/internal/handlers/clusterauth/**'
      - 'api/migrate*.go'
      - 'api/schema_ahead*.go'
      - 'api/node_*.go'
      - 'api/self_update*.go'
      - 'api/go.mod'
      - 'shared/go/layout/**'
      - 'shared/go/ports/**'
      - 'shared/go/releaseverify/**'
      - 'shared/db/migrations/**'
      # the rehearsal itself
      - 'api/rehearsal_*_e2e_test.go'
      - 'api/autoupdate_*e2e_test.go'
      - 'api/twomachine_e2e_test.go'
      - 'tools/rehearsal/**'
      - 'tools/release/linux-app/pins.env'
      - '.github/workflows/update-rehearsal.yml'
  push:
    branches: [main, 'release/**']
    # a push that changes only the Claude trail starts no run: it would join the
    # update-rehearsal-main group and replace the pending run of the code commit before it,
    # the one waiting to be tagged (trail-only commits are never tagged; see ci.yml)
    paths-ignore: ['docs/claude-trail.md', 'docs/trail/**']
  schedule:
    - cron: '17 6 * * *' # nightly, 06:17 UTC
  workflow_dispatch:
    inputs:
      prev_tag:
        description: "the previous release to update from (default: the latest published stable release below this commit)"
        required: false
        default: ''
      cur_ref:
        description: "rehearse this ref's code as 'this commit' (default: the checkout); the harness stays the checkout's"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # As ci.yml: per PR (cancelled by a newer push); one group for main's pushes, NOT
  # cancel-in-progress: the running rehearsal finishes and a newer commit's run replaces
  # only the older pending one (the tag guard needs a finished green run on the tagged
  # commit); a re-run, the nightly run, a hand run and a release/** push get their commit's
  # own group and are never cancelled.
  group: update-rehearsal-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1') && 'main' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the same absolute paths in every job (a seeded machine links its payload's Postgres by
  # path), outside the checkout; actions/cache takes no '..' in a path
  KIT: /home/runner/rh-kit
  SEEDS: /home/runner/rh-seeds

jobs:
  kit:
    name: kit (two releases' binaries, the bundled Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # the binaries of four releases and three packs (story 51.18)
    outputs:
      prev: ${{ steps.prev.outputs.tag }}
      expect_fail: ${{ steps.expected.outputs.list }}
      expected_notes: ${{ steps.expected.outputs.notes }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('api/go.sum', 'streaming/go.sum', 'cmd/maktaba-server/go.sum', 'cmd/maktaba-launcher/go.sum', 'tools/release/go.sum') }}

      # this job's Go modules, retried (offline: false: see .github/actions/go-mod-download)
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api streaming cmd/maktaba-server cmd/maktaba-launcher tools/release
          offline: "false"

      # the release's pack build (tools/rehearsal/build.sh: the tool.yt-dlp pack of each of
      # this commit's releases, scenarios 13 and 14)
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # release.yml's uv: the same pins
          version: "0.13.4"

      - name: The previous release
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.prev_tag }}
        run: |
          set -euo pipefail
          if [ -n "${WANT}" ]; then
            tag="${WANT}"
          else
            # the latest published stable release that is not this commit's own tag
            head="$(git rev-parse HEAD)"
            tag=""
            for t in $(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' | sort -rV); do
              git rev-parse -q --verify "refs/tags/$t" >/dev/null || git fetch -q origin "+refs/tags/$t:refs/tags/$t"
              [ "$(git rev-list -n1 "$t")" = "$head" ] && continue
              tag="$t"; break
            done
          fi
          [ -n "${tag}" ] || { echo "::error::no published release to update from"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "the previous release: ${tag} ($(git rev-list -n1 "${tag}"))"

      - name: The scenarios expected to fail until their fix merges
        id: expected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          list='[]' notes=''
          while read -r scenario pr why; do
            case "${scenario}" in ''|'#'*) continue ;; esac
            merge="$(gh pr view "${pr}" --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid' </dev/null 2>/dev/null || true)"
            if [ -n "${merge}" ] && git merge-base --is-ancestor "${merge}" HEAD 2>/dev/null; then
              echo "${scenario}: #${pr} is in this commit: required"
              continue
            fi
            echo "${scenario}: expected to fail until #${pr} merges (${why})"
            list="$(jq -c --arg s "${scenario}" '. + [$s]' <<<"${list}")"
            notes="${notes}${scenario}: #${pr}; "
          done < tools/rehearsal/expected-failures.txt
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: Build the two releases
        env:
          PREV: ${{ steps.prev.outputs.tag }}
          CUR_REF: ${{ inputs.cur_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src-prev"
          git archive "${PREV}" | tar -x -C "$RUNNER_TEMP/src-prev"
          cur="$GITHUB_WORKSPACE"
          if [ -n "${CUR_REF}" ]; then
            git fetch -q origin "${CUR_REF}" || true
            mkdir -p "$RUNNER_TEMP/src-cur"
            git archive "$(git rev-parse "${CUR_REF}" 2>/dev/null || git rev-parse FETCH_HEAD)" | tar -x -C "$RUNNER_TEMP/src-cur"
            cur="$RUNNER_TEMP/src-cur"
            echo "::notice::rehearsing ${CUR_REF} as this commit (the harness is the checkout's)"
          fi
          tools/rehearsal/build.sh --prev-src "$RUNNER_TEMP/src-prev" --prev-version "${PREV#v}" --cur-src "${cur}" --out "$KIT"
          {
            echo "### Update rehearsal: the kit"
            echo '```'
            cat "$KIT/versions.env"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # restore only; the save after the download runs on a push to main (a pull request's
      # entry would push main's out of the repository's 10 GB cache)
      - id: pg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.KIT }}/pg
          key: rehearsal-pg-${{ steps.prev.outputs.tag }}-${{ runner.arch }}

      - name: The bundled Postgres (the previous release's Linux payload)
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.prev.outputs.tag }}
        run: tools/rehearsal/postgres.sh --tag "${PREV}" --out "$KIT/pg"

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.KIT }}/pg
          key: rehearsal-pg-${{ steps.prev.outputs.tag }}-${{ runner.arch }}

      - name: Pack the kit
        run: tar -C "$KIT/.." -cf "$RUNNER_TEMP/rh-kit.tar" "$(basename "$KIT")"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rehearsal-kit
          path: ${{ runner.temp }}/rh-kit.tar
          retention-days: 3
          compression-level: 6

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  seed:
    name: seed (${{ matrix.profile }})
    needs: [kit]
    runs-on: ubuntu-24.04
    timeout-minutes: 75 # a cold full seed: 2M vectors and their HNSW index on 4 vCPUs
    strategy:
      fail-fast: false
      matrix:
        profile: [full, restore, small]
    steps:
      - uses: actions/checkout@v6.0.2

      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SEEDS }}
          key: rehearsal-seed-${{ needs.kit.outputs.prev }}-${{ matrix.profile }}-${{ hashFiles('api/rehearsal_seed_e2e_test.go') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('api/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-mod-download
        with:
          modules: api

      - name: Download rehearsal-kit
        id: artifact-rehearsal-kit
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-kit
          path: ${{ runner.temp }}
      - name: Wait 15s to retry the download of rehearsal-kit
        if: steps.artifact-rehearsal-kit.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Download rehearsal-kit (attempt 2)
        id: artifact-rehearsal-kit-2
        if: steps.artifact-rehearsal-kit.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-kit
          path: ${{ runner.temp }}
      - name: Wait 45s to retry the download of rehearsal-kit
        if: steps.artifact-rehearsal-kit-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Download rehearsal-kit (attempt 3)
        id: artifact-rehearsal-kit-3
        if: steps.artifact-rehearsal-kit-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-kit
          path: ${{ runner.temp }}
      - name: Check rehearsal-kit downloaded
        id: artifact-rehearsal-kit-check
        if: steps.artifact-rehearsal-kit-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: rehearsal-kit
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1

      - name: Seed the home (${{ matrix.profile }})
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: api
        env:
          MAKTABA_E2E_REHEARSAL: '1'
          MAKTABA_REHEARSAL_PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          mkdir -p "$KIT" && tar -C "$KIT/.." -xf "$RUNNER_TEMP/rh-kit.tar"
          python3 -m venv --without-pip "$RUNNER_TEMP/venv-probe" 2>/dev/null || {
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends python3-venv >/dev/null
          }
          MAKTABA_REHEARSAL_KIT="$KIT" MAKTABA_REHEARSAL_PG_HOME="$KIT/pg" MAKTABA_REHEARSAL_SEEDS="$SEEDS" \
            MAKTABA_REHEARSAL_WORK="$RUNNER_TEMP/rh-work" MAKTABA_E2E_LOG_DIR="$RUNNER_TEMP/rh-logs" \
            go test -count=1 -timeout 70m -run '^TestUpdateRehearsalSeed$' -v . 2>&1 | tee "$RUNNER_TEMP/seed.out"
          grep -q -- '--- PASS: TestUpdateRehearsalSeed ' "$RUNNER_TEMP/seed.out" || { echo "::error::the seed did not run"; exit 1; }
          du -sh "$SEEDS"/* || true

      # only a push to main saves a seed; a pull request builds its own and reads main's
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SEEDS }}
          key: rehearsal-seed-${{ needs.kit.outputs.prev }}-${{ matrix.profile }}-${{ hashFiles('api/rehearsal_seed_e2e_test.go') }}

      # the scenarios take the seed from this run, not from the cache: the cache is the
      # repository's 10 GB shared by every branch's builds, and GitHub evicts what was used
      # least, so a seed saved here was gone by the time its scenarios ran (2026-10-31, the
      # small seed on main and on #440). The cache only spares the seed's building; a tar
      # keeps the seed's symlinks and modes, which an artifact's zip does not
      - name: Hand the seed to the scenarios
        run: tar -C "$SEEDS" -cf "$RUNNER_TEMP/rh-seed-${{ matrix.profile }}.tar" .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rehearsal-seed-${{ matrix.profile }}
          path: ${{ runner.temp }}/rh-seed-${{ matrix.profile }}.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rehearsal-seed-logs-${{ matrix.profile }}
          path: ${{ runner.temp }}/rh-logs
          if-no-files-found: ignore

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  scenario:
    name: ${{ matrix.id }} ${{ matrix.name }}
    needs: [kit, seed]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # a scenario whose fix has not merged yet is expected to fail: reported, not counted
    continue-on-error: ${{ contains(fromJSON(needs.kit.outputs.expect_fail), matrix.test) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: '01', name: normal update with migrations (full seed), test: TestUpdateRehearsal01NormalUpdate, profile: full }
          - { id: '02', name: the TV's change waits during the watch, test: TestUpdateRehearsal02WatchWithTVWaiting, profile: restore }
          - { id: '03', name: rollback after additive migrations, test: TestUpdateRehearsal03RollbackAdditive, profile: restore }
          - { id: '04', name: rollback after a destructive migration, test: TestUpdateRehearsal04RollbackDestructive, profile: restore }
          - { id: '05', name: the restore under concurrent logins, test: TestUpdateRehearsal05RestoreUnderLogins, profile: restore }
          - { id: '06', name: the restore killed part way, test: TestUpdateRehearsal06RestoreKilled, profile: restore }
          - { id: '07', name: halted roles recover by themselves, test: TestUpdateRehearsal07HaltRecovers, profile: small }
          - { id: '08', name: no room for two copies, test: TestUpdateRehearsal08NoRoom, profile: small }
          - { id: '09', name: from the owner's Mac's live state, test: TestUpdateRehearsal09FromTheLiveState, profile: small }
          - { id: '10a', name: machines after the home (the driver), test: TestUpdateRehearsal10aMachinesAfterHomeDriver, profile: small }
          - { id: '10b', name: machines after the home (their own updater), test: TestUpdateRehearsal10bMachineOwnUpdater, profile: small }
          - { id: '11', name: the TV's change restarts a slot left on the old release, test: TestUpdateRehearsal11TVChangeRestartsARunningSlot, profile: small }
          - { id: '12', name: no behaviour change (an update of a seeded home), test: TestUpdateRehearsal12NoBehaviourChange, profile: small }
          - { id: '13', name: an update carries the packs and a rollback finds the kept one, test: TestUpdateRehearsal13UpdateWithPacks, profile: small }
          - { id: '14', name: a pack that fails its verification stops the update, test: TestUpdateRehearsal14PackFailsVerification, profile: small }
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('api/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api

      - name: Download rehearsal-kit
        id: artifact-rehearsal-kit
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-kit
          path: ${{ runner.temp }}
      - name: Wait 15s to retry the download of rehearsal-kit
        if: steps.artifact-rehearsal-kit.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Download rehearsal-kit (attempt 2)
        id: artifact-rehearsal-kit-2
        if: steps.artifact-rehearsal-kit.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-kit
          path: ${{ runner.temp }}
      - name: Wait 45s to retry the download of rehearsal-kit
        if: steps.artifact-rehearsal-kit-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Download rehearsal-kit (attempt 3)
        id: artifact-rehearsal-kit-3
        if: steps.artifact-rehearsal-kit-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-kit
          path: ${{ runner.temp }}
      - name: Check rehearsal-kit downloaded
        id: artifact-rehearsal-kit-check
        if: steps.artifact-rehearsal-kit-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: rehearsal-kit
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1

      - name: Download rehearsal-seed-${{ matrix.profile }}
        id: artifact-rehearsal-seed
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-seed-${{ matrix.profile }}
          path: ${{ runner.temp }}
      - name: Wait 15s to retry the download of rehearsal-seed-${{ matrix.profile }}
        if: steps.artifact-rehearsal-seed.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Download rehearsal-seed-${{ matrix.profile }} (attempt 2)
        id: artifact-rehearsal-seed-2
        if: steps.artifact-rehearsal-seed.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-seed-${{ matrix.profile }}
          path: ${{ runner.temp }}
      - name: Wait 45s to retry the download of rehearsal-seed-${{ matrix.profile }}
        if: steps.artifact-rehearsal-seed-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Download rehearsal-seed-${{ matrix.profile }} (attempt 3)
        id: artifact-rehearsal-seed-3
        if: steps.artifact-rehearsal-seed-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-seed-${{ matrix.profile }}
          path: ${{ runner.temp }}
      - name: Check rehearsal-seed-${{ matrix.profile }} downloaded
        id: artifact-rehearsal-seed-check
        if: steps.artifact-rehearsal-seed-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: rehearsal-seed-${{ matrix.profile }}
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1

      - name: The kit, the seed, Python's venv
        run: |
          set -euo pipefail
          mkdir -p "$KIT" && tar -C "$KIT/.." -xf "$RUNNER_TEMP/rh-kit.tar"
          mkdir -p "$SEEDS" && tar -C "$SEEDS" -xf "$RUNNER_TEMP/rh-seed-${{ matrix.profile }}.tar"
          rm -f "$RUNNER_TEMP/rh-seed-${{ matrix.profile }}.tar"
          cat "$KIT/versions.env"
          python3 -m venv --without-pip "$RUNNER_TEMP/venv-probe" 2>/dev/null || {
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends python3-venv >/dev/null
          }

      - name: A small volume of its own (no room for two copies)
        if: matrix.id == '08'
        run: |
          set -euo pipefail
          truncate -s 6G "$RUNNER_TEMP/small.img"
          mkfs.ext4 -q -F "$RUNNER_TEMP/small.img"
          sudo mkdir -p /mnt/rh-small
          sudo mount -o loop "$RUNNER_TEMP/small.img" /mnt/rh-small
          sudo chown "$(id -u):$(id -g)" /mnt/rh-small
          df -h /mnt/rh-small
          echo "MAKTABA_REHEARSAL_SMALL_VOLUME=/mnt/rh-small" >> "$GITHUB_ENV"

      - name: ${{ matrix.id }} ${{ matrix.name }}
        working-directory: api
        env:
          MAKTABA_E2E_REHEARSAL: '1'
          MAKTABA_REHEARSAL_REQUIRE_ALL: '1'
          TEST: ${{ matrix.test }}
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.id }} ${{ matrix.name }}"
            echo "| test | what | downtime | budget |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          MAKTABA_REHEARSAL_KIT="$KIT" MAKTABA_REHEARSAL_PG_HOME="$KIT/pg" MAKTABA_REHEARSAL_SEEDS="$SEEDS" \
            MAKTABA_REHEARSAL_WORK="$RUNNER_TEMP/rh-work" MAKTABA_E2E_LOG_DIR="$RUNNER_TEMP/rh-logs" \
            go test -count=1 -timeout 45m -run "^${TEST}\$" -v . 2>&1 | tee "$RUNNER_TEMP/scenario.out"
          grep -q -- "--- PASS: ${TEST} " "$RUNNER_TEMP/scenario.out" || { echo "::error::${TEST} did not pass"; exit 1; }

      - name: What failed
        if: failure()
        run: |
          grep -E '^\s+rehearsal_.*(Error|error|want|not |FAIL|timed out)' "$RUNNER_TEMP/scenario.out" | sed -n 1,40p || true
          ls -la "$RUNNER_TEMP/rh-logs" 2>/dev/null || true

      - name: Keep the servers' logs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rehearsal-logs-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/rh-logs
            ${{ runner.temp }}/scenario.out
          if-no-files-found: ignore

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  update-rehearsal:
    name: update-rehearsal
    needs: [kit, seed, scenario]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: The verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.kit.outputs.expected_notes }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          if [ -n "${EXPECTED}" ]; then
            echo "::notice::expected to fail until their fix merges (reported, not counted): ${EXPECTED}"
            echo "Expected to fail until their fix merges (not counted): ${EXPECTED}" >> "$GITHUB_STEP_SUMMARY"
          fi
          fail=0
          for j in kit seed scenario; do
            r="$(echo "$RESULTS" | jq -r ".\"$j\".result")"
            [ "$r" = success ] || { echo "::error::$j: $r"; fail=1; }
          done
          exit $fail
