# Deploys maktaba.tv, the website (web/packages/website, Epic 60 README §6.3, story 60.03), to
# Cloudflare Workers.
#
# On a push to main that changes the site or a source it is built from, by hand (Actions →
# Deploy maktaba.tv → Run workflow), and monthly: each build renders security.txt with an
# Expires 11 months after the build day, so the monthly deploy keeps it ahead. Pull requests
# never deploy: ci.yml's website job builds and tests them. The deploy runs only after this
# run's own build and tests pass, and deploys the dist/ that build uploaded.
#
# The token is CLOUDFLARE_API_TOKEN_WEBSITE when that secret is set, and otherwise the shared
# CLOUDFLARE_API_TOKEN, as the other Cloudflare deploys do (deploy/cloudflare/README.md, the
# token table: the shared token is the union of the rows, the website's included).
#
# The repository variable WEBSITE_LIVE = true is the only go-live switch, and the safeguard
# against publishing maktaba.tv by accident: without it nothing is uploaded, promoted, attached
# or rolled back, whatever the secrets (tools/ci/tests/test_website_deploy.py keeps every write
# behind it). The deploy job then prints a notice naming what is missing and passes.
#
# The token check runs even while WEBSITE_LIVE is unset, as soon as a token and the account are
# set: it is read-only (GET calls only: verify, the zone, the token's policy or one read per
# permission), so a missing permission is named on every push to main, not first at go-live.
# While the site is not live a failed check is reported (an error annotation naming the
# permission, and the job summary) without failing the run; once live it stops the deploy.
#
# The nightly sweep (website-nightly.yml, story 60.04): a red sweep blocks the deploy until a
# fix lands. The nightly job reads the latest sweep (tools/ci/website_nightly_state.sh); when it
# failed, this run's build measures the pages it failed again (Lighthouse, 3 runs, median), and
# the deploy goes on only when they pass; a failed sweep whose pages cannot be read refuses the
# deploy outright. A rollback is never held back by it.
#
# The steps (tools/cloudflare/website-deploy.mjs): the token check; record the version serving
# now; upload the new version (not live) and smoke its preview URL; promote it at 100% and
# apply the custom domains (`triggers deploy`); smoke the live site, and on failure roll back
# to the recorded version and fail. By hand, `rollback: true` returns the site to the
# `version` input, or else to the deployment before the current one.

name: Deploy maktaba.tv

on:
  push:
    branches: [main]
    # the website filter of .github/ci-paths.yml: what the site is built from
    paths:
      - 'web/packages/website/**'
      - 'web/packages/install/**'
      - 'web/vite.install.config.ts'
      - 'web/src/help/content/**'
      - 'shared/api/problems.json'
      - 'shared/log/schema/**'
      - 'cloud/internal/privacy/**'
      - 'cloud/cmd/privacy-json/**'
      - 'docs/app-privacy.md'
      - 'LICENSE'
      - 'api/internal/security/disclosure.go'
      - 'web/design-system/tokens/**'
      - 'web/public/icons/**'
      - 'tools/ci/website_nightly_state.sh'
      - 'tools/cloudflare/smoke.mjs'
      - 'tools/cloudflare/token-check.mjs'
      - 'tools/cloudflare/website-deploy.mjs'
      - '.github/workflows/_website.yml'
      - '.github/workflows/website-deploy.yml'
      # the demo library the product shots are taken on (60.09): a change rebuilds the same site
      - 'tests/fixtures/demo-library/**'
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll maktaba.tv back instead of deploying"
        type: boolean
        default: false
      version:
        description: "With rollback: the version id to return to (empty: the deployment before the current one)"
        type: string
        default: ""
  # the 1st of each month, 06:37 UTC: security.txt's Expires rolls forward
  schedule:
    - cron: '37 6 1 * *'

permissions:
  contents: read

# one deploy at a time; a newer commit's run waits for the running one, never cancels it
concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  # the latest nightly sweep on main: green, none yet, red (with the pages it failed), or red
  # and unreadable
  nightly:
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      state: ${{ steps.latest.outputs.state }}
      failed: ${{ steps.latest.outputs.failed }}
      run: ${{ steps.latest.outputs.run }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: The latest nightly sweep
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash tools/ci/website_nightly_state.sh

  # the same build and tests as the pull request ran, on this commit (a rollback builds nothing),
  # with the pages the last nightly sweep failed measured again
  build:
    needs: [nightly]
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/_website.yml
    with:
      lighthouse_extra: ${{ needs.nightly.outputs.failed }}

  deploy:
    needs: [nightly, build]
    if: ${{ always() && (needs.build.result == 'success' || (inputs.rollback && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # its rules (required reviewers, if set) apply, as to every Cloudflare deploy
    environment: production
    defaults:
      run:
        working-directory: web/packages/website
    steps:
      # The go-live gate: a token (the website's own, else the shared one), the account, and
      # vars.WEBSITE_LIVE. `check` (a token and the account) lets the read-only token check
      # run; `ok` (those and WEBSITE_LIVE = true) lets anything write.
      # (tools/ci/tests/test_website_deploy.py keeps every later step behind them.)
      - name: Go-live gate
        id: gate
        working-directory: .
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WEBSITE || secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE: ${{ vars.WEBSITE_LIVE }}
        run: |
          missing=()
          [ -n "$TOKEN" ] || missing+=("the secret CLOUDFLARE_API_TOKEN (or CLOUDFLARE_API_TOKEN_WEBSITE)")
          [ -n "$ACCOUNT" ] || missing+=("the secret CLOUDFLARE_ACCOUNT_ID")
          if [ -n "$ACCOUNT" ]; then echo "::add-mask::$ACCOUNT"; fi
          if [ ${#missing[@]} -eq 0 ]; then echo "check=true" >> "$GITHUB_OUTPUT"; else echo "check=false" >> "$GITHUB_OUTPUT"; fi
          [ "$LIVE" = "true" ] || missing+=("the repository variable WEBSITE_LIVE = true")
          if [ ${#missing[@]} -gt 0 ]; then
            list=$(printf '%s, ' "${missing[@]}")
            echo "::notice title=maktaba.tv not deployed::not set: ${list%, } (see deploy/cloudflare/README.md, the website's row)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6.0.2
        if: steps.gate.outputs.check == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        if: steps.gate.outputs.check == 'true'
        with:
          node-version-file: web/packages/website/.nvmrc
          package-manager-cache: false

      # wrangler at the version package-lock.json pins (`triggers deploy` is experimental)
      - name: Install
        if: steps.gate.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund

      # Read-only, and before any write: the token can deploy Workers, their routes, and the
      # custom domains' DNS records on maktaba.tv. It runs while the site is not live too, so a
      # missing permission is named now; not live, a failure is reported without failing the
      # run (the Report step), live, it stops the deploy.
      - name: Token check
        id: token
        if: steps.gate.outputs.check == 'true'
        continue-on-error: ${{ steps.gate.outputs.ok != 'true' }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WEBSITE || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node tools/cloudflare/token-check.mjs --pieces workers,dns --zone maktaba.tv | tee token-check.log
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: Token check report
        if: always() && steps.gate.outputs.check == 'true'
        working-directory: .
        env:
          OUTCOME: ${{ steps.token.outcome }}
          LIVE: ${{ steps.gate.outputs.ok }}
        run: |
          {
            echo "### maktaba.tv: the Cloudflare token check"
            echo
            echo "Outcome: ${OUTCOME} (site live: ${LIVE})"
            echo
            echo '```'
            cat token-check.log 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != "success" ] && [ "$LIVE" != "true" ]; then
            echo "::warning title=maktaba.tv token::the token check failed while the site is not live; the missing permissions are named above and in the summary. Add them to the token before setting WEBSITE_LIVE."
          fi

      # The nightly sweep's gate (story 60.04): green or none yet, go on; red, go on only because
      # this run's build measured the failing pages again and they passed (the deploy needs the
      # build); red with no readable list of pages, refuse.
      # (tools/ci/tests/test_website_deploy.py runs this script with each state.)
      - name: Nightly sweep gate
        if: steps.gate.outputs.ok == 'true' && !inputs.rollback
        working-directory: .
        env:
          STATE: ${{ needs.nightly.outputs.state }}
          FAILED: ${{ needs.nightly.outputs.failed }}
          RUN: ${{ needs.nightly.outputs.run }}
        run: |
          case "$STATE" in
            green) echo "the latest nightly sweep passed (${RUN})" ;;
            none) echo "::notice title=maktaba.tv nightly::no nightly sweep has finished yet" ;;
            red)
              echo "::notice title=maktaba.tv nightly::the latest sweep (${RUN}) failed on ${FAILED}; this run's build measured those pages again and they pass"
              ;;
            *)
              echo "::error title=maktaba.tv not deployed::the latest nightly sweep (${RUN:-unknown}) is red and its failing pages cannot be read (state: ${STATE:-empty}); fix forward or revert, then dispatch website-nightly.yml"
              exit 1
              ;;
          esac

      # the site the build job built and tested
      - name: Download website-site
        id: artifact-website-site
        if: steps.gate.outputs.ok == 'true' && !inputs.rollback
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: website-site
          path: web/packages/website/dist
      - name: Wait 15s to retry the download of website-site
        if: steps.artifact-website-site.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Download website-site (attempt 2)
        id: artifact-website-site-2
        if: steps.artifact-website-site.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: website-site
          path: web/packages/website/dist
      - name: Wait 45s to retry the download of website-site
        if: steps.artifact-website-site-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Download website-site (attempt 3)
        id: artifact-website-site-3
        if: steps.artifact-website-site-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: website-site
          path: web/packages/website/dist
      - name: Check website-site downloaded
        id: artifact-website-site-check
        if: steps.artifact-website-site-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: website-site
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1

      # record the live version, stage, smoke the preview, promote, apply the domains, smoke
      # live; on a failed live smoke, roll back to the recorded version and fail
      - name: Deploy
        id: deploy
        if: steps.gate.outputs.ok == 'true' && !inputs.rollback
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WEBSITE || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/cloudflare/website-deploy.mjs deploy --sha "$GITHUB_SHA"

      - name: Roll back
        id: rollback
        if: steps.gate.outputs.ok == 'true' && inputs.rollback
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WEBSITE || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ inputs.version }}
          ACTOR: ${{ github.actor }}
        run: node tools/cloudflare/website-deploy.mjs rollback --actor "$ACTOR" --version "$VERSION"

      - name: Summary
        if: always() && steps.gate.outputs.ok == 'true'
        working-directory: .
        env:
          PREVIOUS: ${{ steps.deploy.outputs.previous_id }}
          DEPLOYED: ${{ steps.deploy.outputs.version_id || steps.rollback.outputs.version_id }}
        run: |
          {
            echo "### maktaba.tv"
            echo "- version before this run: ${PREVIOUS:-n/a (rollback)}"
            echo "- version this run made live: ${DEPLOYED:-none}"
            echo "- roll back by hand: Actions → Deploy maktaba.tv → Run workflow, rollback: true (version: the one above)"
          } >> "$GITHUB_STEP_SUMMARY"
