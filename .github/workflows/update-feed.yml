# The release feed (docs/updates.md, "How a home finds a release"): what every home reads to
# find the releases it can install, instead of GitHub's list of every release (10.5 MB for 30
# releases on 2026-11-23, past every home's cap: no home saw a release for a day).
#
# Per channel (stable, beta) and platform (each release.json platform: darwin-amd64,
# darwin-arm64, linux-amd64, linux-arm64, windows-amd64), one file listing the newest 10
# releases with only that platform's files (a NAS's container is linux-*), and the channel's
# index.json; each signed keyless here (cosign sign-blob, <file>.sigstore.json). Homes verify
# the signature with shared/go/releaseverify (VerifyFeed): this workflow, on main, of this
# repository, started by workflow_run, workflow_dispatch or schedule. No key, no secret.
#
# When:
#   - after each release: when release.yml or desktop-release.yml completes (whichever
#     publishes the release last: tools/release/release-assets.sh). A release still a draft
#     writes nothing (the other workflow's end runs this again); a published one is required:
#     the run fails unless every platform's feed lists it, verified.
#   - a release pulled: the repository variable UPDATE_FEED_WITHDRAWN ({"0.3.158": "why"}),
#     then Actions → Update feed → Run workflow (tools/release/pull-release.sh does both). A
#     pulled release stays in the feed marked withdrawn; homes never install it.
#   - weekly, so the newest feed's artifact (90 days) never expires.
#
# It writes the feed only from published releases each verified as a home verifies them
# (release-feed generate), then signs, then verifies what it signed with the homes' code
# (release-feed verify), then uploads it as the update-feed artifact and starts maktaba.tv's
# deploy (website-deploy.yml), which serves the newest such artifact under /updates/v1/. Then
# it waits for maktaba.tv to serve it (release-feed live): the live check fails the run when
# the live feed does not list the release for every platform within 100 minutes (a site
# deploy takes 30 to 60, waiting its turn).

name: Update feed

on:
  workflow_run:
    workflows: [Release, Desktop Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "A release the feed must list for every platform (empty: none; a pull needs none)"
        type: string
        default: ""
  # Mondays 05:41 UTC
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

# one at a time, never cancelled: each run writes the whole feed from what is published now, so
# a pending run that a newer one replaces loses nothing
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  feed:
    name: write, sign and publish the release feed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # keyless cosign: the feed's signature names this workflow
      actions: write # gh workflow run website-deploy.yml
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      written: ${{ steps.which.outputs.write }}
    steps:
      - name: Which release
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          none() { echo "::notice::$1"; echo "write=false" >>"${GITHUB_OUTPUT}"; exit 0; }
          # homes accept a feed signed on main only
          [ "${GITHUB_REF}" = refs/heads/main ] || none "a run from ${GITHUB_REF} writes no feed (homes accept main's only)"
          tag=""
          case "${EVENT}" in
            workflow_dispatch) tag="${INPUT_TAG}" ;;
            schedule) ;;
            *)
              case "${RUN_EVENT}" in
                push | workflow_dispatch) ;;
                *) none "the run (${RUN_EVENT}) was no tag's release" ;;
              esac
              case "${RUN_TAG}" in
                v[0-9]*.[0-9]*.[0-9]*) ;;
                *) none "${RUN_TAG} is not a release tag" ;;
              esac
              draft="$(gh release view "${RUN_TAG}" --repo "${REPO}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
              case "${draft}" in
                false) ;;
                true) none "${RUN_TAG} is still a draft: the workflow that publishes it runs this again" ;;
                *) none "${RUN_TAG} has no release" ;;
              esac
              tag="${RUN_TAG}" ;;
          esac
          {
            echo "write=true"
            echo "tag=${tag}"
          } >>"${GITHUB_OUTPUT}"
          echo "the feed is written${tag:+, and must list ${tag}}"

      - uses: actions/checkout@v6.0.2
        if: steps.which.outputs.write == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6.4.0
        if: steps.which.outputs.write == 'true'
        with:
          go-version-file: tools/release/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache)
      - name: Go caches
        if: steps.which.outputs.write == 'true'
        uses: ./.github/actions/go-cache

      - name: Go modules
        if: steps.which.outputs.write == 'true'
        uses: ./.github/actions/go-mod-download
        with:
          modules: tools/release

      - name: The published releases and their signed files
        if: steps.which.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/release-feed-inputs.sh "${RUNNER_TEMP}/in" 30

      # every release verified as a home verifies it; the required one listed for every platform
      - name: Write the feed
        if: steps.which.outputs.write == 'true'
        working-directory: tools/release
        env:
          TAG: ${{ steps.which.outputs.tag }}
          WITHDRAWN: ${{ vars.UPDATE_FEED_WITHDRAWN }}
        run: |
          set -euo pipefail
          go run ./cmd/release-feed generate --releases "${RUNNER_TEMP}/in/views.json" --signed "${RUNNER_TEMP}/in/signed" \
            --out "${RUNNER_TEMP}/feed" --repo "${GITHUB_REPOSITORY}" --withdrawn "${WITHDRAWN}" --require "${TAG}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Install cosign
        if: steps.which.outputs.write == 'true'
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign the feed (keyless cosign)
        if: steps.which.outputs.write == 'true'
        working-directory: ${{ runner.temp }}/feed
        run: |
          set -euo pipefail
          for f in stable/*.json beta/*.json; do
            cosign sign-blob --yes --new-bundle-format --bundle "${f}.sigstore.json" "${f}"
          done

      # what a home will accept: the homes' own code, the embedded Sigstore root
      - name: Verify the signed feed (releaseverify)
        if: steps.which.outputs.write == 'true'
        working-directory: tools/release
        run: go run ./cmd/release-feed verify --dir "${RUNNER_TEMP}/feed" --repo "${GITHUB_REPOSITORY}"

      - name: Upload the feed
        if: steps.which.outputs.write == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: update-feed
          path: ${{ runner.temp }}/feed
          retention-days: 90
          if-no-files-found: error

      # website-deploy.yml serves the newest update-feed artifact of main under /updates/v1/
      - name: Deploy maktaba.tv with it
        if: steps.which.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run website-deploy.yml --repo "${GITHUB_REPOSITORY}" --ref main -f feed_run="${RUN}"
          echo "### maktaba.tv" >>"${GITHUB_STEP_SUMMARY}"
          echo "website-deploy.yml started on main to serve this run's feed under /updates/v1/." >>"${GITHUB_STEP_SUMMARY}"

  # The live check: maktaba.tv serves the release, signed and verified as a home verifies it,
  # for every platform this run's feed lists it for.
  live:
    name: the live feed lists the release
    needs: [feed]
    if: needs.feed.outputs.written == 'true' && needs.feed.outputs.tag != ''
    runs-on: ubuntu-24.04
    # a site deploy takes 30 to 60 minutes, waiting its turn behind others
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/release/go.mod
          cache: false

      - name: Go caches
        uses: ./.github/actions/go-cache

      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: tools/release

      - name: Download update-feed
        id: artifact-update-feed
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: update-feed
          path: ${{ runner.temp }}/feed
      - name: Wait 15s to retry the download of update-feed
        if: steps.artifact-update-feed.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Download update-feed (attempt 2)
        id: artifact-update-feed-2
        if: steps.artifact-update-feed.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: update-feed
          path: ${{ runner.temp }}/feed
      - name: Wait 45s to retry the download of update-feed
        if: steps.artifact-update-feed-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Download update-feed (attempt 3)
        id: artifact-update-feed-3
        if: steps.artifact-update-feed-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: update-feed
          path: ${{ runner.temp }}/feed
      - name: Check update-feed downloaded
        if: steps.artifact-update-feed-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: update-feed
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1

      - name: maktaba.tv serves it
        working-directory: tools/release
        env:
          TAG: ${{ needs.feed.outputs.tag }}
        run: |
          go run ./cmd/release-feed live --url https://maktaba.tv/updates/v1 --expect "${RUNNER_TEMP}/feed" \
            --tag "${TAG}" --repo "${GITHUB_REPOSITORY}" --wait 100m --every 60s
