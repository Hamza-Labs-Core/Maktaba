# Reusable gate for the native Apple apps (Epic 42, `apps/apple` and the Apple TV app in
# `apps/tv/tvos`): MaktabaKit's tests, a build of each app (Maktaba Remote, Maktaba Player
# for iPhone and the Mac, Maktaba TV), and their String Catalogs in English and Arabic; and,
# in a second job, the Player's UI tests on throwaway iPhone and iPad simulators.
#
# The catalogs: tools/apple/check-string-catalogs.py fails on a key without its Arabic
# (state "translated") and, reading the .stringsdata the builds write (project.yml sets
# SWIFT_EMIT_LOC_STRINGS), on a string the code uses that is not in its app's catalog.

name: Apple apps

on:
  workflow_call:

permissions:
  contents: read

jobs:
  apple-apps:
    name: Apple apps (Remote, Player, TV)
    # the newest Xcode is on macos-26 (as testflight.yml)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DERIVED: ${{ github.workspace }}/build/apple-derived
    steps:
      - uses: actions/checkout@v6.0.2

      # every key has its Arabic: seconds, before anything is built
      - name: String Catalogs have their Arabic
        run: python3 tools/apple/check-string-catalogs.py

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -n1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      # xcodebuild, not `swift test`: the runner's SwiftPM copies Localizable.xcstrings
      # as-is instead of compiling it, so its Arabic and plural forms would not resolve
      - name: MaktabaKit tests
        working-directory: apps/apple/MaktabaKit
        run: |
          xcodebuild test -scheme MaktabaKit -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/maktabakit" CODE_SIGNING_ALLOWED=NO

      # unsigned simulator and Mac builds: compiling each app writes its .stringsdata
      - name: Build the apps
        working-directory: apps/apple
        run: |
          set -euo pipefail
          build() {
            echo "::group::$1"
            xcodebuild build -project Maktaba.xcodeproj -scheme "$1" -destination "$2" \
              -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO -quiet
            echo "::endgroup::"
          }
          build "Maktaba Remote" "generic/platform=iOS Simulator"
          build "Maktaba Player" "generic/platform=iOS Simulator"
          build "Maktaba Player Mac" "platform=macOS"
          build "Maktaba TV" "generic/platform=tvOS Simulator"

      - name: Every string the code uses is in its catalog
        run: python3 tools/apple/check-string-catalogs.py --stringsdata "$DERIVED"

  # The Player's UI tests (Epic 48: its shell, then each screen) on iPhone and iPad, against
  # MockHome (apps/apple/UITests, served by the test runner; no real home). Every class in
  # apps/apple/UITests/Player*Tests.swift runs, so a screen's tests need no change here. Each
  # simulator is made for the run and deleted after it (never a shared device); the
  # screenshots (dark, English and Arabic) are kept as an artifact.
  #
  # Three jobs per device, side by side (each its own simulator), and one for the Mac: the
  # iPhone's classes in one job outgrew the hour.
  player-ui-tests:
    name: Player UI tests (${{ matrix.device }}${{ matrix.shard != 0 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The iPhone and iPad classes are split over `shards` jobs that run side by side: in
      # one job they outgrew the hour. Each class goes, heaviest first, to the shard with
      # the fewest tests so far, so the shards stay even as classes are added.
      matrix:
        include:
          - { device: iphone, shard: 1, shards: 3 }
          - { device: iphone, shard: 2, shards: 3 }
          - { device: iphone, shard: 3, shards: 3 }
          - { device: ipad, shard: 1, shards: 3 }
          - { device: ipad, shard: 2, shards: 3 }
          - { device: ipad, shard: 3, shards: 3 }
          - { device: mac, shard: 0, shards: 0 }
    env:
      DERIVED: ${{ github.workspace }}/build/player-ui-derived
      SHOTS: ${{ github.workspace }}/build/player-shots
      RESULTS: ${{ github.workspace }}/build/player-results
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -n1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Run the Player UI tests
        if: matrix.device != 'mac'
        working-directory: apps/apple
        run: |
          set -euo pipefail
          mkdir -p "$SHOTS" "$RESULTS"
          # this shard's classes: heaviest first (by test count) to the lightest shard
          only=()
          while IFS= read -r c; do only+=("$c"); done < <(python3 ../../tools/apple/ui-shard.py "${{ matrix.shard }}" "${{ matrix.shards }}" UITests/Player*Tests.swift)
          echo "shard ${{ matrix.shard }}/${{ matrix.shards }} classes: ${only[*]}"
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(sorted(r, key=lambda x: [int(p) for p in x["version"].split(".")])[-1]["identifier"])')
          # the newest device type of a kind this Xcode knows ("iPhone 17", "iPad Pro 11-inch (M5)")
          devtype() {
            xcrun simctl list devicetypes -j | python3 -c "
          import json, re, sys
          want = {'iphone': r'^iPhone (\d+)$', 'ipad': r'^iPad Pro 11-inch \(M(\d+)\)$'}[sys.argv[1]]
          t = [(int(m.group(1)), d['identifier']) for d in json.load(sys.stdin)['devicetypes'] if (m := re.match(want, d['name']))]
          print(max(t)[1])" "$1"
          }
          made=()
          cleanup() { for u in ${made[@]+"${made[@]}"}; do xcrun simctl shutdown "$u" || true; xcrun simctl delete "$u" || true; done; }
          trap cleanup EXIT
          status=0
          run() { # scheme, test target, device-type prefix
            local udid args=()
            udid=$(xcrun simctl create "maktaba-ci-${GITHUB_RUN_ID}-$3-${{ matrix.shard }}" "$(devtype "$3")" "$runtime")
            made+=("$udid")
            xcrun simctl boot "$udid"
            xcrun simctl ui "$udid" appearance dark
            for c in "${only[@]}"; do args+=(-only-testing "$2/$c"); done
            echo "::group::$1 on $3"
            TEST_RUNNER_MAKTABA_SHOTS="$SHOTS" xcodebuild test -project Maktaba.xcodeproj -scheme "$1" \
              -destination "id=$udid" -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO \
              -resultBundlePath "$RESULTS/$3-${{ matrix.shard }}.xcresult" "${args[@]}" || status=1
            echo "::endgroup::"
            xcrun simctl shutdown "$udid" || true
          }
          case "${{ matrix.device }}" in
            iphone) run "Maktaba Player" "Maktaba Player UITests" "iphone" ;;
            ipad) run "Maktaba Player iPad" "Maktaba Player iPad UITests" "ipad" ;;
          esac
          exit $status

      # The Mac Player (story 48.25): its menus read in-process, then driven from outside by
      # PlayerMacTests/UI against MockHome. A macOS UI-test runner must be signed, so the
      # build is ad-hoc signed, everything with the UI tests' entitlements (sandbox, network
      # client and server): the app's own add a keychain group, which needs a provisioning
      # profile. The Mac keychain test needs that group, so it is not among the classes here.
      - name: Run the Mac Player tests
        if: matrix.device == 'mac'
        working-directory: apps/apple
        run: |
          set -euo pipefail
          TEST_RUNNER_MAKTABA_SHOTS="$SHOTS" xcodebuild test -project Maktaba.xcodeproj -scheme "Maktaba Player Mac" \
            -destination platform=macOS -derivedDataPath "$DERIVED-mac" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS="$PWD/PlayerMacTests/UI/PlayerMacUITests.entitlements" \
            -resultBundlePath "$RESULTS/mac.xcresult" \
            -only-testing "Maktaba Player Mac Tests/PlayerMenus" \
            -only-testing "Maktaba Player Mac Tests/MacPlayerSurface" \
            -only-testing "Maktaba Player Mac UITests"

      - name: Keep the screenshots and results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: player-ui-tests-${{ matrix.device }}${{ matrix.shard != 0 && format('-{0}', matrix.shard) || '' }}
          path: |
            build/player-shots
            build/player-results
          if-no-files-found: warn
          retention-days: 14
