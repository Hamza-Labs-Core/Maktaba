# Reusable gate for the native Apple apps (Epic 42, `apps/apple` and the Apple TV app in
# `apps/tv/tvos`): MaktabaKit's tests, a build of each app (Maktaba Remote for iPhone and
# iPad, Maktaba Player for iPhone and the Mac, Maktaba TV), and their String Catalogs in
# English and Arabic; and, in other jobs, the Player's UI tests on throwaway iPhone and iPad
# simulators and the Apple TV app's Live TV, Home and Libraries UI tests on a throwaway Apple
# TV simulator.
#
# The catalogs: tools/apple/check-string-catalogs.py fails on a key without its Arabic
# (state "translated") and, reading the .stringsdata the builds write (project.yml sets
# SWIFT_EMIT_LOC_STRINGS), on a string the code uses that is not in its app's catalog.

name: Apple apps

on:
  workflow_call:
    # each part when its files changed (ci.yml, from .github/ci-paths.yml)
    inputs:
      build: { type: boolean, default: true }
      player_ui: { type: boolean, default: true }
      # only the product screenshots (story 60.09; product-shots.yml): each UI job runs its
      # demo-shot tests alone, the Player's shards but the `shots` one are left out
      shots_only: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  apple-apps:
    name: Apple apps (Remote, Player, TV)
    if: inputs.build && !inputs.shots_only
    # Xcode 27 (App Store Connect wants the 27 SDKs from April 2027) is on the xcode-27 image
    # alone: macOS 27 with Xcode 27.0, 27.1 and 27.2, and only the 27 simulators (as testflight.yml)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DERIVED: ${{ github.workspace }}/build/apple-derived
    steps:
      - uses: actions/checkout@v6.0.2

      # every key has its Arabic: seconds, before anything is built
      - name: String Catalogs have their Arabic
        run: python3 tools/apple/check-string-catalogs.py

      # every UI test types through typeExactly, which reads the field back (seconds too)
      - name: UI tests type through typeExactly
        run: |
          python3 tools/apple/check-ui-typing.py --self-test
          python3 tools/apple/check-ui-typing.py

      # the Player's Cast receiver id is shared/cast/app.json's (story 58.06)
      - name: The Cast receiver id matches shared/cast/app.json
        run: |
          python3 tools/apple/cast-app-id.py --self-test
          python3 tools/apple/cast-app-id.py --check

      # the Player UI tests' split over shards (by measured time; every test in one shard)
      - name: UI test shards split every test once
        run: python3 tools/apple/ui-shard.py --self-test

      # how the product screenshots (60.09) leave a result bundle
      - name: The shots' export picks the shot- attachments only
        run: python3 tools/apple/export-shots.py --self-test

      # how a UI shard reads its simulator's own processes to know it has settled
      - name: A simulator's settle check reads its own processes
        run: python3 tools/apple/sim-settle.py --self-test

      # how a UI job keeps its simulator's logs and the app's crash reports
      - name: A simulator's logs and the app's crash reports are kept
        run: python3 tools/apple/sim-log.py --self-test

      # the Xcode pick, the simulator pick and the uploads' SDK check (tools/apple/xcode.py)
      - name: The Xcode, simulator and SDK checks pick what they should
        run: python3 tools/apple/xcode.py --self-test

      # how a CI run's drawn pages become the Mac Player's page references (issue #876)
      - name: The page references' copier picks PageSnapshots' images only
        run: python3 tools/apple/snapshots.py --self-test

      # the newest released Xcode, 27 or later, or the job fails (tools/apple/xcode.py)
      - name: Select Xcode
        run: python3 tools/apple/xcode.py select --min 27

      # xcodebuild, not `swift test`: the runner's SwiftPM copies Localizable.xcstrings
      # as-is instead of compiling it, so its Arabic and plural forms would not resolve
      # with code coverage: on a push to main it feeds the affected-tests map (below)
      - name: MaktabaKit tests
        working-directory: apps/apple/MaktabaKit
        run: |
          xcodebuild test -scheme MaktabaKit -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/maktabakit" CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES -resultBundlePath "$RUNNER_TEMP/maktabakit.xcresult"

      # tools/affected-tests: which source files MaktabaKit's tests execute (coverage-map.yml
      # builds the map from it). Never fails the gate.
      - name: Coverage for the affected-tests map
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build/coverage-fragment
          xcrun xccov view --report --json "$RUNNER_TEMP/maktabakit.xcresult" >build/coverage-fragment/maktabakit.xccov.json
          echo "apple-kit:apps/apple/MaktabaKit/Tests/MaktabaKitTests" >build/coverage-fragment/maktabakit.xccov.json.id
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-fragment-apple-kit
          path: build/coverage-fragment
          if-no-files-found: ignore
          retention-days: 3

      # unsigned simulator and Mac builds: compiling each app writes its .stringsdata
      - name: Build the apps
        working-directory: apps/apple
        run: |
          set -euo pipefail
          build() {
            echo "::group::$1"
            xcodebuild build -project Maktaba.xcodeproj -scheme "$1" -destination "$2" \
              -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO -quiet
            echo "::endgroup::"
          }
          build "Maktaba Remote" "generic/platform=iOS Simulator"
          build "Maktaba Remote iPad" "generic/platform=iOS Simulator"
          build "Maktaba Player" "generic/platform=iOS Simulator"
          build "Maktaba Player Mac" "platform=macOS"
          build "Maktaba TV" "generic/platform=tvOS Simulator"
          # the Player's Cast receiver and Bonjour services are app.json's, and no other's
          python3 "$GITHUB_WORKSPACE/tools/apple/cast-app-id.py" --built \
            "$DERIVED/Build/Products/Debug-iphonesimulator/Maktaba Player.app"

      - name: Every string the code uses is in its catalog
        run: python3 tools/apple/check-string-catalogs.py --stringsdata "$DERIVED"

  # The Player's UI tests (Epic 48: its shell, then each screen) on iPhone and iPad, against
  # MockHome (apps/apple/UITests, served by the test runner; no real home). Every test of
  # apps/apple/UITests/Player*Tests.swift runs, so a screen's tests need no change here. Each
  # simulator is made for the run and deleted after it (never a shared device); the
  # screenshots (dark, English and Arabic), the result bundles and the app's own log are kept
  # as an artifact.
  #
  # Built once per device (build-for-testing, below), then run on six simulators side by side
  # (test-without-building), each its own job: a shard no longer spends ten minutes building
  # the same app. The tests are split by how long each took on CI (tools/apple/ui-shard.py,
  # tools/apple/ui-durations.json), so the shards end together.
  #
  # No Mac runner is held waiting for another job (tools/ci/tests/test_no_held_runners.py): a
  # shard `needs:` its device's build and is queued once the app is there. It used to start
  # beside the build, its simulator settling meanwhile, and ask the API for the app for up to
  # 30 minutes; with many pull requests queued the shards had the runners their own builds were
  # queued for, and failed with no test run. A build takes 3 to 4 minutes, a simulator 6 to 14
  # to boot and settle, so the overlap only ever saved the build's. The simulator still settles
  # before the first test (sim-settle.py): one made for the run is busy for minutes after it
  # boots, and a test in that time ran slowly enough to fail on time (CI: an accessibility audit
  # "failed to complete in time"; a page took 31 s to idle).
  #
  # Each device has a build job and a test job of its own, not one matrix of both: `needs:` on
  # a matrix waits for all of it, and a failed iPad build would skip the iPhone's shards too.
  # The steps are shared by YAML anchors (GitHub expands them; it has no `<<` merge). The job
  # names are as before: tools/release/tag-guard.sh and web/packages/website/shots.config.json
  # find the jobs by them.
  player-ui-build-iphone:
    name: Player UI tests build (${{ matrix.device }})
    if: inputs.player_ui
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { device: iphone, scheme: "Maktaba Player" }
    env: &player-ui-build-env
      DERIVED: ${{ github.workspace }}/build/player-ui-derived
    steps: &player-ui-build-steps
      - uses: actions/checkout@v6.0.2

      # the newest released Xcode, 27 or later, or the job fails (tools/apple/xcode.py)
      - name: Select Xcode
        run: python3 tools/apple/xcode.py select --min 27

      # for the runner's own simulators (arm64), with the .xctestrun the shards run from
      # Cast on, with Google's public Default Media Receiver: PlayerCastUITests runs the real
      # Google Cast SDK, which iOS lets search only for the Bonjour services in Info.plist. Every
      # other test starts with Cast off (PlayerUITestCase.launch), and no other build names it:
      # the TestFlight and App Store builds take app.json's.
      - name: Build the app and its UI tests
        working-directory: apps/apple
        env:
          CAST_RECEIVER: CC1AD845
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project Maktaba.xcodeproj -scheme "${{ matrix.scheme }}" \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            MAKTABA_CAST_APP_ID="$CAST_RECEIVER" MAKTABA_CAST_ENABLED=YES \
            -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO -quiet
          python3 "$GITHUB_WORKSPACE/tools/apple/cast-app-id.py" --receiver "$CAST_RECEIVER" --built \
            "$DERIVED/Build/Products/Debug-iphonesimulator/${{ matrix.scheme }}.app"
          # one archive: an artifact keeps no file modes, and the app's binaries need theirs
          tar -C "$DERIVED/Build" -cf "$RUNNER_TEMP/player-ui-build.tar" Products
          ls -la "$RUNNER_TEMP/player-ui-build.tar"

      # kept a week: a failed shard run again (a later attempt of this run) downloads the app its
      # first attempt built
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: player-ui-build-${{ matrix.device }}
          path: ${{ runner.temp }}/player-ui-build.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  player-ui-build-ipad:
    name: Player UI tests build (${{ matrix.device }})
    if: inputs.player_ui
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { device: ipad, scheme: "Maktaba Player iPad" }
    env: *player-ui-build-env
    steps: *player-ui-build-steps

  player-ui-tests-iphone:
    name: Player UI tests (${{ matrix.device }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [player-ui-build-iphone]
    if: inputs.player_ui
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone]
        # `shots`: the product screenshots (PlayerDemoShots, story 60.09), on a shard of their own
        shard: &player-ui-shards ${{ fromJSON(inputs.shots_only && '["shots"]' || '["1", "2", "3", "4", "5", "6", "shots"]') }}
        shards: [6]
    env: &player-ui-tests-env
      PRODUCTS: ${{ github.workspace }}/build/player-ui-products
      SHOTS: ${{ github.workspace }}/build/player-shots
      RESULTS: ${{ github.workspace }}/build/player-results
    steps: &player-ui-tests-steps
      - uses: actions/checkout@v6.0.2

      # the newest released Xcode, 27 or later, or the job fails (tools/apple/xcode.py)
      - name: Select Xcode
        run: python3 tools/apple/xcode.py select --min 27

      - name: Make, boot and settle the simulator
        run: |
          set -euo pipefail
          device="${{ matrix.device }}" shard="${{ matrix.shard }}"
          mkdir -p "$SHOTS" "$RESULTS" "$PRODUCTS"
          # the newest runtime that takes the newest "iPhone N" or "iPad Pro 11-inch (MN)"
          # (iOS 27.1 is the iPhone Duo's alone: tools/apple/xcode.py tries the next pair)
          udid=$(python3 tools/apple/xcode.py simulator "$device" "maktaba-ci-${GITHUB_RUN_ID}-$device-$shard")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          # the on-screen keyboard shows, as on a phone (PlayerSignInKeyboardUITests measures
          # fields against it): no hardware keyboard, and the software one not minimized when
          # keys are typed (XCUITest types keys)
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          # booted in at most 5 minutes (a boot takes well under one), a line each minute
          # meanwhile: twice an iPad 6/6 job's log stopped here and the job was cancelled 9 to
          # 12 minutes in, with no word of why (main's run 45298651218, PR #1561's 45319649409).
          # The lines say whether the runner was still alive; a boot that runs out is said and
          # the simulator is made once more
          boot() {
            xcrun simctl bootstatus "$1" -b > /dev/null & local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 5; waited=$((waited + 5))
              if [ $((waited % 60)) -eq 0 ]; then echo "booting $1: ${waited}s"; fi
              if [ "$waited" -ge 300 ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; return 1; fi
            done
            wait "$pid"
          }
          if ! boot "$udid"; then
            echo "::warning::the $device simulator did not boot in 5 minutes: made again"
            xcrun simctl shutdown "$udid" 2>/dev/null || true
            xcrun simctl delete "$udid" 2>/dev/null || true
            udid=$(python3 tools/apple/xcode.py simulator "$device" "maktaba-ci-${GITHUB_RUN_ID}-$device-$shard-again")
            echo "UDID=$udid" >> "$GITHUB_ENV"
            boot "$udid"
          fi
          # two of the simulator's own services are turned off, which no test here uses:
          # - PosterBoard draws every wallpaper of the gallery a few minutes after a first boot
          #   (the background task `com.apple.springboard.posterboardupdate.prewarm`; with it off
          #   the task ends at once). On these runners, with no GPU and 7 GB, that is about two
          #   minutes in which xcodebuild, testmanagerd and the app hardly run. Five failures of
          #   five began in it ("Failed to terminate" in runs 45492257208, 45444285100 and
          #   45495588048, twice; "does not have a process ID" in 45513857454).
          # - apsd retries its push connection 8 to 17 times a second for good: it has no device
          #   identity here. Each try writes some 80 log lines. It and diagnosticd, which reads
          #   them, held up to more than one of the three cores (136 % of one at the most), and
          #   kept 3 of 8 simulators from ever settling below.
          # each call into the simulator has a time limit (macOS has no `timeout`): one that
          # never answers is a warning here, not the job's hour
          limit() { perl -e 'alarm shift; exec @ARGV or exit 127' "$@"; }
          for service in com.apple.PosterBoard com.apple.apsd; do
            limit 30 xcrun simctl spawn "$udid" launchctl disable "user/foreground/$service" || true
            limit 30 xcrun simctl spawn "$udid" launchctl bootout "user/foreground/$service" || true
            running=$(limit 30 xcrun simctl spawn "$udid" launchctl list || true)
            if [ -z "$running" ]; then
              echo "::warning::the simulator did not list its services: $service may still run, and its load can fail a test (#1678)"
            elif grep -q "[[:space:]]$service\$" <<< "$running"; then
              echo "::warning::$service still runs in the simulator: its load can fail a test (#1678)"
            fi
          done
          xcrun simctl ui "$udid" appearance dark
          # the simulator keeps the app's info and debug lines too (its subsystem is its bundle
          # id; a parent's config is not inherited): by default `log show` finds its errors and
          # notices alone. Kept, not streamed: a live stream slows the simulator (accessibility
          # audits timed out), and the other subsystems stay as they are
          case "$device" in
            iphone) bundle=com.hamzalabs.maktaba.player ;;
            ipad) bundle=com.hamzalabs.maktaba.player.tablet ;;
          esac
          xcrun simctl spawn "$udid" log config --subsystem "$bundle" --mode "level:debug,persist:debug"
          # the keyboard types only what a test types: no suggestions, autocorrection or
          # capitals of its own, no slide-to-type introduction over the keys (CI: the home's
          # address in the picker came out with its port three times)
          for key in KeyboardAutocorrection KeyboardPrediction KeyboardShowPredictionBar KeyboardCheckSpelling \
                     KeyboardAutocapitalization KeyboardContinuousPathEnabled; do
            xcrun simctl spawn "$udid" defaults write com.apple.Preferences "$key" -bool false
          done
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences AutomaticMinimizationEnabled -bool false
          # settled: the simulator's own processes quiet on three 5-second looks running (its
          # first-boot work done; the runner's own daemons are no measure, they kept it under
          # 30% idle for 12 minutes). Each look is kept with the results. Not quiet in 8
          # minutes: the tests run anyway, and the log says so.
          python3 tools/apple/sim-settle.py "$udid" "$RESULTS/$device-$shard-settle.log" --max 480

      # the app its device's build job built, in this attempt or an earlier one
      - name: Download player-ui-build-${{ matrix.device }}
        id: artifact-player-ui-build
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: player-ui-build-${{ matrix.device }}
          path: ${{ runner.temp }}
      - name: Wait 15s to retry the download of player-ui-build-${{ matrix.device }}
        if: steps.artifact-player-ui-build.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Download player-ui-build-${{ matrix.device }} (attempt 2)
        id: artifact-player-ui-build-2
        if: steps.artifact-player-ui-build.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: player-ui-build-${{ matrix.device }}
          path: ${{ runner.temp }}
      - name: Wait 45s to retry the download of player-ui-build-${{ matrix.device }}
        if: steps.artifact-player-ui-build-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Download player-ui-build-${{ matrix.device }} (attempt 3)
        id: artifact-player-ui-build-3
        if: steps.artifact-player-ui-build-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: player-ui-build-${{ matrix.device }}
          path: ${{ runner.temp }}
      - name: Check player-ui-build-${{ matrix.device }} downloaded
        id: artifact-player-ui-build-check
        if: steps.artifact-player-ui-build-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: player-ui-build-${{ matrix.device }}
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1

      - name: Run the Player UI tests
        working-directory: apps/apple
        run: |
          set -euo pipefail
          device="${{ matrix.device }}" shard="${{ matrix.shard }}" shards="${{ matrix.shards }}"
          case "$device" in
            iphone) scheme="Maktaba Player" target="Maktaba Player UITests" ;;
            ipad) scheme="Maktaba Player iPad" target="Maktaba Player iPad UITests" ;;
          esac
          tar -xf "$RUNNER_TEMP/player-ui-build.tar" -C "$PRODUCTS"
          only=()
          if [ "$shard" = shots ]; then
            # the product screenshots: a status bar at noon, full, on Wi-Fi
            xcrun simctl status_bar "$UDID" override --time 2026-06-15T12:00:00.000Z --dataNetwork wifi --wifiMode active \
              --wifiBars 3 --cellularMode notSupported --batteryState charged --batteryLevel 100 \
              || echo "::warning::the status bar override failed: the shots keep the simulator's own"
            only=(-only-testing "$target/PlayerDemoShots")
          else
            # this shard's tests: longest first, to the shard with the least time so far
            while IFS= read -r t; do only+=(-only-testing "$target/$t"); done \
              < <(python3 ../../tools/apple/ui-shard.py "$device" "$shard" "$shards" UITests/Player*Tests.swift)
          fi
          echo "shard $shard/$shards: ${#only[@]} arguments for $((${#only[@]} / 2)) tests"
          printf '%s\n' "${only[@]}" > "$RESULTS/$device-$shard.selection"
          xctestrun=$(ls "$PRODUCTS/Products/${scheme}_iphonesimulator"*.xctestrun)
          # a hung test is cut at 10 minutes, with XCTest's spindump of it, and the shard goes
          # on: the longest test that passed took 411 s, its shard's first launch included.
          # Without a cap a test that hung in its tearDown after "Failed to terminate" held the
          # shard until the job's 60 minutes ran out, and no later test ran (PR #1550's run
          # 45264580791, iPhone 2/6, twice)
          run_tests() {
            TEST_RUNNER_MAKTABA_SHOTS="$SHOTS" xcodebuild test-without-building -xctestrun "$xctestrun" \
              -destination "id=$UDID" -resultBundlePath "$RESULTS/$device-$shard.xcresult" \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 600 "${only[@]}" 2>&1 | tee "$RESULTS/$device-$shard-xcodebuild.log"
          }
          status=0
          run_tests || status=$?
          # The test runner itself not starting, before any test began, is the simulator's, not a
          # test's: "Failed to install or launch the test runner" (SpringBoard refused it, "The
          # request was denied by service delegate (SBMainWorkspace)", PR #1561's run 45319649409,
          # iPhone 1/6, after the simulator never settled) and "The test runner failed to
          # initialize for UI testing" ("Timed out waiting for AX loaded notification", PR
          # #1562's run 45296281858, iPad 1/6). Only those, and only with no test started: said,
          # the first result bundle kept beside, and run once more.
          started="^Test Case '.*' started"
          runner="Failed to install or launch the test runner|failed to initialize for UI testing"
          if [ "$status" -ne 0 ] && ! grep -q "$started" "$RESULTS/$device-$shard-xcodebuild.log" \
             && grep -qE "$runner" "$RESULTS/$device-$shard-xcodebuild.log"; then
            echo "::warning::the test runner did not start, no test ran ($(grep -m1 -oE "$runner" "$RESULTS/$device-$shard-xcodebuild.log")): once more"
            mv "$RESULTS/$device-$shard.xcresult" "$RESULTS/$device-$shard-runner-did-not-start.xcresult"
            mv "$RESULTS/$device-$shard-xcodebuild.log" "$RESULTS/$device-$shard-runner-did-not-start.log"
            status=0
            run_tests || status=$?
          fi
          exit "$status"

      # xcodebuild can say TEST EXECUTE SUCCEEDED for a run that ran none, or not all, of its
      # tests: a runner restarted after an unexpected exit may run nothing (CI run 43605618404,
      # #1312: 1 iteration of 20, the job green). Reads the result bundle and fails on no test
      # run, a selected test missing from it, or fewer iterations than asked.
      - name: Check every selected test ran
        run: python3 tools/ci/xcresult_ran.py "${{ matrix.device }} ${{ matrix.shard }}/${{ matrix.shards }}" "$RESULTS/${{ matrix.device }}-${{ matrix.shard }}.xcresult" "$RESULTS/${{ matrix.device }}-${{ matrix.shard }}.selection"

      # the app's own log (MaktabaKit's `Log`: the requests to the mock home, connects,
      # sign-ins), kept with the results, read once the tests are done: a failed wait
      # shows what the app did meanwhile. Read after, not streamed: a stream makes each
      # line the app's frameworks log cost while the tests run (CI: a stream at info
      # took accessibility's per-element lines, snapshots took 15 s, an audit timed out).
      # The simulator is the run's own, so the log covers its whole life: every launch.
      - name: Read and check the app's log, delete the simulator
        if: always() && env.UDID != ''
        env:
          # failure when the app's build artifact never downloaded (no test ran)
          APP_DOWNLOAD: ${{ steps.artifact-player-ui-build-check.outcome }}
          APP_ARTIFACT: player-ui-build-${{ matrix.device }}
        run: |
          log="$RESULTS/${{ matrix.device }}-${{ matrix.shard }}-app.log"
          # the app's log, the system's word on its processes ending, its crash reports; a
          # simulator that stopped under the tests is said and booted again to read its log
          python3 tools/apple/sim-log.py "$UDID" "$RESULTS" "${{ matrix.device }}-${{ matrix.shard }}" || true
          if [ "$APP_DOWNLOAD" = failure ]; then
            echo "::error::no line of the app at all: the app artifact $APP_ARTIFACT never downloaded, so no test ran"
            exit 1
          fi
          # checked whole: every launch's info and debug lines are in it
          python3 tools/apple/check-app-log.py "$log"

      # the product screenshots (60.09), `<device>-<screen>-<language>.png`, for
      # web/packages/website/scripts/shots.mjs --from-run
      - name: Export the product screenshots
        if: "!cancelled() && matrix.shard == 'shots'"
        run: python3 tools/apple/export-shots.py build/product-shots "$RESULTS/${{ matrix.device }}-shots.xcresult"
      - name: Keep the product screenshots
        if: "!cancelled() && matrix.shard == 'shots'"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: product-shots-${{ matrix.device }}
          path: build/product-shots
          if-no-files-found: error
          retention-days: 30

      # kept for reading a failure, not a check: the steps above pass or fail the shard. The
      # artifact service unreachable here (run 45199851694, iPad 1/6: "Failed to CreateArtifact:
      # Unable to make request: ENOTFOUND" after all 34 tests passed) marks the step, not the shard
      - name: Keep the screenshots, results and the app's log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: player-ui-tests-${{ matrix.device }}-${{ matrix.shard }}
          path: |
            build/player-shots
            build/player-results
          if-no-files-found: warn
          retention-days: 14

  player-ui-tests-ipad:
    name: Player UI tests (${{ matrix.device }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [player-ui-build-ipad]
    if: inputs.player_ui
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [ipad]
        shard: *player-ui-shards
        shards: [6]
    env: *player-ui-tests-env
    steps: *player-ui-tests-steps

  # The Mac Player (story 48.25): its menus read in-process, then driven from outside by
  # PlayerMacTests/UI against MockHome. A macOS UI-test runner must be signed, so the
  # The Apple TV app's Live TV, Home and Libraries UI tests (TVLiveUITests), its parental
  # controls' (TVParentalUITests, Epic 57) and Watch a broadcast's (TVGuestUITests, story 50.27,
  # against the mock edge) and Search's (TVSearchUITests, story 49.11) against the mock home,
  # with the Siri remote, on a
  # throwaway Apple TV simulator made and deleted here (MaktabaTVUITests.swift needs a real
  # home and skips without one).
  tv-ui-tests:
    name: TV UI tests
    if: inputs.build
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DERIVED: ${{ github.workspace }}/build/tv-ui-derived
      SHOTS: ${{ github.workspace }}/build/tv-shots
      RESULTS: ${{ github.workspace }}/build/tv-results
    steps:
      - uses: actions/checkout@v6.0.2

      # the newest released Xcode, 27 or later, or the job fails (tools/apple/xcode.py)
      - name: Select Xcode
        run: python3 tools/apple/xcode.py select --min 27

      - name: Make and boot the Apple TV simulator
        run: |
          set -euo pipefail
          mkdir -p "$SHOTS" "$RESULTS"
          # the newest runtime with the newest 4K Apple TV it takes (tvOS 27 has no first one)
          udid=$(python3 tools/apple/xcode.py simulator appletv "maktaba-ci-${GITHUB_RUN_ID}-tv")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          # (no `simctl ui appearance` here: the tvOS runtime does not support it)
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl spawn "$udid" log config --subsystem com.hamzalabs.maktaba.tv --mode "level:debug,persist:debug"
          python3 tools/apple/sim-settle.py "$udid" "$RESULTS/tv-settle.log" --max 480

      - name: Run the TV UI tests
        working-directory: apps/apple
        env:
          SHOTS_ONLY: ${{ inputs.shots_only }}
        run: |
          set -euo pipefail
          # and the product screenshots (TVDemoShotsUITests, story 60.09); only those for shots_only
          only=(-only-testing "Maktaba TV UITests/TVDemoShotsUITests")
          if [ "$SHOTS_ONLY" != true ]; then
            only+=(-only-testing "Maktaba TV UITests/TVLiveUITests" -only-testing "Maktaba TV UITests/TVParentalUITests"
                   -only-testing "Maktaba TV UITests/TVGuestUITests" -only-testing "Maktaba TV UITests/TVSearchUITests")
          fi
          printf '%s\n' "${only[@]}" > "$RESULTS/tv.selection"
          TEST_RUNNER_MAKTABA_SHOTS="$SHOTS" xcodebuild test -project Maktaba.xcodeproj -scheme "Maktaba TV" \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" -resultBundlePath "$RESULTS/tv.xcresult" \
            CODE_SIGNING_ALLOWED=NO "${only[@]}"

      # the result bundle ran every selected test (as the Player's shards check theirs)
      - name: Check every selected test ran
        run: python3 tools/ci/xcresult_ran.py "tv" "$RESULTS/tv.xcresult" "$RESULTS/tv.selection"

      - name: Keep the app's log, delete the simulator
        if: always() && env.UDID != ''
        run: |
          python3 tools/apple/sim-log.py "$UDID" "$RESULTS" tv || true

      - name: Export the product screenshots
        if: "!cancelled()"
        run: python3 tools/apple/export-shots.py build/product-shots "$RESULTS/tv.xcresult"
      - name: Keep the product screenshots
        if: "!cancelled()"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: product-shots-appletv
          path: build/product-shots
          if-no-files-found: error
          retention-days: 30

      - name: Keep the screenshots, results and the app's log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tv-ui-tests
          path: |
            build/tv-shots
            build/tv-results
          if-no-files-found: warn
          retention-days: 14

  # build is ad-hoc signed, everything with the UI tests' entitlements (sandbox, network
  # client and server): the app's own add a keychain group, which needs a provisioning
  # profile. The Mac keychain test needs that group, so it is not among the classes here.
  player-ui-mac:
    name: Player UI tests (mac)
    if: inputs.player_ui
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DERIVED: ${{ github.workspace }}/build/player-ui-derived
      SHOTS: ${{ github.workspace }}/build/player-shots
      RESULTS: ${{ github.workspace }}/build/player-results
    steps:
      - uses: actions/checkout@v6.0.2

      # the newest released Xcode, 27 or later, or the job fails (tools/apple/xcode.py)
      - name: Select Xcode
        run: python3 tools/apple/xcode.py select --min 27

      - name: Run the Mac Player tests
        working-directory: apps/apple
        env:
          SHOTS_ONLY: ${{ inputs.shots_only }}
        run: |
          set -euo pipefail
          # a push to main measures coverage for the affected-tests map
          cover=()
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then cover=(-enableCodeCoverage YES); fi
          mkdir -p "$RESULTS"
          # the app's own log, whole (info and debug too), as on the iPhone and iPad: the
          # runner keeps its subsystem's lines while it runs, read once the tests are done
          sudo log config --subsystem com.hamzalabs.maktaba.player.mac --mode "level:debug,persist:debug"
          start=$(date '+%Y-%m-%d %H:%M:%S')
          status=0
          # every Mac UI test, the product screenshots (PlayerMacDemoShotsUITests) among them;
          # shots_only: those alone
          only=(-only-testing "Maktaba Player Mac Tests/PlayerMenus"
                -only-testing "Maktaba Player Mac Tests/MacPlayerSurface"
                -only-testing "Maktaba Player Mac Tests/PlayerLaunchLog"
                -only-testing "Maktaba Player Mac Tests/PageLocale"
                -only-testing "Maktaba Player Mac Tests/SeriesScreenDetails"
                -only-testing "Maktaba Player Mac Tests/PageSnapshots"
                -only-testing "Maktaba Player Mac Tests/PlaybackUnderALimit"
                -only-testing "Maktaba Player Mac Tests/HomeCardActions"
                -only-testing "Maktaba Player Mac UITests")
          if [ "$SHOTS_ONLY" = true ]; then only=(-only-testing "Maktaba Player Mac UITests/PlayerMacDemoShotsUITests"); fi
          printf '%s\n' "${only[@]}" > "$RESULTS/mac.selection"
          TEST_RUNNER_MAKTABA_SHOTS="$SHOTS" xcodebuild test -project Maktaba.xcodeproj -scheme "Maktaba Player Mac" \
            -destination platform=macOS -derivedDataPath "$DERIVED-mac" ${cover[@]+"${cover[@]}"} \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS="$PWD/PlayerMacTests/UI/PlayerMacUITests.entitlements" \
            -resultBundlePath "$RESULTS/mac.xcresult" "${only[@]}" || status=1
          log show --start "$start" --style compact --info --debug \
            --predicate 'subsystem BEGINSWITH "com.hamzalabs.maktaba"' > "$RESULTS/mac-app.log" || true
          # and the Mac app's crash reports from this run, as the simulators' jobs keep theirs
          # (tools/apple/sim-log.py): in run 45238693973 the app under
          # PlayerMacDemoShotsUITests.testLibrary ended without a line ("Lost connection to the
          # application"), and nothing said why
          mkdir -p "$RESULTS/mac-crashes"
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -iname '*maktaba*' -newer "$RESULTS/mac.selection" \
            -exec cp {} "$RESULTS/mac-crashes/" \; 2>/dev/null || true
          ls "$RESULTS/mac-crashes" | sed 's/^/crash report kept: /'
          python3 ../../tools/apple/check-app-log.py "$RESULTS/mac-app.log" || status=1
          exit $status

      # the result bundle ran every selected test (as the Player's shards check theirs)
      - name: Check every selected test ran
        run: python3 tools/ci/xcresult_ran.py "mac" "$RESULTS/mac.xcresult" "$RESULTS/mac.selection"

      # tools/affected-tests: which source files the Mac Player's tests execute. The iPhone and
      # iPad runs are not measured (they take most of an hour as it is): their tests are
      # found by the UI search and by name.
      - name: Coverage for the affected-tests map
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p build/coverage-fragment
          xcrun xccov view --report --json "$RESULTS/mac.xcresult" >build/coverage-fragment/player-mac.xccov.json
          echo "apple-mac:apps/apple/PlayerMacTests" >build/coverage-fragment/player-mac.xccov.json.id
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-fragment-apple-mac
          path: build/coverage-fragment
          if-no-files-found: ignore
          retention-days: 3

      - name: Export the product screenshots
        if: "!cancelled()"
        run: python3 tools/apple/export-shots.py build/product-shots "$RESULTS/mac.xcresult"
      - name: Keep the product screenshots
        if: "!cancelled()"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: product-shots-mac
          path: build/product-shots
          if-no-files-found: error
          retention-days: 30

      - name: Keep the screenshots and results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: player-ui-tests-mac
          path: |
            build/player-shots
            build/player-results
          if-no-files-found: warn
          retention-days: 14

  # The Remote's diagnostics (Epic 53: Errors, Logs, dashboards, problem reports) against the
  # mock home, on a throwaway iPhone simulator made, settled and deleted here. Its
  # screenshots are the maktaba.dev Remote page's (web/packages/devportal).
  remote-ui-tests:
    name: Remote UI tests
    if: inputs.player_ui
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DERIVED: ${{ github.workspace }}/build/remote-ui-derived
      SHOTS: ${{ github.workspace }}/build/remote-shots
      RESULTS: ${{ github.workspace }}/build/remote-results
    steps:
      - uses: actions/checkout@v6.0.2

      # the newest released Xcode, 27 or later, or the job fails (tools/apple/xcode.py)
      - name: Select Xcode
        run: python3 tools/apple/xcode.py select --min 27

      - name: Make, boot and settle the iPhone simulator
        run: |
          set -euo pipefail
          mkdir -p "$SHOTS" "$RESULTS"
          udid=$(python3 tools/apple/xcode.py simulator iphone "maktaba-ci-${GITHUB_RUN_ID}-remote")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl spawn "$udid" log config --subsystem com.hamzalabs.maktaba.remote --mode "level:debug,persist:debug"
          for key in KeyboardAutocorrection KeyboardPrediction KeyboardShowPredictionBar KeyboardCheckSpelling \
                     KeyboardAutocapitalization KeyboardContinuousPathEnabled; do
            xcrun simctl spawn "$udid" defaults write com.apple.Preferences "$key" -bool false
          done
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          python3 tools/apple/sim-settle.py "$udid" "$RESULTS/remote-settle.log" --max 480

      - name: Run the Remote's diagnostics UI tests
        working-directory: apps/apple
        env:
          SHOTS_ONLY: ${{ inputs.shots_only }}
        run: |
          set -euo pipefail
          # and the Remote's product screenshot (RemoteDemoShotsUITests, story 60.09), at noon on a
          # full status bar; only that for shots_only
          xcrun simctl status_bar "$UDID" override --time 2026-06-15T12:00:00.000Z --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode notSupported --batteryState charged --batteryLevel 100 \
            || echo "::warning::the status bar override failed: the shots keep the simulator's own"
          only=(-only-testing "Maktaba Remote UITests/RemoteDemoShotsUITests")
          if [ "$SHOTS_ONLY" != true ]; then only+=(-only-testing "Maktaba Remote UITests/RemoteDiagnosticsUITests"); fi
          printf '%s\n' "${only[@]}" > "$RESULTS/remote.selection"
          TEST_RUNNER_MAKTABA_SHOTS="$SHOTS" xcodebuild test -project Maktaba.xcodeproj -scheme "Maktaba Remote" \
            -destination "id=$UDID" -derivedDataPath "$DERIVED" -resultBundlePath "$RESULTS/remote.xcresult" \
            CODE_SIGNING_ALLOWED=NO "${only[@]}"

      # the result bundle ran every selected test (as the Player's shards check theirs)
      - name: Check every selected test ran
        run: python3 tools/ci/xcresult_ran.py "remote" "$RESULTS/remote.xcresult" "$RESULTS/remote.selection"

      - name: Keep the app's log, delete the simulator
        if: always() && env.UDID != ''
        run: |
          python3 tools/apple/sim-log.py "$UDID" "$RESULTS" remote || true

      # its own artifact: product-shots-iphone is the Player's (the files are iphone-remote-<language>.png)
      - name: Export the product screenshots
        if: "!cancelled()"
        run: python3 tools/apple/export-shots.py build/product-shots "$RESULTS/remote.xcresult"
      - name: Keep the product screenshots
        if: "!cancelled()"
        uses: actions/upload-artifact@v7.0.1
        with:
          name: product-shots-iphone-remote
          path: build/product-shots
          if-no-files-found: error
          retention-days: 30

      - name: Keep the screenshots, results and the app's log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: remote-ui-tests
          path: |
            build/remote-shots
            build/remote-results
          if-no-files-found: warn
          retention-days: 14
