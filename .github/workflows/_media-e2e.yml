# Reusable media e2e gate: the Go tests that need a real ffmpeg/ffprobe
# (remote end to end, simulcast to an RTMP destination, two hosts on one
# machine, the channel engine/station and the strip), which every other
# tier skips. Its own wall budget (MEDIA_E2E_TIER_BUDGET, 5m) leaves the
# integration tier's 2m untouched.
#
# ffmpeg is the distro's: Ubuntu 22.04's apt ffmpeg (4.4.x), what the
# .deb packaging depends on. The runner image is pinned (ubuntu-22.04), and
# the version check below fails the job if the archive ever moves it off
# 4.4, so a new ffmpeg arrives as a deliberate change here.
#
# Service container digests are pinned like _integration.yml's; bump via
# Renovate.

name: Media e2e

on:
  workflow_call:

permissions:
  contents: read

jobs:
  media-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
      MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
      FFMPEG_SERIES: "4.4"

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum

      - name: Install ffmpeg and an Arabic font
        # a stuck mirror once took the job's whole 25 minutes (twice in a day)
        timeout-minutes: 10
        run: |
          tools/ci/apt-install.sh ffmpeg fonts-noto-core >/dev/null
          v=$(ffmpeg -hide_banner -version | head -1)
          echo "$v"
          ffprobe -hide_banner -version | head -1
          case "$v" in
            "ffmpeg version ${FFMPEG_SERIES}"*) ;;
            *) echo "::error::expected ffmpeg ${FFMPEG_SERIES}.x, got: $v"; exit 1 ;;
          esac
          ls /usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U maktaba >/dev/null 2>&1 && { echo "postgres ready"; exit 0; }
            sleep 2
          done
          echo "::error::Postgres not ready after 60s"
          exit 1

      # Migrating the service's own database once makes the cluster-wide
      # maktaba_worker role before the tests' scratch databases need it.
      - name: Run migrations
        run: make migrate

      - name: Run media e2e tier
        run: make test-media-e2e
