# Epic 51 (story 51.06): the components jobs, against real Postgres 16 with real sleepy
# pipeline workers (tests/components/sleepy/worker.py).
#
# - components-live: a component switched off, held and on again; N1-N5 of the epic's
#   README section 11 measured (components-live.json), on PRs touching the components.
#   With the API built from the commit, a loop and a stages component switched through
#   the Components page's calls: the phase, the health, the Queues tile and System health
#   (components-api-live.json; 51.10 T14, 51.14 T13). With maktaba-server serve of the
#   whole machine, a process component (llm, its process a stand-in) switched off and on:
#   the process table, the status and audit rows (components-server-live.json and the
#   server's log, server-live.log; 51.04 N3). And Epic 54 Phase 1 end to end: a plugin (the
#   host's hello guest) installed from a file, turned on, its job run in the sandboxed
#   maktaba-plugind, then turned off and removed (plugins-live.json, plugins-live.log).
# - components-chaos: 100 random flips of four stage groups while 2,000 jobs run (N6);
#   on PRs touching the runners, and nightly (components-nightly.yml).
#
# Every run keeps the workers' logs and the measurements as an artifact; a failure keeps
# the whole job history too.

name: Components

on:
  workflow_call:
    inputs:
      live: { type: boolean, default: true }
      chaos: { type: boolean, default: false }

permissions:
  contents: read

jobs:
  components-live:
    if: inputs.live
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
      MAKTABA_COMPONENTS_LOGS: ${{ github.workspace }}/components-logs
      # the API of the commit, for the scenarios through the Components page's calls
      # (test_api_live.py: 51.10 T14, 51.14 T13)
      MAKTABA_COMPONENTS_API_BIN: ${{ github.workspace }}/components-bin/maktaba-api
      # the whole server of the commit (maktaba-server serve with the API and streaming
      # beside it), for a process component switched off and on (test_server_live.py:
      # 51.04 N3, #641)
      MAKTABA_COMPONENTS_SERVER_BIN: ${{ github.workspace }}/components-bin
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false
      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('api/go.sum', 'streaming/go.sum', 'cmd/maktaba-server/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api streaming cmd/maktaba-server

      - name: Build the API
        working-directory: api
        env:
          CGO_ENABLED: '0'
        run: go build -o "$MAKTABA_COMPONENTS_API_BIN" .
      - name: Build streaming and maktaba-server
        env:
          CGO_ENABLED: '0'
        run: |
          (cd streaming && go build -o "$MAKTABA_COMPONENTS_SERVER_BIN/maktaba-streaming" .)
          (cd cmd/maktaba-server && go build -o "$MAKTABA_COMPONENTS_SERVER_BIN/maktaba-server" .)
      # Epic 54: the plugin host and its test guests, for the plugins' end to end
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build maktaba-plugind and the test guests
        run: |
          cargo build --locked --release --manifest-path plugind/Cargo.toml -p maktaba-plugind
          install -m 0755 plugind/target/release/maktaba-plugind "$MAKTABA_COMPONENTS_SERVER_BIN/"
          make plugind-guests
      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen --extra dev
      - name: components-live
        working-directory: pipeline
        run: >-
          uv run --extra dev pytest ../tests/components/test_rig_logs.py ../tests/components/test_collect_together.py
          ../tests/components/test_live.py ../tests/components/test_api_live.py
          ../tests/components/test_server_live.py ../tests/components/test_plugins_live.py
          -q -p no:cacheprovider -rsx
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: components-live-logs
          path: ${{ github.workspace }}/components-logs
          if-no-files-found: ignore

  components-chaos:
    if: inputs.chaos
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable
      MAKTABA_COMPONENTS_LOGS: ${{ github.workspace }}/components-logs
      # the run's schedule is printed in components-chaos.json; set it to repeat a run
      MAKTABA_CHAOS_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen --extra dev
      - name: components-chaos
        working-directory: pipeline
        run: uv run --extra dev pytest ../tests/components/test_chaos.py -q -p no:cacheprovider -rs
      - name: Keep the logs and the job history
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: components-chaos-logs
          path: ${{ github.workspace }}/components-logs
          if-no-files-found: ignore
