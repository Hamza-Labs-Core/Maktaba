# Releases are automatic: the newest commit on main that CI and the update rehearsal both
# passed on is tagged as the next patch version (vX.Y.Z+1, an annotated tag), and the tag
# workflows are started for it.
#
# WHEN: each time a CI run or an update rehearsal finishes green on main (a push, or the
# rehearsal's nightly run). The commit, and whether it is tagged, is tools/release/next_tag.py's
# choice: the newest commit of main both passed on (not only this event's: main's runs replace
# a pending one, so an event can be lost, and a commit with no run of its own is carried by the
# next green one's tag); never a commit that has a v* tag, nor one older than a tagged commit,
# nor one whose change since the highest tag is only the Claude trail (a trail-only push starts
# neither workflow either: their paths-ignore).
#
# THE TAG WORKFLOWS start from the tag push itself (`on: push: tags`), as for a tag pushed by
# hand. The tag is pushed over SSH with the repository's release deploy key (the secret
# RELEASE_TAG_DEPLOY_KEY; docs/updates.md, "The release deploy key"), never with GITHUB_TOKEN: a
# tag pushed with GITHUB_TOKEN starts no workflow, and starting them with a dispatch instead
# (#699) cannot make a release homes accept. Every release is signed keyless by release.yml, and
# the certificate records the run's trigger; shared/go/releaseverify, in every home's updater
# since the start, pins it to `push` (BuildTrigger). v0.3.85's dispatched release was signed as
# `workflow_dispatch` and failed that check, so it was never published. Without the key this job
# fails before tagging: a tag no release can follow helps no one. After the push it checks that
# each tag workflow (RELEASE_WORKFLOWS: every one with `push: tags`, kept so by
# tools/ci/tests/test_next_tag.py) has a push run for the tag.
#
# web-release.yml has no tag trigger: release.yml attaches the web bundle to every release (see
# web-release.yml's header). packages.yml follows Release and Desktop Release (workflow_run).
#
# RACES: both workflows' completions can fire for one commit, so one run at a time
# (concurrency, never cancelled), the choice is made again on freshly fetched tags just before
# the push, and the push never overwrites a tag (one made meanwhile fails it, and nothing is
# dispatched).

name: Auto tag

on:
  workflow_run:
    workflows: [CI, Update rehearsal]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag the newest green commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # the tag is pushed with the release deploy key, not this token
      actions: read # the green runs, and the tag workflows' runs after the push
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_WORKFLOWS: >-
        release.yml
        desktop-release.yml
        mobile-release.yml
        tv-release.yml
        play-bundles.yml
        testflight.yml
        relay.yml
    steps:
      # No key, no tag: a tag pushed with GITHUB_TOKEN starts no release, and a dispatched
      # release is signed as `workflow_dispatch`, which every home refuses (see the header).
      - name: The release deploy key is set
        env:
          HAS_KEY: ${{ secrets.RELEASE_TAG_DEPLOY_KEY != '' }}
        run: |
          if [ "${HAS_KEY}" != true ]; then
            echo "::error::auto-tag: the secret RELEASE_TAG_DEPLOY_KEY is not set, so no tag is made (a tag needs a push that starts release.yml: docs/updates.md, \"The release deploy key\")"
            exit 1
          fi

      # origin is SSH with the deploy key: the tag push below starts the tag workflows
      - uses: actions/checkout@v6.0.2
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          ssh-key: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}

      # the commits of main that CI and the rehearsal both finished green on (push and nightly
      # runs: the tag guard counts any finished green run on the commit)
      - name: The green commits
        run: |
          set -euo pipefail
          green() {
            gh run list --workflow "$1" --branch main --status success --limit 50 \
              --json headSha,event --jq '.[] | select(.event == "push" or .event == "schedule") | .headSha' |
              sort -u
          }
          comm -12 <(green ci.yml) <(green update-rehearsal.yml) >"${RUNNER_TEMP}/green.txt"
          echo "green on both: $(wc -l <"${RUNNER_TEMP}/green.txt") commit(s)"

      - name: Choose
        id: choose
        run: |
          set -euo pipefail
          python3 tools/release/next_tag.py --green "${RUNNER_TEMP}/green.txt" | tee -a "${GITHUB_OUTPUT}"

      - name: Tag
        id: tag
        if: steps.choose.outputs.tag != ''
        env:
          TAG: ${{ steps.choose.outputs.tag }}
          SHA: ${{ steps.choose.outputs.sha }}
        run: |
          set -euo pipefail
          # once more on the remote's tags, just before the push (a session may have tagged)
          git fetch --quiet --force --tags origin +refs/heads/main:refs/remotes/origin/main
          again="$(python3 tools/release/next_tag.py --green "${RUNNER_TEMP}/green.txt")"
          if [ "$(sed -n 's/^tag=//p' <<<"${again}")" != "${TAG}" ] || [ "$(sed -n 's/^sha=//p' <<<"${again}")" != "${SHA}" ]; then
            echo "::notice::not tagging ${TAG}: the tags changed meanwhile ($(sed -n 's/^reason=//p' <<<"${again}"))"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the message is the tag's name: play-bundles.yml then gives Play testers no notes of
          # their own (tools/ci/play_release.py)
          git tag -a "${TAG}" -m "${TAG}" "${SHA}"
          git push origin "refs/tags/${TAG}"
          echo "pushed=true" >>"${GITHUB_OUTPUT}"
          echo "::notice::tagged ${SHA} ${TAG}"

      # The push started them (on: push: tags). A missing one is an error to look at, never a
      # dispatch: a dispatched release.yml signs a release no home accepts.
      - name: The tag workflows started
        if: steps.tag.outputs.pushed == 'true'
        env:
          TAG: ${{ steps.choose.outputs.tag }}
        run: |
          set -euo pipefail
          missing="${RELEASE_WORKFLOWS}"
          for _ in $(seq 1 12); do
            sleep 10
            left=""
            for wf in ${missing}; do
              runs="$(gh run list --workflow "${wf}" --branch "${TAG}" --event push --limit 5 --json databaseId --jq 'length')"
              if [ "${runs}" = 0 ]; then left="${left} ${wf}"; else echo "${wf}: started by the push of ${TAG}"; fi
            done
            missing="${left}"
            [ -z "${missing}" ] && exit 0
          done
          echo "::error::the push of ${TAG} started no run of:${missing} (is RELEASE_TAG_DEPLOY_KEY a deploy key with write access?)"
          exit 1
