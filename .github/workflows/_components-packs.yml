# Reusable components-packs gate (Epic 51, story 51.15 T09/T12; README §11): the component
# packs of this commit for linux-amd64, built by tools/release/packs/build.sh as a release
# builds them, go into a release a fake Sigstore signs; the index verifies with the e2e
# trust root (-tags e2etrust, MAKTABA_E2E_TRUSTED_ROOT, never a runtime setting), every
# pack matches it and unpacks with the machine's rules, and a bad signature (a flipped
# byte), a bad sha256, a path traversal and an expired index are each refused. Then the
# build script itself: two builds of one tree are byte-identical, parts join to the pack.

name: Components packs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  packs:
    name: components-packs (linux-amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/release/go.mod
          cache-dependency-path: |
            tools/release/go.sum
            shared/go/releaseverify/go.sum
            shared/go/componentpack/go.sum
            shared/components/go.sum

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          # release.yml's uv: the same pins
          version: "0.13.4"

      # runtime.ml's linux-amd64 wheels are a few GB (torch with CUDA)
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: shellcheck
        run: shellcheck -x tools/release/packs/*.sh tools/release/packs/recipes/*.sh

      - name: build.sh (T09)
        run: bash tools/release/packs/test_build.sh 2>&1 | tee packs-logs-test-build.log

      - name: Build this commit's linux-amd64 packs
        run: |
          set -euo pipefail
          tools/release/packs/build.sh --version 0.0.0-ci --platform linux-amd64 --out "${RUNNER_TEMP}/packs" \
            2>&1 | tee packs-logs-build.log

      - name: Verify them with the e2e trust root (T12)
        working-directory: tools/release
        env:
          MAKTABA_PACKS_DIR: ${{ runner.temp }}/packs
          MAKTABA_PACKS_VERSION: 0.0.0-ci
        run: |
          set -euo pipefail
          go test -tags e2etrust -count=1 -v -run TestPacksEndToEnd ./componentsindex 2>&1 | tee ../../packs-logs-e2e.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: components-packs-logs
          path: packs-logs-*.log
          if-no-files-found: ignore
          retention-days: 7
