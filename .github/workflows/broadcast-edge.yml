# Deploys the broadcast edge (Epic 50 story 50.21, web/packages/broadcast-edge) to Maktaba's
# Cloudflare account, by hand only: the edge is not live until the broadcasting gate opens
# (README §14.11), so nothing deploys it on a push. A run picks the environment (staging, then
# production); the job first runs the same tests and rehearsal as a pull request, then checks
# the token, then deploys. `rollback: true` returns the Worker to its previous version instead
# (Durable Object state is kept).
#
# Needs CLOUDFLARE_API_TOKEN (or CLOUDFLARE_API_TOKEN_BROADCAST) with the broadcast piece's
# permissions (tools/cloudflare/token-check.mjs: Workers Scripts, Workers R2 Storage, Workers
# Routes, Zone Read; on maktaba.tv for production, maktaba.dev for staging) and
# CLOUDFLARE_ACCOUNT_ID; without them the job says so and passes. The
# buckets, the secrets and the first deploy are the owner's (docs/broadcast-edge.md).

name: Broadcast edge deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where to deploy"
        type: choice
        options: [staging, production]
        default: staging
      rollback:
        description: "Roll the Worker back to its previous version instead of deploying"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: broadcast-edge-deploy
  cancel-in-progress: false

jobs:
  test:
    if: ${{ !inputs.rollback }}
    uses: ./.github/workflows/_broadcast-edge.yml

  deploy:
    needs: [test]
    if: ${{ !cancelled() && (needs.test.result == 'success' || inputs.rollback) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: web/packages/broadcast-edge
    steps:
      - uses: actions/checkout@v6.0.2

      - name: The Cloudflare secrets
        id: ready
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BROADCAST || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=broadcast edge not deployed::Cloudflare secrets not set: skipping (docs/broadcast-edge.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6.4.0
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version-file: web/packages/broadcast-edge/.nvmrc
          package-manager-cache: false

      # before any write: the token can deploy a Worker with R2 and custom domains (50.34 §2)
      - name: Token check
        if: steps.ready.outputs.ok == 'true'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BROADCAST || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/cloudflare/token-check.mjs --pieces broadcast --zone ${{ inputs.environment == 'production' && 'maktaba.tv' || 'maktaba.dev' }}

      - name: Install
        if: steps.ready.outputs.ok == 'true'
        id: install
        run: |
          npm ci --no-audit --no-fund
          echo "wrangler=$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.ready.outputs.ok == 'true' && !inputs.rollback
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_BROADCAST || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/packages/broadcast-edge
          wranglerVersion: ${{ steps.install.outputs.wrangler }}
          command: deploy ${{ inputs.environment == 'production' && '--env production' || '' }}

      - name: Roll back to the previous version
        if: steps.ready.outputs.ok == 'true' && inputs.rollback
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_BROADCAST || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/packages/broadcast-edge
          wranglerVersion: ${{ steps.install.outputs.wrangler }}
          command: rollback ${{ inputs.environment == 'production' && '--env production' || '' }} --message "broadcast-edge rollback by ${{ github.actor }}"
