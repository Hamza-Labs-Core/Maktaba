# Reusable gate for the native Android apps (Epic 42.3, `apps/android`): the portable client's
# tests (the module the desktop Player shares) and the core module's unit tests (the API client, token storage, the stream's authorization, the fold layout),
# the Player's unit and Compose UI tests on the JVM (Robolectric, against a fake home) with its
# screenshots checked against the references (Roborazzi, Epic 48.15),
# Android lint on every module, and a debug build of each app for each form factor
# (Maktaba Player and Maktaba Remote; phone, foldable and tablet).

name: Android apps

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android-apps:
    name: Android apps (Player, Remote)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6.0.2

      # The wrapper's jar runs the build: it must be Gradle's own for the version it names.
      - name: Gradle wrapper is Gradle's
        run: |
          set -euo pipefail
          version=$(sed -n 's#.*/gradle-\(.*\)-bin.zip#\1#p' gradle/wrapper/gradle-wrapper.properties)
          want=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "${want}  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The default package list includes the long-removed `tools` package, which current
        # sdkmanager rejects. compileSdk 37 is installed here; AGP fetches its build-tools.
        with:
          packages: platform-tools platforms;android-37.0

      - name: Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/**/*.gradle.kts') }}
          restore-keys: android-gradle-

      - name: Unit tests, lint, build
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :client:test :core:testDebugUnitTest :remote:testPhoneDebugUnitTest \
            :player:testPhoneDebugUnitTest :player:verifyRoborazziPhoneDebug \
            :core:lintDebug :player:lintPhoneDebug :remote:lintPhoneDebug \
            assembleDebug

      # tools/affected-tests: which source files each module's unit tests execute (JaCoCo,
      # added by an init script: no build file changes). On a push to main only, after the
      # gate above, and never failing it; coverage-map.yml builds the map from it.
      - name: Coverage for the affected-tests map
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --quiet --init-script ../../tools/affected-tests/android-coverage.gradle \
            :client:jacocoTestReport :core:createDebugUnitTestCoverageReport \
            :remote:createPhoneDebugUnitTestCoverageReport :player:createPhoneDebugUnitTestCoverageReport
          out=../../build/coverage-fragment
          mkdir -p "$out"
          for m in client core remote player; do
            # build/reports/jacoco/test/jacocoTestReport.xml (JVM), build/reports/coverage/test/<variant>/report.xml
            report=$(find "$m/build/reports/jacoco" "$m/build/reports/coverage" -name '*.xml' 2>/dev/null | head -n1 || true)
            if [ -z "$report" ]; then echo "::warning::no coverage report for $m"; continue; fi
            cp "$report" "$out/$m.jacoco.xml"
            echo "android:apps/android/$m/src/test" >"$out/$m.jacoco.xml.id"
          done
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-fragment-android
          path: build/coverage-fragment
          if-no-files-found: ignore
          retention-days: 3

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-apps-reports
          path: |
            apps/android/*/build/reports/
            apps/android/*/build/test-results/
            apps/android/player/build/outputs/roborazzi/
          retention-days: 7
