# Reusable gate for the native Android apps (Epic 42.3, `apps/android`): the portable client's
# tests (the module the desktop Player shares) and the core module's unit tests (the API client, token storage, the stream's authorization, the fold layout),
# the Player's unit and Compose UI tests on the JVM (Robolectric, against a fake home) with its
# screenshots checked against the references (Roborazzi, Epic 48.15),
# Android lint on every module, a debug build of each app (Maktaba Player and Maktaba Remote:
# one package each for phone, foldable and tablet), and each app's release bundle, unsigned,
# so a change R8 breaks fails here and not on the release tag (play-bundles.yml signs them).
# And the tag-to-versionCode rule the release bundles use (tools/release/play-version.sh).

name: Android apps

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android-apps:
    name: Android apps (Player, Remote)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6.0.2

      # The wrapper's jar runs the build: it must be Gradle's own for the version it names.
      - name: Gradle wrapper is Gradle's
        working-directory: .
        # Gradle's published SHA-256 of the jar, fetched with retries
        run: tools/ci/gradle-wrapper.sh check apps/android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The default package list includes the long-removed `tools` package, which current
        # sdkmanager rejects. compileSdk 37 is installed here; AGP fetches its build-tools.
        with:
          packages: platform-tools platforms;android-37.0

      # Gradle's own cache action (Enhanced Caching: free on a public repository): the Gradle
      # User Home's dependencies, plugins, wrapper and compiled scripts, restored before the build
      # so it resolves nothing it resolved before from the network. Each dependency is its own
      # entry, shared between runs. The entry's key is the wrapper, the version catalogs and the
      # build scripts (not the commit), so a run on the same inputs reuses it and writes nothing
      # new; after a version change it restores the newest entry for this job and fetches only
      # what changed. Only main writes (the action's default): the repository's Actions cache is
      # over its 10 GB limit, and entries a pull request writes would push main's out sooner.
      - name: Gradle caches
        uses: gradle/actions/setup-gradle@v6.4.0
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB_EXECUTION: ${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/**/*.gradle.kts', 'apps/android/gradle.properties') }}
        with:
          add-job-summary: on-failure
          # the step above checks the wrapper jar
          validate-wrappers: false

      # The wrapper's distribution before the build, so ./gradlew downloads nothing (its own
      # download, one try with a 10 s timeout, failed the desktop Player on 2026-11-08): cached
      # by its pin, saved on a miss on any ref, and on a miss fetched with retries and checked
      # against distributionSha256Sum, then put where the wrapper looks
      # (tools/ci/gradle-wrapper.sh). Nothing is fetched when the cache above restored it.
      - name: Gradle distribution's cache key
        id: gradle-dist-key
        working-directory: .
        run: echo "key=$(tools/ci/gradle-wrapper.sh --key apps/android)" >>"$GITHUB_OUTPUT"
      - id: gradle-dist-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ci-pinned/gradle
          key: ${{ steps.gradle-dist-key.outputs.key }}
      - name: Gradle distribution, retried
        working-directory: .
        run: tools/ci/gradle-wrapper.sh dist apps/android build/ci-pinned/gradle
      - name: Save the Gradle distribution
        if: steps.gradle-dist-cache.outputs.cache-hit != 'true' && hashFiles('build/ci-pinned/gradle/*.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: build/ci-pinned/gradle
          key: ${{ steps.gradle-dist-key.outputs.key }}

      - name: Play versionCode from the tag
        working-directory: .
        run: bash tools/release/play-version-test.sh

      - name: Unit tests, lint, build
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            :client:test :core:testDebugUnitTest :remote:testDebugUnitTest \
            :player:testDebugUnitTest :player:verifyRoborazziDebug :remote:verifyRoborazziDebug \
            :core:lintDebug :player:lintDebug :remote:lintDebug \
            assembleDebug :player:bundleRelease :remote:bundleRelease

      # tools/affected-tests: which source files each module's unit tests execute (JaCoCo,
      # added by an init script: no build file changes). On a push to main only, after the
      # gate above, and never failing it; coverage-map.yml builds the map from it.
      - name: Coverage for the affected-tests map
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --quiet --init-script ../../tools/affected-tests/android-coverage.gradle \
            :client:jacocoTestReport :core:createDebugUnitTestCoverageReport \
            :remote:createDebugUnitTestCoverageReport :player:createDebugUnitTestCoverageReport
          out=../../build/coverage-fragment
          mkdir -p "$out"
          for m in client core remote player; do
            # build/reports/jacoco/test/jacocoTestReport.xml (JVM), build/reports/coverage/test/<variant>/report.xml
            report=$(find "$m/build/reports/jacoco" "$m/build/reports/coverage" -name '*.xml' 2>/dev/null | sed -n 1p || true)
            if [ -z "$report" ]; then echo "::warning::no coverage report for $m"; continue; fi
            cp "$report" "$out/$m.jacoco.xml"
            echo "android:apps/android/$m/src/test" >"$out/$m.jacoco.xml.id"
          done
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-fragment-android
          path: build/coverage-fragment
          if-no-files-found: ignore
          retention-days: 3

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-apps-reports
          path: |
            apps/android/*/build/reports/
            apps/android/*/build/test-results/
            apps/android/player/build/outputs/roborazzi/
            apps/android/remote/build/outputs/roborazzi/
          retention-days: 7
