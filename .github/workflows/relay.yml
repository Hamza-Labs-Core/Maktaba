# Maktaba Cloud Relay — dedicated CI/CD pipeline.
#
# Scope: the `cloud` Go module (the single `maktaba-cloud` binary that
# runs the api/relay/worker roles) and its VPS deploy stack under
# deploy/cloud-relay/. The repo-wide `ci.yml` already gates the cloud
# module as part of the monorepo unit/integration tiers; THIS workflow
# is the relay-focused leg that additionally builds + publishes the
# `maktaba-cloud` image and (optionally, when the RELAY_DEPLOY repo
# variable is 'true') rolls it out to the production VPS.
#
# Flow:
#   lint   golangci-lint over cloud/ (mirrors `make relay-ci`)
#   test   go test ./... against a Postgres service container
#   build  cross-compile the relay binary for linux/{amd64,arm64}
#   docker build cloud/Dockerfile + push to GHCR  (main + tags only)
#   gate   a tag: waits for release.yml to publish the release (its images signed),
#          then deploys only the latest release (releaseorder.Latest: never a
#          pre-release or a maintenance release of an older line)
#   deploy SSH to the VPS + roll the stack          (dispatch, or the latest
#          release's tag when vars.RELAY_DEPLOY == 'true'; never when this
#          run's lint, test or build failed)
#
# The reusable `make relay-ci` target runs lint+test+build locally so a
# developer reproduces this workflow's PR gates without GitHub.

name: Relay CI/CD

on:
  push:
    branches: [main]
    paths:
      # Maktaba's Caddy (Epic 50 story 50.02) and the HA pair's edge
      - 'deploy/caddy/**'
      - 'deploy/cloud-ha/**'
      - 'cloud/**'
      # the shared logger the cloud builds with (Epic 53 story 53.01)
      - 'shared/log/go/**'
      - 'deploy/cloud-relay/**'
      - '.github/workflows/relay.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      # Maktaba's Caddy (Epic 50 story 50.02) and the HA pair's edge
      - 'deploy/caddy/**'
      - 'deploy/cloud-ha/**'
      - 'cloud/**'
      # the shared logger the cloud builds with (Epic 53 story 53.01)
      - 'shared/log/go/**'
      - 'deploy/cloud-relay/**'
      - '.github/workflows/relay.yml'
  # Manual rollout: pick a tag (or leave blank to deploy `latest`) and
  # run the deploy job against the `production` environment.
  # Or a tag's run, as a pushed tag's: auto-tag.yml dispatches it on each tag it makes
  # (`--ref vX.Y.Z -f tag=vX.Y.Z`; a tag pushed with GITHUB_TOKEN starts no push run).
  # "A tag's run" below is a pushed tag, or a dispatch with `tag` on that tag's ref.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. v1.2.3). Blank = latest.'
        required: false
        default: ''
      tag:
        description: "A tag's run (auto-tag.yml), dispatched with --ref set to it; blank for a manual rollout"
        required: false
        default: ''

permissions:
  contents: read

# A new push to a branch/PR supersedes in-flight runs for that ref;
# tag pushes are never cancelled (each tag is its own immutable run).
concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Mirrors release.yml: forks pushing elsewhere set the MAKTABA_REGISTRY
  # repo variable; otherwise GHCR under the org namespace.
  REGISTRY: ${{ vars.MAKTABA_REGISTRY || 'ghcr.io/hamza-labs-core' }}
  IMAGE_NAME: maktaba-cloud

jobs:
  lint:
    name: lint (cloud)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cloud/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('cloud/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: cloud

      - name: golangci-lint (cloud)
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          working-directory: cloud
          args: --timeout=5m
          # its lint cache: pull requests and tags restore main's, only a push to main saves
          skip-save-cache: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  test:
    name: test (cloud + postgres)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    # The relay persists durable state (server registry, billing meter)
    # in Postgres; its store + migration tests need a live DB. Image and tag
    # pinned to match _integration.yml (Postgres 16 with pgvector; bumped via
    # Renovate, not by hand).
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MAKTABA_CLOUD_DB_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cloud/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('cloud/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: cloud

      - name: Wait for Postgres
        # pg_isready flips healthy before the DB accepts non-loopback
        # connections; poll once more (belt-and-braces, mirrors
        # _integration.yml).
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U maktaba >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres not ready after 60s"; exit 1

      - name: Unit tests (cloud)
        working-directory: cloud
        run: go test -short -count=1 ./...

      # The relay/api stores + embedded migrations are the integration
      # surface; the binary applies migrations on connect, so the tagged
      # tests run against the live service container.
      - name: Integration tests (cloud)
        working-directory: cloud
        run: go test -tags=integration -count=1 ./...

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cloud/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('cloud/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: cloud

      # Same reproducibility envelope as release.yml's cloud binary leg
      # (-trimpath, -buildid=, -s -w, -X main.*). VERSION is the tag on a
      # tag build, else `git describe`.
      - name: Build maktaba-cloud
        working-directory: cloud
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver="${VERSION:-$(git describe --tags --dirty --always 2>/dev/null || echo dev)}"
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-buildid= -s -w \
              -X main.Version=${ver} \
              -X main.Commit=${COMMIT}" \
            -o "../dist/maktaba-cloud-${GOOS}-${GOARCH}" ./cmd/maktaba-cloud

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maktaba-cloud-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  docker:
    name: docker build + push
    needs: [lint, test, build]
    # Publish only on main pushes — never on PRs (no secrets, no registry
    # write), never on manual dispatch (deploy uses an already-published
    # image), and never on a tag: a release's maktaba-cloud:<tag> (and
    # :latest, for a plain tag) is release.yml's alone, signed by its
    # identity with the other images and recorded in its signed
    # release-manifest.json. Two publishers of one tag (different build
    # args and signers, the last writer winning) left the deployed image
    # unknown.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-qemu-action@v3.6.0

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Registry login
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY == 'ghcr.io/hamza-labs-core' && 'ghcr.io' || env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Tag policy (main pushes only): :edge + :sha-<short>. latest=false: the
      # action's default (latest=auto) also moved :latest, on an rc tag too.
      - name: Derive image tags
        uses: docker/metadata-action@v5.7.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      # The relay runs on whatever the operator's VPS is (x86 droplets,
      # arm64 Ampere/Graviton), so the image is multi-arch — unlike
      # release.yml's single-arch app images. The build matrix above
      # already proved both arches compile.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Maktaba's Caddy (Epic 50 story 50.02, deploy/caddy): Caddy with the Cloudflare DNS module,
  # for the wildcard certificate every node holds. Every run builds it and checks it (T01: the
  # module is in; T02: both Caddyfiles validate); a push to main publishes it, multi-arch, and
  # signs it (cosign, keyless).
  caddy:
    name: caddy image (build, check, publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    env:
      CADDY_IMAGE: ${{ vars.MAKTABA_REGISTRY || 'ghcr.io/hamza-labs-core' }}/maktaba-caddy
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build (this runner's arch)
        run: docker build -t maktaba-caddy:check deploy/caddy
      - name: T01 the DNS modules are in
        run: |
          docker run --rm maktaba-caddy:check caddy list-modules | tee /tmp/modules
          grep -qx 'dns.providers.cloudflare' /tmp/modules
          grep -qx 'dns.providers.acmedns' /tmp/modules
      - name: T02 the Caddyfiles validate
        run: |
          set -euo pipefail
          tok=test0000000000000000000000000000000000ab
          for f in deploy/cloud-relay/Caddyfile deploy/cloud-ha/caddy/Caddyfile; do
            docker run --rm -v "$PWD/$f:/etc/caddy/Caddyfile:ro" -e RELAY_DOMAIN=relay.example.com \
              -e ACME_EMAIL=ops@example.com -e CF_API_TOKEN="$tok" -e NODE_ADDR=10.0.0.2 -e "RELAY_UPSTREAMS=127.0.0.1:8443 127.0.0.1:8453" \
              maktaba-caddy:check caddy validate --config /etc/caddy/Caddyfile
          done
      - name: The HA pair's scripts (Epic 50 story 50.07)
        run: |
          shellcheck -x deploy/cloud-ha/setup.sh deploy/cloud-ha/bin/* deploy/cloud-ha/tests/*.sh
          bash deploy/cloud-ha/tests/scripts-test.sh
      - name: The monitoring (Epic 50 stories 50.09, 50.10: promtool, amtool, the probe)
        run: |
          bash deploy/cloud-ha/monitoring/check.sh
          bash deploy/cloud-ha/monitoring/probe-test.sh
          shellcheck deploy/cloud-ha/monitoring/*.sh
      - name: T05 the witness's certificate check
        run: |
          shellcheck deploy/cloud-ha/witness/check-certs.sh deploy/cloud-ha/witness/check-certs-test.sh
          bash deploy/cloud-ha/witness/check-certs-test.sh
      - name: The image's tag
        id: tag
        run: |
          caddy="$(sed -n 's/^ARG CADDY_VERSION=v//p' deploy/caddy/Dockerfile)"
          cf="$(sed -n 's/^ARG CLOUDFLARE_VERSION=v//p' deploy/caddy/Dockerfile)"
          echo "tag=${caddy}-cf${cf}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/setup-buildx-action@v4.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Registry login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY == 'ghcr.io/hamza-labs-core' && 'ghcr.io' || env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7.2.0
        with:
          context: deploy/caddy
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.CADDY_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.CADDY_IMAGE }}:sha-${{ github.sha }}
      - uses: sigstore/cosign-installer@v3.10.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ${{ env.CADDY_IMAGE }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE_REF"

  # A tag deploys only once release.yml has published its release (published means its
  # signed set is in: build-images pushed and signed every image, sign-and-release signed the
  # checksums), and only the latest release: a maintenance release of an older line (story
  # 22.5 EC1), or a pre-release, never replaces what runs. Only after this run's lint, test
  # and build passed (each checked: docker is skipped on a tag either way, so its result
  # cannot tell a failure from a skip).
  gate:
    name: the release, published and the latest
    needs: [lint, test, build]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == github.ref_name)) &&
      !contains(github.ref, '-') && vars.RELAY_DEPLOY == 'true' &&
      needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    # the release is published once release.yml and the desktop apps are in (about 90 min);
    # a tag the guard refused, or whose release.yml failed, is told at once, not waited for
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read # release.yml's run for the tag: its guard's outcome and its own
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: tools/release/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('tools/release/go.sum') }}

      # this job's Go modules, retried (offline: false: see .github/actions/go-mod-download)
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: tools/release
          offline: "false"

      - name: Wait for the published release, then ask whether it is the latest
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # release.yml's newest run for this tag: "<id> <status> <conclusion>" ("" while none)
          release_run() {
            gh run list --repo "${GITHUB_REPOSITORY}" --workflow release.yml --limit 50 \
              --json databaseId,headBranch,status,conclusion \
              --jq "[.[] | select(.headBranch == \"${TAG}\")][0] // empty | \"\(.databaseId) \(.status) \(.conclusion)\"" \
              2>/dev/null || true
          }
          started="$(date +%s)"
          draft=missing
          for _ in $(seq 1 220); do
            draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
            if [ "${draft}" = false ]; then
              break
            fi
            run="" status="" conclusion=""
            read -r run status conclusion <<<"$(release_run)" || true
            if [ -n "${run}" ]; then
              guard="$(gh run view "${run}" --repo "${GITHUB_REPOSITORY}" --json jobs \
                --jq '.jobs[] | select(.name | startswith("guard")) | .conclusion' 2>/dev/null | sed -n 1p || true)"
              if [ "${guard}" = failure ]; then
                echo "::error::the tag guard refused ${TAG} (release.yml run ${run}): it is never published; nothing deployed"
                exit 1
              fi
              if [ "${status}" = completed ] && [ "${conclusion}" != success ]; then
                echo "::error::release.yml's run ${run} for ${TAG} ended ${conclusion}: the release is not published unless it is run again; nothing deployed (run this job again once it is)"
                exit 1
              fi
            fi
            if [ "${draft}" = missing ] && [ $(( $(date +%s) - started )) -ge 600 ]; then
              echo "::error::no draft or release for ${TAG} after 10 minutes (the tag guard opens one: it refused the tag, or release.yml never ran); nothing deployed"
              exit 1
            fi
            echo "release ${TAG}: not published yet (${draft})"
            sleep 60
          done
          [ "${draft}" = false ] || { echo "::error::${TAG} was not published in time: nothing deployed"; exit 1; }
          latest="$(gh release list --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' |
            (cd tools/release && go run ./cmd/release-order latest --tag "${TAG}"))"
          echo "release ${TAG} is published; the latest: ${latest}"
          echo "deploy=${latest}" >> "$GITHUB_OUTPUT"

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  deploy:
    name: deploy to VPS
    needs: [lint, test, build, docker, gate]
    # Manual rollout, or automatically for the latest release's tag (the gate), but only in
    # a repo that has a VPS: set the RELAY_DEPLOY repo variable to 'true'. Without it a tag
    # skips this job, so no deployment is recorded on `production`. A pre-release tag
    # (v0.3.0-rc.1) or a maintenance release never deploys by itself; dispatch it with its
    # tag to roll it out. Never when this run's lint, test or build failed, each checked
    # (`docker` is skipped on a dispatch and on a tag, after a failure too). `!cancelled()`
    # lets the skipped jobs' dependents run, but not a cancelled run (`always()` would).
    if: >-
      !cancelled() &&
      needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.tag == '' && needs.docker.result == 'skipped') ||
        (startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == github.ref_name)) &&
          needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true')
      )
    runs-on: ubuntu-22.04
    # a tag waits up to an hour for release.yml's image
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read # the release's image in the registry
      actions: read # the cloud rehearsal's runs (tools/release/cloud-guard.sh)
    # The `production` environment has no protection rules yet, so a
    # deploy does not wait for approval. To add a gate, add required
    # reviewers under Settings → Environments → production.
    # one deploy at a time (a deploy that waits is never cancelled)
    concurrency:
      group: relay-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.RELAY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v6.0.2

      # Pick the tag to roll out: explicit dispatch input wins, else the
      # pushed tag, else `latest`.
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # A tag's run: its release is published (the gate), so release.yml's image of it is
      # pushed and signed; checked here once more before the rollout.
      - name: Registry login
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == github.ref_name))
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY == 'ghcr.io/hamza-labs-core' && 'ghcr.io' || env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Wait for the release's image
        if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tag == github.ref_name))
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "release image ${IMAGE} is published"
              exit 0
            fi
            sleep 30
          done
          echo "::error::${IMAGE} was not published within an hour (release.yml's build-images, or its tag guard)"
          exit 1

      # Epic 50 story 50.06: no cloud deploy of a commit whose failover, deploy, rollback and
      # restore the cloud rehearsal (cloud-rehearsal.yml) did not pass on; a run still going is
      # waited for. The commit is the pushed tag's, or the dispatched image tag's.
      - name: The cloud rehearsal passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          if [ "${IMAGE_TAG}" != latest ] && [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            git fetch -q origin "+refs/tags/${IMAGE_TAG}:refs/tags/${IMAGE_TAG}"
            sha="$(git rev-list -n 1 "refs/tags/${IMAGE_TAG}")"
          fi
          SHA="${sha}" bash tools/release/cloud-guard.sh

      # The single VPS (deploy/cloud-relay), until the Phase 1 pair exists.
      - name: Deploy (the single VPS)
        if: vars.CLOUD_HA != 'true'
        env:
          RELAY_SSH_HOST: ${{ secrets.RELAY_SSH_HOST }}
          RELAY_SSH_USER: ${{ secrets.RELAY_SSH_USER }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          MAKTABA_CLOUD_TAG: ${{ steps.tag.outputs.tag }}
        # deploy.sh fails if the SSH secrets are missing: once this job
        # runs, a missing host is a misconfiguration, not a skip.
        run: bash deploy/cloud-relay/deploy.sh

      # The Phase 1 pair (Epic 50 story 50.08, deploy/cloud-ha/deploy.sh): Patroni says which
      # node leads; the standby smoke-tests the release first, then expand-only migrations and
      # a blue/green on the leader, whose old colour drains its homes to the new one. Set the
      # repository variable CLOUD_HA to 'true' once the pair runs.
      - name: Deploy (the Phase 1 pair)
        if: vars.CLOUD_HA == 'true'
        env:
          RELAY_HOST_A: ${{ secrets.RELAY_HOST_A }}
          RELAY_HOST_B: ${{ secrets.RELAY_HOST_B }}
          RELAY_SSH_USER: ${{ secrets.RELAY_SSH_USER }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: bash deploy/cloud-ha/deploy.sh "${{ steps.tag.outputs.tag }}"
