# Maktaba Cloud Relay — dedicated CI/CD pipeline.
#
# Scope: the `cloud` Go module (the single `maktaba-cloud` binary that
# runs the api/relay/worker roles) and its VPS deploy stack under
# deploy/cloud-relay/. The repo-wide `ci.yml` already gates the cloud
# module as part of the monorepo unit/integration tiers; THIS workflow
# is the relay-focused leg that additionally builds + publishes the
# `maktaba-cloud` image and (optionally, when the RELAY_DEPLOY repo
# variable is 'true') rolls it out to the production VPS.
#
# Flow:
#   lint   golangci-lint over cloud/ (mirrors `make relay-ci`)
#   test   go test ./... against a Postgres service container
#   build  cross-compile the relay binary for linux/{amd64,arm64}
#   docker build cloud/Dockerfile + push to GHCR  (main + tags only)
#   sign   keyless cosign over the pushed image digest  (tags only)
#   deploy SSH to the VPS + roll the stack          (dispatch, or plain
#          vX.Y.Z tags when vars.RELAY_DEPLOY == 'true')
#
# The reusable `make relay-ci` target runs lint+test+build locally so a
# developer reproduces this workflow's PR gates without GitHub.

name: Relay CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - 'deploy/cloud-relay/**'
      - '.github/workflows/relay.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'cloud/**'
      - 'deploy/cloud-relay/**'
      - '.github/workflows/relay.yml'
  # Manual rollout: pick a tag (or leave blank to deploy `latest`) and
  # run the deploy job against the `production` environment.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. v1.2.3). Blank = latest.'
        required: false
        default: ''

permissions:
  contents: read

# A new push to a branch/PR supersedes in-flight runs for that ref;
# tag pushes are never cancelled (each tag is its own immutable run).
concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Mirrors release.yml: forks pushing elsewhere set the MAKTABA_REGISTRY
  # repo variable; otherwise GHCR under the org namespace.
  REGISTRY: ${{ vars.MAKTABA_REGISTRY || 'ghcr.io/hamza-labs-core' }}
  IMAGE_NAME: maktaba-cloud

jobs:
  lint:
    name: lint (cloud)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cloud/go.mod
          cache-dependency-path: cloud/go.sum

      - name: golangci-lint (cloud)
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          working-directory: cloud
          args: --timeout=5m

  test:
    name: test (cloud + postgres)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    # The relay persists durable state (server registry, billing meter)
    # in Postgres; its store + migration tests need a live DB. Tag pinned
    # to match _integration.yml (bumped via Renovate, not by hand).
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MAKTABA_CLOUD_DB_URL: postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cloud/go.mod
          cache-dependency-path: cloud/go.sum

      - name: Wait for Postgres
        # pg_isready flips healthy before the DB accepts non-loopback
        # connections; poll once more (belt-and-braces, mirrors
        # _integration.yml).
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U maktaba >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres not ready after 60s"; exit 1

      - name: Unit tests (cloud)
        working-directory: cloud
        run: go test -short -count=1 ./...

      # The relay/api stores + embedded migrations are the integration
      # surface; the binary applies migrations on connect, so the tagged
      # tests run against the live service container.
      - name: Integration tests (cloud)
        working-directory: cloud
        run: go test -tags=integration -count=1 ./...

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cloud/go.mod
          cache-dependency-path: cloud/go.sum

      # Same reproducibility envelope as release.yml's cloud binary leg
      # (-trimpath, -buildid=, -s -w, -X main.*). VERSION is the tag on a
      # tag build, else `git describe`.
      - name: Build maktaba-cloud
        working-directory: cloud
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver="${VERSION:-$(git describe --tags --dirty --always 2>/dev/null || echo dev)}"
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-buildid= -s -w \
              -X main.Version=${ver} \
              -X main.Commit=${COMMIT}" \
            -o "../dist/maktaba-cloud-${GOOS}-${GOARCH}" ./cmd/maktaba-cloud

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maktaba-cloud-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  docker:
    name: docker build + push
    needs: [lint, test, build]
    # Publish only on main pushes — never on PRs (no secrets, no registry
    # write), never on manual dispatch (deploy uses an already-published
    # image), and never on a tag: a release's maktaba-cloud:<tag> (and
    # :latest, for a plain tag) is release.yml's alone, signed by its
    # identity with the other images and recorded in its signed
    # release-manifest.json. Two publishers of one tag (different build
    # args and signers, the last writer winning) left the deployed image
    # unknown.
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-qemu-action@v3.6.0

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Registry login
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY == 'ghcr.io/hamza-labs-core' && 'ghcr.io' || env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Tag policy (main pushes only): :edge + :sha-<short>. latest=false: the
      # action's default (latest=auto) also moved :latest, on an rc tag too.
      - name: Derive image tags
        uses: docker/metadata-action@v5.7.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      # The relay runs on whatever the operator's VPS is (x86 droplets,
      # arm64 Ampere/Graviton), so the image is multi-arch — unlike
      # release.yml's single-arch app images. The build matrix above
      # already proved both arches compile.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: deploy to VPS
    needs: [docker]
    # Manual rollout, or automatically once a tag's image is published,
    # but only in a repo that has a VPS: set the RELAY_DEPLOY repo
    # variable to 'true'. Without it a tag skips this job, so no
    # deployment is recorded on `production`. A pre-release tag
    # (v0.3.0-rc.1) never deploys by itself; dispatch it with its tag
    # to roll it out. `!cancelled()` lets a
    # workflow_dispatch run (where `docker` is skipped) reach deploy, but
    # not a cancelled run (`always()` would); a tag needs docker to have
    # succeeded, not been skipped because lint, test or build failed.
    # A tag's image is release.yml's (docker skips tags): the deploy waits for it below
    # (it exists only once release.yml's guard let the tag through and it was signed).
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'workflow_dispatch' && needs.docker.result == 'skipped') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
          !contains(github.ref, '-') &&
          needs.docker.result == 'skipped' && vars.RELAY_DEPLOY == 'true')
      )
    runs-on: ubuntu-22.04
    # a tag waits up to an hour for release.yml's image
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read # the release's image in the registry
    # The `production` environment has no protection rules yet, so a
    # deploy does not wait for approval. To add a gate, add required
    # reviewers under Settings → Environments → production.
    environment:
      name: production
      url: ${{ vars.RELAY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v6.0.2

      # Pick the tag to roll out: explicit dispatch input wins, else the
      # pushed tag, else `latest`.
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # A pushed tag: wait for release.yml's image of it (pushed, then signed, in its
      # build-images job), up to an hour.
      - name: Registry login
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY == 'ghcr.io/hamza-labs-core' && 'ghcr.io' || env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Wait for the release's image
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if docker buildx imagetools inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "release image ${IMAGE} is published"
              exit 0
            fi
            sleep 30
          done
          echo "::error::${IMAGE} was not published within an hour (release.yml's build-images, or its tag guard)"
          exit 1

      - name: Deploy
        env:
          RELAY_SSH_HOST: ${{ secrets.RELAY_SSH_HOST }}
          RELAY_SSH_USER: ${{ secrets.RELAY_SSH_USER }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          MAKTABA_CLOUD_TAG: ${{ steps.tag.outputs.tag }}
        # deploy.sh fails if the SSH secrets are missing: once this job
        # runs, a missing host is a misconfiguration, not a skip.
        run: bash deploy/cloud-relay/deploy.sh
