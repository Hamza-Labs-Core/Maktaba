# TEMPORARY: removed before the PR merges. Runs capabilities.test.tsx 800 times per leg:
# "fixed" is this branch, "unfixed" puts back main's capabilities.tsx and test file (c7e64b517).
name: tmp capabilities flake loop
on:
  push:
    branches: [fix/capabilities-open-page-flake]
permissions:
  contents: read
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [fixed, unfixed]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Put back the unfixed code
        if: matrix.leg == 'unfixed'
        run: |
          git show c7e64b517:web/src/lib/capabilities.tsx > web/src/lib/capabilities.tsx
          git show c7e64b517:web/src/lib/capabilities.test.tsx > web/src/lib/capabilities.test.tsx
      - name: 4 parallel loops of 50 runs
        working-directory: web
        run: |
          set -u
          mkdir -p ../loop
          for p in 1 2 3 4; do
            (
              f=0
              for i in $(seq 1 50); do
                if ! pnpm exec vitest run src/lib/capabilities.test.tsx > ../loop/run-$p.log 2>&1; then
                  f=$((f+1)); cp ../loop/run-$p.log ../loop/fail-$p-$i.log
                fi
              done
              echo "$f" > ../loop/failed-$p
            ) &
          done
          wait
          total=$(cat ../loop/failed-* | paste -sd+ | bc)
          echo "leg=${{ matrix.leg }} shard=${{ matrix.shard }}: $total/200 runs failed" | tee -a "$GITHUB_STEP_SUMMARY"
          for f in ../loop/fail-*.log; do [ -e "$f" ] && grep -E "×|FAIL|Unable to find" "$f" | head -5; done
          true
