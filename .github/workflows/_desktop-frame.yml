# Reusable gate for the desktop app's own window frame (Epic 13 story 13.10; the quality bar in
# docs/design/desktop/README.md): the web app's title bar, as the shell gives it the frame,
# against its references (web/e2e/desktop/__screenshots__/), dark, 1280×800, English and
# Arabic, Windows, GNOME and the Mac (pnpm e2e:desktop, web/playwright.desktop.config.ts).
#
# In the Playwright image, so the fonts are the same on every run. A reference that does not
# exist yet is written by the run (updateSnapshots "missing"), uploaded for the pull request to
# commit, and fails the job: the frame never passes without its committed references. The
# report and the failures' traces stay 7 days. No secret, no network call beyond the packages.

name: Desktop frame

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop-frame:
    name: Desktop frame (visual references)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host --init
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - name: Install web deps
        run: pnpm install --frozen-lockfile

      - name: Design tokens
        working-directory: .
        run: node web/design-system/build/build-tokens.mjs

      - name: The frame against its references
        env:
          CI: "true"
        run: |
          # the moment before the run: a reference newer than this was written by the run
          touch "$RUNNER_TEMP/references-before"
          pnpm e2e:desktop

      - name: References this run had to write
        id: new-references
        if: always()
        working-directory: .
        run: |
          # by file time, not git: the container's checkout may be one git refuses to read
          marker="$RUNNER_TEMP/references-before"
          if [ ! -f "$marker" ]; then echo "::error::the run left no marker; the references cannot be checked"; exit 1; fi
          new=""
          if [ -d web/e2e/desktop/__screenshots__ ]; then
            new=$(find web/e2e/desktop/__screenshots__ -type f -name '*.png' -newer "$marker")
          fi
          if [ -z "$new" ]; then echo "every reference exists"; exit 0; fi
          mkdir -p new-references
          for f in $new; do
            cp "$f" new-references/
            echo "::error file=$f::no committed reference: this run wrote it in CI's image (artifact desktop-frame-new-references); look at it, commit it and list it under Reference images:"
          done
          echo "written=true" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Upload the references this run wrote
        if: always() && steps.new-references.outputs.written == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-frame-new-references
          path: new-references/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-frame-report
          path: |
            web/test-results/desktop-report/
            web/test-results/desktop/
          if-no-files-found: warn
          retention-days: 7
