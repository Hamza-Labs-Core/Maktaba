# Reusable gate for the desktop Player for Windows and Linux (Epic 42.4,
# `apps/desktop-player`, Compose for Desktop on the apps' portable client): its tests (the
# stream proxy's rules, the update signature check against the release's, the stores, both
# languages) and an installer built on each system, as desktop-release.yml builds them.

name: Desktop Player

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop-player:
    name: Desktop Player (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-22.04
            tasks: packageDeb packageRpm
            jbr: linux-x64
            mpv: linux-x64
          - label: windows
            os: windows-latest
            tasks: packageMsi
            jbr: windows-x64
            mpv: windows-x64
    runs-on: ${{ matrix.os }}
    # a libmpv build (on a cache miss, after a change to its pins) takes up to half an hour
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop-player
    steps:
      - uses: actions/checkout@v6.0.2

      # The wrapper's jar runs the build: it must be Gradle's own for the version it names.
      - name: Gradle wrapper is Gradle's
        working-directory: .
        # Gradle's published SHA-256 of the jar, fetched with retries
        run: tools/ci/gradle-wrapper.sh check apps/desktop-player

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Story 13.15: the JetBrains Runtime the installers' runtime is jlinked from (its custom
      # title bar is the Player's own frame), pinned in jbr.sh and fetched through
      # fetch-pinned.sh; cached as WiX is, written only from main (the cache is over its limit)
      - name: JBR's cache key
        id: jbr-pin
        run: echo "key=$(./jbr.sh --key ${{ matrix.jbr }})" >>"$GITHUB_OUTPUT"
      - id: jbr-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ci-pinned/jbr
          key: ${{ steps.jbr-pin.outputs.key }}
      - name: JBR, retried
        id: jbr
        run: |
          set -euo pipefail
          home="$(./jbr.sh ${{ matrix.jbr }})"
          [ "$RUNNER_OS" != Windows ] || home="$(cygpath -w "$home")"
          echo "home=$home" >>"$GITHUB_OUTPUT"
      - name: Save JBR
        if: github.ref == 'refs/heads/main' && steps.jbr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ci-pinned/jbr
          key: ${{ steps.jbr-pin.outputs.key }}

      - name: Packaging tools (rpm)
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq rpm fakeroot

      # Gradle's own cache action (Enhanced Caching: free on a public repository): the Gradle
      # User Home's dependencies, plugins, wrapper and compiled scripts, restored before the build
      # so it resolves nothing it resolved before from the network. Each dependency is its own
      # entry, shared between runs. The entry's key is the wrapper, the version catalogs and the
      # build scripts (not the commit), so a run on the same inputs reuses it and writes nothing
      # new; after a version change it restores the newest entry for this job and fetches only
      # what changed. Only main writes (the action's default): the repository's Actions cache is
      # over its 10 GB limit, and entries a pull request writes would push main's out sooner.
      - name: Gradle caches
        uses: gradle/actions/setup-gradle@v6.4.0
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB_EXECUTION: ${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/desktop-player/gradle/*.toml', 'apps/desktop-player/gradle/wrapper/gradle-wrapper.properties', 'apps/desktop-player/**/*.gradle.kts', 'apps/desktop-player/gradle.properties', 'apps/android/client/build.gradle.kts') }}
        with:
          add-job-summary: on-failure
          # the step above checks the wrapper jar
          validate-wrappers: false

      # The wrapper's distribution before the build, so ./gradlew downloads nothing (its own
      # download, one try with a 10 s timeout, failed the desktop Player on 2026-11-08): cached
      # by its pin, saved on a miss on any ref, and on a miss fetched with retries and checked
      # against distributionSha256Sum, then put where the wrapper looks
      # (tools/ci/gradle-wrapper.sh). Nothing is fetched when the cache above restored it.
      - name: Gradle distribution's cache key
        id: gradle-dist-key
        working-directory: .
        run: echo "key=$(tools/ci/gradle-wrapper.sh --key apps/desktop-player)" >>"$GITHUB_OUTPUT"
      - id: gradle-dist-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ci-pinned/gradle
          key: ${{ steps.gradle-dist-key.outputs.key }}
      - name: Gradle distribution, retried
        working-directory: .
        run: tools/ci/gradle-wrapper.sh dist apps/desktop-player build/ci-pinned/gradle
      - name: Save the Gradle distribution
        if: steps.gradle-dist-cache.outputs.cache-hit != 'true' && hashFiles('build/ci-pinned/gradle/*.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: build/ci-pinned/gradle
          key: ${{ steps.gradle-dist-key.outputs.key }}

      # The .msi's WiX toolset: compose's downloadWix fetches it from a github.com release with
      # no retry (it timed out on 2026-11-08), and skips that when
      # $GRADLE_USER_HOME/compose-jb/wix311.zip is there (compose 1.12.2, wixToolset.kt). Pinned
      # by SHA-256, cached, fetched by tools/release/fetch-pinned.sh (the API first, retried)
      # and put there, so the build downloads nothing. A compose that wants another WiX
      # downloads its own, as before.
      - name: WiX's cache key
        id: wix-pin
        if: runner.os == 'Windows'
        working-directory: .
        env:
          WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip
          WIX_SHA256: 2c1888d5d1dba377fc7fa14444cf556963747ff9a0a289a3599cf09da03b9e2e
        run: |
          {
            echo "key=$(tools/release/fetch-pinned.sh --key "$WIX_URL" "$WIX_SHA256")"
            echo "url=$WIX_URL"
            echo "sha256=$WIX_SHA256"
          } >>"$GITHUB_OUTPUT"
      - id: wix-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: build/ci-pinned/wix
          key: ${{ steps.wix-pin.outputs.key }}
      - name: WiX, retried
        if: runner.os == 'Windows'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WIX_URL: ${{ steps.wix-pin.outputs.url }}
          WIX_SHA256: ${{ steps.wix-pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          zip="$(tools/release/fetch-pinned.sh "$WIX_URL" "$WIX_SHA256" build/ci-pinned/wix/wix311.zip)"
          home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$home/compose-jb"
          cp "$zip" "$home/compose-jb/wix311.zip"
          echo "WiX put in $home/compose-jb/wix311.zip for compose's downloadWix to skip"
      - name: Save WiX
        if: runner.os == 'Windows' && steps.wix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ci-pinned/wix
          key: ${{ steps.wix-pin.outputs.key }}

      # Story 13.18: the libmpv the Player carries (libmpv/build.sh: LGPL FFmpeg, dav1d,
      # libplacebo and mpv from the pinned sources in libmpv/pins.env), cached by the script and
      # its pins and saved from main only; it goes into resources/<system>/, which the
      # installers carry. The system libraries it uses, and ffmpeg for the test media, are
      # installed on every run (Windows: MSYS2's, which also builds it there).
      - name: libmpv's cache key
        id: mpv-pin
        working-directory: .
        run: echo "key=libmpv-${{ matrix.mpv }}-${{ hashFiles('apps/desktop-player/libmpv/**', 'tools/release/fetch-pinned.sh') }}" >>"$GITHUB_OUTPUT"
      - id: mpv-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/desktop-player/build/libmpv
          key: ${{ steps.mpv-pin.outputs.key }}
      - name: libmpv's libraries, ffmpeg for the test media (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg libass9 libva2 libva-drm2 libpulse0 libasound2 \
            nasm ninja-build pkg-config libass-dev libfreetype-dev libfribidi-dev libharfbuzz-dev libasound2-dev \
            libpulse-dev libva-dev zlib1g-dev
          pip3 install --user --quiet 'meson==1.6.1'
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: MSYS2, for libmpv's build and libraries and the test media (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            git curl base-devel
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-ntldd mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-spirv-cross
            mingw-w64-ucrt-x86_64-ffmpeg
      - name: Build libmpv (Linux)
        if: runner.os == 'Linux' && steps.mpv-cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: libmpv/build.sh build/libmpv
      - name: Build libmpv (Windows)
        if: runner.os == 'Windows' && steps.mpv-cache.outputs.cache-hit != 'true'
        timeout-minutes: 50
        shell: msys2 {0}
        run: libmpv/build.sh build/libmpv
      - name: Save libmpv
        if: github.ref == 'refs/heads/main' && steps.mpv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/desktop-player/build/libmpv
          key: ${{ steps.mpv-pin.outputs.key }}
      - name: libmpv into the installers
        run: |
          set -euo pipefail
          mkdir -p "resources/${{ matrix.mpv }}"
          cp -R build/libmpv/. "resources/${{ matrix.mpv }}/"
          ls -l "resources/${{ matrix.mpv }}"
      # T01 and T02's files (MpvRealTest reads them)
      - name: Test media (story 13.18, Linux)
        if: runner.os == 'Linux'
        run: libmpv/test-media.sh build/test-media
      - name: Test media (story 13.18, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: libmpv/test-media.sh build/test-media

      - name: Tests, installers
        env:
          JBR: ${{ steps.jbr.outputs.home }}
          MAKTABA_LIBMPV_DIR: ${{ github.workspace }}/apps/desktop-player/build/libmpv
          MAKTABA_TEST_MEDIA: ${{ github.workspace }}/apps/desktop-player/build/test-media
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :client:test test ${{ matrix.tasks }} -Pmaktaba.version=0.0.1 "-Pmaktaba.jbr=${JBR}"
          # the real libmpv's tests ran, not skipped (story 13.18), and what they measured
          report=(build/test-results/test/TEST-*MpvRealTest.xml)
          counts=$(grep -m 1 -oE 'tests="[0-9]+" skipped="[0-9]+"' "${report[0]}" || true)
          echo "MpvRealTest: ${counts}"
          grep -oE '(T0[0-9][^<]*|mpv-configuration[^<]*)' "${report[0]}" || true
          grep -q 'skipped="0"' <<<"${counts}" || { echo "::error::MpvRealTest was skipped: no libmpv or no test media"; exit 1; }

      # Story 13.15: the Player as packaged, on the JetBrains Runtime, started on a virtual
      # display: it must come up with its own title bar and still be running 25 s later
      - name: Starts with its own title bar
        if: runner.os == 'Linux'
        env:
          JBR: ${{ steps.jbr.outputs.home }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace createDistributable -Pmaktaba.version=0.0.1 "-Pmaktaba.jbr=${JBR}"
          home="$(mktemp -d)"
          code=0
          HOME="$home" timeout -k 5 25 xvfb-run -a build/compose/binaries/main/app/maktaba-player/bin/maktaba-player >"$home/out.log" 2>&1 || code=$?
          pkill -f 'maktaba-player/bin/maktaba-player' || true
          cat "$home/out.log"
          # 124: still running at 25 s and stopped; 137: still running, killed when it took
          # over 5 s to stop
          [ "$code" = 124 ] || [ "$code" = 137 ] || { echo "::error::the Player ended (exit $code) before 25 s"; exit 1; }
          grep -q 'maktaba-player: frame decorated' "$home/out.log" || { echo "::error::the Player did not start with its own title bar"; exit 1; }
          ! grep -qE '^(Exception|Caused by|java\.lang\.[A-Za-z]*(Error|Exception))' "$home/out.log" || { echo "::error::the Player logged an exception at start"; exit 1; }

      # Story 55.02 (issue #638): a build with the capabilities gate switched off makes its
      # session with the gate off. The installers above are built with no property: gate on.
      - name: Gate switched off
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :test --tests '*CapabilitiesGateTest*' -Pmaktaba.capabilitiesGate=off -Pmaktaba.version=0.0.1

      - name: Check the installers
        run: |
          set -euo pipefail
          shopt -s nullglob
          out=build/compose/binaries/main
          ls -lR "$out"
          # the runtime the installers carry is the JetBrains Runtime (story 13.15)
          # (compose's jlink writes no IMPLEMENTOR: the build runs on Java 17, jbr.sh's JBR is 25)
          # (compose's createRuntimeImage writes it here, and the installers copy it)
          release=build/compose/tmp/main/runtime/release
          if ! grep -q '^JAVA_VERSION="25\.' "$release"; then
            echo "::error::the installers' runtime is not jbr.sh's JetBrains Runtime 25 ($release)"; cat "$release" || true; exit 1
          fi
          case "$RUNNER_OS" in
            Linux)
              deb=("$out"/deb/*.deb); rpm=("$out"/rpm/*.rpm)
              [ "${#deb[@]}" = 1 ] && [ "${#rpm[@]}" = 1 ] || { echo "::error::want one .deb and one .rpm"; exit 1; }
              [ "$(dpkg-deb -f "${deb[0]}" Package)" = maktaba-player ]
              # the launcher, the app's jars (with JavaFX's Linux natives) and its own runtime;
              # listed once into a variable (grep -q on a pipe ends it early: tar's write fails)
              files=$(dpkg-deb -c "${deb[0]}")
              info=$(rpm -qip "${rpm[0]}")
              for want in '/bin/maktaba-player$' '/lib/app/.*javafx-media' '/lib/runtime/' '/lib/app/resources/libmpv\.so\.2$'; do
                grep -qE "${want}" <<<"${files}" || { echo "::error::the .deb has nothing matching ${want}"; grep -E 'bin/|lib/app/' <<<"${files}" | sed -n 1,40p; exit 1; }
              done
              grep -q '^Name *: maktaba-player' <<<"${info}" || { echo "::error::the .rpm is not maktaba-player"; echo "${info}"; exit 1; }
              # libmpv's system libraries are the package's dependencies (story 13.18)
              depends=$(dpkg-deb -f "${deb[0]}" Depends)
              echo "Depends: ${depends}"
              grep -q 'libass9' <<<"${depends}" || { echo "::error::the .deb does not depend on libass9, which libmpv needs"; exit 1; }
              requires=$(rpm -qRp "${rpm[0]}")
              grep -q '^libass' <<<"${requires}" || { echo "::error::the .rpm does not require libass, which libmpv needs"; echo "${requires}"; exit 1; }
              ;;
            Windows)
              msi=("$out"/msi/*.msi)
              [ "${#msi[@]}" = 1 ] || { echo "::error::want one .msi"; exit 1; }
              # story 13.14: Maktaba's bitmaps and text styles, and the Arabic transform
              # (packageMsi ran theme_msi.py), read back through Windows Installer
              python ../../tools/release/msi/theme_msi.py --check "${msi[0]}"
              ;;
          esac

      # Story 13.14: the .msi with its Arabic transform installed and uninstalled by msiexec (the
      # check above applies it without Windows Installer). Nothing else here installs the Player.
      - name: The Arabic .msi, through Windows Installer
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem build/compose/binaries/main/msi/*.msi).FullName
          ../../tools/release/msi/install-arabic.ps1 -Msi $msi

      # Story 13.15's visual references (FrameReferencesTest, compared on Linux): one missing
      # is written here and fails the job; the pull request commits it from this artifact into
      # src/test/resources/references/ and lists it under "Reference images:"
      - name: New and differing references
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-player-new-references
          if-no-files-found: ignore
          path: |
            apps/desktop-player/build/new-references/
            apps/desktop-player/build/reference-diffs/

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-player-reports-${{ matrix.label }}
          path: |
            apps/desktop-player/build/reports/
            apps/android/client/build/reports/
