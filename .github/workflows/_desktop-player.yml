# Reusable gate for the desktop Player for Windows and Linux (Epic 42.4,
# `apps/desktop-player`, Compose for Desktop on the apps' portable client): its tests (the
# stream proxy's rules, the update signature check against the release's, the stores, both
# languages) and an installer built on each system, as desktop-release.yml builds them.

name: Desktop Player

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop-player:
    name: Desktop Player (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-22.04
            tasks: packageDeb packageRpm
          - label: windows
            os: windows-latest
            tasks: packageMsi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop-player
    steps:
      - uses: actions/checkout@v6.0.2

      # The wrapper's jar runs the build: it must be Gradle's own for the version it names.
      - name: Gradle wrapper is Gradle's
        working-directory: .
        # Gradle's published SHA-256 of the jar, fetched with retries
        run: tools/ci/gradle-wrapper.sh check apps/desktop-player

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Packaging tools (rpm)
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 8
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq rpm fakeroot

      # Gradle's own cache action (Enhanced Caching: free on a public repository): the Gradle
      # User Home's dependencies, plugins, wrapper and compiled scripts, restored before the build
      # so it resolves nothing it resolved before from the network. Each dependency is its own
      # entry, shared between runs. The entry's key is the wrapper, the version catalogs and the
      # build scripts (not the commit), so a run on the same inputs reuses it and writes nothing
      # new; after a version change it restores the newest entry for this job and fetches only
      # what changed. Only main writes (the action's default): the repository's Actions cache is
      # over its 10 GB limit, and entries a pull request writes would push main's out sooner.
      - name: Gradle caches
        uses: gradle/actions/setup-gradle@v6.4.0
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB_EXECUTION: ${{ hashFiles('apps/android/gradle/libs.versions.toml', 'apps/desktop-player/gradle/*.toml', 'apps/desktop-player/gradle/wrapper/gradle-wrapper.properties', 'apps/desktop-player/**/*.gradle.kts', 'apps/desktop-player/gradle.properties', 'apps/android/client/build.gradle.kts') }}
        with:
          add-job-summary: on-failure
          # the step above checks the wrapper jar
          validate-wrappers: false

      # The wrapper's distribution before the build, so ./gradlew downloads nothing (its own
      # download, one try with a 10 s timeout, failed the desktop Player on 2026-11-08): cached
      # by its pin, saved on a miss on any ref, and on a miss fetched with retries and checked
      # against distributionSha256Sum, then put where the wrapper looks
      # (tools/ci/gradle-wrapper.sh). Nothing is fetched when the cache above restored it.
      - name: Gradle distribution's cache key
        id: gradle-dist-key
        working-directory: .
        run: echo "key=$(tools/ci/gradle-wrapper.sh --key apps/desktop-player)" >>"$GITHUB_OUTPUT"
      - id: gradle-dist-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ci-pinned/gradle
          key: ${{ steps.gradle-dist-key.outputs.key }}
      - name: Gradle distribution, retried
        working-directory: .
        run: tools/ci/gradle-wrapper.sh dist apps/desktop-player build/ci-pinned/gradle
      - name: Save the Gradle distribution
        if: steps.gradle-dist-cache.outputs.cache-hit != 'true' && hashFiles('build/ci-pinned/gradle/*.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: build/ci-pinned/gradle
          key: ${{ steps.gradle-dist-key.outputs.key }}

      # The .msi's WiX toolset: compose's downloadWix fetches it from a github.com release with
      # no retry (it timed out on 2026-11-08), and skips that when
      # $GRADLE_USER_HOME/compose-jb/wix311.zip is there (compose 1.12.2, wixToolset.kt). Pinned
      # by SHA-256, cached, fetched by tools/release/fetch-pinned.sh (the API first, retried)
      # and put there, so the build downloads nothing. A compose that wants another WiX
      # downloads its own, as before.
      - name: WiX's cache key
        id: wix-pin
        if: runner.os == 'Windows'
        working-directory: .
        env:
          WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip
          WIX_SHA256: 2c1888d5d1dba377fc7fa14444cf556963747ff9a0a289a3599cf09da03b9e2e
        run: |
          {
            echo "key=$(tools/release/fetch-pinned.sh --key "$WIX_URL" "$WIX_SHA256")"
            echo "url=$WIX_URL"
            echo "sha256=$WIX_SHA256"
          } >>"$GITHUB_OUTPUT"
      - id: wix-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: build/ci-pinned/wix
          key: ${{ steps.wix-pin.outputs.key }}
      - name: WiX, retried
        if: runner.os == 'Windows'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WIX_URL: ${{ steps.wix-pin.outputs.url }}
          WIX_SHA256: ${{ steps.wix-pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          zip="$(tools/release/fetch-pinned.sh "$WIX_URL" "$WIX_SHA256" build/ci-pinned/wix/wix311.zip)"
          home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$home/compose-jb"
          cp "$zip" "$home/compose-jb/wix311.zip"
          echo "WiX put in $home/compose-jb/wix311.zip for compose's downloadWix to skip"
      - name: Save WiX
        if: runner.os == 'Windows' && steps.wix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ci-pinned/wix
          key: ${{ steps.wix-pin.outputs.key }}

      - name: Tests, installers
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :client:test test ${{ matrix.tasks }} -Pmaktaba.version=0.0.1

      # Story 55.02 (issue #638): a build with the capabilities gate switched off makes its
      # session with the gate off. The installers above are built with no property: gate on.
      - name: Gate switched off
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :test --tests '*CapabilitiesGateTest*' -Pmaktaba.capabilitiesGate=off -Pmaktaba.version=0.0.1

      - name: Check the installers
        run: |
          set -euo pipefail
          shopt -s nullglob
          out=build/compose/binaries/main
          ls -lR "$out"
          case "$RUNNER_OS" in
            Linux)
              deb=("$out"/deb/*.deb); rpm=("$out"/rpm/*.rpm)
              [ "${#deb[@]}" = 1 ] && [ "${#rpm[@]}" = 1 ] || { echo "::error::want one .deb and one .rpm"; exit 1; }
              [ "$(dpkg-deb -f "${deb[0]}" Package)" = maktaba-player ]
              # the launcher, the app's jars (with JavaFX's Linux natives) and its own runtime;
              # listed once into a variable (grep -q on a pipe ends it early: tar's write fails)
              files=$(dpkg-deb -c "${deb[0]}")
              info=$(rpm -qip "${rpm[0]}")
              for want in '/bin/maktaba-player$' '/lib/app/.*javafx-media' '/lib/runtime/'; do
                grep -qE "${want}" <<<"${files}" || { echo "::error::the .deb has nothing matching ${want}"; grep -E 'bin/|lib/app/' <<<"${files}" | sed -n 1,40p; exit 1; }
              done
              grep -q '^Name *: maktaba-player' <<<"${info}" || { echo "::error::the .rpm is not maktaba-player"; echo "${info}"; exit 1; }
              ;;
            Windows)
              msi=("$out"/msi/*.msi)
              [ "${#msi[@]}" = 1 ] || { echo "::error::want one .msi"; exit 1; }
              ;;
          esac

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-player-reports-${{ matrix.label }}
          path: |
            apps/desktop-player/build/reports/
            apps/android/client/build/reports/
