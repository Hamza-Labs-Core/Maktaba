# The cloud rehearsal (Epic 50 story 50.06, docs/cloud-rehearsal.md): Maktaba Cloud's Phase 1
# cluster in Docker on the runner (tools/rehearsal-cloud/compose.yml), broken on purpose in each
# way it can break, every scenario measured against its budget. No Hetzner, Cloudflare, Let's
# Encrypt or payment provider host is ever contacted: the cluster is this commit's image, Postgres
# and Caddy on a Docker network, and the simulated homes and clients run in the test.
#
# Jobs: image (this commit's relay, tools/rehearsal-cloud/Dockerfile), one job per scenario
# (cloud/rehearsal/scenarios_test.go, -tags cloudrehearsal), and cloud-rehearsal, the verdict. A
# scenario a later story builds is listed in tools/rehearsal-cloud/expected-failures.txt: reported,
# not counted, until that story removes its line. The relay's deploy job (relay.yml) refuses a
# commit this workflow did not pass on (tools/release/cloud-guard.sh).

name: Cloud rehearsal

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'cloud/**'
      - 'shared/log/go/**'
      - 'shared/logkeeper/go/**'
      - 'shared/go/clientip/**'
      - 'deploy/cloud-ha/**'
      - 'deploy/cloud-relay/**'
      - 'deploy/caddy/**'
      - 'tools/rehearsal-cloud/**'
      - 'tools/release/cloud-guard*.sh'
      # the direct-remote scenario's home (Dockerfile.home)
      - 'api/cmd/rehearsal-direct-home/**'
      - 'api/internal/directaccess/**'
      - '.github/workflows/cloud-rehearsal.yml'
  push:
    branches: [main, 'release/**']
    paths-ignore: ['docs/claude-trail.md', 'docs/trail/**']
  schedule:
    - cron: '47 5 * * *' # nightly, 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-rehearsal-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image (this commit's relay)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      not_built: ${{ steps.expected.outputs.notes }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build
        run: |
          docker build -f tools/rehearsal-cloud/Dockerfile -t maktaba-cloud:rehearsal .
          # the releases the deploy scenarios deploy (story 50.08): a new one, and a bad one
          docker build -f tools/rehearsal-cloud/Dockerfile --build-arg VERSION=new -t maktaba-cloud:rehearsal-new .
          docker build -f tools/rehearsal-cloud/Dockerfile --build-arg VERSION=bad --build-arg BUILD_TAGS=rehearsalbad -t maktaba-cloud:rehearsal-bad .
          # the plans build (story 50.19 T13, relay-plans): the paid plans' TBD numbers set
          docker build -f tools/rehearsal-cloud/Dockerfile --build-arg BUILD_TAGS=rehearsalplans -t maktaba-cloud:rehearsal-plans .
          # Maktaba's Caddy (deploy/caddy, story 50.02) for the cert-on-standby scenario
          docker build -t maktaba-caddy:rehearsal deploy/caddy
          # a machine of the Phase 1 pair (deploy/cloud-ha, story 50.07) for the failover scenarios
          docker build -f tools/rehearsal-cloud/Dockerfile.node -t maktaba-node:rehearsal \
            --build-arg CLOUD_IMAGE=maktaba-cloud:rehearsal --build-arg CADDY_IMAGE=maktaba-caddy:rehearsal .
          # a home with direct remote access behind a NAT-PMP router (story 50.15, direct-remote)
          docker build -f tools/rehearsal-cloud/Dockerfile.home -t maktaba-home:rehearsal .
      - name: Save
        run: docker save maktaba-cloud:rehearsal maktaba-cloud:rehearsal-new maktaba-cloud:rehearsal-bad maktaba-cloud:rehearsal-plans maktaba-caddy:rehearsal maktaba-node:rehearsal maktaba-home:rehearsal | gzip -1 > /tmp/image.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: rehearsal-image
          path: /tmp/image.tar.gz
          retention-days: 1
      - name: The scenarios a later story builds
        id: expected
        run: |
          notes="$(grep -v '^\s*#' tools/rehearsal-cloud/expected-failures.txt | awk 'NF{printf "%s (%s); ", $1, $2}')"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

  scenario:
    name: ${{ matrix.scenario }}
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # C01–C10 (story 50.06 §2); a scenario a later story builds skips itself
        scenario:
          - drain-1k
          - failover-kill-leader
          - failover-network-partition
          - switchover
          - deploy-blue-green
          - deploy-bad-release-rollback
          - migration-n-minus-1
          - db-blip
          - restore-pitr
          - cert-on-standby
          - status-feed
          - runbook-switchover
          - runbook-forced-failover
          - runbook-dns-swap
          - load-small
          - relay-plans
          - direct-remote
          - origin-only-via-edge
          - origin-aop
          # 53.16 T07: a canary home's reports through its agent, symbolicated with tables made in the job
          - report-symbolicated
          # 50.17: three api nodes behind HAProxy (LB11): the worker's lock, the shared sign-in
          # limit, a change reaching every cache, a rolling deploy with no failed request
          - api-pool
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cloud/go.mod
          cache: false
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: cloud
      # the artifacts API can be unreachable once: three attempts, then a loud failure
      - name: Download rehearsal-image
        id: artifact-rehearsal-image
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-image
          path: /tmp
      - name: Wait 15s to retry the download of rehearsal-image
        if: steps.artifact-rehearsal-image.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Download rehearsal-image (attempt 2)
        id: artifact-rehearsal-image-2
        if: steps.artifact-rehearsal-image.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-image
          path: /tmp
      - name: Wait 45s to retry the download of rehearsal-image
        if: steps.artifact-rehearsal-image-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Download rehearsal-image (attempt 3)
        id: artifact-rehearsal-image-3
        if: steps.artifact-rehearsal-image-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: rehearsal-image
          path: /tmp
      - name: Check rehearsal-image downloaded
        id: artifact-rehearsal-image-check
        if: steps.artifact-rehearsal-image-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: rehearsal-image
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1
      - name: Load the image
        run: gunzip -c /tmp/image.tar.gz | docker load
      - name: Pull the cluster's other images
        run: docker compose -f tools/rehearsal-cloud/compose.yml --profile certs pull --ignore-buildable --quiet postgres edge pebble
      - name: Run ${{ matrix.scenario }}
        if: matrix.scenario != 'load-small'
        env:
          REHEARSAL_OUT: ${{ runner.temp }}/rehearsal
        working-directory: cloud
        run: |
          ulimit -n 65536 || true
          CGO_ENABLED=0 go test -tags cloudrehearsal -run "TestScenario/${{ matrix.scenario }}$" -timeout 28m -v ./rehearsal/ 2>&1 | tee "${RUNNER_TEMP}/scenario.log"
          exit "${PIPESTATUS[0]}"
      # load-small (story 50.14) compares the relay with its base on the same runner: a figure
      # from another run is another machine (the same code measured 0.00045 to 0.00087
      # CPU-seconds per Mbit across runners, #832). The base is the commit this one is compared
      # with: the pull request's base, or main before this push. Its relay image is built here,
      # and both run this commit's scenario (3 one-minute rounds each); more than 20 % worse
      # CPU per Mbit, or memory per tunnel, fails. A base that can't run fails too: a gate that
      # can't measure doesn't pass.
      - name: Build the base commit's relay (load-small)
        if: matrix.scenario == 'load-small'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE_SHA}"
          if [ -z "${base}" ] || [ "${base}" = 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=2 origin "${GITHUB_SHA}"
            base="$(git rev-parse "${GITHUB_SHA}^")"
          fi
          git fetch --no-tags --depth=1 origin "${base}"
          git worktree add --detach "${RUNNER_TEMP}/base" "${base}"
          echo "base: ${base}"
          docker build -q -f tools/rehearsal-cloud/Dockerfile -t maktaba-cloud:rehearsal-base "${RUNNER_TEMP}/base"
      - name: Run load-small, the base's relay then this commit's
        if: matrix.scenario == 'load-small'
        env:
          OUT: ${{ runner.temp }}/rehearsal
        working-directory: cloud
        run: |
          ulimit -n 65536 || true
          docker tag maktaba-cloud:rehearsal maktaba-cloud:rehearsal-this
          run() { # run <image> <out>: this commit's load-small against that relay image
            docker tag "$1" maktaba-cloud:rehearsal
            REHEARSAL_OUT="$2" REHEARSAL_LOAD_SECONDS=180 REHEARSAL_LOAD_ROUNDS=3 CGO_ENABLED=0 \
              go test -tags cloudrehearsal -run 'TestScenario/load-small$' -timeout 13m -v ./rehearsal/ 2>&1 | tee -a "${RUNNER_TEMP}/scenario.log"
            return "${PIPESTATUS[0]}"
          }
          run maktaba-cloud:rehearsal-base "${OUT}/base"
          run maktaba-cloud:rehearsal-this "${OUT}"
          docker tag maktaba-cloud:rehearsal-this maktaba-cloud:rehearsal
          for f in "${OUT}/base/load-small-baseline.json" "${OUT}/load-small-baseline.json"; do
            [ -s "${f}" ] || { echo "::error::${f} is missing: load-small measured nothing to compare"; exit 1; }
          done
          CGO_ENABLED=0 go run ./cmd/maktaba-loadtest compare --baseline "${OUT}/base/load-small-baseline.json" --current "${OUT}/load-small-baseline.json"
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.scenario == 'load-small'
        with:
          name: load-small-baseline
          path: ${{ runner.temp }}/rehearsal/load-small-baseline.json
          retention-days: 90
      - name: Summary
        if: always()
        env:
          OUT: ${{ runner.temp }}/rehearsal
        run: |
          f="${OUT}/${{ matrix.scenario }}.json"
          if [ -f "$f" ]; then
            jq -r '"| \(.scenario) | \(if .passed then "pass" else "fail or not built" end) | \(.downtime_ms) ms / \(.budget_ms) ms | \(.failed_requests) of \(.requests) | \((.notes // []) | join("; ")) |"' "$f" >> "$GITHUB_STEP_SUMMARY"
          fi
      # every container's log and the scenario's JSON, whether it passed or not (tests keep their logs)
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: rehearsal-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/rehearsal
            ${{ runner.temp }}/scenario.log
          retention-days: 14

  cloud-rehearsal:
    name: cloud-rehearsal
    needs: [image, scenario]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: The verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
          NOT_BUILT: ${{ needs.image.outputs.not_built }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          if [ -n "${NOT_BUILT}" ]; then
            echo "::notice::not built yet (reported, not counted): ${NOT_BUILT}"
            echo "Not built yet (not counted): ${NOT_BUILT}" >> "$GITHUB_STEP_SUMMARY"
          fi
          fail=0
          for j in image scenario; do
            r="$(echo "$RESULTS" | jq -r ".\"$j\".result")"
            [ "$r" = success ] || { echo "::error::$j: $r"; fail=1; }
          done
          exit $fail
