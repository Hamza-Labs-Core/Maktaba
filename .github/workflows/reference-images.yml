# Reference images need review (Epic 60, story 60.04): a pull request that changes a file under
# web/packages/website/e2e/__screenshots__/ (the visual references) or
# web/packages/website/static/shots/ (the site's screenshots, story 60.09) lists each one in a
# `Reference images:` section of its body, with one line on why. tools/ci/reference_images.py
# reads the body and the file list fresh from the API (a re-run reads the body as it is now).
#
# Its own workflow, on `edited` too: ci.yml runs on the default pull_request types, which leave
# `edited` out, so fixing the body would never re-run the check there.

name: Reference images

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# No concurrency group: a push and a body edit seconds apart start two runs on the same head, and
# a group cancelled one of them, leaving a CANCELLED check beside the green one; a fail-closed
# merge reads that as not green (#1207, #1208). Each run reads the body and the files fresh and
# takes seconds, so both finish, and both answer the same.

jobs:
  reference-images:
    name: changed reference images are listed
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Every changed reference image is listed with why
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/reference_images.py
