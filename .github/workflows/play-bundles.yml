# The native Android apps for Google Play (docs/google-play.md).
#
# On every `v*` tag the three native Android apps are built as release App Bundles (R8 on),
# signed with the Play upload key, and attached to the tag's GitHub Release:
#
#   maktaba-player-<version>.aab   com.hamzalabs.maktaba.player   apps/android/player
#   maktaba-remote-<version>.aab   com.hamzalabs.maktaba.remote   apps/android/remote
#   maktaba-tv-<version>.aab       com.hamzalabs.maktaba.tv       apps/tv/android/app
#
# Each app is one package for every screen (phone, foldable, tablet; the TV app for TVs), so
# each is one Play listing. Google Play App Signing re-signs what reaches users; the upload key
# only proves the upload is ours.
#
# VERSIONS: tools/release/play-version.sh. The versionName is the tag without its v, the
# versionCode (MAJOR*1000000 + MINOR*1000 + PATCH)*100 + STEP, STEP 99 for a stable tag and
# below it for -alpha.N / -beta.N / -rc.N (v0.3.55 -> 305599, v0.4.0-rc.1 -> 400065), the same
# for the three apps, so every tag has its own code, above the last one's.
#
# SIGNING: the upload key from the repository secrets ANDROID_UPLOAD_KEYSTORE_BASE64,
# ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD and, optionally,
# ANDROID_UPLOAD_STORE_PASSWORD (else the key's password). Gradle reads them from the
# environment (the apps' build.gradle.kts); the keystore lives in the runner's temp folder for
# the build only. Without the secrets the bundles are unsigned: they stay a workflow artifact
# (`-unsigned.aab`), the run warns, and nothing is attached to the Release.
#
# PLAY: keyless, through Workload Identity Federation (GitHub's OIDC token, no service-account
# key anywhere). With the repository variables PLAY_WIF_PROVIDER (the provider's full resource,
# projects/<NUMBER>/locations/global/workloadIdentityPools/github/providers/github) and
# PLAY_SERVICE_ACCOUNT (the service account's email, allowed to release to testing tracks in
# Play Console), each signed bundle also goes to its app's internal testing track, status
# completed, with its mapping.txt and the tag's release notes (whatsnew en-US and ar,
# tools/ci/play_release.py). The package uploaded to is the applicationId in the app's Gradle
# build file. Without both variables the run notes "Play upload skipped: PLAY_WIF_PROVIDER or
# PLAY_SERVICE_ACCOUNT not set" and succeeds. Only the internal track is ever written: never
# beta or production. The one-time Google Cloud and Play Console setup is in
# docs/google-play.md ("One-time setup").
#
# This workflow runs only on tags pushed to this repository (never on a pull request), checks
# out only the tagged commit, and gives each job only the permissions it needs.
name: Play bundles

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One run per tag at a time, never cancelled.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the tag-order guard, as every tag workflow (release.yml's guard opens the release as a draft)
  guard:
    uses: ./.github/workflows/_tag-guard.yml
    permissions:
      contents: write
      actions: read

  bundles:
    name: play bundles (player, remote, tv)
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # release-assets.sh upload
    outputs:
      signed: ${{ steps.collect.outputs.signed }}
      version: ${{ steps.version.outputs.name }}
      play: ${{ steps.play.outputs.upload }}
      player_package: ${{ steps.play-notes.outputs.player }}
      remote_package: ${{ steps.play-notes.outputs.remote }}
      tv_package: ${{ steps.play-notes.outputs.tv }}
    # Only whether there is a key (or a Play account) is job-wide (a step's `if:` cannot read
    # secrets); the key and its passwords reach only the steps that sign, never the setup
    # actions. The Play account is no secret: two variables naming the Workload Identity
    # provider and the service account, used only by the play job.
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ vars.PLAY_WIF_PROVIDER != '' && vars.PLAY_SERVICE_ACCOUNT != '' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6.0.2

      # For Google Play: each app's package (its Gradle applicationId) and the tag's release
      # notes in English and Arabic (tools/ci/play_release.py). The message of an annotated
      # tag only: a lightweight tag's "contents" would be its commit's message.
      - name: Play packages and release notes
        id: play-notes
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          : >"$RUNNER_TEMP/tag-message"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            git for-each-ref --format='%(contents)' "refs/tags/${TAG}" >"$RUNNER_TEMP/tag-message"
          fi
          python3 tools/ci/play_release.py whatsnew "$TAG" "$RUNNER_TEMP/tag-message" whatsnew
          {
            echo "player=$(python3 tools/ci/play_release.py package player)"
            echo "remote=$(python3 tools/ci/play_release.py package remote)"
            echo "tv=$(python3 tools/ci/play_release.py package tv)"
          } | tee -a "$GITHUB_OUTPUT"
          head -n 20 whatsnew/*

      # The wrappers' jars run the builds, with the upload key in the environment: each must
      # be Gradle's own for the version it names.
      - name: Gradle wrappers are Gradle's
        run: |
          set -euo pipefail
          for dir in apps/android apps/tv/android; do
            version=$(sed -n 's#.*/gradle-\(.*\)-bin.zip#\1#p' "$dir/gradle/wrapper/gradle-wrapper.properties")
            want=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
            echo "${want}  $dir/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          done

      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          tools/release/play-version.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        # The default package list includes the long-removed `tools` package, which current
        # sdkmanager rejects. compileSdk 37 is installed here; AGP fetches its build-tools.
        with:
          packages: platform-tools platforms;android-37.0

      # Gradle's own cache action, read-only: a tag's entries are seen by that tag alone, and
      # each would push main's out of the repository's 10 GB cache. It restores the Gradle User
      # Home main's Android apps job saved (_android-apps.yml; the job key names that job) with
      # its dependency, wrapper and compiled-script entries.
      - name: Gradle caches
        uses: gradle/actions/setup-gradle@v6.4.0
        env:
          GRADLE_BUILD_ACTION_CACHE_KEY_JOB: android-apps
        with:
          cache-read-only: true
          add-job-summary: on-failure
          # the step above checks both wrappers' jars
          validate-wrappers: false

      # The keystore goes to the runner's temp folder; Gradle signs with it when
      # ANDROID_UPLOAD_KEYSTORE_FILE names it (the apps' signingConfigs "upload").
      - name: Upload key
        if: ${{ env.HAS_UPLOAD_KEY == 'true' }}
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$ANDROID_UPLOAD_KEY_ALIAS" ] || { echo "::error::ANDROID_UPLOAD_KEY_ALIAS is not set"; exit 1; }
          [ -n "$ANDROID_UPLOAD_KEY_PASSWORD" ] || { echo "::error::ANDROID_UPLOAD_KEY_PASSWORD is not set"; exit 1; }
          store="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d >"$store"
          chmod 600 "$store"
          echo "ANDROID_UPLOAD_KEYSTORE_FILE=$store" >>"$GITHUB_ENV"

      - name: Player and Remote bundles
        working-directory: apps/android
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :player:bundleRelease :remote:bundleRelease \
            -Pmaktaba.versionName="$NAME" -Pmaktaba.versionCode="$CODE"

      - name: TV bundle
        working-directory: apps/tv/android
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:bundleRelease \
            -Pmaktaba.versionName="$NAME" -Pmaktaba.versionCode="$CODE"

      # Play refuses an unsigned bundle, so an unsigned one gets an -unsigned name and is not
      # attached to the Release. A signed one must verify (jarsigner) before it is attached.
      - name: Collect bundles
        id: collect
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p out mapping
          signed=false
          [ -n "${ANDROID_UPLOAD_KEYSTORE_FILE:-}" ] && signed=true
          suffix=""
          [ "$signed" = true ] || suffix="-unsigned"
          collect() { # APP MODULE_DIR AAB_NAME
            local aab="$2/build/outputs/bundle/release/$3"
            local name="maktaba-$1-${NAME}${suffix}.aab"
            [ -f "$aab" ] || { echo "::error::$aab was not built"; exit 1; }
            if [ "$signed" = true ]; then
              local verify
              verify="$(jarsigner -verify "$aab")"
              grep -q '^jar verified' <<<"$verify" || { echo "::error::$aab is not signed: $verify"; exit 1; }
            fi
            cp "$aab" "out/$name"
            cp "$2/build/outputs/mapping/release/mapping.txt" "mapping/maktaba-$1-${NAME}-mapping.txt"
          }
          collect player apps/android/player player-release.aab
          collect remote apps/android/remote remote-release.aab
          collect tv apps/tv/android/app app-release.aab
          ( cd out && sha256sum ./*.aab | sed 's# \./# #' >"maktaba-play-${NAME}.sha256" )
          echo "signed=$signed" >>"$GITHUB_OUTPUT"
          if [ "$signed" != true ]; then
            msg="ANDROID_UPLOAD_KEYSTORE_BASE64 is not set, so the Google Play bundles are unsigned. They are kept in the maktaba-play-bundles workflow artifact and not attached to the ${TAG} release."
            echo "::warning title=Play bundles not signed::${msg}"
            printf '### Google Play: not attached to the release\n\n%s\n' "${msg}" >>"$GITHUB_STEP_SUMMARY"
          fi
          ls -l out mapping

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      # Whether the play job uploads: a Play account, signed bundles, and not a re-run of a
      # published tag (Play already has its versionCode). Each skip is one notice; none fails.
      - name: Google Play upload
        id: play
        env:
          SIGNED: ${{ steps.collect.outputs.signed }}
          PUBLISHED: ${{ needs.guard.outputs.published }}
        run: |
          set -euo pipefail
          upload=false
          if [ "$HAS_PLAY_ACCOUNT" != true ]; then
            echo "::notice title=Google Play::Play upload skipped: PLAY_WIF_PROVIDER or PLAY_SERVICE_ACCOUNT not set"
          elif [ "$SIGNED" != true ]; then
            echo "::notice title=Google Play::Play upload skipped: the bundles are unsigned"
          elif [ "$PUBLISHED" = true ]; then
            echo "::notice title=Google Play::Play upload skipped: ${TAG} is published already, so Play has its versionCode"
          else
            upload=true
            echo "Play upload: the internal track of each app"
          fi
          echo "upload=$upload" >>"$GITHUB_OUTPUT"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maktaba-play-bundles
          path: |
            out/*
            mapping/*
            whatsnew/*
          retention-days: 14

      # Signed bundles only. To the tag's release, a draft until release.yml's signed files and
      # the server apps are in (it is never made public or the latest from here); a published
      # release only gains the files it lacks.
      - name: Attach to GitHub Release
        if: steps.collect.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/release-assets.sh upload "$TAG" out/*

  # Each signed bundle to its app's internal testing track, when the bundles job said so (a Play
  # account, signed bundles, not a re-run of a published tag). The apps exist in Play Console
  # already (their first upload is by hand: the API cannot create an app). Pre-releases too:
  # every tag has its own versionCode (tools/release/play-version.sh).
  play:
    name: google play internal (${{ matrix.app }})
    needs: [bundles]
    if: needs.bundles.outputs.play == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # id-token: write lets google-github-actions/auth ask GitHub for this job's OIDC token,
    # which Google trades (Workload Identity Federation) for a short-lived token of the service
    # account. Only this job has it; it checks out no code and holds no secret.
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [player, remote, tv]
    steps:
      - name: The bundles
        id: artifact-maktaba-play-bundles
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: maktaba-play-bundles
          path: play
      - name: Wait 15s to retry the download of maktaba-play-bundles
        if: steps.artifact-maktaba-play-bundles.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: The bundles (attempt 2)
        id: artifact-maktaba-play-bundles-2
        if: steps.artifact-maktaba-play-bundles.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: maktaba-play-bundles
          path: play
      - name: Wait 45s to retry the download of maktaba-play-bundles
        if: steps.artifact-maktaba-play-bundles-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: The bundles (attempt 3)
        id: artifact-maktaba-play-bundles-3
        if: steps.artifact-maktaba-play-bundles-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: maktaba-play-bundles
          path: play
      - name: Check maktaba-play-bundles downloaded
        id: artifact-maktaba-play-bundles-check
        if: steps.artifact-maktaba-play-bundles-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: maktaba-play-bundles
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1

      # Signed only: the bundles job names an unsigned bundle -unsigned and says signed=false,
      # so this file exists only when it was signed and jarsigner verified it.
      - name: The signed bundle
        env:
          APP: ${{ matrix.app }}
          AAB: play/out/maktaba-${{ matrix.app }}-${{ needs.bundles.outputs.version }}.aab
          PACKAGE: ${{ needs.bundles.outputs[format('{0}_package', matrix.app)] }}
        run: |
          set -euo pipefail
          [ -n "$PACKAGE" ] || { echo "::error::no package name for $APP"; exit 1; }
          [ -f "$AAB" ] || { echo "::error::$AAB is not in the bundles (unsigned?)"; exit 1; }
          echo "$AAB -> $PACKAGE (internal)"

      # Keyless Google sign-in: GitHub's OIDC token for this job (repository
      # Hamza-Labs-Core/Maktaba, the only one the provider accepts) -> the Workload Identity
      # provider -> the service account. The credentials file it writes is an external_account
      # configuration (no private key) that fetches short-lived tokens; the action deletes it
      # when the job ends.
      - name: Google sign-in (Workload Identity Federation)
        id: google
        # google-github-actions/auth v2.1.13
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      # r0adkll/upload-google-play: the Play Developer API (androidpublisher v3) edit, upload,
      # track and commit, maintained, used widely, pinned to a commit as every third-party
      # action here. Its serviceAccountJson input is a credentials file path it hands to
      # google-auth-library (9.15.1 at this commit) as GOOGLE_APPLICATION_CREDENTIALS, which
      # reads the external_account file the sign-in step wrote.
      - name: Upload to the internal track
        # r0adkll/upload-google-play v1.1.5
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJson: ${{ steps.google.outputs.credentials_file_path }}
          packageName: ${{ needs.bundles.outputs[format('{0}_package', matrix.app)] }}
          releaseFiles: play/out/maktaba-${{ matrix.app }}-${{ needs.bundles.outputs.version }}.aab
          mappingFile: play/mapping/maktaba-${{ matrix.app }}-${{ needs.bundles.outputs.version }}-mapping.txt
          whatsNewDirectory: play/whatsnew
          releaseName: ${{ needs.bundles.outputs.version }}
          track: internal
          status: completed
