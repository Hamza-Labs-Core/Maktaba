# Reusable Linux app gate (Epic 39, stories 39.2 and 39.10): on an x86_64 and an aarch64
# runner, build the server payload (Go binaries with the web UI, pinned Postgres / ffmpeg /
# Python checked against tools/release/linux-app/pins.env, Postgres's library closure from
# the runner, the pipeline wheel + constraints) and the app around it (AppImage, .deb,
# .rpm: `make linux-app`). check-app.sh installs each bundle's payload the way the app
# does (`maktaba-server runtime install`, every file checked) and runs check.sh on the
# copy; check.sh also runs in minimal containers of the distributions the app supports
# (the payload mounted read-only, an ordinary user), so a library the payload assumes but
# a system lacks fails here. Then e2e.sh runs the server the way the app installs it, as the
# runner's systemd user unit. Unsigned: the updater signature comes with desktop-release.yml.

name: Linux app

on:
  workflow_call:

permissions:
  contents: read

jobs:
  payload:
    name: Linux app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cmd/maktaba-server/go.sum
            cmd/maktaba-launcher/go.sum

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      - name: Install web + desktop deps and the build tools
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C apps/desktop install --frozen-lockfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf zip shellcheck libarchive-tools \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # the pinned third-party downloads (~150 MB), keyed on their checksums
      - uses: actions/cache@v4
        with:
          path: build/linux-app/downloads
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}

      - name: shellcheck and the payload tool's tests
        run: |
          shellcheck -x tools/release/linux-app/*.sh
          python3 tools/release/linux-app/test_payload_tool.py -v

      # On failure the last lines go into an annotation: readable on the run's
      # page without signing in (the job log is not).
      - name: Build the app with the payload, and check its bundles
        env:
          VERSION: v0.0.0-ci.${{ github.run_number }}
        run: |
          set -o pipefail
          if ! make linux-app 2>&1 | tee "$RUNNER_TEMP/linux-app.log"; then
            echo "::error title=make linux-app::$(grep -v '^\s*$' "$RUNNER_TEMP/linux-app.log" | tail -n 25 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      # an ordinary user with a passwd entry (initdb looks the user up), the
      # runner's uid so the read-only checkout is theirs; coreutils' chroot
      # --userspec drops root in every image (minimal Ubuntu has no runuser)
      - name: Check it in minimal containers
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 debian:12-slim fedora:40; do
            echo "::group::$image"
            docker run --rm -v "$PWD:$PWD:ro" -w "$PWD" -e UID_GID="$(id -u):$(id -g)" "$image" bash -c '
              set -e
              groupadd -g "${UID_GID#*:}" ci 2>/dev/null || true
              useradd -m -u "${UID_GID%%:*}" -g "${UID_GID#*:}" ci
              exec chroot --skip-chdir --userspec="$UID_GID" / env HOME=/home/ci USER=ci \
                bash tools/release/linux-app/check.sh --payload build/linux-app/server'
            echo "::endgroup::"
          done

      # Epic 39 story 39.11: the server as the app installs it (runtime copy, venv, the
      # systemd user unit) runs every role on 127.0.0.1, and comes back from a restart,
      # a SIGKILL of the launcher and a pause. Linger starts the runner's user manager.
      - name: End to end on systemd
        run: |
          sudo loginctl enable-linger "$USER"
          tools/release/linux-app/e2e.sh --payload build/linux-app/server

      - name: Sizes
        if: always()
        run: |
          {
            echo "### Linux payload (${{ matrix.arch }})"
            echo '```'
            du -sh build/linux-app/server/* 2>/dev/null || true
            du -sh build/linux-app/server 2>/dev/null || true
            du -sh apps/desktop/src-tauri/target/release/bundle/{appimage,deb,rpm}/*.{AppImage,deb,rpm} 2>/dev/null || true
            python3 -c 'import json; d=json.load(open("build/linux-app/server/payload.json")); print("glibc", d["min_glibc"], "libraries", " ".join(d["postgres"]["libraries"]))' 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
