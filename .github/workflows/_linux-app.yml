# Reusable Linux app gate (Epic 39, stories 39.2 and 39.10): on an x86_64 and an aarch64
# runner, build the server payload (Go binaries with the web UI, pinned Postgres / Python
# checked against tools/release/linux-app/pins.env, Postgres's library closure from the
# runner, the pipeline wheel + constraints) and the app around it (AppImage, .deb, .rpm:
# `make linux-app`). check-app.sh installs each bundle's payload the way the app does
# (`maktaba-server runtime install`, every file checked) and runs check.sh on the copy;
# check.sh also runs in minimal containers of the distributions the app supports (the
# payload mounted read-only, an ordinary user), so a library the payload assumes but a
# system lacks fails here. ffmpeg is the distribution's: the runner and each container
# install their own, and `maktaba-server ffmpeg` must take Ubuntu's and Debian's and refuse
# Fedora's ffmpeg-free (no libx264) with the RPM Fusion command. Then e2e.sh runs the server
# the way the app installs it, as the runner's systemd user unit, on the runner's ffmpeg.
# The Docker install's image (deploy/docker/server) is built from the payload and started on
# a fresh volume: its entrypoint's bootstrap, and its wait for the setup; then as a NAS runs it
# (docker-nas.sh, story 59.01): any uid:gid, refusals, an offline first start.
# Unsigned: the updater signature comes with desktop-release.yml.

name: Linux app

on:
  workflow_call:

permissions:
  contents: read

jobs:
  payload:
    name: Linux app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110 # the build, the checks, then up to 45 minutes of end to end
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          # restore main's uv cache; only a push to main saves it
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      # restore only: main's entries (.github/actions/node-cache); only a push to main saves
      - name: pnpm store
        id: pnpm-cache
        uses: ./.github/actions/node-cache
        with:
          package-manager: pnpm
          lock-hash: ${{ hashFiles('web/pnpm-lock.yaml', 'apps/desktop/pnpm-lock.yaml') }}

      - name: Apt package cache
        id: apt-cache
        # the runner's Ubuntu mirror has stalled installs at 50 KB/s: packages are kept
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-linux-app-${{ matrix.arch }}-${{ hashFiles('tools/ci/apt-install.sh', '.github/workflows/_linux-app.yml') }}
          restore-keys: apt-linux-app-${{ matrix.arch }}-

      - name: Install web + desktop deps and the build tools
        env:
          APT_CACHE_DIR: /home/runner/apt-cache
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C apps/desktop install --frozen-lockfile
          tools/ci/apt-install.sh patchelf zip shellcheck libarchive-tools rpm ffmpeg \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # pull requests and tags restore main's build; only a push to main saves
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # the pinned third-party downloads (~150 MB), keyed on their checksums
      # an earlier pins.env's cache too: payload.sh checks every file against its pinned
      # SHA-256 and downloads only what changed, so a host outage after a pin change does
      # not stop the pieces it did not touch
      - id: downloads-cache
        uses: actions/cache/restore@v4
        with:
          # a cancelled download's .part is never kept
          path: |
            build/linux-app/downloads
            !build/linux-app/downloads/*.part
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}
          restore-keys: linux-app-downloads-${{ matrix.arch }}-

      - name: shellcheck, the payload tool's, the removal script's and the bundle versions' tests
        run: |
          shellcheck -x tools/release/linux-app/*.sh
          python3 tools/release/linux-app/test_payload_tool.py -v
          bash tools/release/linux-app/test_package_remove.sh
          bash tools/release/linux-app/test_bundle.sh

      # maktaba-full (story 51.17): the packages release.yml's package-linux-full builds,
      # with the nfpm _launcher.yml caches (keep the version in step with it)
      - name: nfpm from the cache
        id: nfpm-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/nfpm
          key: nfpm-v2.46.3-static-${{ runner.os }}-${{ runner.arch }}

      - name: Install nfpm
        if: steps.nfpm-cache.outputs.cache-hit != 'true'
        env:
          GOTOOLCHAIN: auto
          CGO_ENABLED: "0"
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api streaming cmd/maktaba-server cmd/maktaba-launcher cloud

      # the packages' names, versions, dependencies and folder; on x86_64 also installed with
      # dpkg beside a stand-in maktaba (the test's packages are amd64): an existing install's
      # own update goes in with maktaba-full there, and maktaba cannot be removed from under it
      - name: maktaba-full's packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          export PATH="$HOME/go/bin:$PATH"
          if [ "$ARCH" = x86_64 ]; then
            bash tools/release/linux-app/test_full_package.sh --install
          else
            bash tools/release/linux-app/test_full_package.sh
          fi

      # tauri's AppImage bundler downloads AppRun, linuxdeploy and linuxdeploy-plugin-appimage
      # from GitHub releases, and the plugin's appimagetool the AppImage runtime, with no
      # retry and no checksum (a 504 failed this job; an aarch64 bundle failed in linuxdeploy,
      # run 42480410454). tools/release/linux-app/tauri-tools.sh fetches each by the SHA-256
      # in tauri-tools.pins, lays the tools out in tauri's tools folder and hands appimagetool
      # the runtime (LDAI_RUNTIME_FILE), so the bundle downloads nothing; cached on the pins.
      - id: tauri-tools-pin
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "key=$(tools/release/linux-app/tauri-tools.sh --key "$ARCH")" >>"$GITHUB_OUTPUT"
      - id: tauri-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ci-pinned/tauri-tools
          key: ${{ steps.tauri-tools-pin.outputs.key }}
      - name: tauri's AppImage tools and the AppImage runtime, pinned
        env:
          ARCH: ${{ matrix.arch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/release/linux-app/tauri-tools.sh "$ARCH"
      - name: Save tauri's AppImage tools
        if: steps.tauri-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ci-pinned/tauri-tools
          key: ${{ steps.tauri-tools-pin.outputs.key }}

      # On failure the last lines go into an annotation: readable on the run's
      # page without signing in (the job log is not).
      - name: Build the app with the payload, and check its bundles
        id: build
        env:
          VERSION: v0.0.0-ci.${{ github.run_number }}
          # the pinned downloads go by the GitHub API first (tools/release/fetch-pinned.sh)
          GITHUB_TOKEN: ${{ github.token }}
          # appimagetool's own output (-v), through linuxdeploy-plugin-appimage; build-app.sh
          # runs tauri verbose, which shows linuxdeploy's
          LDAI_VERBOSE: "1"
        run: |
          set -o pipefail
          if ! make linux-app 2>&1 | tee "$RUNNER_TEMP/linux-app.log"; then
            echo "::error title=make linux-app::$(grep -v '^\s*$' "$RUNNER_TEMP/linux-app.log" | tail -n 25 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      # an ordinary user with a passwd entry (initdb looks the user up), the
      # runner's uid so the read-only checkout is theirs; coreutils' chroot
      # --userspec drops root in every image (minimal Ubuntu has no runuser).
      # Each image installs its distribution's ffmpeg first, and check.sh is told
      # what the server must say of it.
      - name: Check it in minimal containers
        run: |
          set -euo pipefail
          for spec in "ubuntu:22.04 ok" "debian:12-slim ok" "fedora:40 lacks"; do
            image="${spec% *}" want="${spec#* }"
            echo "::group::$image (its ffmpeg: $want)"
            docker run --rm -v "$PWD:$PWD:ro" -w "$PWD" -e UID_GID="$(id -u):$(id -g)" -e WANT="$want" "$image" bash -c '
              set -e
              if command -v apt-get >/dev/null; then
                apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
              else
                dnf install -y -q ffmpeg-free >/dev/null
              fi
              groupadd -g "${UID_GID#*:}" ci 2>/dev/null || true
              useradd -m -u "${UID_GID%%:*}" -g "${UID_GID#*:}" ci
              exec chroot --skip-chdir --userspec="$UID_GID" / env HOME=/home/ci USER=ci \
                bash tools/release/linux-app/check.sh --payload build/linux-app/server --ffmpeg "$WANT"'
            echo "::endgroup::"
          done

      # The Docker install's image (deploy/docker/server), built from this payload as
      # release.yml builds it from the release's: a command runs after the entrypoint put the
      # payload on a fresh volume's runtime (owned by the machine: the server updates it);
      # with no setup yet the container waits, saying how to set up, and docker stop ends it.
      - name: The Docker image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/server-image"
          mkdir -p "$ctx/$ARCH"
          cp -a build/linux-app/server "$ctx/$ARCH/server"
          docker build -q -f deploy/docker/server/Dockerfile -t maktaba-server:ci "$ctx"
          docker volume create maktaba-ci >/dev/null
          trap 'docker rm -f maktaba-ci >/dev/null 2>&1 || true; docker volume rm maktaba-ci >/dev/null 2>&1 || true' EXIT
          docker run --rm -v maktaba-ci:/var/lib/maktaba maktaba-server:ci runtime status | tee "$RUNNER_TEMP/runtime-status.txt"
          grep -q "owner headless" "$RUNNER_TEMP/runtime-status.txt"
          docker run -d --name maktaba-ci -v maktaba-ci:/var/lib/maktaba maktaba-server:ci >/dev/null
          for _ in $(seq 1 60); do
            if grep -q "not set up yet" < <(docker logs maktaba-ci 2>&1); then break; fi
            sleep 1
          done
          docker logs maktaba-ci >"$RUNNER_TEMP/container.log" 2>&1
          grep -q "not set up yet" "$RUNNER_TEMP/container.log"
          docker stop -t 30 maktaba-ci >/dev/null
          test "$(docker inspect -f '{{.State.ExitCode}}' maktaba-ci)" = 0

      # Epic 59 story 59.01: the image as a NAS runs it. For 1000:1000, 568:568 (TrueNAS),
      # 99:100 (Unraid), 1026:100 (a DSM user) and 4321:4321 (no passwd entry: nss_wrapper),
      # each on a volume it owns: setup with --network none (the venv from the payload's
      # wheelhouse; initdb under the uid), then the container offline: the API answers, the
      # plugin runners start, every process runs as that uid:gid. A root-owned volume, root,
      # --privileged and the Docker socket each stop it with exit 78 and their message in
      # English and Arabic. The image's compressed size stays at 1 GB or less.
      - name: The Docker image on a NAS (any uid, never root, first start offline)
        timeout-minutes: 30
        run: tools/release/linux-app/docker-nas.sh maktaba-server:ci "$RUNNER_TEMP/docker-nas"

      - name: Keep the NAS checks' logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-nas-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-nas
          if-no-files-found: ignore
          retention-days: 14

      # Epic 39 story 39.11: `setup --answers` as `install.sh --app` runs it (runtime copy,
      # venv, models, finish, the systemd user unit), every role on 127.0.0.1, back from a
      # restart, a SIGKILL of the launcher and a pause, then an update (a dump before the
      # migrations, the venv kept) from the latest release's payload when it has one. e2e.sh
      # turns linger on for the runner's user manager and off again, in a scratch XDG home it
      # removes. The token only reads the latest release.
      - name: End to end on systemd
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/release/linux-app/e2e.sh --payload build/linux-app/server

      - name: Sizes
        if: always()
        run: |
          {
            echo "### Linux payload (${{ matrix.arch }})"
            echo '```'
            du -sh build/linux-app/server/* 2>/dev/null || true
            du -sh build/linux-app/server 2>/dev/null || true
            du -sh apps/desktop/src-tauri/target/release/bundle/{appimage,deb,rpm}/*.{AppImage,deb,rpm} 2>/dev/null || true
            python3 -c 'import json; d=json.load(open("build/linux-app/server/payload.json")); print("glibc", d["min_glibc"], "libraries", " ".join(d["postgres"]["libraries"]))' 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # this job writes its runner's one Go cache entry (.github/actions/go-cache), every
      # module of the checkout in it first; only a push to main writes it
      - name: Every module in the Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.arch == 'ARM64' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        run: tools/ci/go-cache-fill.sh
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.arch == 'ARM64' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

      - name: Save the pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.key != '' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.key }}

      - name: Save the apt package cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: apt-linux-app-${{ matrix.arch }}-${{ hashFiles('tools/ci/apt-install.sh', '.github/workflows/_linux-app.yml') }}

      # main's, once the build has run, whatever came after it (an e2e failure lost the entry
      # before): fetch-pinned.sh moves a file in only once its SHA-256 is the pin's. A build
      # that failed leaves a partial folder, saved under the key and -partial-<run>, which the
      # exact key never matches and restore-keys finds.
      - name: Save the pinned downloads
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.downloads-cache.outputs.cache-hit != 'true' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          # a cancelled download's .part is never kept
          path: |
            build/linux-app/downloads
            !build/linux-app/downloads/*.part
          key: linux-app-downloads-${{ matrix.arch }}-${{ hashFiles('tools/release/linux-app/pins.env') }}${{ steps.build.outcome != 'success' && format('-partial-{0}-{1}', github.run_id, github.run_attempt) || '' }}
