# Reusable launcher gate (Epic 35, story 35.2): the side-by-side install layout
# and maktaba-launcher on Linux, macOS and Windows (fake server binaries that
# exit 0 / 75 / crash, the boot-loop fallback, pointer atomicity, a power-loss
# simulation that kills a process mid-switch), the Windows service for real on
# windows-latest, and the .deb built with nfpm installed on a clean runner
# (package layout and postinstall's move into bin/releases/<v>/).

name: Launcher

on:
  workflow_call:

permissions:
  contents: read

jobs:
  launcher:
    name: launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cmd/maktaba-server/go.mod
          cache-dependency-path: |
            cmd/maktaba-launcher/go.sum
            cmd/maktaba-server/go.sum
            shared/go/layout/go.sum

      - name: layout
        working-directory: shared/go/layout
        run: go test -count=1 ./...

      - name: launcher
        working-directory: cmd/maktaba-launcher
        env:
          # windows-latest runs as an administrator: register the launcher as a
          # real (temporary) Windows service and drive it through the SCM
          MAKTABA_TEST_WINDOWS_SERVICE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: go test -count=1 -v ./...

      - name: maktaba-server (layout, service units, self-managed conversion)
        working-directory: cmd/maktaba-server
        run: >-
          go test -count=1 . ./internal/service ./internal/selfmanaged
          ./internal/supervisor -run "ReleaseDir|ReleaseBinRoot|Launcher|StopFile|HealthyFor|Render|Plan|Deploy|Install|SelfManaged|Package|Convert|Homebrew"

      # Epic 38 story 38.1: where an install keeps its files on each OS, how an older
      # layout comes in (Windows copies its config and keys out of the roaming profile
      # and keeps the originals; a Mac moves its XDG paths), the state root and the
      # node config's path, on the OS itself; and node.json's one Go writer, whose
      # Windows tests (the user-only temp file and ACL, the lock the pipeline shares,
      # ReplaceFileW's settling, a reader waiting out writes) run here only, as do a
      # switch's records and identity kept the user's alone. Verbose, so the log shows
      # each one ran.
      - name: maktaba-server (paths per OS)
        working-directory: cmd/maktaba-server
        shell: bash # stops at the first failing command (pwsh would report only the last)
        run: |
          go test -count=1 -v ./internal/config
          go test -count=1 -v . -run "PrivateFilesAreTheUsersAlone|WriteNodeConfigKeepsThePipelinesFields|NodeConfigIsolated"

      # Epic 38 story 38.1: streaming's node config readers on the OS itself: which
      # node.json it reads (the roaming profile's, its leftovers, its encodings), and that
      # a node config it cannot read, or one being written, is never taken for the home.
      - name: streaming (the node config's readers)
        working-directory: streaming
        run: >-
          go test -count=1 -v ./internal/channel ./internal/cluster
          -run "NodeConfig|DetectRole|NodeMode|AForcedHomeIsNeverANode"

      # Epic 38 story 38.13: moving an install this PC runs (a scheduled task and its
      # script) into the app. On windows-latest a real task is registered, its server
      # found and stopped, the task removed and registered again from its saved XML.
      - name: maktaba-server (moving an install into the app)
        working-directory: cmd/maktaba-server
        env:
          MAKTABA_TEST_WINDOWS_TASK: ${{ runner.os == 'Windows' && '1' || '' }}
        run: go test -count=1 -v ./internal/adopt

      # Epic 38 story 38.5 on Windows itself: every role, the venv bootstrap and
      # a setup step are asked to stop with CTRL_BREAK, each held from the check
      # that it still runs to the send (internal/ctrlbreak), so the event never
      # reaches the whole console. These start processes, which the unit tier
      # (-short) skips.
      - name: maktaba-server (clean stop on Windows)
        if: runner.os == 'Windows'
        working-directory: cmd/maktaba-server
        shell: bash # stops at the first failing command (pwsh would report only the last)
        run: |
          go test -count=1 -v ./internal/ctrlbreak ./internal/supervisor ./internal/appvenv
          go test -count=1 -v . -run "StopGently|SetupVenvStopsGently"

      # The bundled Postgres on Windows, against the pinned build pgbin fetches (kept
      # between runs): postgres.exe under a restricted token (the runner is an
      # administrator, which postgres refuses), initdb, the app role, a dump and
      # pg_ctl's fast stop; the supervisor holding it under that token; and (Epic 38
      # story 38.10) "auto" inside an app payload and the payload's ffmpeg.exe.
      - name: Postgres download (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pgbin
          key: pgbin-windows-${{ hashFiles('cmd/maktaba-server/internal/pgbin/pgbin.go') }}

      - name: maktaba-server (Postgres on Windows, and in the Windows app)
        if: runner.os == 'Windows'
        working-directory: cmd/maktaba-server
        env:
          MAKTABA_TEST_PG_DOWNLOAD: ${{ runner.temp }}/pgbin
        run: >-
          go test -count=1 -v ./internal/pgbundle ./internal/supervisor
          -run "TestPostgresToken|TestTheSupervisorHoldsARestrictedPostgres|TestRealPostgresOnWindows|TestResolveAutoInsideAnAppPayload|TestAppBundleFFmpegOnWindows"

  package:
    name: .deb layout + postinstall
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cmd/maktaba-server/go.mod
          cache-dependency-path: |
            cmd/maktaba-server/go.sum
            cmd/maktaba-launcher/go.sum

      # GOTOOLCHAIN=auto: nfpm needs a newer Go than the runner's, and setup-go sets
      # GOTOOLCHAIN=local; a setup-go that left the runner's Go first on PATH (its
      # download not installed) then failed this step. Go fetches what nfpm asks for.
      - name: Install nfpm
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      - name: Build, package and install three versions
        run: |
          set -euo pipefail
          PKG="github.com/Hamza-Labs-Core/Maktaba/cmd/maktaba-server/internal/version"
          build() { # version -> out/maktaba-server_<v>_amd64.deb
            v="$1"
            rm -rf pkgroot && mkdir -p pkgroot out
            ( cd cmd/maktaba-server && CGO_ENABLED=0 go build -ldflags "-X ${PKG}.Version=v${v}" -o ../../pkgroot/maktaba-server . )
            ( cd cmd/maktaba-launcher && CGO_ENABLED=0 go build -ldflags "-X main.Version=v${v}" -o ../../pkgroot/maktaba-launcher . )
            # the api/streaming roles are not exercised here
            printf '#!/bin/sh\necho maktaba-api %s\n' "$v" > pkgroot/maktaba-api
            printf '#!/bin/sh\necho maktaba-streaming %s\n' "$v" > pkgroot/maktaba-streaming
            chmod 0755 pkgroot/*
            ARCH=amd64 VERSION="$v" nfpm package -f deploy/packaging/nfpm.yaml -p deb -t out/
          }
          inst() { sudo dpkg -i --force-depends "out/maktaba-server_${1}-1_amd64.deb"; }
          st() { sudo /usr/bin/maktaba-launcher --root /var/lib/maktaba --status --json; }
          field() { st | jq -r ".$1 // empty"; }
          want() { got="$(field "$1")"; [ "$got" = "$2" ] || { echo "::error::$1 = '$got', want '$2'"; st; exit 1; }; }

          build 1.2.3
          echo "==> package contents"
          dpkg-deb -c out/maktaba-server_1.2.3-1_amd64.deb | tee contents.txt
          for p in ./usr/bin/maktaba-launcher ./usr/bin/maktaba-server \
                   ./usr/lib/maktaba/release/maktaba-server ./usr/lib/maktaba/release/maktaba-api \
                   ./usr/lib/maktaba/release/maktaba-streaming ./usr/lib/maktaba/release/maktaba-launcher \
                   ./usr/lib/systemd/system/maktaba-server.service; do
            grep -q " ${p}\$" contents.txt || { echo "::error::package lacks ${p}"; exit 1; }
          done

          echo "==> first install: release 1.2.3 staged and current"
          inst 1.2.3
          want current 1.2.3
          want watermark 1.2.3
          sudo test -f /var/lib/maktaba/bin/releases/1.2.3/.verified
          sudo grep -q '"identity": "package"' /var/lib/maktaba/bin/releases/1.2.3/.verified
          sudo /usr/bin/maktaba-launcher --verify /var/lib/maktaba/bin/releases/1.2.3
          grep -q '^ExecStart=/usr/bin/maktaba-launcher --root /var/lib/maktaba serve$' /usr/lib/systemd/system/maktaba-server.service
          grep -q '^RestartForceExitStatus=75$' /usr/lib/systemd/system/maktaba-server.service
          sudo /usr/bin/maktaba-server --version | grep -q 'v1.2.3'
          test "$(sudo stat -c %U /var/lib/maktaba/bin/releases/1.2.3)" = maktaba

          echo "==> upgrade: 1.2.4 becomes current under the boot-loop guard"
          build 1.2.4
          inst 1.2.4
          want current 1.2.4
          want previous 1.2.3
          want pending.version 1.2.4

          echo "==> an older package than the watermark only refreshes the launcher"
          sudo sh -c 'printf "1.3.0\n" > /var/lib/maktaba/watermark'
          build 1.2.2
          sudo dpkg -i --force-depends --force-downgrade out/maktaba-server_1.2.2-1_amd64.deb
          want current 1.2.4
          /usr/bin/maktaba-launcher --version | grep -q 'v1.2.2'
