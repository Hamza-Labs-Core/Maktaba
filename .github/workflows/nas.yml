# nas-shapes (Epic 59, story 59.15): the server image started the way NAS boxes start it.
#
# Most NAS failures come from a few differences, and each one is imitated here in a container
# on a GitHub runner: another uid, a data folder or a library owned by someone else or mounted
# read-only, a memory limit, arm64, a kernel without Landlock. tests/nas/cells.json is the
# matrix; tests/nas/README.md says what each cell asserts and how to add one; the device
# checklists (docs/nas/checklists) cover what a container cannot imitate.
#
# Jobs:
#   plan      what changed: whether the cells run (the image, the server, streaming's ffmpeg,
#             the pipeline's runner, scanner and speech code, plugind, the NAS install files,
#             the harness) and whether arm64 is required (the image, streaming or the
#             pipeline's speech); the harness's own tests and the checklists' lint
#   image     the Linux payload of this commit (tools/release/linux-app/payload.sh, on the
#             payload's glibc baseline, ubuntu-22.04 and its arm runner) in the server image
#             (deploy/docker/server/Dockerfile), saved as an artifact per architecture
#   cell      one job per cell and architecture (tests/nas/plan.py): fixtures, then
#             tests/nas/cell.py: volumes, server.toml, headless setup, the server started,
#             ready, the cell's assertions through the admin API. Its logs (docker logs,
#             the server's, each worker's and plugind's, the launcher's, the setup log, the
#             API's view) are its artifact, kept pass or fail
#   nas-shapes  the verdict: every cell passed; the summary lists each cell's result and
#             links its artifact
#
# It runs on a pull request touching those paths, on main and release/** for the same paths
# (every main commit is a release candidate: the release session tags one only once CI and
# the rehearsal passed; this job reports on it), and by hand (workflow_dispatch, every cell).
# A pull request touching only web/ does not start it (tools/ci/tests/test_nas_workflow.py).

name: NAS shapes

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - '.github/workflows/nas.yml'
      - 'tests/nas/**'
      - 'docs/nas/checklists/**'
      - 'deploy/docker/server/**'
      - 'cloud/installers/docker/**'
      - 'cloud/installers/nas/**'
      - 'deploy/nas/**'
      - 'tools/release/linux-app/**'
      - 'cmd/maktaba-server/**'
      - 'cmd/maktaba-launcher/**'
      - 'shared/go/**'
      - 'streaming/internal/ffmpeg/**'
      - 'pipeline/src/maktaba_pipeline/orchestrator/**'
      - 'pipeline/src/maktaba_pipeline/pipeline/**'
      - 'pipeline/src/maktaba_pipeline/scanner/**'
      - 'pipeline/src/maktaba_pipeline/stt/**'
      - 'pipeline/src/maktaba_pipeline/venv_bootstrap.py'
      - 'pipeline/pyproject.toml'
      - 'pipeline/uv.lock'
      - 'plugind/**'
  push:
    branches: [main, 'release/**']
    paths:
      - '.github/workflows/nas.yml'
      - 'tests/nas/**'
      - 'docs/nas/checklists/**'
      - 'deploy/docker/server/**'
      - 'cloud/installers/docker/**'
      - 'cloud/installers/nas/**'
      - 'deploy/nas/**'
      - 'tools/release/linux-app/**'
      - 'cmd/maktaba-server/**'
      - 'cmd/maktaba-launcher/**'
      - 'shared/go/**'
      - 'streaming/internal/ffmpeg/**'
      - 'pipeline/src/maktaba_pipeline/orchestrator/**'
      - 'pipeline/src/maktaba_pipeline/pipeline/**'
      - 'pipeline/src/maktaba_pipeline/scanner/**'
      - 'pipeline/src/maktaba_pipeline/stt/**'
      - 'pipeline/src/maktaba_pipeline/venv_bootstrap.py'
      - 'pipeline/pyproject.toml'
      - 'pipeline/uv.lock'
      - 'plugind/**'
  workflow_dispatch:
    inputs:
      only:
        description: 'cells to run, comma-separated (empty: every cell)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nas-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v6.0.2

      # a pull request: what it changed; a push or a dispatch: everything
      - uses: dorny/paths-filter@v4.0.1
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            cells:
              - '.github/workflows/nas.yml'
              - 'tests/nas/**'
              - 'deploy/docker/server/**'
              - 'cloud/installers/docker/**'
              - 'cloud/installers/nas/**'
              - 'deploy/nas/**'
              - 'tools/release/linux-app/**'
              - 'cmd/maktaba-server/**'
              - 'cmd/maktaba-launcher/**'
              - 'shared/go/**'
              - 'streaming/internal/ffmpeg/**'
              - 'pipeline/src/maktaba_pipeline/orchestrator/**'
              - 'pipeline/src/maktaba_pipeline/pipeline/**'
              - 'pipeline/src/maktaba_pipeline/scanner/**'
              - 'pipeline/src/maktaba_pipeline/stt/**'
              - 'pipeline/src/maktaba_pipeline/venv_bootstrap.py'
              - 'pipeline/pyproject.toml'
              - 'pipeline/uv.lock'
              - 'plugind/**'
            arm64:
              - '.github/workflows/nas.yml'
              - 'tests/nas/**'
              - 'deploy/docker/server/**'
              - 'tools/release/linux-app/**'
              - 'streaming/internal/ffmpeg/**'
              - 'pipeline/src/maktaba_pipeline/stt/**'
              - 'pipeline/src/maktaba_pipeline/venv_bootstrap.py'
              - 'pipeline/pyproject.toml'
              - 'pipeline/uv.lock'

      - name: The harness's tests and the checklists' lint
        run: |
          python3 -m unittest discover -s tests/nas -p 'test_*.py' -v
          python3 tests/nas/check_checklists.py docs/nas/checklists

      - name: The matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CELLS: ${{ steps.changes.outputs.cells }}
          ARM64: ${{ steps.changes.outputs.arm64 }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          run=true arm=true
          if [ "$EVENT" = pull_request ]; then
            [ "$CELLS" = true ] || run=false
            [ "$ARM64" = true ] || arm=false
          fi
          args=(--only "${ONLY:-}")
          [ "$arm" = true ] || args+=(--no-arm64)
          cells="$(python3 tests/nas/plan.py "${args[@]}")"
          echo "run=$run" >>"$GITHUB_OUTPUT"
          echo "cells=$cells" >>"$GITHUB_OUTPUT"
          {
            echo "### NAS shapes: the plan"
            echo "cells run: $run; arm64: $arm"
            echo '```json'
            echo "$cells" | python3 -m json.tool
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  image:
    name: image (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, payload: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64, payload: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - name: Is this architecture in the plan?
        id: wanted
        env:
          CELLS: ${{ needs.plan.outputs.cells }}
          ARCH: ${{ matrix.arch }}
        run: |
          if python3 -c 'import json, os, sys; sys.exit(0 if any(c["arch"] == os.environ["ARCH"] for c in json.loads(os.environ["CELLS"])["include"]) else 1)'; then
            echo "build=true" >>"$GITHUB_OUTPUT"
          else
            echo "build=false" >>"$GITHUB_OUTPUT"
            echo "no $ARCH cell in the plan" >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v6.0.2
        if: steps.wanted.outputs.build == 'true'
        with:
          fetch-depth: 0 # payload.sh names the version with git describe

      - uses: actions/setup-go@v6.4.0
        if: steps.wanted.outputs.build == 'true'
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache)
      - name: Go caches
        if: steps.wanted.outputs.build == 'true'
        uses: ./.github/actions/go-cache

      - uses: astral-sh/setup-uv@v8.1.0
        if: steps.wanted.outputs.build == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          save-cache: false

      - uses: pnpm/action-setup@v6.0.8
        if: steps.wanted.outputs.build == 'true'
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        if: steps.wanted.outputs.build == 'true'
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      # restore only: main's entries (.github/actions/node-cache)
      - name: pnpm store
        if: steps.wanted.outputs.build == 'true'
        uses: ./.github/actions/node-cache
        with:
          package-manager: pnpm
          lock-hash: ${{ hashFiles('web/pnpm-lock.yaml') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.wanted.outputs.build == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.wanted.outputs.build == 'true'
        with:
          workspaces: plugind
          save-if: false

      # the Linux app job's pinned downloads (Postgres, Python, pgvector), main's entry
      - uses: actions/cache/restore@v4
        if: steps.wanted.outputs.build == 'true'
        with:
          path: |
            build/linux-app/downloads
            !build/linux-app/downloads/*.part
          key: linux-app-downloads-${{ matrix.payload }}-${{ hashFiles('tools/release/linux-app/pins.env') }}
          restore-keys: linux-app-downloads-${{ matrix.payload }}-

      - name: Web deps and the build tools
        if: steps.wanted.outputs.build == 'true'
        run: |
          pnpm -C web install --frozen-lockfile
          tools/ci/apt-install.sh patchelf

      - name: Go modules
        if: steps.wanted.outputs.build == 'true'
        uses: ./.github/actions/go-mod-download
        with:
          modules: api streaming cmd/maktaba-server cmd/maktaba-launcher cloud

      - name: The Linux payload
        if: steps.wanted.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/release/linux-app/payload.sh

      - name: The server image
        if: steps.wanted.outputs.build == 'true'
        env:
          PAYLOAD: ${{ matrix.payload }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/server-image"
          mkdir -p "$ctx/$PAYLOAD"
          cp -a build/linux-app/server "$ctx/$PAYLOAD/server"
          docker build -q -f deploy/docker/server/Dockerfile \
            --build-arg VERSION="$(git describe --tags --match 'v*' --always)" --build-arg COMMIT="$GITHUB_SHA" \
            -t maktaba-server:nas "$ctx"
          docker image ls maktaba-server:nas
          docker save maktaba-server:nas | zstd -T0 -3 -q -o "$RUNNER_TEMP/maktaba-server-$ARCH.tar.zst"
          ls -lh "$RUNNER_TEMP/maktaba-server-$ARCH.tar.zst"

      # Epic 59 story 59.07: the third-party test plugin the no-Landlock cells install
      # (plugind's hello guest with tests/nas/plugin's manifest); WebAssembly, so once
      - name: The test plugin
        if: steps.wanted.outputs.build == 'true' && matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip2
          make plugind-guests
          src="$RUNNER_TEMP/nas-plugin-src"
          cp -a tests/nas/plugin "$src"
          cp plugind/guests/target/wasm32-wasip2/release/hello.wasm "$src/plugin.wasm"
          mkdir -p "$RUNNER_TEMP/nas-plugin"
          (cd shared/go/componentpack && go run ./cmd/mkplugin "$src" "$RUNNER_TEMP/nas-plugin/hello.mkplugin")
          ls -l "$RUNNER_TEMP/nas-plugin"

      - uses: actions/upload-artifact@v7.0.1
        if: steps.wanted.outputs.build == 'true' && matrix.arch == 'amd64'
        with:
          name: nas-plugin
          path: ${{ runner.temp }}/nas-plugin/hello.mkplugin
          retention-days: 3

      - uses: actions/upload-artifact@v7.0.1
        if: steps.wanted.outputs.build == 'true'
        with:
          name: nas-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/maktaba-server-${{ matrix.arch }}.tar.zst
          retention-days: 3
          compression-level: 0

  cell:
    name: cell ${{ matrix.cell }} (${{ matrix.arch }})
    needs: [plan, image]
    if: needs.plan.outputs.run == 'true' && fromJSON(needs.plan.outputs.cells).include[0] != null
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download nas-image-${{ matrix.arch }}
        id: artifact-nas-image
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: nas-image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Wait 15s to retry the download of nas-image-${{ matrix.arch }}
        if: steps.artifact-nas-image.outcome == 'failure'
        shell: bash
        run: sleep 15
      - name: Download nas-image-${{ matrix.arch }} (attempt 2)
        id: artifact-nas-image-2
        if: steps.artifact-nas-image.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: nas-image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Wait 45s to retry the download of nas-image-${{ matrix.arch }}
        if: steps.artifact-nas-image-2.outcome == 'failure'
        shell: bash
        run: sleep 45
      - name: Download nas-image-${{ matrix.arch }} (attempt 3)
        id: artifact-nas-image-3
        if: steps.artifact-nas-image-2.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: nas-image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Check nas-image-${{ matrix.arch }} downloaded
        id: artifact-nas-image-check
        if: steps.artifact-nas-image-3.outcome == 'failure'
        shell: bash
        env:
          ARTIFACT: nas-image-${{ matrix.arch }}
        run: |
          echo "::error::the artifact $ARTIFACT never downloaded after 3 attempts (the artifacts API unreachable, or no job uploaded it)"
          exit 1

      - name: Load the image
        env:
          ARCH: ${{ matrix.arch }}
        run: zstd -d -q -c "$RUNNER_TEMP/maktaba-server-$ARCH.tar.zst" | docker load

      - name: The fixture library
        run: tests/nas/fixtures.sh "$RUNNER_TEMP/fixtures"

      # the test plugin (59.07), packed by the amd64 image job: the cells that install it
      # fail their assertion without it, the others do not need it
      - name: Download nas-plugin
        if: matrix.arch == 'amd64'
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: nas-plugin
          path: ${{ runner.temp }}/nas-plugin

      - name: The cell
        id: cell
        env:
          CELL: ${{ matrix.cell }}
        run: |
          set -euo pipefail
          plugin=()
          [ -f "$RUNNER_TEMP/nas-plugin/hello.mkplugin" ] && plugin=(--plugin "$RUNNER_TEMP/nas-plugin/hello.mkplugin")
          python3 tests/nas/cell.py --image maktaba-server:nas --cell "$CELL" --fixtures "$RUNNER_TEMP/fixtures" --out "$RUNNER_TEMP/nas-out" "${plugin[@]}"

      - name: The cell's summary
        if: always()
        run: cat "$RUNNER_TEMP/nas-out/summary.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary (the cell did not start)" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        id: logs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nas-cell-${{ matrix.cell }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/nas-out
          retention-days: 14
          if-no-files-found: warn

  nas-shapes:
    name: nas-shapes
    needs: [plan, image, cell]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Every cell's result, with its logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN: ${{ needs.plan.outputs.run }}
          PLAN: ${{ needs.plan.result }}
          IMAGE: ${{ needs.image.result }}
          CELL: ${{ needs.cell.result }}
        run: |
          set -euo pipefail
          {
            echo "### NAS shapes"
            echo "plan: $PLAN, image: $IMAGE, cells: $CELL"
            echo
            echo "| Job | Result | Logs |"
            echo "|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          # the table is best-effort: the verdict below reads the jobs' results alone
          if [ "$RUN" = true ] && ! {
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate >"$RUNNER_TEMP/jobs.json"
            gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --paginate >"$RUNNER_TEMP/artifacts.json"
            python3 tests/nas/summary.py "$RUNNER_TEMP/jobs.json" "$RUNNER_TEMP/artifacts.json" "$REPO" "$RUN_ID" >>"$GITHUB_STEP_SUMMARY"
          }; then
            echo "(the table of cells could not be built: see the run's jobs and artifacts)" >>"$GITHUB_STEP_SUMMARY"
          fi
          [ "$PLAN" = success ] || { echo "the plan failed"; exit 1; }
          if [ "$RUN" != true ]; then echo "no cell to run for this change"; exit 0; fi
          [ "$IMAGE" = success ] || { echo "the image was not built"; exit 1; }
          [ "$CELL" = success ] || [ "$CELL" = skipped ] || { echo "a cell failed: see the summary"; exit 1; }
          echo "every cell passed"
