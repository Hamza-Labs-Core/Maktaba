# Deploys the cloud's two web Workers from the repository (Epic 50, stories 50.32, 50.34):
# maktaba-cloud-web (the user app, app.maktaba.tv; web/packages/cloud-web) and
# maktaba-admin-web (the operator console, admin.maktaba.tv; web/packages/admin-web). Each
# builds, tests and deploys only once its package exists (its wrangler.toml, added by 50.32);
# until then the job says so and passes. Pull requests never deploy: ci.yml builds and tests the
# packages. After a deploy, a smoke check of the live host (tools/cloudflare/smoke.mjs). By
# hand, `rollback: true` returns a Worker to its previous version instead.
#
# Needs CLOUDFLARE_API_TOKEN (or CLOUDFLARE_API_TOKEN_WORKERS) and CLOUDFLARE_ACCOUNT_ID;
# without them the job says so and passes (deploy/cloudflare/README.md, the token table).

name: Cloud web deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/packages/cloud-web/**'
      - 'web/packages/admin-web/**'
      - 'web/cloud/**'
      - 'tools/cloudflare/smoke.mjs'
      - 'tools/cloudflare/token-check.mjs'
      - '.github/workflows/cloud-web-deploy.yml'
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll each Worker back to its previous version instead of deploying"
        type: boolean
        default: false

permissions:
  contents: read

# one deploy at a time; a newer run waits for the running one, never cancels it
concurrency:
  group: cloud-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (${{ matrix.worker }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { worker: maktaba-cloud-web, package: web/packages/cloud-web, smoke: cloud-web }
          - { worker: maktaba-admin-web, package: web/packages/admin-web, smoke: admin-web }
    steps:
      - uses: actions/checkout@v6.0.2

      - name: The package and the Cloudflare secrets
        id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKERS || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PKG: ${{ matrix.package }}
        run: |
          if [ ! -f "$PKG/wrangler.toml" ]; then
            echo "::notice title=${{ matrix.worker }} not deployed::$PKG/wrangler.toml does not exist yet (story 50.32)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=${{ matrix.worker }} not deployed::Cloudflare secrets not set: skipping (CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, see deploy/cloudflare/README.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6.4.0
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version-file: tools/cloudflare/.nvmrc
          package-manager-cache: false

      # before any write: the token can deploy Workers and their routes (50.34 §2)
      - name: Token check
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKERS || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/cloudflare/token-check.mjs --pieces workers --zone maktaba.tv

      # the same build and tests as the pull request ran, on this commit; wrangler at the
      # version the package's lockfile pins
      - name: Build and test
        if: steps.ready.outputs.ok == 'true' && !inputs.rollback
        id: build
        working-directory: ${{ matrix.package }}
        run: |
          npm ci --no-audit --no-fund
          npm run build --if-present
          npm test --if-present
          echo "wrangler=$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.ready.outputs.ok == 'true' && !inputs.rollback
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKERS || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.package }}
          wranglerVersion: ${{ steps.build.outputs.wrangler }}
          command: deploy

      - name: Roll back to the previous version
        if: steps.ready.outputs.ok == 'true' && inputs.rollback
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN_WORKERS || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.package }}
          command: rollback --message "cloud-web-deploy rollback by ${{ github.actor }}"

      # the live host: the app's marker and CSP, and an admin path's answer (50.34 §3)
      - name: Smoke check
        if: steps.ready.outputs.ok == 'true'
        run: node tools/cloudflare/smoke.mjs "${{ matrix.smoke }}"
