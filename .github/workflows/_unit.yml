# Reusable unit-test gate (Story 22.1, gate 2; Epic 20.1).

name: Unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    # 5.5-11.6 min on main (2026-10-22), plus "Set up pnpm", whose
    # self-installer has stalled for up to 7 min (the lint gate's note):
    # 25 keeps a stalled run from being cancelled.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cloud/go.sum

      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen --all-extras

      - name: Run unit tier
        run: make test-unit

      # The cloud module is a separate Go module outside the Makefile's
      # GO_MODULES set, so `make test-unit` does not reach it. Run its
      # unit tier explicitly so the relay/api/worker code is gated too.
      - name: Run cloud unit tests
        working-directory: cloud
        run: go test -short -count=1 ./...

  # Epic 31: a joined machine may be Windows. The cluster tests (config paths, path-map
  # inference with drive letters and UNC, crypto vectors, stage selection, the join
  # client) run there too; Linux runs the whole suite above.
  pipeline-cluster-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Run cluster tests
        working-directory: pipeline
        run: uv run --frozen --extra dev pytest tests/cluster -q -p no:cacheprovider

  # Epic 36: the Mac app shell (apps/desktop, Tauri 2): menu-bar status,
  # login item, setup-step runner. macOS only (SMAppService, launchd).
  desktop-shell:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri::generate_context! reads build.frontendDist; the tests never load it
      - name: Stub the web bundle
        run: mkdir -p web/dist

      - name: Format, lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # Epic 38: the same shell on Windows: the sign-in task, the server agent's
  # loop and stop event, setup steps started without a console window.
  desktop-shell-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri::generate_context! reads build.frontendDist; the tests never load it
      - name: Stub the web bundle
        shell: bash
        run: mkdir -p web/dist

      - name: Format, lint and test
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          # the runner may register (and removes) a real sign-in task
          MAKTABA_TEST_WINDOWS_TASK: '1'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # Epic 39: the same shell on Linux: the systemd user unit through
  # `maktaba-server service`, the runtime copy, the tray without a
  # StatusNotifier host. No other PR job builds the Linux shell.
  desktop-shell-linux:
    runs-on: ubuntu-22.04
    # the apt step may take up to 35 minutes on a slow mirror (below), then the build
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install the WebKitGTK and AppIndicator libraries
        # a stalled mirror fails fast and is tried again (apt-install.sh); WebKitGTK's dev
        # packages are a few hundred MB, so a slow one that still moves gets 15 minutes
        timeout-minutes: 35
        env:
          APT_NET_TIMEOUT: "900"
        run: tools/ci/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri::generate_context! reads build.frontendDist; the tests never load it
      - name: Stub the web bundle
        run: mkdir -p web/dist

      - name: Format, lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
