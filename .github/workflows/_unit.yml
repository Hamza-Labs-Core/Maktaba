# Reusable unit-test gate (Story 22.1, gate 2; Epic 20.1).

name: Unit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: |
            api/go.sum
            streaming/go.sum
            cloud/go.sum

      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install pipeline deps
        working-directory: pipeline
        run: uv sync --frozen --all-extras

      - name: Run unit tier
        run: make test-unit

      # The cloud module is a separate Go module outside the Makefile's
      # GO_MODULES set, so `make test-unit` does not reach it. Run its
      # unit tier explicitly so the relay/api/worker code is gated too.
      - name: Run cloud unit tests
        working-directory: cloud
        run: go test -short -count=1 ./...

  # Epic 31: a joined machine may be Windows. The cluster tests (config paths, path-map
  # inference with drive letters and UNC, crypto vectors, stage selection, the join
  # client) run there too; Linux runs the whole suite above.
  pipeline-cluster-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Run cluster tests
        working-directory: pipeline
        run: uv run --frozen --extra dev pytest tests/cluster -q -p no:cacheprovider

  # Epic 36: the Mac app shell (apps/desktop, Tauri 2): menu-bar status,
  # login item, setup-step runner. macOS only (SMAppService, launchd).
  desktop-shell:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri::generate_context! reads build.frontendDist and bundle.icon;
      # the tests load neither. Icons are stubbed only while none are committed.
      - name: Stub the web bundle and missing icons
        run: |
          mkdir -p web/dist
          if [ ! -f apps/desktop/src-tauri/icons/icon.icns ]; then
            python3 -c "import struct,zlib;n=64;r=b''.join(b'\\x00'+b'\\x1f\\x6f\\x5a\\xff'*n for _ in range(n));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d));open('stub.png','wb').write(b'\\x89PNG\\r\\n\\x1a\\n'+c(b'IHDR',struct.pack('>IIBBBBB',n,n,8,6,0,0,0))+c(b'IDAT',zlib.compress(r))+c(b'IEND',b''))"
            npx --yes @tauri-apps/cli@2.12.3 icon stub.png -o apps/desktop/src-tauri/icons
          fi

      - name: Format, lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
