# Reusable unit-test gate (Story 22.1, gate 2; Epic 20.1).

name: Unit

on:
  workflow_call:
    # each part when its files changed (ci.yml, from .github/ci-paths.yml)
    inputs:
      go: { type: boolean, default: true }
      pipeline: { type: boolean, default: true }
      web: { type: boolean, default: true }
      tokens: { type: boolean, default: true }
      desktop_shell: { type: boolean, default: true }
      mdns: { type: boolean, default: true }
      log_bench: { type: boolean, default: true }

permissions:
  contents: read

jobs:
  unit:
    if: inputs.go || inputs.pipeline || inputs.web || inputs.tokens
    runs-on: ubuntu-22.04
    # 5.5-11.6 min on main (2026-10-22), plus "Set up pnpm", whose
    # self-installer has stalled for up to 7 min (the lint gate's note):
    # 25 keeps a stalled run from being cancelled.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        if: inputs.go
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        if: inputs.go
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('api/go.sum', 'streaming/go.sum', 'cloud/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        if: inputs.go
        uses: ./.github/actions/go-mod-download
        with:
          modules: all

      - uses: actions/setup-python@v6.2.0
        if: inputs.pipeline
        with:
          python-version-file: pipeline/.python-version

      - uses: astral-sh/setup-uv@v8.1.0
        if: inputs.pipeline
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          # restore main's uv cache; only a push to main saves it
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@v6.0.8
        if: inputs.web || inputs.tokens
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        if: inputs.web || inputs.tokens
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      # restore only: main's entries (.github/actions/node-cache); only a push to main saves
      - name: pnpm store
        id: pnpm-cache
        if: inputs.web || inputs.tokens
        uses: ./.github/actions/node-cache
        with:
          package-manager: pnpm
          lock-hash: ${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install web deps
        if: inputs.web
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install pipeline deps
        if: inputs.pipeline
        working-directory: pipeline
        run: uv sync --frozen --all-extras

      - name: Run unit tier (Go)
        if: inputs.go
        run: make test-unit-go

      - name: Run unit tier (pipeline)
        if: inputs.pipeline
        run: make test-unit-py

      - name: Run unit tier (web)
        if: inputs.web
        run: make test-unit-web

      # Story 48.2: one token source. Fails when the committed Tokens.swift /
      # Tokens.kt are stale against web/design-system/tokens/, when
      # web/src/styles/tokens.css drifts from the JSON, or when a text colour is
      # under 4.5:1 on its background (light and dark).
      - name: Design tokens are current
        if: inputs.tokens
        run: make test-tokens

      # Epic 42.5: the player edition of the web app builds with no server page
      # code (vite.config.ts playerBundleCheck fails the build if any is left).
      - name: Web player edition has no server pages
        if: inputs.web
        working-directory: web
        run: pnpm build:player

      # The cloud module is a separate Go module outside the Makefile's
      # GO_MODULES set, so `make test-unit` does not reach it. Run its
      # unit tier explicitly so the relay/api/worker code is gated too.
      - name: Run cloud unit tests
        if: inputs.go
        working-directory: cloud
        run: go test -short -count=1 ./...

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

      - name: Save the pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.key != '' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.key }}

  # Epic 31: a joined machine may be Windows. The cluster tests (config paths, path-map
  # inference with drive letters and UNC, crypto vectors, stage selection, the join
  # client) run there too; Linux runs the whole suite above.
  pipeline-cluster-windows:
    if: inputs.pipeline
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          # restore main's uv cache; only a push to main saves it
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # --durations: a test near the soft cap here shows by how much (file work costs a
      # Windows runner several times what it costs Linux).
      - name: Run cluster tests
        working-directory: pipeline
        run: uv run --frozen --extra dev pytest tests/cluster -q -p no:cacheprovider --durations=40 --durations-min=0.05

  # The mDNS announcement on Windows: a home there announces through the system's own
  # responder (DnsServiceRegister, dnsapi.dll) so it never answers for the machine's name
  # beside it. Both copies (api, maktaba-server) register and withdraw for real here; the
  # Unix fakes run in the unit job above, resolved for real in mdns-linux.
  mdns-windows:
    if: inputs.mdns
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('api/go.sum', 'cmd/maktaba-server/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api cmd/maktaba-server

      - name: Test the announcement (api)
        working-directory: api
        run: go test -count=1 -v ./internal/discovery/

      - name: Test the announcement (maktaba-server)
        working-directory: cmd/maktaba-server
        run: go test -count=1 -v ./internal/mdns/

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  # The mDNS announcement on Linux through systemd-resolved, for real: resolved answers mDNS
  # here (MulticastDNS=yes, Avahi masked), and both copies announce, are found by an mDNS
  # client in a peer namespace (resolved ignores its own addresses) and by resolvectl,
  # change their TXT and withdraw: as a user polkit does not let register (zeroconf under
  # "<host>-maktaba"), as one a rule lets, and as root (RegisterService).
  # tools/ci/mdns-linux.sh; the unit job runs the fakes.
  mdns-linux:
    if: inputs.mdns
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      # a fix made in one copy and not the other ships one module with the bug
      - name: The two copies are the same
        run: python3 tools/ci/mdns_copies.py

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('api/go.sum', 'cmd/maktaba-server/go.sum') }}

      # this job's Go modules, retried; later steps read the module cache only
      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api cmd/maktaba-server

      - name: Turn on resolved's mDNS, build the tests
        run: tools/ci/mdns-linux.sh setup

      - name: Announce as a user polkit does not let register (zeroconf, own host)
        run: tools/ci/mdns-linux.sh run denied

      - name: Announce as a user a polkit rule lets register (RegisterService)
        run: tools/ci/mdns-linux.sh run allowed

      - name: Announce as root (RegisterService)
        run: tools/ci/mdns-linux.sh run root

      - name: resolved's state and journal
        if: always()
        run: tools/ci/mdns-linux.sh logs

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mdns-linux-logs
          path: ${{ runner.temp }}/mdns-linux-logs
          if-no-files-found: warn

      # only a push to main writes the caches restored above (pull requests and tags read main's)
      - name: Save the Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.key != '' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  # Epic 53 story 53.13: the log path's performance budget. Each bench fails with its
  # numbers when over its budget (scaled by the runner's speed: logbench.Calibrate);
  # docs/performance/logs.md has the targets.
  log-bench:
    if: inputs.log_bench
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: cmd/maktaba-server/go.mod
          cache: false

      # restore only: main's entries (.github/actions/go-cache); only a push to main saves
      - name: Go caches
        id: go-cache
        uses: ./.github/actions/go-cache
        with:
          go-sum-hash: ${{ hashFiles('cmd/maktaba-server/go.sum') }}

      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: cmd/maktaba-server

      - name: The log benches
        working-directory: cmd/maktaba-server
        env:
          LOGBENCH_OUT: ${{ runner.temp }}/logbench.json
        run: go test -tags logbench -count=1 -v -timeout 12m ./internal/logbench/

      # the Python logger's cost per call (pipeline/tools/log_bench.py: 20 µs at p99 on the
      # reference, times the runner's factor), and the nightly run's regression check's tests
      - uses: actions/setup-python@v6.2.0
        with:
          python-version-file: pipeline/.python-version

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
          # restore main's uv cache; only a push to main saves it
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: The Python logger bench
        working-directory: pipeline
        env:
          LOGBENCH_PY_OUT: ${{ runner.temp }}/logbench-python.json
        run: |
          uv sync --frozen
          uv run --frozen python tools/log_bench.py

      - name: The nightly comparison's tests
        run: uv run --no-project --python 3.12 --with pytest==8.4.2 pytest tools/logbench/tests -q -p no:cacheprovider

      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: logbench
          path: |
            ${{ runner.temp }}/logbench.json
            ${{ runner.temp }}/logbench-python.json
          if-no-files-found: warn

  # Epic 36: the Mac app shell (apps/desktop, Tauri 2): menu-bar status,
  # login item, setup-step runner. macOS only (SMAppService, launchd).
  desktop-shell:
    if: inputs.desktop_shell
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # pull requests and tags restore main's build; only a push to main saves
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # tauri::generate_context! reads build.frontendDist; the tests never load it
      - name: Stub the web bundle
        run: mkdir -p web/dist

      - name: Format, lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # Epic 38: the same shell on Windows: the sign-in task, the server agent's
  # loop and stop event, setup steps started without a console window.
  desktop-shell-windows:
    if: inputs.desktop_shell
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # pull requests and tags restore main's build; only a push to main saves
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # tauri::generate_context! reads build.frontendDist; the tests never load it
      - name: Stub the web bundle
        shell: bash
        run: mkdir -p web/dist

      - name: Format, lint and test
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          # the runner may register (and removes) a real sign-in task
          MAKTABA_TEST_WINDOWS_TASK: '1'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # Epic 39: the same shell on Linux: the systemd user unit through
  # `maktaba-server service`, the runtime copy, the tray without a
  # StatusNotifier host. No other PR job builds the Linux shell.
  desktop-shell-linux:
    if: inputs.desktop_shell
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install the WebKitGTK and AppIndicator libraries
        timeout-minutes: 8
        run: |
          # a mirror that stalls fails over instead of holding the job until its time runs
          # out (it did: this install hung 30 minutes and the job was cancelled)
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update -qq
          sudo apt-get "${apt_opts[@]}" install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # pull requests and tags restore main's build; only a push to main saves
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # tauri::generate_context! reads build.frontendDist; the tests never load it
      - name: Stub the web bundle
        run: mkdir -p web/dist

      - name: Format, lint and test
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
