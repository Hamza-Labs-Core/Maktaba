# The pinned Postgres archives on Maktaba's CDN, after every release.
#
# A machine that needs Postgres at runtime (a node's copy of its home's database:
# cmd/maktaba-server/internal/pgbin) downloads it from Maktaba's CDN first, then GitHub's API
# asset route, then github.com's download door, and accepts only the pinned SHA-256 and size
# from any of them. This puts each archive of tools/release/postgres-cdn.txt (kept equal to
# pgbin's pins by TestTheCDNListIsThePins) in the store's public bucket (maktaba-plugins,
# served at https://plugins-cdn.maktaba.tv), at postgres/<version>/<name>:
# tools/release/postgres-cdn.sh checks each archive against its pin before it uploads it, and
# skips one the CDN already serves with that pin, so every run is safe to repeat.
#
# It runs after the Release workflow completes (a pushed tag's run) and by hand from main, as
# packages.yml does, so it can never fail or hold a release. It needs the organization
# secrets CLOUDFLARE_API_TOKEN (with write access to the bucket's R2) and
# CLOUDFLARE_ACCOUNT_ID, the store's (store-deploy.yml); without them it skips with a
# warning, and machines download from GitHub as before. vars.MAKTABA_CDN_BUCKET and
# vars.MAKTABA_CDN_URL override the bucket and its public address.

name: Postgres CDN

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-cdn
  cancel-in-progress: false

jobs:
  publish:
    name: Postgres archives to the CDN
    # a tag's successful release, or a run by hand from main
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CDN_URL: ${{ vars.MAKTABA_CDN_URL || 'https://plugins-cdn.maktaba.tv' }}
      BUCKET: ${{ vars.MAKTABA_CDN_BUCKET || 'maktaba-plugins' }}
    steps:
      # what is set, never its value
      - name: Configured
        id: config
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [ "${HAS_TOKEN}" = true ] && [ "${HAS_ACCOUNT}" = true ]; then
            echo "ready=true" >>"${GITHUB_OUTPUT}"
          else
            missing=""
            [ "${HAS_TOKEN}" = true ] || missing="${missing} secrets.CLOUDFLARE_API_TOKEN"
            [ "${HAS_ACCOUNT}" = true ] || missing="${missing} secrets.CLOUDFLARE_ACCOUNT_ID"
            echo "::warning::the Postgres archives are not published to ${CDN_URL}: missing${missing}. Machines download Postgres from GitHub (its API, then github.com) until they are set."
            echo "ready=false" >>"${GITHUB_OUTPUT}"
          fi

      # main's list and script: a release publishes the pins main has
      - uses: actions/checkout@v6.0.2
        if: steps.config.outputs.ready == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v6.4.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: store/.nvmrc
          package-manager-cache: false

      # A pin mismatch (exit 2) fails the run: it is never uploaded. An upload failure (exit 3:
      # the bucket missing, Cloudflare down) only warns: machines fall back to GitHub.
      - name: Publish
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          bash tools/release/postgres-cdn.sh tools/release/postgres-cdn.txt "${RUNNER_TEMP}/postgres" || rc=$?
          case "${rc}" in
            0) echo "::notice::the Postgres archives are on ${CDN_URL}" ;;
            3) echo "::warning::the Postgres archives could not be uploaded to ${BUCKET}: machines download Postgres from GitHub until a later run succeeds" ;;
            *) exit "${rc}" ;;
          esac
