# Epic 54: plugins. The plugin host (maktaba-plugind), the manifest validators of the SDK,
# and the sandbox proof on every OS (README §5.4, §13).
#
#   plugind          the Rust workspace: format, clippy, the host against real hostile
#                    components (54.02 T01–T10), the N1 bench in a release build, and the
#                    TypeScript SDK's manifest validator on the shared corpus (54.01)
#   plugins-sandbox  CI ONLY, never on a developer's or the owner's machine: on macOS,
#                    Ubuntu 22.04 and 24.04 and Windows the sandboxed host runs a job, then
#                    a test build tries to get out as native code (TCP and UDP to a canary
#                    on loopback and the LAN address, a TEST-NET-3 literal, names, a bound
#                    port, raw and netlink sockets, planted files, writes, a process):
#                    every probe DENIED and the canary counts 0 (N8). The same probes
#                    without the sandbox must reach the canary (the positive control).
#                    Ubuntu 24.04 also runs with user namespaces blocked: Degraded
#                    (sandbox_partial: namespaces) and still no network.

name: Plugins

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  plugind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugind
            plugind/guests
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: The host's format, lint and tests (make plugind-test)
        run: make plugind-test

      # N1 and N7 in a release build (story 54.02 T07; README §7.2)
      - name: Job start bench
        working-directory: plugind
        run: cargo test --locked --release -p plugind-core --test host -- --include-ignored --nocapture bench_job_start runaway

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false

      # story 54.01 T01, T02, T06 (ts): the SDK's validator on the shared corpus
      - name: The TypeScript SDK's manifest validator
        working-directory: tools/plugin-sdk/js
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      # story 54.12 T01, T05: the Python and JavaScript templates, new to build to test in
      # the harness, the Python package's size, and a call no capability covers refused at
      # build. Each toolchain in an environment of its own, pinned to what the templates
      # were made with
      - name: The SDK templates' toolchains
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/componentize-py"
          "$RUNNER_TEMP/componentize-py/bin/pip" install --quiet componentize-py==0.25.1
          mkdir -p "$RUNNER_TEMP/jco"
          npm install --prefix "$RUNNER_TEMP/jco" --no-fund --no-audit --silent \
            @bytecodealliance/jco@1.41.0 @bytecodealliance/componentize-js@0.23.0
          {
            echo "MKP_COMPONENTIZE_PY=$RUNNER_TEMP/componentize-py/bin/componentize-py"
            echo "MKP_JCO=$RUNNER_TEMP/jco/node_modules/.bin/jco"
          } >> "$GITHUB_ENV"

      # in release, as a developer's mkp and a home's host are, and one at a time: three
      # compiles of large components at once on this runner's 4 cores ran past the compile
      # cap (54.02 §6, 180 s) in a debug build. Debug builds now optimize Wasmtime and
      # Cranelift too (plugind/Cargo.toml), so either way a compile takes seconds
      - name: The Python and JavaScript templates (mkp new, build, test, pack)
        working-directory: plugind
        env:
          MKP_TEST_TOOLCHAINS: '1'
        run: cargo test --locked --release -p mkp --test templates -- --test-threads=1

      # story 54.12 T02: the Go template is tier 2 (a template and a smoke test, best effort),
      # so its steps do not fail the job. TinyGo's wasm-unknown target, wit-bindgen-go's
      # bindings, wasm-tools for the component; each pinned
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.24'
          cache: false

      - name: The Go template's toolchain
        id: go-toolchain
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tinygo.deb" \
            https://github.com/tinygo-org/tinygo/releases/download/v0.44.0/tinygo_0.44.0_amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/tinygo.deb"
          curl -fsSL --retry 3 \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.263.0/wasm-tools-1.263.0-x86_64-linux.tar.gz |
            tar -xz -C "$RUNNER_TEMP"
          GOBIN="$RUNNER_TEMP/go-bin" go install go.bytecodealliance.org/cmd/wit-bindgen-go@v0.7.0
          {
            echo "MKP_WASM_TOOLS=$RUNNER_TEMP/wasm-tools-1.263.0-x86_64-linux/wasm-tools"
            echo "MKP_WIT_BINDGEN_GO=$RUNNER_TEMP/go-bin/wit-bindgen-go"
          } >> "$GITHUB_ENV"

      - name: The Go template (mkp new, build, test; a refused import fails the build)
        if: steps.go-toolchain.outcome == 'success'
        continue-on-error: true
        working-directory: plugind
        env:
          MKP_TEST_GO: '1'
        run: cargo test --locked -p mkp --test templates -- go

  plugins-sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugind
            plugind/guests
          key: ${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: actions/setup-go@v6.4.0
        if: runner.os == 'Windows'
        with:
          go-version-file: cmd/maktaba-server/go.mod
          cache: false

      # this job's Go module (the AppContainer launcher), retried; the build reads the cache
      - name: Go modules
        if: runner.os == 'Windows'
        uses: ./.github/actions/go-mod-download
        with:
          modules: cmd/maktaba-server

      - name: Build the guests
        run: cd plugind/guests && cargo build --locked --release --target wasm32-wasip2

      # GitHub's 24.04 image may block unprivileged user namespaces; the first run expects
      # the full sandbox, the last step blocks them on purpose
      - name: Allow user namespaces
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # the sandboxed host for real: starts, runs a job through the API socket, and exits
      # 78 naming the step when a required layer fails (54.03 T05, T06's host side)
      - name: The sandboxed host runs a job
        working-directory: plugind
        run: cargo test --locked --release -p maktaba-plugind

      # #710: on Windows the pipeline reaches the host through the supervisor's named pipe
      # relay (cmd/maktaba-server/internal/pluginrelay): bytes both ways unchanged, a squatted
      # name not served, a closed client when the host is down, another local user refused,
      # and the pipeline's own connect (pipe.py) through it. The second user is made here
      # with a random password, never printed
      - uses: actions/setup-python@v6.2.0
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - name: A second local user for the relay's refusal test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $pass = 'Aa1!' + [Convert]::ToBase64String($bytes)
          Write-Output "::add-mask::$pass"
          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name 'mkrelayprobe' -Password $secure -PasswordNeverExpires | Out-Null
          "MAKTABA_RELAY_TEST_USER=mkrelayprobe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MAKTABA_RELAY_TEST_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: The pipeline's relay to the host (#710)
        if: runner.os == 'Windows'
        working-directory: cmd/maktaba-server
        shell: bash
        env:
          MAKTABA_RELAY_TEST_REQUIRE: '1'
        run: |
          set -euo pipefail
          MAKTABA_RELAY_TEST_PYTHON="$(command -v python)" go test -count=1 -v ./internal/pluginrelay/

      # #710: on Windows the supervisor starts the host inside its AppContainer through the
      # launcher (here CI's aclaunch, the same code as `maktaba-server plugins-sandbox-run`)
      # and the pipeline reaches it through the relay: the release host built above answers
      # a health frame sent through the relay's pipe
      - name: The plugin host through the supervisor and its relay (#710)
        if: runner.os == 'Windows'
        working-directory: cmd/maktaba-server
        shell: bash
        env:
          MAKTABA_PLUGINS_E2E_REQUIRE: '1'
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/aclaunch-e2e.exe" ./internal/appcontainer/aclaunch
          MAKTABA_PLUGIND_BIN="$(cygpath -w "$GITHUB_WORKSPACE/plugind/target/release/maktaba-plugind.exe")" \
          MAKTABA_PLUGINS_SANDBOX_RUN="$(cygpath -w "$RUNNER_TEMP/aclaunch-e2e.exe")" \
            go test -count=1 -v -run '^TestThePluginHostOnWindowsThroughTheRelay$' ./internal/supervisor/

      # 54.23 on Windows: the runner launcher's package on the OS itself, real profiles and
      # ACLs on temp folders. A grant or revoke lands only on the folder that was checked:
      # one swapped for a junction to a decoy between the check and the change (a test hook)
      # is refused, the decoy gets no entry and the start fails closed. Verbose, so the log
      # shows each test ran
      - name: The runner launcher's grants (54.23)
        if: runner.os == 'Windows'
        working-directory: cmd/maktaba-server
        shell: bash
        run: go test -count=1 -v ./internal/appcontainer/...

      # 54.23 on Windows: a runner's library on an SMB share, through its launcher's file
      # broker. Two shares are made on local folders (reached as \\localhost\<name>); a
      # runner group started through the launcher reads the library and writes a subtitle
      # there from inside its AppContainer, and reaches nothing else (the other share, a
      # traversal, a junction out, an 8.3 alias, another name). Verbose, so the log shows it
      # ran, with the read throughput through the broker's handle and outside the sandbox
      - name: SMB shares for the runner's file broker (54.23)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lib = Join-Path $env:RUNNER_TEMP 'smb-library'
          $other = Join-Path $env:RUNNER_TEMP 'smb-other'
          New-Item -ItemType Directory -Force -Path $lib, $other | Out-Null
          New-SmbShare -Name 'mklibrary' -Path $lib -FullAccess $env:USERNAME | Out-Null
          New-SmbShare -Name 'mkother' -Path $other -FullAccess $env:USERNAME | Out-Null
          Get-ChildItem '\\localhost\mklibrary' | Out-Null
          "MAKTABA_BROKER_SHARE=\\localhost\mklibrary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MAKTABA_BROKER_SHARE_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MAKTABA_BROKER_OTHER_SHARE=\\localhost\mkother" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MAKTABA_BROKER_OTHER_DIR=$other" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # the Windows app's ffmpeg (tools/release/win-app/pins.env), for the runner's tools
      # on a share file: in a cache keyed on its file name and pin, fetched on a miss with
      # retries and backoff (tools/ci/fetch-pinned.sh; GitHub's release downloads answer 504
      # for minutes at a time), checked against the pin on a hit as on a miss
      - id: ffmpeg-cache-pin
        if: runner.os == 'Windows'
        run: |
          . tools/release/win-app/pins.env
          echo "key=$(tools/ci/fetch-pinned.sh --key "$FFMPEG_URL" "$FFMPEG_SHA256")" >>"$GITHUB_OUTPUT"
          echo "path=build/ci-pinned/ffmpeg-$FFMPEG_VERSION.zip" >>"$GITHUB_OUTPUT"
      - id: ffmpeg-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.ffmpeg-cache-pin.outputs.path }}
          key: ${{ steps.ffmpeg-cache-pin.outputs.key }}
      - name: The ffmpeg download, retried
        if: runner.os == 'Windows'
        env:
          ZIP: ${{ steps.ffmpeg-cache-pin.outputs.path }}
        run: |
          . tools/release/win-app/pins.env
          tools/ci/fetch-pinned.sh "$FFMPEG_URL" "$FFMPEG_SHA256" "$ZIP"
      - name: Save the ffmpeg download
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.ffmpeg-cache-pin.outputs.path }}
          key: ${{ steps.ffmpeg-cache-pin.outputs.key }}

      - name: ffmpeg for the runner's tools on a share (54.23)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZIP: ${{ steps.ffmpeg-cache-pin.outputs.path }}
        run: |
          $zip = $env:ZIP
          $sha = (Select-String -Path tools/release/win-app/pins.env -Pattern '^FFMPEG_SHA256=(.*)$').Matches[0].Groups[1].Value
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower() -ne $sha) { throw "ffmpeg.zip: sha256 mismatch" }
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -Path $zip -DestinationPath $dest
          $bin = (Get-ChildItem -Path $dest -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          & (Join-Path $bin 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1
          "MAKTABA_BROKER_FFMPEG=$(Join-Path $bin 'ffmpeg.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MAKTABA_BROKER_FFPROBE=$(Join-Path $bin 'ffprobe.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: A runner's library on a share, through its broker (54.23)
        if: runner.os == 'Windows'
        working-directory: cmd/maktaba-server
        shell: bash
        env:
          MAKTABA_BROKER_REQUIRE: '1'
        run: |
          set -euo pipefail
          MAKTABA_BROKER_PYTHON="$(cygpath -w "$(command -v python)")" \
            go test -count=1 -v -run '^(TestARunnersLibraryOnAShareThroughItsBroker|TestARunnersToolsReadAShareFileThroughItsBroker|TestARunnersBrokerServesOnlyItsShareFolders|TestTheRunnerLauncherLeavesSharesAlone)$' ./internal/appcontainer/

      # 54.23 on Windows: a stage's captured tool start (asyncio, stdout and stderr PIPE)
      # inside a runner's AppContainer: asyncio's own named pipes are refused there (the
      # control); the runner's anonymous pipes (winproc) answer the output, the exit code and
      # a cancel. Verbose, so the log shows it ran
      - name: A runner's captured tool start in its AppContainer (54.23)
        if: runner.os == 'Windows'
        working-directory: cmd/maktaba-server
        shell: bash
        env:
          MAKTABA_BROKER_REQUIRE: '1'
        run: |
          set -euo pipefail
          MAKTABA_BROKER_PYTHON="$(cygpath -w "$(command -v python)")" \
            go test -count=1 -v -run '^TestARunnersCapturedToolStartRunsInItsAppContainer$' ./internal/appcontainer/

      # 54.23 on Windows: a first-party runner group started as the supervisor starts one,
      # through the launcher's runner-sandbox-run (CI's aclaunch, the same code), in its own
      # AppContainer and Job Object: from inside, only its granted folders, no canary on
      # loopback or the LAN address without net, no process, no other group's pipe nor the
      # worker's; its API pipe and the broker's pairing work; a net group reaches the
      # internet and still no canary. The same probes outside the sandbox are the control
      - name: A first-party runner in its AppContainer (54.23)
        if: runner.os == 'Windows'
        working-directory: cmd/maktaba-server
        shell: bash
        env:
          MAKTABA_RUNNER_E2E_REQUIRE: '1'
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/aclaunch-runner.exe" ./internal/appcontainer/aclaunch
          MAKTABA_RUNNER_E2E_PYTHON="$(cygpath -w "$(command -v python)")" \
          MAKTABA_PLUGINS_SANDBOX_RUN="$(cygpath -w "$RUNNER_TEMP/aclaunch-runner.exe")" \
            go test -count=1 -v -run '^(TestARunnerOnWindowsInItsAppContainer|TestARunnersPipesOnWindows)$' ./internal/supervisor/

      # 54.03 §4 (#710): a guest can open no socket on Windows either (the host links no
      # wasi:sockets: the audit refuses it, and the linker without the audit)
      - name: A guest can open no socket (Windows)
        if: runner.os == 'Windows'
        working-directory: plugind
        run: cargo test --locked --release -p plugind-core --test host -- a_guest_can_open_no_socket

      - name: The hostile components inside the sandboxed host (54.03 T07)
        if: runner.os != 'Windows'
        working-directory: plugind
        run: cargo test --locked --release -p plugind-core --test host

      # after the tests: they build the same binary without the probes
      - name: Build the probe build
        working-directory: plugind
        run: cargo build --locked --release -p maktaba-plugind --features escape-probes

      - name: Plant the files the probes reach for
        id: plant
        run: |
          data="$RUNNER_TEMP/plugind-data"
          mkdir -p "$data/plugins/cache" "$data/run/plugins" "$data/state" "$HOME/.ssh"
          echo "not a real key" > "$HOME/.ssh/plugind_probe_fake"
          echo "state" > "$data/state/probe.txt"
          echo "data=$data" >>"$GITHUB_OUTPUT"
          python3 tools/ci/plugins/canary.py --port 47391 --count "$RUNNER_TEMP/canary.count" --lan-file "$RUNNER_TEMP/lan.txt" > "$RUNNER_TEMP/canary.log" 2>&1 &
          for _ in $(seq 1 50); do [ -s "$RUNNER_TEMP/lan.txt" ] && break; sleep 0.2; done
          echo "lan=$(cat "$RUNNER_TEMP/lan.txt")" >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/canary.log"

      - name: Escape probes, sandboxed and as the positive control
        env:
          DATA: ${{ steps.plant.outputs.data }}
          PROBE_LAN: ${{ steps.plant.outputs.lan }}
          PROBE_PORT: '47391'
        run: |
          native() { if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$1"; else echo "$1"; fi; }
          export PROBE_SECRET="$(native "$HOME/.ssh/plugind_probe_fake")" PROBE_STATE="$(native "$DATA/state/probe.txt")" PROBE_WRITE="$(native "$DATA/escape.txt")"
          bin=plugind/target/release/maktaba-plugind
          count() { cat "$RUNNER_TEMP/canary.count"; }
          before=$(count)
          if [ "$RUNNER_OS" = Windows ]; then
            (cd cmd/maktaba-server && go build -o "$RUNNER_TEMP/aclaunch.exe" ./internal/appcontainer/aclaunch)
            "$RUNNER_TEMP/aclaunch.exe" -profile Maktaba.Plugins.CI \
              -read "$(cygpath -w "$PWD/plugind/target/release")" -read "$(cygpath -w "$DATA/plugins")" \
              -write "$(cygpath -w "$DATA/plugins/cache")" -write "$(cygpath -w "$DATA/run/plugins")" \
              -- "$(cygpath -w "$PWD/$bin.exe")" --data "$(cygpath -w "$DATA")" --escape-probes | tee "$RUNNER_TEMP/sandboxed.txt"
          else
            "$bin" --data "$DATA" --escape-probes | tee "$RUNNER_TEMP/sandboxed.txt"
          fi
          sleep 1
          after_sandboxed=$(count)
          "$bin" --data "$(native "$DATA")" --escape-probes --no-sandbox | tee "$RUNNER_TEMP/control.txt"
          sleep 1
          after_control=$(count)
          cat "$RUNNER_TEMP/canary.log"
          python3 tools/ci/plugins/check_probes.py --sandboxed "$RUNNER_TEMP/sandboxed.txt" --control "$RUNNER_TEMP/control.txt" \
            --canary-before "$before" --canary-after-sandboxed "$after_sandboxed" --canary-after-control "$after_control"

      # 54.03 T03: user namespaces blocked (Ubuntu 24.04's AppArmor rule): Degraded, and
      # seccomp still refuses every network family
      - name: Escape probes with user namespaces blocked
        if: matrix.os == 'ubuntu-24.04'
        env:
          DATA: ${{ steps.plant.outputs.data }}
          PROBE_LAN: ${{ steps.plant.outputs.lan }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          export PROBE_SECRET="$HOME/.ssh/plugind_probe_fake" PROBE_STATE="$DATA/state/probe.txt" PROBE_WRITE="$DATA/escape.txt"
          before=$(cat "$RUNNER_TEMP/canary.count")
          plugind/target/release/maktaba-plugind --data "$DATA" --escape-probes | tee "$RUNNER_TEMP/partial.txt"
          sleep 1
          after=$(cat "$RUNNER_TEMP/canary.count")
          python3 tools/ci/plugins/check_probes.py --sandboxed "$RUNNER_TEMP/partial.txt" \
            --canary-before "$before" --canary-after-sandboxed "$after" --expect-missing namespaces

  # Epic 54 Phase 4: Maktaba's own stages as first-party plugins (stories 54.22-54.27).
  # graph-golden, the trusted manifest and its statements, the roles, the import contract,
  # the runner's sandbox and protocol, and plugins-parity (the harness's self-tests and every
  # migrated stage) with the real plugin API on Postgres.
  first-party:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: maktaba
          POSTGRES_PASSWORD: maktaba
          POSTGRES_DB: maktaba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maktaba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MAKTABA_TEST_PG_URL: postgres://maktaba:maktaba@localhost:5432/maktaba
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Go modules
        uses: ./.github/actions/go-mod-download
        with:
          modules: api

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Pipeline deps
        working-directory: pipeline
        run: uv sync --frozen --extra dev

      - name: The bundle the server embeds and the wheel carries is current (54.22)
        run: python3 tools/plugins/bundle.py

      - name: graph-golden (54.25 §2)
        working-directory: pipeline
        run: uv run python ../tools/plugins/graph_golden.py

      - name: Each plugin's statements are what its code runs (54.24 §1)
        working-directory: pipeline
        run: uv run --with pglast==8.7 python ../tools/plugins/statements_build.py check --all

      - name: The roles migration follows the manifests (54.24 §3)
        run: python3 tools/plugins/roles.py check

      - name: The import contract (54.27 §1)
        run: python3 tools/plugins/import_contracts.py

      - name: The SDK, the runner, its sandbox and protocol, and plugins-parity (54.23-54.26)
        working-directory: pipeline
        env:
          MAKTABA_PARITY_REPORT_DIR: ${{ runner.temp }}/parity-report
        run: uv run --with pglast==8.7 pytest -q -p no:cacheprovider tests/plugins/firstparty $(ls -d ../plugins/first-party/*/tests 2>/dev/null)

      # N16's timings on every run, passing or failing: where a plugin job spends its time
      - name: The parity timing report (N16)
        if: always()
        run: cat "$RUNNER_TEMP"/parity-report/*.txt 2>/dev/null || echo "no parity report"

      - name: Keep the parity report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: parity-report
          path: ${{ runner.temp }}/parity-report
          if-no-files-found: ignore

      - name: The plugin API's statements, trusted tokens and the flip (54.22, 54.24, 54.25)
        working-directory: api
        run: go test -count=1 ./internal/plugins/... ./internal/handlers/queues/ -run 'Statement|Trusted|FirstParty|Flip|CheckPackage|Bundle|Command'

  # the runner's Seatbelt sandbox and protocol on macOS (no Postgres there)
  first-party-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Pipeline deps
        working-directory: pipeline
        run: uv sync --frozen --extra dev

      - name: The runner's sandbox and protocol (54.23 T01, T03)
        working-directory: pipeline
        run: uv run pytest -q -p no:cacheprovider tests/plugins/firstparty
