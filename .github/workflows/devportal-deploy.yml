# Deploys maktaba.dev, the developer portal (web/packages/devportal), to Cloudflare Workers.
#
# On a push to main that changes the portal, the wiki or a doc it publishes, by hand (Actions →
# Deploy maktaba.dev → Run workflow), and monthly: each build renders security.txt with an
# Expires 11 months after the build day (api/internal/security/disclosure.go,
# ExpiryMonths), so the monthly deploy keeps it always 10 to 11 months ahead. Pull requests never deploy: ci.yml's
# devportal job builds and tests them. The deploy runs only after this run's own build,
# tests and public-safety scan pass, and deploys the dist/ that build uploaded.
#
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (org or repo). Without
# them the deploy job says so and skips, and the run stays green. The token's permissions
# are in web/packages/devportal/README.md. After a deploy, a smoke check fetches the live
# home page, the wiki in both languages and security.txt.

name: Deploy maktaba.dev

on:
  push:
    branches: [main]
    # the devportal filter of .github/ci-paths.yml: what the site is built from
    paths:
      - 'web/packages/devportal/**'
      - 'web/wiki-app/**'
      - 'specs/diagrams/**'
      - 'docs/developers/**'
      - 'CHANGELOG.md'
      - 'CHANGELOG.ar.md'
      - 'shared/api/openapi.json'
      - 'shared/api/openapi.ar.json'
      - 'api/internal/security/disclosure.go'
      - 'web/public/icons/**'
      - '.github/workflows/_devportal.yml'
      - '.github/workflows/devportal-deploy.yml'
  workflow_dispatch:
  # the 1st of each month, 06:17 UTC: security.txt's Expires rolls forward
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: read

# one deploy at a time; a newer commit's run waits for the running one, never cancels it
concurrency:
  group: devportal-deploy
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_devportal.yml
    with:
      upload: true

  deploy:
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/packages/devportal
    steps:
      - name: Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=maktaba.dev not deployed::Cloudflare secrets not set: skipping deploy (CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, see web/packages/devportal/README.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6.0.2
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v6.4.0
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version-file: web/packages/devportal/.nvmrc
          cache: npm
          cache-dependency-path: web/packages/devportal/package-lock.json

      # wrangler at the version package-lock.json pins
      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci --no-audit --no-fund

      # the site the build job built, tested and scanned
      - uses: actions/download-artifact@v8.0.1
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: devportal-site
          path: web/packages/devportal/dist

      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/packages/devportal
          wranglerVersion: '4.151.0'
          command: deploy

      # The live site answers from the Worker: the home page, security.txt and the headers.
      # A first deploy's custom domain can take a few minutes to get its certificate, so
      # each check retries for up to 5 minutes.
      - name: Smoke check https://maktaba.dev
        if: steps.secrets.outputs.ok == 'true'
        working-directory: .
        run: |
          check() { # url, a line the body must contain
            for i in $(seq 1 30); do
              code=$(curl -sS -o body.txt -D headers.txt -w '%{http_code}' "$1" || true)
              if [ "$code" = 200 ] && grep -qF -- "$2" body.txt; then
                echo "ok: $1 ($code)"
                return 0
              fi
              echo "waiting for $1 (status $code, try $i/30)"
              sleep 10
            done
            echo "::error::$1 did not answer 200 with \"$2\""
            cat headers.txt || true
            head -c 600 body.txt || true
            return 1
          }
          # every page is in English and Arabic: / links its /ar/ twin, which is right to left
          check https://maktaba.dev/ 'id="lang-switch" class="lang" href="/ar/"'
          grep -qi '^strict-transport-security:' headers.txt || { echo "::error::no HSTS header on /"; exit 1; }
          grep -qi "^content-security-policy:.*frame-ancestors 'none'" headers.txt || { echo "::error::no CSP on /"; exit 1; }
          check https://maktaba.dev/ar/ '<html lang="ar" dir="rtl">'
          # the wiki in both languages: the English and Arabic pages, and the Arabic database
          check https://maktaba.dev/wiki/ '<html lang="en" dir="ltr">'
          check https://maktaba.dev/ar/wiki/ '<html lang="ar" dir="rtl">'
          check https://maktaba.dev/ar/wiki/db/wiki.json '"lang": "ar"'
          check https://maktaba.dev/wiki/db/wiki.json '"entries"'
          for u in https://maktaba.dev/wiki/db/wiki.json https://maktaba.dev/ar/wiki/db/wiki.json; do
            if curl -sS "$u" | grep -qF 'linear.app'; then echo "::error::$u links linear.app"; exit 1; fi
          done
          check https://maktaba.dev/.well-known/security.txt 'Contact: mailto:security@maktaba.dev'
          grep -q '^Expires: ' body.txt || { echo "::error::security.txt has no Expires"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' https://www.maktaba.dev/ || true)
          echo "www: $code"
          case "$code" in "301 https://maktaba.dev/") ;; *) echo "::error::www.maktaba.dev does not redirect to https://maktaba.dev/"; exit 1 ;; esac
