# Auto-label PRs based on changed paths (Story 22.1, EC3 visibility).

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/labeler@v5.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
