[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maktaba"
version = "0.1.0"
description = "Batch video transcription, subtitling, and intelligent search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click",
    "ffmpeg-python",
    "mlx-whisper; sys_platform == 'darwin'",
    "openai-whisper",
    "chromadb",
]

[project.scripts]
maktaba = "maktaba.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["maktaba"]

# Repo-root pytest config. The e2e / perf-ci gates (Track V) live in
# ./tests and are invoked with an explicit path, which makes pytest
# resolve rootdir here and read THIS config (not pipeline's). The
# `e2e` marker mirrors pipeline/pyproject.toml so the suite collects
# without an unregistered-marker warning regardless of rootdir.
[tool.pytest.ini_options]
markers = [
    "e2e: tests that drive the full compose stack (Epic 20.5)",
]
