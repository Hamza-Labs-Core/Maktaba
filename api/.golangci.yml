# golangci-lint v1.62 config for the Maktaba API server.
# Story 22.1 sets a sensible default; individual stories may extend it.

run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
