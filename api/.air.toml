# air config for the api service (Story 22.8 live-reload).
#
# air watches `root` for changes, rebuilds via `cmd`, and re-execs
# `bin`. The supervisor SIGTERMs the previous process before starting
# the new one so each save cleanly tears down + starts.
#
# Epic 7 wired the real HTTP serve loop, exposed via the `serve`
# subcommand, so air re-execs `./tmp/main serve` and the binary stays
# up between rebuilds. Running `./tmp/main` with no args only prints
# the usage banner (the old stub path), which is why `full_bin` must
# carry the `serve` argument.

root = "/src/api"
tmp_dir = "/src/api/tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  full_bin = "./tmp/main serve"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = ["tmp", "vendor", "bin"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true
