# air config for the api service (Story 22.8 live-reload).
#
# air watches `root` for changes, rebuilds via `cmd`, and re-execs
# `bin`. The supervisor SIGTERMs the previous process before starting
# the new one so each save cleanly tears down + starts.
#
# Stub note (Story 22.1/22.2): the current api `main` exits after
# printing a banner, so air will rebuild + re-exec on save and you'll
# see the new banner in logs within ~3 s. Once Epic 7 wires the real
# HTTP serve loop, the binary will stay up between rebuilds.

root = "/src/api"
tmp_dir = "/src/api/tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = ["tmp", "vendor", "bin"]
  exclude_regex = ["_test\\.go$"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true
