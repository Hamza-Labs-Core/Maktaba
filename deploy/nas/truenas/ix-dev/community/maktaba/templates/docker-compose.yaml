{# Maktaba: one container that runs the home's server and everything it runs (the web app, the
   API, live TV, the pipeline, its own Postgres) and updates itself on its data storage. #}
{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.maktaba_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perm_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# The image runs as whatever user it is given and never as root: it chowns nothing. #}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{# The launcher drains the server on a stop: the pipeline's jobs, then Postgres. #}
{% do c1.set_grace_period(90) %}
{# Healthy once the web app answers; also while it waits for its first setup (the app's Shell). #}
{% do c1.healthcheck.set_custom_test(["CMD", "/opt/maktaba/server/bin/maktaba-server", "healthcheck"]) %}
{% do c1.healthcheck.set_start_period(600) %}

{% do c1.environment.add_env("MAKTABA_PLATFORM", "truenas") %}
{% if values.network.host_ip %}
  {% do c1.environment.add_env("MAKTABA_HOST_IP", values.network.host_ip) %}
{% endif %}
{% do c1.environment.add_user_envs(values.maktaba.additional_envs) %}

{# Maktaba's own ports (Epic 59 story 59.08): 8088, 8080 and 8081 unless Additional Environment
   Variables set MAKTABA_WEB_PORT, MAKTABA_API_PORT or MAKTABA_STREAM_PORT (another app on the
   NAS holds one). On a bridge they are the container ports; the published ones below. #}
{% set own = namespace(web=values.consts.internal_web_port, api=values.consts.internal_api_port, live=values.consts.internal_live_port) %}
{% for e in values.maktaba.additional_envs %}
  {% if e.name == "MAKTABA_WEB_PORT" and e.value %}{% set own.web = e.value | int %}{% endif %}
  {% if e.name == "MAKTABA_API_PORT" and e.value %}{% set own.api = e.value | int %}{% endif %}
  {% if e.name == "MAKTABA_STREAM_PORT" and e.value %}{% set own.live = e.value | int %}{% endif %}
{% endfor %}

{# Bridge: the ports the NAS publishes are the ones the household's devices reach, so the
   addresses Maktaba hands out (setup, the Machines page, the TV tuner's URLs) name them. #}
{% if not values.network.host_network %}
  {% for key, env in [("web_port", "MAKTABA_PUBLIC_WEB_PORT"), ("api_port", "MAKTABA_PUBLIC_API_PORT"), ("live_port", "MAKTABA_PUBLIC_STREAM_PORT")] %}
    {% if values.network[key].bind_mode == "published" %}
      {% do c1.environment.add_env(env, values.network[key].port_number | string) %}
    {% endif %}
  {% endfor %}
{% endif %}

{# Host network (the default): the home announces itself by mDNS with its own responder and is
   reached at the NAS's address. No D-Bus socket is mounted. Bridge: the web app, the cluster's
   API and live TV are published; mDNS is off. #}
{% if not values.network.host_network %}
  {% do c1.add_port(values.network.web_port, {"container_port": own.web}) %}
  {% do c1.add_port(values.network.api_port, {"container_port": own.api}) %}
  {% do c1.add_port(values.network.live_port, {"container_port": own.live}) %}
{% endif %}

{# Data: server.toml, the runtime it updates, the database, logs and models. An ixVolume is
   handed to the run-as user by the catalog's permissions step; a host path is never touched
   (use the dataset's Apps preset, or an ACL entry for the run-as user with Modify). #}
{% do c1.add_storage(values.consts.data_path, values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perm_config) %}

{# Media: each folder at its own host path (/mnt/tank/media stays /mnt/tank/media), so the
   cluster's machines recognise the same share. Never chowned; read-only per folder. #}
{# create_host_path: only the catalog's test values set it (a runner has no media folder) #}
{% for item in values.storage.media %}
  {% set create = item.create_host_path if item.create_host_path is defined else false %}
  {% do c1.add_storage(item.path, {"type": "host_path", "read_only": item.read_only, "host_path_config": {"path": item.path, "create_host_path": create}}) %}
{% endfor %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perm_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"port": own.web if values.network.host_network else None}) %}

{% do tpl.notes.add_info("Before the first start, Maktaba needs its setup: open this app's Shell (Workloads → maktaba → Shell) and run `/opt/maktaba/server/bin/maktaba-server container setup`. The server then starts by itself.") %}
{% do tpl.notes.add_info("Maktaba updates itself inside its update window (Admin → Updates), as well as when the catalog moves this app. An older image never replaces a newer version on the data storage.") %}
{% do tpl.notes.add_info("ZFS's ARC takes most free memory and gives it back on demand: Maktaba counts it as available, so the dashboard's \"used\" memory is not a problem.") %}

{{ tpl.render() | tojson }}
