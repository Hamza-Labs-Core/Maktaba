resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC
maktaba:
  additional_envs:
    - name: MAKTABA_LOG_LEVEL
      value: info
network:
  host_network: false
  host_ip: 192.168.1.20
  web_port:
    bind_mode: published
    port_number: 30088
  api_port:
    bind_mode: published
    port_number: 30080
  live_port:
    bind_mode: published
    port_number: 30081

run_as:
  user: 568
  group: 568

ix_volumes:
  maktaba-data: /opt/tests/mnt/maktaba-bridge-data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: maktaba-data
      create_host_path: true
  media: []
  additional_storage: []
