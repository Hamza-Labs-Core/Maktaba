groups:
  - name: Maktaba Configuration
    description: Configure Maktaba
  - name: User and Group Configuration
    description: Configure User and Group for Maktaba
  - name: Network Configuration
    description: Configure Network for Maktaba
  - name: Storage Configuration
    description: Configure Storage for Maktaba
  - name: Labels Configuration
    description: Configure Labels for Maktaba
  - name: Resources Configuration
    description: Configure Resources for Maktaba

questions:
  - variable: TZ
    group: Maktaba Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: maktaba
    label: ""
    group: Maktaba Configuration
    schema:
      type: dict
      attrs:
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
  - variable: run_as
    label: ""
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          description: |
            The user Maktaba runs as (never root). It must be able to write to the data storage
            and read the media folders: the dataset's Apps preset, or an ACL entry for this user.
          schema:
            type: int
            min: 2
            default: 568
            required: true
        - variable: group
          label: Group ID
          description: The group Maktaba runs as.
          schema:
            type: int
            min: 2
            default: 568
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: host_network
          label: Host Network
          description: |
            Bind to the host network (recommended for Maktaba). The apps and TVs of your network then
            find the home by themselves (mDNS) and reach it at the NAS's own address.</br>
            Off: the ports below are published and mDNS is off; apps connect by the NAS's address,
            the home's HTTPS name, or a code from Maktaba Cloud.</br>
            Maktaba's own ports are 8088 (web), 8080 (API), 8081 (live TV) and 54329 (database).
            If another app on the NAS uses one, add MAKTABA_WEB_PORT, MAKTABA_API_PORT,
            MAKTABA_STREAM_PORT or MAKTABA_POSTGRES_PORT with a free port under Additional
            Environment Variables.
          schema:
            type: boolean
            default: true
        - variable: host_ip
          label: Host IP
          description: |
            Optional. The NAS address the apps and TVs of your network reach Maktaba at. With Host
            Network on, Maktaba announces itself on that address's interface only. With it off,
            set it: a bridge network has no mDNS, so Maktaba cannot learn the address by itself.
          schema:
            type: string
            default: ""
            $ref:
              - definitions/node_bind_ip
        - variable: web_port
          label: WebUI Port
          description: The web app and the apps' API (container port 8088).
          schema:
            type: dict
            show_if: [["host_network", "=", false]]
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  show_if: [["bind_mode", "=", "published"]]
                  default: 8088
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: api_port
          label: Cluster Port
          description: The API the cluster's machines use (container port 8080).
          schema:
            type: dict
            show_if: [["host_network", "=", false]]
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  show_if: [["bind_mode", "=", "published"]]
                  default: 8080
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
        - variable: live_port
          label: Live TV Port
          description: |
            Live TV (container port 8081). The default is not 8081 only because another catalog app
            has it: set 8081 when nothing else on the NAS uses it.
          schema:
            type: dict
            show_if: [["host_network", "=", false]]
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  show_if: [["bind_mode", "=", "published"]]
                  default: 30575
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip
  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Maktaba Data Storage
          description: |
            Everything Maktaba keeps: its settings, the version it updates itself to, the database,
            logs and speech models. Use a dataset on an SSD pool when the NAS has one, with the
            Apps preset (or an ACL entry for the run-as user with Modify): Maktaba changes no
            permissions itself. Keep this path when you reinstall the app: the home is in it.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  Host Path: a dataset you created (recommended: on an SSD pool, with the Apps preset).</br>
                  ixVolume: a dataset the system creates in the apps pool; the catalog's permissions step
                  hands it to the run-as user.
                schema:
                  type: string
                  required: true
                  default: "host_path"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "data"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: media
          label: Media Folders
          description: |
            Your libraries. Each folder is mounted at its own path (/mnt/tank/media stays
            /mnt/tank/media), so the machines of a Maktaba cluster see the same share. Maktaba
            changes no permissions: give the run-as user an ACL entry with Read (or Modify).
          schema:
            type: list
            default: []
            items:
              - variable: folder
                label: Media Folder
                schema:
                  type: dict
                  attrs:
                    - variable: path
                      label: Host Path
                      description: A dataset or folder under /mnt.
                      schema:
                        type: hostpath
                        required: true
                    - variable: read_only
                      label: Read Only
                      description: |
                        Mount it read-only. Maktaba shows the library as Read only and keeps what
                        it would write beside the videos (subtitles) in its database instead.
                      schema:
                        type: boolean
                        default: false
        - variable: additional_storage
          label: Additional Storage
          schema:
            type: list
            default: []
            items:
              - variable: storageEntry
                label: Storage Entry
                schema:
                  type: dict
                  attrs:
                    - variable: type
                      label: Type
                      description: |
                        ixVolume: Is dataset created automatically by the system.</br>
                        Host Path: Is a path that already exists on the system.
                      schema:
                        type: string
                        required: true
                        default: "host_path"
                        enum:
                          - value: "host_path"
                            description: Host Path (Path that already exists on the system)
                          - value: "ix_volume"
                            description: ixVolume (Dataset created automatically by the system)
                    - variable: read_only
                      label: Read Only
                      description: Mount the volume as read only.
                      schema:
                        type: boolean
                        default: false
                    - variable: mount_path
                      label: Mount Path
                      description: The path inside the container to mount the storage.
                      schema:
                        type: path
                        required: true
                    - variable: host_path_config
                      label: Host Path Configuration
                      schema:
                        type: dict
                        show_if: [["type", "=", "host_path"]]
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: acl
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
                              $ref:
                                - "normalize/acl"
                          - variable: path
                            label: Host Path
                            description: The host path to use for storage.
                            schema:
                              type: hostpath
                              show_if: [["acl_enable", "=", false]]
                              required: true
                    - variable: ix_volume_config
                      label: ixVolume Configuration
                      description: The configuration for the ixVolume dataset.
                      schema:
                        type: dict
                        show_if: [["type", "=", "ix_volume"]]
                        $ref:
                          - "normalize/ix_volume"
                        attrs:
                          - variable: acl_enable
                            label: Enable ACL
                            description: Enable ACL for the storage.
                            schema:
                              type: boolean
                              default: false
                          - variable: dataset_name
                            label: Dataset Name
                            description: The name of the dataset to use for storage.
                            schema:
                              type: string
                              required: true
                              default: "storage_entry"
                          - variable: acl_entries
                            label: ACL Configuration
                            schema:
                              type: dict
                              show_if: [["acl_enable", "=", true]]
                              attrs: []
  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                description: Containers where the label should be applied
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: maktaba
                            description: maktaba
  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for Maktaba.
                schema:
                  type: int
                  default: 4
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: |
                  Memory limit for Maktaba. Maktaba sizes itself to it (its hardware tier: Light under
                  6 GB, Standard, Strong from 16 GB): 8192 suits a typical NAS.
                schema:
                  type: int
                  default: 8192
                  required: true
        - variable: gpus
          group: Resources Configuration
          label: GPU Configuration
          description: |
            Intel or AMD: allocate the GPU and Maktaba converts video on it (VA-API).</br>
            NVIDIA: select the card (TrueNAS's NVIDIA drivers installed) for video (NVENC) and faster
            speech to text. TrueNAS 25.10's drivers no longer support Pascal and older cards: Maktaba's
            test encode then falls back to the CPU and Settings → This machine says why.
          schema:
            type: dict
            $ref:
              - "definitions/gpu_configuration"
            attrs: []
