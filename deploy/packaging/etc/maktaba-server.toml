# Maktaba unified server configuration (native-package default).
#
# Installed by the .deb / .rpm package to /etc/maktaba/server.toml and
# read by the systemd unit via MAKTABA_CONFIG=/etc/maktaba/server.toml.
# It is marked as a config file, so your edits survive package upgrades.
#
# This default is tuned for a single-host home server using SQLite. Run
# `maktaba-server setup` for an interactive wizard, or edit by hand and
# `systemctl restart maktaba-server`. Every field is documented in
# deploy/server.toml.example.

[server]
# Public API bind address.
listen = "0.0.0.0:8080"
# Writable state root: SQLite database, downloaded models, caches.
# Owned by the `maktaba` system user the package creates.
data_dir = "/var/lib/maktaba"
# Embedded web UI bind (the unified binary serves the SPA here and
# reverse-proxies /api, /stream, /xmltv.xml and /lineup.m3u to the services
# for a single-origin app).
web_listen = "0.0.0.0:8088"
# API admin/metrics bind (health, /metrics).
admin_addr = ":9100"
# Streaming service public bind.
stream_addr = ":8081"
# How other devices (Plex, TVs, phones) reach the streaming service:
# the HDHomeRun address and the XMLTV/M3U links. Empty = stream_addr
# with this machine's LAN IP.
# public_url = "http://192.168.1.20:8081"

[database]
# SQLite (default, great for libraries under ~5 TB):
url = "sqlite:///var/lib/maktaba/maktaba.db"
# Postgres (recommended for large/multi-user libraries over ~5 TB):
# url = "postgres://maktaba:maktaba@localhost:5432/maktaba?sslmode=disable"

[media]
# One or more library roots scanned for media. Point these at your
# existing collections; the `maktaba` user needs read access.
roots = ["/var/lib/maktaba/media"]

[transcription]
# Whisper backend: "mlx-whisper" (Apple Silicon), "faster-whisper"
# (CUDA/CPU), or "openai". Linux servers default to faster-whisper.
backend = "faster-whisper"
model = "large-v3"
# Linux transcribes with CTranslate2 (faster-whisper's models): on an NVIDIA
# GPU when CUDA works there, else on the CPU. Every key below is optional;
# 0 / "auto" is the default.
# Where: "auto", "cuda" ("cuda:1": the second GPU) or "cpu".
# device = "auto"
# Precision: "auto" (float16 on the GPU, int8_float16 on one under 7 GB, int8
# on the CPU), or float16, int8_float16, int8, int8_float32, float32.
# compute_type = "auto"
# Transcription workers beside the main worker, and how many files each
# decodes together per GPU pass: sized from the GPU's memory (an 8 GB card:
# one worker, 8 files); without a GPU the main worker transcribes, 4 at a time.
# workers = 0
# batch = 0
# Threads on the CPU: half the logical CPUs (2 to 16).
# cpu_threads = 0

[cloud]
# Optional cloud-link enrolment.
enabled = false
# claim_code = "ABCD1234"

[supervisor]
# How `serve` keeps its child processes (api, streaming, pipeline) running.
# Every key is optional; these are the defaults.
# "always" restarts a child whenever it exits; "on-failure" leaves a clean
# exit (code 0) stopped; "never" stops the whole stack when any child exits
# (use it when systemd, launchd or compose restarts the service instead).
# restart = "always"
# Restart delay: starts at backoff_initial and doubles up to backoff_max;
# a child that stays up for healthy_after starts again from backoff_initial.
# backoff_initial = "1s"
# backoff_max = "60s"
# healthy_after = "5m"
# max_restarts exits inside max_restarts_window mark a child failed (a
# crash loop). The others keep running; it is retried every failed_retry.
# max_restarts = 5
# max_restarts_window = "10m"
# failed_retry = "5m"
# Liveness probes catch a hung child: probe_failures failed /healthz
# checks in a row (every probe_interval, each timing out after
# probe_timeout) kill and restart it. Failures only count after
# startup_grace, unless a probe has already answered.
# probe_interval = "10s"
# probe_timeout = "3s"
# probe_failures = 3
# startup_grace = "60s"
# Loopback address of the supervisor state endpoint (GET /processes). The
# API shows it at /api/system/processes. "off" disables it.
# admin_addr = "127.0.0.1:9103"
