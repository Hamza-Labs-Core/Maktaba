# Maktaba canonical compose stack (Story 22.3).
#
# `docker compose -f deploy/compose/docker-compose.yml up -d --wait`
# brings the full stack to "all healthy" on a fresh host (TC1; AC2).
# The Mac overlay (docker-compose.mac.yml) bind-mounts host FFmpeg and
# selects the MLX backend; the dev overlay (Story 22.8) replaces the
# built images with live-reload mounts.
#
# Build contexts are repo-root relative because the e2e CI gate runs
# the file via `-f deploy/compose/docker-compose.yml` from the repo
# root; compose resolves contexts relative to the file's directory, so
# `../..` walks back to the repo root.
#
# Image tags default to `:dev` so a fresh `docker compose build && up`
# works without pulling from ghcr.io. Releases override
# MAKTABA_VERSION to pin a published tag.

name: maktaba

x-restart-policy: &restart unless-stopped

x-build-args: &build-args
  VERSION: ${MAKTABA_VERSION:-dev}
  COMMIT: ${MAKTABA_COMMIT:-unknown}
  SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}

services:
  postgres:
    image: postgres:16-alpine
    restart: *restart
    environment:
      POSTGRES_USER: ${MAKTABA_PG_USER:-maktaba}
      POSTGRES_PASSWORD: ${MAKTABA_PG_PASSWORD:-maktaba}
      POSTGRES_DB: ${MAKTABA_PG_DB:-maktaba}
    ports:
      # Exposed for the e2e/integration suites that drive the DB from
      # the host. Production Compose-on-Linux installs would close this
      # via an override; the Mac dev path leaves it open.
      - "${MAKTABA_PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-maktaba} -d $${POSTGRES_DB:-maktaba}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: ghcr.io/chroma-core/chroma:0.5.5
    restart: *restart
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # Exposed for e2e tests; closed in prod via override.
      - "${MAKTABA_CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/maktaba/api:${MAKTABA_VERSION:-dev}
    build:
      context: ../..
      dockerfile: api/Dockerfile
      args: *build-args
    restart: *restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAKTABA_DATABASE_URL: postgres://${MAKTABA_PG_USER:-maktaba}:${MAKTABA_PG_PASSWORD:-maktaba}@postgres:5432/${MAKTABA_PG_DB:-maktaba}?sslmode=disable
      MAKTABA_HTTP_ADDR: ":8080"
      HEALTHCHECK_URL: http://127.0.0.1:8080/healthz
    command: ["serve"]
    volumes:
      - media:/var/maktaba/media:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  streaming:
    image: ghcr.io/maktaba/streaming:${MAKTABA_VERSION:-dev}
    build:
      context: ../..
      dockerfile: streaming/Dockerfile
      args: *build-args
    restart: *restart
    depends_on:
      api:
        condition: service_healthy
    environment:
      MAKTABA_API_URL: http://api:8080
      MAKTABA_HTTP_ADDR: ":8081"
      HEALTHCHECK_URL: http://127.0.0.1:8081/healthz
    command: ["serve"]
    volumes:
      - media:/var/maktaba/media:ro
      - cache:/var/maktaba/cache
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  pipeline:
    image: ghcr.io/maktaba/pipeline:${MAKTABA_VERSION:-dev}
    build:
      context: ../..
      dockerfile: pipeline/Dockerfile
    restart: *restart
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    environment:
      MAKTABA_DATABASE_URL: postgres://${MAKTABA_PG_USER:-maktaba}:${MAKTABA_PG_PASSWORD:-maktaba}@postgres:5432/${MAKTABA_PG_DB:-maktaba}?sslmode=disable
      MAKTABA_CHROMA_URL: http://chroma:8000
      MAKTABA_MEDIA_ROOT: /var/maktaba/media
      MAKTABA_CHROMA_DIR: /var/maktaba/chroma
    volumes:
      - media:/var/maktaba/media
      - chroma:/var/maktaba/chroma
    healthcheck:
      # `python -m maktaba_pipeline doctor` is the stub probe (Story
      # 22.3 plan §2.7); Epic 03 swaps it for the real doctor that
      # checks DB / Chroma / ffmpeg / MLX.
      test: ["CMD", "python", "-m", "maktaba_pipeline", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/maktaba/web:${MAKTABA_VERSION:-dev}
    build:
      context: ../..
      dockerfile: web/Dockerfile
    restart: *restart
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/", "-O", "/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    restart: *restart
    depends_on:
      api:
        condition: service_healthy
      streaming:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${MAKTABA_HTTP_PORT:-80}:80"
      - "${MAKTABA_HTTPS_PORT:-443}:443"
    environment:
      MAKTABA_HOSTNAME: ${MAKTABA_HOSTNAME:-localhost}
    volumes:
      - ../docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  chroma_data:
  media: # Operator-supplied library; bind via override or `docker volume create`.
  cache:
  chroma:
  caddy_data:
  caddy_config:
