# Maktaba canonical compose stack (Story 22.3).
#
# `docker compose -f deploy/compose/docker-compose.yml up -d --wait`
# brings the full stack to "all healthy" on a fresh host (TC1; AC2).
# The Mac overlay (docker-compose.mac.yml) bind-mounts host FFmpeg and
# selects the MLX backend; the dev overlay (Story 22.8) replaces the
# built images with live-reload mounts.
#
# Build contexts are repo-root relative because the e2e CI gate runs
# the file via `-f deploy/compose/docker-compose.yml` from the repo
# root; compose resolves contexts relative to the file's directory, so
# `../..` walks back to the repo root.
#
# Image tags default to `:dev` so a fresh `docker compose build && up`
# works without pulling from ghcr.io. Releases override
# MAKTABA_VERSION to pin a published tag.

name: maktaba

x-restart-policy: &restart unless-stopped

x-build-args: &build-args
  VERSION: ${MAKTABA_VERSION:-dev}
  COMMIT: ${MAKTABA_COMMIT:-unknown}
  SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:-0}

services:
  postgres:
    # Postgres 16 with pgvector (semantic search, specs/epics/43-pgvector-search), the
    # version the app bundles build. Debian-based: a data volume made by the earlier
    # postgres:16-alpine image (musl) needs a REINDEX of its text indexes once, as glibc
    # sorts some strings differently.
    image: pgvector/pgvector:0.8.7-pg16
    restart: *restart
    # Parallel queries share memory through /dev/shm; Docker's default 64 MB ran
    # out under the transcription load ("could not resize shared memory segment").
    shm_size: 256m
    environment:
      POSTGRES_USER: ${MAKTABA_PG_USER:-maktaba}
      POSTGRES_PASSWORD: ${MAKTABA_PG_PASSWORD:-maktaba}
      POSTGRES_DB: ${MAKTABA_PG_DB:-maktaba}
    ports:
      # Exposed for the e2e/integration suites that drive the DB from
      # the host. Production Compose-on-Linux installs would close this
      # via an override; the Mac dev path leaves it open.
      - "${MAKTABA_PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-maktaba} -d $${POSTGRES_DB:-maktaba}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: ghcr.io/chroma-core/chroma:0.5.5
    restart: *restart
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      # Exposed for e2e tests; closed in prod via override. Bound to the
      # host's loopback only: this Chroma server has no auth, and its HTTP
      # API carries the chromadb collection-endpoint advisories
      # (GHSA-f4j7-r4q5-qw2c, GHSA-36p7-vc44-83pf, GHSA-2wm9-hf6c-p5cr,
      # GHSA-xph7-9rjv-w5fr), none of which has a patched release. The
      # pipeline itself uses an embedded PersistentClient (MAKTABA_CHROMA_DIR).
      - "127.0.0.1:${MAKTABA_CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/maktaba/api:${MAKTABA_VERSION:-dev}
    build:
      context: ../..
      dockerfile: api/Dockerfile
      args: *build-args
    restart: *restart
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DATABASE_URL drives the migrate subcommand AND the readiness
      # probe's DB check (Story 21.4 — buildChecks reads $DATABASE_URL).
      DATABASE_URL: postgres://${MAKTABA_PG_USER:-maktaba}:${MAKTABA_PG_PASSWORD:-maktaba}@postgres:5432/${MAKTABA_PG_DB:-maktaba}?sslmode=disable
      MAKTABA_DATABASE_URL: postgres://${MAKTABA_PG_USER:-maktaba}:${MAKTABA_PG_PASSWORD:-maktaba}@postgres:5432/${MAKTABA_PG_DB:-maktaba}?sslmode=disable
      # the port the cluster's machines reach this database at (its published port, not the
      # container's): the api hands it to them at their join and when it re-makes their access
      MAKTABA_CLUSTER_DB_PORT: ${MAKTABA_PG_PORT:-5432}
      MAKTABA_HTTP_ADDR: ":8080"
      MAKTABA_ADMIN_ADDR: ":9100"
      # Run `migrate up` on boot so a fresh `compose up` doesn't
      # require a separate `make migrate` step (operators can disable
      # by overriding to "false"). Set unconditionally here because
      # the pipeline waits on api's healthcheck to land green AFTER
      # migrations apply — see the depends_on note on pipeline.
      MAKTABA_AUTO_MIGRATE: "true"
      # Aggregator fan-out: /api/system/health probes these per the
      # plan's name=URL pair format.
      MAKTABA_HEALTH_PEERS: streaming=http://streaming:9101/readyz
      HEALTHCHECK_URL: http://127.0.0.1:9100/healthz
      # Epic 31 cluster channel. The home's two keys live on a volume so a
      # recreated container keeps them: a new cluster key would make every
      # joined machine re-join; the agent key is shared with the pipeline's
      # home workers (read-only there).
      MAKTABA_HOME_CLUSTER_KEY: /var/maktaba/keys/home-cluster.key
      MAKTABA_HOME_AGENT_KEY: /var/maktaba/keys/home-agent.key
      # group-readable, so the pipeline (uid 1000, group_add 65532) can read it
      MAKTABA_HOME_AGENT_KEY_MODE: "0640"
      # the long-term archive of every machine's logs, jobs and LLM usage
      # (design-agent.md §7.10): on its own volume, kept a year by default
      MAKTABA_ARCHIVE_DIR: /var/maktaba/archive
      # the stream signing key (Story 10.8): the api signs the video sessions'
      # stream URLs with it (created on first start), streaming verifies them
      MAKTABA_STREAM_SIGNING_KEY: /var/maktaba/keys/stream-signing.key
      # The home's IP folder on the share: set it to the host's LAN address
      # (a container only knows its own bridge address).
      MAKTABA_CLUSTER_IP: ${MAKTABA_CLUSTER_IP:-}
    command: ["serve"]
    volumes:
      # read-write: the hub writes <share root>/maktaba/cluster (its own
      # files, link-safe, nothing else); the media itself is never written
      - media:/var/maktaba/media
      - cluster_keys:/var/maktaba/keys
      - cluster_archive:/var/maktaba/archive
    # the pipeline (uid 1000) writes beside the hub in the home's IP folder on
    # the share; both create group-writable folders and share each other's group
    group_add:
      - "1000"
    healthcheck:
      # Probes /healthz on the admin port (Story 21.4); the binary is
      # baked in because distroless has no curl. Liveness only — see
      # AC1: never blocks on dependencies, so the orchestrator only
      # restarts a *hung* process, never a process whose DB is down.
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  streaming:
    image: ghcr.io/maktaba/streaming:${MAKTABA_VERSION:-dev}
    build:
      context: ../..
      dockerfile: streaming/Dockerfile
      args: *build-args
    restart: *restart
    depends_on:
      api:
        condition: service_healthy
    environment:
      # the channels, the TV settings and this host's streaming_hosts check-in
      # (the admin Live TV page lists only hosts that check in)
      DATABASE_URL: postgres://${MAKTABA_PG_USER:-maktaba}:${MAKTABA_PG_PASSWORD:-maktaba}@postgres:5432/${MAKTABA_PG_DB:-maktaba}?sslmode=disable
      MAKTABA_API_URL: http://api:8080
      MAKTABA_HTTP_ADDR: ":8081"
      MAKTABA_ADMIN_ADDR: ":9101"
      # Probe the API's admin port from streaming's readiness so we
      # can detect the api↔streaming network partition described in
      # the story's gRPC-peer requirement (AC2).
      MAKTABA_GRPC_PEERS: api=api:9100
      HEALTHCHECK_URL: http://127.0.0.1:9101/healthz
      # verifies the stream URLs the api signs (same key file, read-only here)
      MAKTABA_STREAM_SIGNING_KEY: /var/maktaba/keys/stream-signing.key
    command: ["serve"]
    volumes:
      - media:/var/maktaba/media:ro
      - cache:/var/maktaba/cache
      - cluster_keys:/var/maktaba/keys:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  pipeline:
    image: ghcr.io/maktaba/pipeline:${MAKTABA_VERSION:-dev}
    build:
      context: ../..
      dockerfile: pipeline/Dockerfile
    restart: *restart
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      # The pipeline reaper queries `processing_jobs` on its first
      # tick; that table is created by api's migrate-up on boot
      # (MAKTABA_AUTO_MIGRATE=true). Wait for api to become healthy
      # (its /healthz only flips green after migrations apply) so
      # the pipeline doesn't race the schema and crash with
      # `UndefinedTableError: relation "processing_jobs" does not
      # exist`. See issue #24.
      api:
        condition: service_healthy
    environment:
      MAKTABA_DATABASE_URL: postgres://${MAKTABA_PG_USER:-maktaba}:${MAKTABA_PG_PASSWORD:-maktaba}@postgres:5432/${MAKTABA_PG_DB:-maktaba}?sslmode=disable
      MAKTABA_CHROMA_URL: http://chroma:8000
      MAKTABA_MEDIA_ROOT: /var/maktaba/media
      MAKTABA_CHROMA_DIR: /var/maktaba/chroma
      # Epic 31 cluster channel: the home workers dial the hub in the api
      # container with the key it wrote.
      MAKTABA_API_URL: http://api:8080
      MAKTABA_HOME_AGENT_KEY: /var/maktaba/keys/home-agent.key
      MAKTABA_CLUSTER_IP: ${MAKTABA_CLUSTER_IP:-}
    volumes:
      - media:/var/maktaba/media
      - chroma:/var/maktaba/chroma
      - cluster_keys:/var/maktaba/keys:ro
    # the API (distroless nonroot, 65532) owns the agent key; this group reads it
    group_add:
      - "65532"
    healthcheck:
      # `python -m maktaba_pipeline doctor` checks the database, schema
      # revision, job queue, ffmpeg/ffprobe and writable storage, and
      # exits 1 when any fails (maktaba_pipeline/doctor.py).
      test: ["CMD", "python", "-m", "maktaba_pipeline", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/maktaba/web:${MAKTABA_VERSION:-dev}
    build:
      context: ../..
      dockerfile: web/Dockerfile
    restart: *restart
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/", "-O", "/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    restart: *restart
    depends_on:
      api:
        condition: service_healthy
      streaming:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${MAKTABA_HTTP_PORT:-80}:80"
      - "${MAKTABA_HTTPS_PORT:-443}:443"
    environment:
      MAKTABA_HOSTNAME: ${MAKTABA_HOSTNAME:-localhost}
    volumes:
      - ../docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pg_data:
  chroma_data:
  media: # Operator-supplied library; bind via override or `docker volume create`.
  cache:
  chroma:
  caddy_data:
  caddy_config:
  cluster_keys: # the home's cluster and agent keys (Epic 31); back it up
  cluster_archive: # the home's long-term log archive (Epic 31)
