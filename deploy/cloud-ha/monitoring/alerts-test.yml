# promtool test rules alerts-test.yml (Epic 50 story 50.10)
rule_files:
  - alerts.yml
evaluation_interval: 30s
tests:
  # the canary fails two probes in a row: canary_down within 90 s; one failure does not page
  - interval: 30s
    input_series:
      - series: 'probe_success{job="canary",instance="w"}'
        values: '1 1 0 1 1 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m30s
        alertname: canary_down
        exp_alerts: []
      - eval_time: 4m
        alertname: canary_down
        exp_alerts:
          - exp_labels: {severity: sev1, instance: w}
            exp_annotations:
              summary: "Remote play is down: the canary home does not answer through the relay"
              runbook_url: docs/runbooks/cloud/canary-down.md
  # 2 minutes down in an hour burns fast
  - interval: 30s
    input_series:
      - series: 'probe_success{job="canary",instance="w"}'
        values: '1x112 0x4 1x3'
      # network 2 fails at the same instants: both down
      - series: 'probe_success{job="canary",instance="actions"}'
        values: '1x112 0x4 1x3'
    alert_rule_test:
      - eval_time: 59m
        alertname: slo_burn_fast
        exp_alerts:
          - exp_labels: {severity: sev1}
            exp_annotations:
              summary: "The month's downtime budget burns fast: 4.202% of the last hour down"
              runbook_url: docs/runbooks/cloud/canary-down.md
  # no streaming replica for 2 minutes
  - interval: 30s
    input_series:
      - series: 'patroni_replica{state="streaming",node="node-b"}'
        values: '1 1 stale _ _ _ _ _'
    alert_rule_test:
      - eval_time: 30s
        alertname: replica_missing
        exp_alerts: []
      - eval_time: 3m30s
        alertname: replica_missing
        exp_alerts:
          - exp_labels: {severity: sev2}
            exp_annotations:
              summary: "No streaming replica: RPO is not 0 until it is back"
              runbook_url: docs/runbooks/cloud/failover-check.md
  # the Floating IP on node-a while node-b leads
  - interval: 30s
    input_series:
      - series: 'fip_holder{node="node-a"}'
        values: '1x8'
      - series: 'fip_holder{node="node-b"}'
        values: '0x8'
      - series: 'patroni_primary{node="node-a"}'
        values: '0x8'
      - series: 'patroni_primary{node="node-b"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: fip_mismatch
        exp_alerts:
          - exp_labels: {severity: sev1, node: node-a}
            exp_annotations:
              summary: "The Floating IP is not on the leader (node-a)"
              runbook_url: docs/runbooks/cloud/hetzner-api-down.md
          - exp_labels: {severity: sev1, node: node-b}
            exp_annotations:
              summary: "The Floating IP is not on the leader (node-b)"
              runbook_url: docs/runbooks/cloud/hetzner-api-down.md
