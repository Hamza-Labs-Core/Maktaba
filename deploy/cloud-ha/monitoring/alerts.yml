# Maktaba Cloud's alert rules (Epic 50 story 50.10), evaluated by the witness's Prometheus.
# Every alert carries its severity (sev1, sev2, sev3: docs/runbooks/cloud/README.md) and links
# to its runbook (50.12); tools/runbooks/lint.py checks both. The backup alerts are in backup-rules.yml (50.09).
# Severity: page (the owner's phone, repeated every 15 min until acknowledged) or warn (email).
groups:
  - name: maktaba-availability
    rules:
      # the canary home through the relay, from the witness (blackbox) and network 2 (Actions)
      - alert: canary_down
        expr: max by (instance) (probe_success{job="canary"}) == 0
        for: 1m   # two failed probes in a row at 30 s
        labels: {severity: sev1}
        annotations:
          summary: "Remote play is down: the canary home does not answer through the relay"
          runbook_url: docs/runbooks/cloud/canary-down.md
      - alert: api_down
        expr: max by (instance) (probe_success{job="api"}) == 0
        for: 1m
        labels: {severity: sev2}
        annotations:
          summary: "api.maktaba.tv/readyz fails"
          runbook_url: docs/runbooks/cloud/canary-down.md
      # the SLO: 99.9 % a month = 43.8 min; 2 % of it in 1 h, 5 % in 6 h. An instant is down
      # when every probing network fails it (README §4.2): the best of the probes counts
      - record: canary:up
        expr: max(probe_success{job="canary"})
      - record: canary:error_ratio:rate1h
        expr: 1 - avg_over_time(canary:up[1h])
      - record: canary:error_ratio:rate6h
        expr: 1 - avg_over_time(canary:up[6h])
      - alert: slo_burn_fast
        # 2 % of 43.8 min = 52.6 s down in an hour: an error ratio over 0.0146
        expr: canary:error_ratio:rate1h > 0.0146
        labels: {severity: sev1}
        annotations:
          summary: "The month's downtime budget burns fast: {{ $value | humanizePercentage }} of the last hour down"
          runbook_url: docs/runbooks/cloud/canary-down.md
      - alert: slo_burn_slow
        # 5 % of 43.8 min = 131 s in 6 h: an error ratio over 0.00608
        expr: canary:error_ratio:rate6h > 0.00608
        labels: {severity: sev2}
        annotations:
          summary: "The month's downtime budget burns: {{ $value | humanizePercentage }} of the last 6 h down"
          runbook_url: docs/runbooks/cloud/canary-down.md

  - name: maktaba-pair
    rules:
      - alert: failover_happened
        expr: increase(patroni_failovers_total[10m]) > 0 or changes(patroni_primary{node="node-a"}[10m]) > 0
        labels: {severity: sev2}
        annotations:
          summary: "The database leader changed: confirm the new leader is healthy"
          runbook_url: docs/runbooks/cloud/failover-check.md
      - alert: replica_missing
        expr: sum(patroni_replica{state="streaming"} or vector(0)) < 1
        for: 2m
        labels: {severity: sev2}
        annotations:
          summary: "No streaming replica: RPO is not 0 until it is back"
          runbook_url: docs/runbooks/cloud/failover-check.md
      - alert: replication_lag
        expr: max(pg_replication_lag_seconds) > 10
        for: 2m
        labels: {severity: sev3}
        annotations:
          summary: "The replica is {{ $value }} s behind"
          runbook_url: docs/runbooks/cloud/failover-check.md
      - alert: fip_mismatch
        # the node Hetzner says holds the Floating IP is not the database leader
        expr: sum by (node) (fip_holder) != on (node) sum by (node) (patroni_primary)
        for: 2m
        labels: {severity: sev1}
        annotations:
          summary: "The Floating IP is not on the leader ({{ $labels.node }})"
          runbook_url: docs/runbooks/cloud/hetzner-api-down.md
      - alert: fip_assign_failed
        expr: max(maktaba_fip_assign_failed) > 0
        labels: {severity: sev1}
        annotations:
          summary: "The leader could not take the Floating IP"
          runbook_url: docs/runbooks/cloud/hetzner-api-down.md

  - name: maktaba-machines
    rules:
      - alert: cert_expiring
        expr: min by (instance) (probe_ssl_earliest_cert_expiry - time()) < 14 * 86400
        labels: {severity: sev3}
        annotations:
          summary: "A relay certificate expires in {{ $value | humanizeDuration }} ({{ $labels.instance }})"
          runbook_url: docs/runbooks/cloud/cert-expiry.md
      - alert: cert_expiring_soon
        expr: min by (instance) (probe_ssl_earliest_cert_expiry - time()) < 7 * 86400
        labels: {severity: sev2}
        annotations:
          summary: "A relay certificate expires in {{ $value | humanizeDuration }} ({{ $labels.instance }})"
          runbook_url: docs/runbooks/cloud/cert-expiry.md
      - alert: disk_filling
        expr: 1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} > 0.8
        for: 5m
        labels: {severity: sev3}
        annotations:
          summary: "{{ $labels.instance }}'s disk is {{ $value | humanizePercentage }} full"
          runbook_url: docs/runbooks/cloud/disk.md
      - alert: disk_full
        expr: 1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} > 0.9
        for: 5m
        labels: {severity: sev2}
        annotations:
          summary: "{{ $labels.instance }}'s disk is {{ $value | humanizePercentage }} full"
          runbook_url: docs/runbooks/cloud/disk.md

  - name: maktaba-relay
    rules:
      - alert: held_requests_timing_out
        expr: |
          sum(increase(maktaba_relay_held_total{result="timeout"}[10m]))
            / clamp_min(sum(increase(maktaba_relay_held_total[10m])), 1) > 0.01
        labels: {severity: sev2}
        annotations:
          summary: "{{ $value | humanizePercentage }} of held requests time out: homes are slow to come back"
          runbook_url: docs/runbooks/cloud/canary-down.md
      - alert: cloud_error_spike
        expr: |
          sum by (service) (rate(maktaba_errors_total[10m]))
            > 5 * sum by (service) (rate(maktaba_errors_total[7d] offset 10m)) and sum by (service) (rate(maktaba_errors_total[10m])) > 0.01
        for: 10m
        labels: {severity: sev2}
        annotations:
          summary: "{{ $labels.service }} errors at 5× their usual rate"
          runbook_url: docs/runbooks/cloud/errors.md
      - alert: log_forward_lagging
        expr: max by (node) (maktaba_log_forward_lag_seconds) > 60
        for: 5m
        labels: {severity: sev3}
        annotations:
          summary: "{{ $labels.node }}'s logs are not reaching the witness"
          runbook_url: docs/runbooks/cloud/errors.md

  # The Phase 2 trigger (story 50.14 §5): relayed traffic and open tunnels against what one
  # node carries, as measured by the load test (docs/cloud-sizing.md). The measured figures are
  # the witness's textfile series relay_measured_mbit_per_second and relay_measured_tunnels
  # (setup.sh writes them from cloud-ha.env; the planning figures until a staging run).
  - name: maktaba-capacity
    rules:
      - record: relay:mbit_per_second
        expr: >-
          sum(rate(maktaba_relay_bandwidth_in_bytes_total{job="cloud"}[5m])
            + rate(maktaba_relay_bandwidth_out_bytes_total{job="cloud"}[5m])) * 8 / 1e6
      - record: relay_capacity_used
        expr: relay:mbit_per_second / scalar(max(relay_measured_mbit_per_second))
      - record: relay_tunnels_used
        expr: sum(maktaba_relay_active_tunnels{job="cloud"}) / scalar(max(relay_measured_tunnels))
      # each day's peak, rolling: above 60 % at the daily peak for 7 days in a row is every
      # 1-day window of the last 7 days peaking above it
      - record: relay_capacity_used:peak1d
        expr: max_over_time(relay_capacity_used[1d])
      - record: relay_tunnels_used:peak1d
        expr: max_over_time(relay_tunnels_used[1d])
      - alert: relay_start_phase2
        expr: >-
          min_over_time(relay_capacity_used:peak1d[7d]) > 0.6
            or min_over_time(relay_tunnels_used:peak1d[7d]) > 0.6
        labels: {severity: sev3}
        annotations:
          summary: "Start Phase 2: the relay's daily peak passed 60 % of one node's measured capacity for 7 days (traffic {{ with query \"relay_capacity_used\" }}{{ . | first | value | humanizePercentage }}{{ end }})"
          runbook_url: docs/runbooks/cloud/capacity.md
      - alert: relay_resize_now
        expr: relay_capacity_used > 0.8 or relay_tunnels_used > 0.8
        for: 1h
        labels: {severity: sev2}
        annotations:
          summary: "The relay is above 80 % of one node's measured capacity for an hour: resize the pair now"
          runbook_url: docs/runbooks/cloud/capacity.md
