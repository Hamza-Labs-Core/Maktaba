# The witness's Alertmanager (stories 50.10, 50.12; docs/runbooks/cloud/README.md). SEV1 pages
# the owner's phone through ntfy (or Telegram: the owner chooses; fill one) and repeats every
# 5 minutes until acknowledged (silenced); SEV2 pages once; SEV3 is a daily email digest.
# ${...} rendered by setup.sh from the secrets in cloud-ha.env.
route:
  receiver: email
  group_by: [alertname, node]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: [severity = "sev1"]
      receiver: phone
      repeat_interval: 5m
    - matchers: [severity = "sev2"]
      receiver: phone
      repeat_interval: 7d
    - matchers: [severity = "sev3"]
      receiver: email
      group_by: [severity]
      group_wait: 1h
      group_interval: 24h
      repeat_interval: 7d
receivers:
  - name: phone
    webhook_configs:
      # ntfy: https://ntfy.sh/<the owner's private topic> (or a self-hosted ntfy), with its token
      - url: "${NTFY_URL}"
        http_config:
          authorization:
            credentials: "${NTFY_TOKEN}"
        send_resolved: true
  - name: email
    email_configs:
      - to: "${ALERT_EMAIL}"
        from: "${ALERT_EMAIL_FROM}"
        smarthost: "${SMTP_HOST}"
        auth_username: "${SMTP_USER}"
        auth_password: "${SMTP_PASSWORD}"
        send_resolved: true
