# pgBackRest for the cloud's Postgres (Epic 50 story 50.09). setup.sh renders it to
# /etc/pgbackrest/pgbackrest.conf with envsubst on A and B (and W, for the restore drill).
#
# Two repositories, written together (archive-push and every backup go to both):
#   repo1  Hetzner Object Storage, in HEL1 (not where the nodes are)
#   repo2  Cloudflare R2, the copy off Hetzner (free egress: a restore from it costs nothing)
# Each is encrypted before upload with its own passphrase (aes-256-cbc), and keeps 30 days
# of point-in-time restore. WAL is pushed at least every minute (archive_timeout 60): RPO 60 s
# if both nodes are lost.
[global]
repo1-type=s3
repo1-s3-endpoint=${REPO1_ENDPOINT}
repo1-s3-region=${REPO1_REGION}
repo1-s3-bucket=${REPO1_BUCKET}
repo1-s3-key=${REPO1_KEY}
repo1-s3-key-secret=${REPO1_SECRET}
repo1-s3-uri-style=path
repo1-storage-verify-tls=${REPO_VERIFY_TLS}
repo1-path=/pg
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${REPO1_CIPHER_PASS}
repo1-retention-full-type=time
repo1-retention-full=30

repo2-type=s3
repo2-s3-endpoint=${REPO2_ENDPOINT}
repo2-s3-region=${REPO2_REGION}
repo2-s3-bucket=${REPO2_BUCKET}
repo2-s3-key=${REPO2_KEY}
repo2-s3-key-secret=${REPO2_SECRET}
repo2-s3-uri-style=path
repo2-storage-verify-tls=${REPO_VERIFY_TLS}
repo2-path=/pg
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=${REPO2_CIPHER_PASS}
repo2-retention-full-type=time
repo2-retention-full=30

process-max=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail
archive-async=n

[cloud]
pg1-path=${PG_DATA}
pg1-port=5432
pg1-socket-path=/var/run/postgresql
