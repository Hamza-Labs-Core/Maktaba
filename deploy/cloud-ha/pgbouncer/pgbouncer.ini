;; PgBouncer on each database node, next to Postgres (Epic 50 story 50.18 §3). setup.sh renders
;; it to /etc/pgbouncer/pgbouncer.ini with envsubst; the rehearsal and the cloud's PgBouncer CI
;; job (relay.yml) render the same file. The database Floating IP (db.internal) lands on the
;; primary's PgBouncer; a replica's PgBouncer answers too, but nothing is sent to it.
;;
;; Two entries for one database (databases.ini):
;;   ${PG_DB}         transaction pool: every request of the api, the relays and the worker
;;   cloud_session    session pool: what holds a session of its own (the worker's leader lock,
;;                    the relays' LISTEN), the cloud's database.direct_url
;; The migrator's lock is a transaction lock in an open transaction, so `migrate up` works
;; through either.

[pgbouncer]
listen_addr = ${PGB_LISTEN_ADDR}
listen_port = ${PGB_LISTEN_PORT}
unix_socket_dir = ${PGB_SOCKET_DIR}

;; the cloud uses database/sql with lib/pq: unnamed statements, which a transaction pool
;; carries; named ones added later are tracked per server connection (PgBouncer >= 1.21)
pool_mode = transaction
max_prepared_statements = 200

default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 2000
max_db_connections = 150

;; clients: SCRAM against the userlist setup.sh writes from cloud-ha.env (0640 root:postgres),
;; over TLS: the database's Floating IP is a public address, so production requires it (the
;; certificate from bin/make-pgbouncer-cert, which the cloud checks with sslmode=verify-full).
;; Production's auth_type is hba: its rules (setup.sh) let the superuser in from the node itself
;; only (the role-change callback's KILL and RESUME) and the app role over TLS only. The
;; rehearsal and CI, on a Docker network, use plain SCRAM without TLS
auth_type = ${PGB_AUTH_TYPE}
auth_file = ${PGB_AUTH_FILE}
auth_hba_file = ${PGB_AUTH_HBA_FILE}
client_tls_sslmode = ${PGB_CLIENT_TLS_SSLMODE}
client_tls_cert_file = ${PGB_TLS_CERT}
client_tls_key_file = ${PGB_TLS_KEY}

;; a demoted primary's PgBouncer must not keep a client on a read-only server: the role-change
;; callback sends KILL on the admin console (bin/on-role-change), and new connections follow the
;; Floating IP to the new primary
admin_users = ${PGB_ADMIN_USERS}
stats_users = ${PGB_ADMIN_USERS}

;; a server that vanished (a killed primary) is noticed within seconds, not at the kernel's
;; TCP timeout
server_connect_timeout = 3
server_login_retry = 1
query_wait_timeout = 30
server_check_delay = 10
server_lifetime = 3600
server_idle_timeout = 600
tcp_keepalive = 1
tcp_keepidle = 10
tcp_keepintvl = 3
tcp_keepcnt = 3

;; a session pool's client is reset when it leaves, so its server can serve the next one
server_reset_query = DISCARD ALL

ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
logfile = ${PGB_LOGFILE}
pidfile = ${PGB_PIDFILE}

%include ${PGB_DATABASES_FILE}
