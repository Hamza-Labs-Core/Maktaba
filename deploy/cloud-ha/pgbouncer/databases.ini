;; PgBouncer's databases on a database node (Epic 50 story 50.18 §3), rendered by setup.sh to
;; /etc/pgbouncer/databases.ini: the local Postgres, in a transaction pool and a session pool.
[databases]
${PG_DB} = host=127.0.0.1 port=5432 dbname=${PG_DB}
cloud_session = host=127.0.0.1 port=5432 dbname=${PG_DB} pool_mode=session pool_size=20
