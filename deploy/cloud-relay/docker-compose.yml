# Maktaba Cloud, one node — the compose stack for a single VPS (QA, and production until
# the Phase 1 pair exists; docs/cloud-single-node.md).
#
#   maktaba-cloud (relay)  the relay binary, role=relay, listens :8443
#   api                    the same image, role=api: accounts, sign-in, claims, plans
#                          (172.30.77.10:8090, a private address: story 50.31)
#   worker                 the same image, role=worker: bandwidth roll-ups, expiries, purges
#   postgres 16            durable state (accounts, server registry, billing meter)
#   redis 7                a cache only, no persistence (nothing uses it yet;
#                          cloud/README.md "Redis is a cache", story 50.05)
#   caddy 2                reverse proxy + certificates (Caddyfile, RELAY_TLS)
#
# Bring up:  docker compose --env-file .env up -d
# (setup.sh wires this into a systemd unit on the host.)
#
# TLS terminates at Caddy; the relay speaks plain HTTP on :8443 behind
# it and does Host-based subdomain routing in user space (see
# cloud/cmd/maktaba-cloud/role_relay.go). Only Caddy publishes ports
# (80/443) to the host — postgres/redis/relay stay on the internal
# network and are never exposed. The host firewall (UFW, see setup.sh)
# enforces the same at the kernel level.

name: maktaba-relay

x-restart: &restart unless-stopped

# The stack's own network, at fixed addresses: the api listens on a private address only, and
# believes CF-Connecting-IP from Caddy's address only (cloud.toml server.trusted_proxies).
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24
          # Docker hands out addresses from the upper half only, so the fixed ones (api .10,
          # Caddy .2) are never taken by a container that started first
          ip_range: 172.30.77.128/25

services:
  postgres:
    image: postgres:16-alpine
    restart: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maktaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-maktaba}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-maktaba} -d $${POSTGRES_DB:-maktaba}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No `ports:` — reachable only on the internal compose network.

  redis:
    image: redis:7-alpine
    restart: *restart
    # A cache: nothing in it may matter after a restart (story 50.05), so no
    # AOF and no snapshots.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  maktaba-cloud:
    image: ghcr.io/hamza-labs-core/maktaba-cloud:${MAKTABA_CLOUD_TAG:-latest}
    restart: *restart
    command: ["serve", "--role", "relay"]
    # the maktaba user (setup.sh writes its ids): the secrets mount is its own, 0700/0600
    user: "${MAKTABA_UID:?run setup.sh}:${MAKTABA_GID:?run setup.sh}"
    # SIGTERM drains the homes' tunnels for up to relay.shutdown_grace (150 s,
    # Epic 50 story 50.03) before the relay exits; Docker's default 10 s would
    # SIGKILL it mid-drain and drop every tunnel.
    stop_grace_period: 160s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # --- Core relay config (env is the single source of truth) ---
      MAKTABA_CLOUD_LISTEN_ADDR: ${MAKTABA_CLOUD_LISTEN_ADDR:-0.0.0.0:8443}
      MAKTABA_CLOUD_DB_URL: ${MAKTABA_CLOUD_DB_URL}
      MAKTABA_CLOUD_REDIS_URL: ${MAKTABA_CLOUD_REDIS_URL:-redis://redis:6379/0}
      MAKTABA_CLOUD_PUBLIC_URL: ${MAKTABA_CLOUD_PUBLIC_URL}
      MAKTABA_CLOUD_RELAY_PUBLIC_HOST: ${RELAY_DOMAIN}
      MAKTABA_CLOUD_TOKEN_SECRET: ${MAKTABA_CLOUD_TOKEN_SECRET}
      # the operator console's staff keys (story 50.33; setup.sh makes them): the api role
      # needs both with its admin listener on, the relay role ignores them
      MAKTABA_CLOUD_STAFF_TOKEN_SECRET: ${MAKTABA_CLOUD_STAFF_TOKEN_SECRET:-}
      MAKTABA_CLOUD_STAFF_SECRET_KEY: ${MAKTABA_CLOUD_STAFF_SECRET_KEY:-}
      # the shared logger hashes account ids with it (Epic 53 story 53.01; setup.sh makes it)
      MAKTABA_LOG_KEY: /etc/maktaba/cloud/secrets/log.key
      # --- api-role secrets that have env overrides (ignored by relay,
      #     wired here so the same stack can run --role api unchanged) ---
      MAKTABA_CLOUD_BILLING_PROVIDER: ${BILLING_PROVIDER:-none}
      MAKTABA_CLOUD_OAUTH_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # the symbol uploaders' token (story 53.16): deploy.sh writes secrets/symbols.token
      # from the MAKTABA_SYMBOLS_TOKEN secret and names it in .env; unset, uploads are off
      MAKTABA_CLOUD_SYMBOLS_TOKEN_FILE: ${MAKTABA_CLOUD_SYMBOLS_TOKEN_FILE:-}
      # Probe target (also baked into the image; set explicitly so it
      # tracks MAKTABA_CLOUD_LISTEN_ADDR if that changes).
      HEALTHCHECK_URL: http://127.0.0.1:8443/healthz
    volumes:
      # Optional: drop a cloud.toml here to supply the id/path-based
      # settings that have no env override (oauth client ids, apns/fcm
      # key paths, entitlement key path). Required only for --role api.
      - ./cloud.toml:/etc/maktaba/cloud/cloud.toml:ro
      # Key material referenced by ENTITLEMENT_KEY_PATH / APNS_KEY_PATH /
      # FCM_SERVICE_ACCOUNT_PATH. setup.sh generates the entitlement key
      # here. Mounted read-only; never world-readable on the host.
      - ./secrets:/etc/maktaba/cloud/secrets:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # The api role (accounts, sign-in, claims, plans): the same image and cloud.toml as the relay.
  # Caddy is its only client (API_DOMAIN).
  api:
    image: ghcr.io/hamza-labs-core/maktaba-cloud:${MAKTABA_CLOUD_TAG:-latest}
    restart: *restart
    command: ["serve", "--role", "api"]
    # the maktaba user (setup.sh writes its ids): the secrets mount is its own, 0700/0600
    user: "${MAKTABA_UID:?run setup.sh}:${MAKTABA_GID:?run setup.sh}"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      maktaba-cloud:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.77.10
    environment:
      MAKTABA_CLOUD_LISTEN_ADDR: 172.30.77.10:8090
      MAKTABA_CLOUD_DB_URL: ${MAKTABA_CLOUD_DB_URL}
      MAKTABA_CLOUD_REDIS_URL: ${MAKTABA_CLOUD_REDIS_URL:-redis://redis:6379/0}
      MAKTABA_CLOUD_PUBLIC_URL: https://${API_DOMAIN}
      MAKTABA_CLOUD_RELAY_PUBLIC_HOST: ${RELAY_DOMAIN}
      MAKTABA_CLOUD_TOKEN_SECRET: ${MAKTABA_CLOUD_TOKEN_SECRET}
      MAKTABA_CLOUD_STAFF_TOKEN_SECRET: ${MAKTABA_CLOUD_STAFF_TOKEN_SECRET:-}
      MAKTABA_CLOUD_STAFF_SECRET_KEY: ${MAKTABA_CLOUD_STAFF_SECRET_KEY:-}
      MAKTABA_LOG_KEY: /etc/maktaba/cloud/secrets/log.key
      MAKTABA_CLOUD_BILLING_PROVIDER: ${BILLING_PROVIDER:-none}
      MAKTABA_CLOUD_OAUTH_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAKTABA_CLOUD_SYMBOLS_TOKEN_FILE: ${MAKTABA_CLOUD_SYMBOLS_TOKEN_FILE:-}
      HEALTHCHECK_URL: http://172.30.77.10:8090/healthz
    volumes:
      - ./cloud.toml:/etc/maktaba/cloud/cloud.toml:ro
      - ./secrets:/etc/maktaba/cloud/secrets:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # The worker role: the periodic jobs (bandwidth roll-ups, expired-token cleanup,
  # account-deletion purges), under the worker's leader lock. Its control port is its health.
  worker:
    image: ghcr.io/hamza-labs-core/maktaba-cloud:${MAKTABA_CLOUD_TAG:-latest}
    restart: *restart
    command: ["serve", "--role", "worker"]
    # the maktaba user (setup.sh writes its ids): the secrets mount is its own, 0700/0600
    user: "${MAKTABA_UID:?run setup.sh}:${MAKTABA_GID:?run setup.sh}"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAKTABA_CLOUD_DB_URL: ${MAKTABA_CLOUD_DB_URL}
      MAKTABA_CLOUD_REDIS_URL: ${MAKTABA_CLOUD_REDIS_URL:-redis://redis:6379/0}
      MAKTABA_CLOUD_PUBLIC_URL: https://${API_DOMAIN}
      MAKTABA_CLOUD_RELAY_PUBLIC_HOST: ${RELAY_DOMAIN}
      MAKTABA_CLOUD_TOKEN_SECRET: ${MAKTABA_CLOUD_TOKEN_SECRET}
      MAKTABA_LOG_KEY: /etc/maktaba/cloud/secrets/log.key
      HEALTHCHECK_URL: http://127.0.0.1:9090/healthz
    volumes:
      - ./cloud.toml:/etc/maktaba/cloud/cloud.toml:ro
      - ./secrets:/etc/maktaba/cloud/secrets:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    # Caddy with the Cloudflare DNS module (deploy/caddy): the wildcard certificate
    # for RELAY_DOMAIN and *.RELAY_DOMAIN by DNS-01 (Epic 50 story 50.02)
    image: ghcr.io/hamza-labs-core/maktaba-caddy:${MAKTABA_CADDY_TAG:-2.11.7-cf0.2.4}
    restart: *restart
    depends_on:
      maktaba-cloud:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.77.2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required (the api's name, e.g. api.maktaba.tv)}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required (the cloud web app's name, e.g. app.maktaba.tv)}
      ACME_EMAIL: ${ACME_EMAIL}
      # dns (the wildcard by DNS-01, CF_API_TOKEN), http (HTTP-01 and on-demand) or internal
      RELAY_TLS: ${RELAY_TLS:-dns}
      # a Cloudflare token with Zone -> DNS -> Edit only; RELAY_TLS=dns only
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # the cloud web app's files (web/cloud), staged by the deploy
      - ./web:/srv/cloud-web:ro
      - caddy_data:/data      # issued certs + ACME account (persist!)
      - caddy_config:/config
    healthcheck:
      # Caddy's local admin API (127.0.0.1:2019) returns 200 once the
      # config is loaded — avoids chasing the :80 -> :443 redirect.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pg_data:
  caddy_data:
  caddy_config:
